extension:
  name: hex9
  description: "Hex9 hierarchical hexagonal DGGS \u2014 point encoding, layer binning,\
    \ cell geometry as WKB, labels, k-rings, Hamiltonian-curve ordering, and grid\
    \ enumeration"
  version: 2.1.0
  language: C++
  build: cmake
  license: Apache-2.0
  maintainers:
  - MrBenGriffin
repo:
  github: MrBenGriffin/duckdb-hex9
  ref: bf3b954b4d91bc6e2ff834dad494e409e0570ab3
docs:
  hello_world: 'SELECT h9_encode(-3.19, 55.95) AS cell;

    SELECT h9_label(h9_encode(-3.19, 55.95), 8) AS label;

    SELECT h9_cell(h9_encode(-3.19, 55.95), 8) AS wkb;  -- pair with spatial''s ST_GeomFromWKB

    SELECT h9_curve_index(h9_curve(h9_encode(-3.19, 55.95))) AS locality;

    '
  extended_description: "Hex9 is an equal-area hierarchical hexagonal DGGS (discrete\
    \ global grid\nsystem), backed by [libhex9](https://github.com/MrBenGriffin/libhex9)\
    \ \u2014\nthe same core as its PostGIS extension. Cells are 16-byte UUIDs; every\n\
    full address is reversible, and layer-scoped bins derived from it serve\nas join\
    \ keys. Vectorized scalar functions (encode/decode/bin, lineage,\nk-rings, labels,\
    \ Hamiltonian-curve locality ordering with HUGEINT\nindexes) plus table functions\
    \ (h9_grid, h9_curve_cells, h9_owned_cells).\nGeometry is emitted as WKB, consumed\
    \ directly by the spatial extension.\nSince libhex9 2.1.0 the encode chain is\
    \ deterministic: the same lon/lat\nyields the bit-identical uuid on every platform,\
    \ enforced by in-repo\nuniversality pin tests.\n"
