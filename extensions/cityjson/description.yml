extension:
  # Haybarn: disabled because the extension does not yet build
  # against DuckDB 1.5.2 — upstream community-extensions also has
  # no v1.5.2 binary. Re-enable when upstream lands a v1.5.2-
  # compatible release (sync_from_upstream will pick up the bump).
  # Tracker: https://github.com/cityjson/duckdb-cityjson/issues/7
  excluded_platforms: linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
  name: cityjson
  description: Read, write, and query CityJSON, CityJSONSeq, and FlatCityBuf 3D city
    model files.
  version: 0.1.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - HideBa
repo:
  github: cityjson/duckdb-cityjson
  ref: 0df88f9fb023e272b0fd3208e0f55445714b278c
docs:
  hello_world: "-- Read a CityJSON file\nSELECT * FROM read_cityjson('buildings.city.json');\n\
    \n-- Read a CityJSONSeq (line-delimited) file\nSELECT * FROM read_cityjsonseq('buildings.city.jsonl');\n\
    \n-- Read a FlatCityBuf file\nSELECT * FROM read_flatcitybuf('buildings.fcb');\n\
    \n-- Extract geometries as WKB at a specific Level of Detail\nSELECT * FROM read_cityjson('buildings.city.json',\
    \ lod=>'1.2');\n\n-- Write query results to CityJSONSeq\nCOPY (SELECT * FROM read_cityjson('buildings.city.json'))\n\
    \  TO 'output.city.jsonl' (FORMAT cityjsonseq);\n\n-- Inspect file metadata\n\
    SELECT * FROM cityjson_metadata('buildings.city.json');\n"
  extended_description: "The CityJSON extension provides table functions for reading\
    \ and writing 3D city model files\nin CityJSON (.city.json), CityJSONSeq (.city.jsonl),\
    \ and FlatCityBuf (.fcb) formats.\nCityJSON is a JSON-based encoding for 3D city\
    \ models (buildings, terrain, vegetation, etc.)\nbased on the CityGML data model.\n\
    \nSupported functions:\n- `read_cityjson`, `read_cityjsonseq`, `read_flatcitybuf`\
    \ \u2014 table functions for querying city objects\n- `cityjson_metadata`, `cityjsonseq_metadata`,\
    \ `flatcitybuf_metadata` \u2014 inspect file headers\n- `COPY ... TO` with formats\
    \ `cityjson`, `cityjsonseq`, and `flatcitybuf` \u2014 write query results\n\n\
    Additional features:\n- Automatic schema inference from CityJSON attributes\n\
    - LOD-based geometry extraction as WKB blobs via the `lod` parameter\n- Support\
    \ for CityJSON v2.0 and CityJSONSeq formats\n\nFor more information on the CityJSON\
    \ format, see https://www.cityjson.org/.\n"
