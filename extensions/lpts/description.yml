extension:
  name: lpts
  description: Optimized-plan inspection and cross-system SQL transpilation
  version: 1.1.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - ila
repo:
  github: cwida/lpts
  ref: 6845654b3ce21922f83f226937abd3aa9a790a70
docs:
  hello_world: "-- Set both input and output dialects to DuckDB for a first round\
    \ trip.\nD SET lpts_input_dialect = 'duckdb';\nD SET lpts_dialect = 'duckdb';\n\
    \nD CREATE TABLE users (id INTEGER, name VARCHAR, age INTEGER);\nD INSERT INTO\
    \ users VALUES (1, 'Alice', 30), (2, 'Bob', 22), (3, 'Carol', 28);\n\n-- Return\
    \ the optimized plan as readable CTE SQL.\nD PRAGMA lpts('SELECT name FROM users\
    \ WHERE age > 25');\nWITH\nt0_scan (t0_name) AS (\n    SELECT  \"name\"\n    FROM\
    \    memory.main.users\n    WHERE   (age>25)\n)\nSELECT  t0_name AS \"name\"\n\
    FROM    t0_scan;\n\n-- The same output, exposed as a first-class EXPLAIN statement.\n\
    D EXPLAIN (FORMAT SQL) SELECT name FROM users WHERE age > 25;\n\u250C\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2510\n\u2502\u250C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2510\u2502\n\u2502\u2502  Optimized Logical Plan\
    \   \u2502\u2502\n\u2502\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2518\u2502\n\u2514\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\
    \nWITH\nt0_scan (t0_name) AS (\n    SELECT  \"name\"\n    FROM    memory.main.users\n\
    \    WHERE   (age>25)\n)\nSELECT  t0_name AS \"name\"\nFROM    t0_scan;\n\n--\
    \ Turn on transparent round-trip checking. Every top-level SELECT is now\n-- rewritten\
    \ by LPTS and its result compared against the original; a wrong\n-- rewrite raises\
    \ an error. The query otherwise returns its normal rows.\nD SET lpts_check = true;\n\
    D SELECT name FROM users WHERE age > 25;\n\u250C\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2510\n\u2502  name   \u2502\n\u2502 varchar \u2502\n\
    \u251C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 Alice\
    \   \u2502\n\u2502 Carol   \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2518\n"
  extended_description: "LPTS is a DuckDB extension for **optimized-plan inspection**\
    \ and\n**cross-system SQL transpilation**. LPTS takes DuckDB's post-optimizer\n\
    logical plan and reconstructs equivalent SQL as a sequence of named CTEs.\n\n\
    ## PRAGMA Syntax\n\n```sql\nPRAGMA lpts('<query>');\n```\n\n## `EXPLAIN (FORMAT\
    \ SQL)`\n\nLPTS also extends DuckDB's `EXPLAIN` with a `SQL` format. `EXPLAIN\
    \ (FORMAT SQL)\n<query>` returns the optimized logical plan rendered as equivalent\
    \ CTE SQL \u2014 the\nsame output as `PRAGMA lpts`, but exposed as a first-class\
    \ `EXPLAIN` statement.\nThe CLI prints the SQL as plain multi-line text, while\
    \ JDBC, Python, and other\nclients receive the standard two-column (`explain_key`,\
    \ `explain_value`) EXPLAIN\nresult. It honors `lpts_dialect` just like `PRAGMA\
    \ lpts`.\n\n```sql\nEXPLAIN (FORMAT SQL) SELECT name FROM users WHERE age > 25;\n\
    ```\n\n```text\n\u250C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502\u250C\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\u2502\n\u2502\
    \u2502  Optimized Logical Plan   \u2502\u2502\n\u2502\u2514\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\u2502\n\u2514\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2518\nWITH\nt0_scan (t0_name) AS (\n    SELECT  \"name\"\n\
    \    FROM    memory.main.users\n    WHERE   (age>25)\n)\nSELECT  t0_name AS \"\
    name\"\nFROM    t0_scan;\n```\n\nLPTS plans the query through DuckDB, optimizes\
    \ it, then serializes the\noptimized logical plan.\n\n## Supported Dialects\n\n\
    The dialect settings accept these values:\n\n| Dialect | Accepted values |\n|---|---|\n\
    | DuckDB | `duckdb` |\n| PostgreSQL | `postgres`, `postgresql` |\n| Spark SQL\
    \ | `spark` |\n| Hive | `hive` |\n| Trino / Presto | `trino`, `presto` |\n| Snowflake\
    \ | `snowflake` |\n| BigQuery | `bigquery`, `bq` |\n| Redshift | `redshift` |\n\
    | MySQL / MariaDB | `mysql`, `mariadb` |\n\n## Use Cases\n\n- Inspect optimized\
    \ DuckDB plans as SQL.\n- Debug optimizer rewrites such as filter pushdown, join\
    \ reordering, top-N,\n  materialized CTEs, and subquery decorrelation.\n- Generate\
    \ a CTE program that communicates the optimized execution shape.\n- Emit SQL for\
    \ another engine with `lpts_dialect`.\n- Convert other SQL dialect syntax to DuckDB\
    \ SQL with `lpts_input_dialect`,\n  then execute or inspect it.\n\n## Supported\
    \ Operators\n\nLPTS is intended to cover all logical operators produced by optimized\
    \ DuckDB\nSELECT plans. The current regression suite round-trips all 22 TPC-H\
    \ queries\nand exercises joins, aggregates, windows, set operations, CTEs, recursive\n\
    CTEs, table functions, DuckLake scans, and inserts.\n\nUnsupported optimizer edge\
    \ cases fail explicitly with `NotImplementedException`.\n\n## Examples\n\n```sql\n\
    D CREATE TABLE events (id INTEGER, ts TIMESTAMP, name VARCHAR, \"order\" INTEGER);\n\
    D INSERT INTO events VALUES\n    (1, TIMESTAMP '2024-01-15 08:09:10', 'alpha',\
    \ 10),\n    (11, TIMESTAMP '2024-01-16 11:12:13', 'beta', 20);\n\n-- Render generated\
    \ SQL for PostgreSQL.\nD SET lpts_dialect = 'postgres';\n\n-- Return generated\
    \ CTE SQL directly in the shell.\nD PRAGMA lpts(\n    'SELECT strftime(ts, ''%Y-%m-%d'')\
    \ AS day\n     FROM events\n     WHERE id > 10\n     ORDER BY day'\n);\n\n-- Return\
    \ generated CTE SQL as a table row, useful in scripts and tests.\nD SELECT sql\n\
    FROM lpts_query(\n    'SELECT strftime(ts, ''%Y-%m-%d'') AS day\n     FROM events\n\
    \     WHERE id > 10\n     ORDER BY day'\n);\n```\n\n```text\nWITH\nt0_scan (ts)\
    \ AS (\n    SELECT  ts\n    FROM    events\n    WHERE   (id>10)\n)\nSELECT   \
    \ to_char(ts, 'YYYY-MM-DD') AS \"day\"\nFROM      t0_scan\nORDER BY  to_char(ts,\
    \ 'YYYY-MM-DD') ASC NULLS LAST;\n```\n\n```sql\n-- Switch back to DuckDB rendering.\n\
    D SET lpts_dialect = 'duckdb';\n\n-- Turn on transparent round-trip checking,\
    \ then run the query directly.\n-- LPTS rewrites every top-level SELECT and compares\
    \ its result bag against\n-- the original, raising on a mismatch; the query returns\
    \ its normal rows.\nD SET lpts_check = true;\nD SELECT name FROM events WHERE\
    \ id > 10 ORDER BY name;\n```\n\n```text\n\u250C\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2510\n\u2502  name   \u2502\n\u2502 varchar \u2502\n\
    \u251C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 beta\
    \    \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\
    \n```\n\n```sql\n-- Print the AST tree to stdout for interactive debugging.\n\
    D PRAGMA print_ast('SELECT name FROM events WHERE id > 10 ORDER BY name');\n\n\
    -- Return the AST tree as a table row, useful for tools and regression tests.\n\
    D SELECT ast\nFROM print_ast_query('SELECT name FROM events WHERE id > 10 ORDER\
    \ BY name');\n```\n\n```sql\n-- Normalize MySQL syntax before DuckDB parses and\
    \ plans the query.\nD SET lpts_input_dialect = 'mysql';\n\n-- Return source-dialect\
    \ SQL normalized to DuckDB SQL.\nD SELECT sql\nFROM lpts_normalize_query(\n  \
    \  'SELECT `order`, DATE_FORMAT(ts, ''%Y-%m-%d %H:%i:%s'') AS formatted FROM events\
    \ LIMIT 5, 10'\n);\n```\n\n```text\nSELECT \"order\", strftime(ts, '%Y-%m-%d %H:%M:%S')\
    \ AS formatted FROM events LIMIT 10 OFFSET 5\n```\n"
