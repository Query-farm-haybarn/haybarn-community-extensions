extension:
  name: semantic_views
  description: Semantic views -- a declarative layer for dimensions, metrics, and
    relationships
  version: 0.17.0
  language: Rust
  build: cargo
  license: MIT
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_rtools;windows_amd64_mingw;linux_amd64_musl;linux_arm64_musl;windows_arm64
  requires_toolchains: rust;python3
  maintainers:
  - anentropic
repo:
  github: s-layer/duckdb-semantic-views
  ref: a3a5547e516984903508c6d027fbd374175ce723
  variegata: 71ea4f11e76c6ad2542bbc77c8669ac491ebc2a4
docs:
  hello_world: "-- Create sample data\nCREATE TABLE demo(region VARCHAR, amount DECIMAL(10,2));\n\
    INSERT INTO demo VALUES ('US', 100), ('US', 200), ('EU', 150);\n\n-- Define a\
    \ semantic view\nCREATE SEMANTIC VIEW sales AS\n  TABLES (d AS demo PRIMARY KEY\
    \ (region))\n  DIMENSIONS (d.region AS d.region)\n  METRICS (d.revenue AS SUM(d.amount));\n\
    \n-- Query it\nFROM semantic_view('sales', dimensions := ['region'], metrics :=\
    \ ['revenue']);\n"
  extended_description: 'Semantic views let you define dimensions, metrics, joins,
    and filters once,

    then query any combination. The extension handles GROUP BY, JOIN, and filter

    composition automatically. Supports multi-table joins with PK/FK relationships,

    fan trap detection, role-playing dimensions, derived metrics, and FACTS.


    Documentation: https://s-layer.github.io/duckdb-semantic-views/

    '
