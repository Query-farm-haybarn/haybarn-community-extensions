extension:
  name: semantic_layer
  description: Define metrics, dimensions and relationships once in SQL, then query
    them at the right grain
  version: 0.1.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - redox
repo:
  github: altertable-ai/duckdb-semantic_layer
  ref: d03fcadc22627eae229e5a416d31289e3bc70873
  variegata: 1cea189f6d4f9e6af30c09ecb085883784cd04e0
docs:
  hello_world: "INSTALL semantic_layer FROM community;\nLOAD semantic_layer;\n\n--\
    \ The example uses the TPC-H tables generated by DuckDB's tpch extension.\nINSTALL\
    \ tpch;\nLOAD tpch;\nCALL dbgen(sf = 0.01);\n\nCREATE SEMANTIC VIEW sales\n  TABLES\
    \ (\n    orders    AS orders    PRIMARY KEY (o_orderkey) TIME (o_orderdate),\n\
    \    customers AS customer  PRIMARY KEY (c_custkey),\n    lines     AS lineitem\
    \  PRIMARY KEY (l_orderkey, l_linenumber)\n  )\n  RELATIONSHIPS (\n    orders_to_customers\
    \ AS orders (o_custkey) REFERENCES customers,\n    lines_to_orders     AS lines\
    \ (l_orderkey) REFERENCES orders\n  )\n  FACTS (\n    lines.net_price   AS l_extendedprice\
    \ * (1 - l_discount),\n    orders.line_count AS COUNT(lines.l_linenumber)\n  )\n\
    \  DIMENSIONS (\n    customers.segment AS c_mktsegment,\n    orders.order_year\
    \ AS YEAR(o_orderdate)\n  )\n  METRICS (\n    lines.revenue        AS SUM(lines.net_price),\n\
    \    lines.revenue_ly     OFFSET (metric_time.day BY INTERVAL 1 YEAR) AS lines.revenue,\n\
    \    lines.revenue_ytd    CUMULATIVE (metric_time.day TO YEAR) AS SUM(lines.net_price),\n\
    \    orders.avg_order     AS AVG(o_totalprice),\n    orders.avg_lines     AS AVG(orders.line_count),\n\
    \    customers.customers  AS COUNT(*),\n    revenue_per_customer AS lines.revenue\
    \ / customers.customers,\n    revenue_growth       AS lines.revenue / lines.revenue_ly\
    \ - 1\n  )\n  COMMENT = 'TPC-H sales';\n\n-- Joins lineitem \u2192 orders \u2192\
    \ customer, aggregates each metric at its own grain.\nSELECT * FROM SEMANTIC_VIEW(\n\
    \  sales\n  DIMENSIONS customers.segment, orders.order_year\n  METRICS lines.revenue,\
    \ orders.avg_order, orders.avg_lines\n  WHERE orders.order_year >= 1998\n)\nORDER\
    \ BY segment, order_year;\n\n-- The same view, queried by name. Metrics are wrapped\
    \ in AGG(...).\nSELECT segment, AGG(revenue) AS revenue\nFROM sales\nWHERE order_year\
    \ = 1998\nGROUP BY segment\nORDER BY revenue DESC;\n\n-- TIME (o_orderdate) adds\
    \ a calendar every metric reaching orders can group by.\nSELECT * FROM SEMANTIC_VIEW(\n\
    \  sales\n  DIMENSIONS metric_time.month\n  METRICS lines.revenue, lines.revenue_ytd,\
    \ revenue_growth\n  WHERE metric_time.year = DATE '1997-01-01'\n)\nORDER BY month;\n"
  extended_description: "**semantic_layer** is a semantic layer inside DuckDB. Describe\
    \ logical tables, the\nrelationships between them, and the facts, dimensions and\
    \ metrics that matter, with\n`CREATE SEMANTIC VIEW`. Then query any combination\
    \ with `SEMANTIC_VIEW(...)` or a\nplain `SELECT ... GROUP BY` using `AGG(...)`.\
    \ There is no YAML file and no separate\nserver: semantic queries are expanded\
    \ into ordinary DuckDB SQL at bind time.\n\nJoins only follow many-to-one relationships,\
    \ and metrics of different grains are\naggregated separately. A query that would\
    \ fan out is rejected instead of returning\ninflated numbers.\n\n- One `TIME (<column>)`\
    \ per table gives every metric a shared calendar\n  (`metric_time.day` / `week`\
    \ / `month` / `quarter` / `year`), with period-over-period\n  offsets, running\
    \ totals, to-date and trailing windows.\n- Many-to-many relationships, semi-additive\
    \ metrics, role-playing relationships,\n  time-dependent and range joins, metric\
    \ filters and window metrics.\n- Materializations pre-aggregate metrics at a chosen\
    \ grain. Matching queries read\n  them, and DuckLake sources can be refreshed\
    \ incrementally.\n- Semantic views show up in `information_schema` like regular\
    \ views, with one typed\n  column per dimension, fact and metric.\n- The syntax\
    \ follows [Snowflake semantic views](https://docs.snowflake.com/en/user-guide/views-semantic/overview).\n\
    \nDocumentation: https://github.com/altertable-ai/duckdb-semantic_layer\n"
