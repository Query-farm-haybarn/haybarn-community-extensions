extension:
  name: parser_tools
  description: Exposes functions for parsing referenced tables and usage context from
    SQL queries using DuckDB's native parser.
  version: 0.6.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - zfarrell
repo:
  github: hotdata-dev/duckdb_extension_parser_tools
  ref: 6a94f2b261bdca4c8f2f8454697e2f6e7bcea9c5
docs:
  hello_world: "-- Extract table references from a simple query\nSELECT * FROM parse_tables('SELECT\
    \ * FROM my_table');\n\u250C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u252C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 schema  \u2502\
    \  table    \u2502 context \u2502\n\u2502 varchar \u2502  varchar  \u2502 varchar\
    \ \u2502\n\u251C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253C\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253C\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 main    \u2502 my_table\
    \  \u2502 from    \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n\n-- Parse\
    \ a query with a CTE and a join\nSELECT * FROM parse_tables($$\n    WITH recent_users\
    \ AS (SELECT * FROM users WHERE created_at > now() - INTERVAL '7 days')\n    SELECT\
    \ * FROM recent_users r JOIN logins l ON r.id = l.user_id\n$$);\n\u250C\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 schema  \u2502\
    \    table     \u2502 context    \u2502\n\u2502 varchar \u2502   varchar    \u2502\
    \ varchar    \u2502\n\u251C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u253C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u253C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2524\n\u2502         \u2502 recent_users \u2502 cte        \u2502\
    \n\u2502 main    \u2502 users        \u2502 from       \u2502\n\u2502 main   \
    \ \u2502 logins       \u2502 join_right \u2502\n\u2502 main    \u2502 recent_users\
    \ \u2502 from_cte   \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2518\n\n-- Return a list of table names from a query\nSELECT\
    \ parse_table_names('SELECT * FROM orders JOIN customers ON orders.customer_id\
    \ = customers.id');\n\u250C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2510\n\u2502           parse_table_names        \u2502\n\u2502       \
    \      varchar[]              \u2502\n\u251C\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2524\n\u2502 ['orders', 'customers']            \u2502\
    \n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n\n--\
    \ Parse queries from a csv file\nSELECT parse_table_names(query) AS tables FROM\
    \ 'user_queries.csv';\n\u250C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502         \
    \   tables             \u2502\n\u2502          varchar[]            \u2502\n\u251C\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 ['users']                     \u2502\
    \n\u2502 ['orders', 'customers']       \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2518\n\n-- Structured output as a list of table references\nSELECT parse_tables('SELECT\
    \ * FROM products p JOIN inventory i ON p.sku = i.sku');\n\u250C\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502               \
    \               parse_tables                                  \u2502\n\u2502 list<struct<schema:\
    \ varchar, table: varchar, context: varchar>>            \u2502\n\u251C\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 [{'schema':\
    \ 'main', 'table': 'products',  'context': 'from'},              \u2502\n\u2502\
    \  {'schema': 'main', 'table': 'inventory', 'context': 'join_right'}]        \u2502\
    \n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\
    \n\n-- Detect invalid sql\nSELECT query, is_parsable(query) AS valid\nFROM (VALUES\n\
    \    ('SELECT * FROM good_table'),\n    ('BAD SQL SELECT *'),\n    ('WITH cte\
    \ AS (SELECT 1) SELECT * FROM cte')\n) AS t(query);\n\u250C\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u252C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2510\n\u2502                    query                      \u2502 valid  \u2502\
    \n\u2502                   varchar                     \u2502 boolean\u2502\n\u251C\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253C\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2524\n\u2502 SELECT * FROM good_table              \
    \        \u2502 true   \u2502\n\u2502 BAD SQL SELECT *                       \
    \       \u2502 false  \u2502\n\u2502 WITH cte AS (SELECT 1) SELECT * FROM cte\
    \      \u2502 true   \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n\n-- Extract WHERE\
    \ conditions from a query\nSELECT * FROM parse_where('SELECT * FROM MyTable WHERE\
    \ time > 1 AND time < 100');\n\u250C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502   condition    \u2502 table_name\
    \ \u2502 context \u2502\n\u2502    varchar     \u2502  varchar   \u2502 varchar\
    \ \u2502\n\u251C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u253C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u253C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2524\n\u2502 (\"time\" > 1)   \u2502 MyTable    \u2502 WHERE   \u2502\
    \n\u2502 (\"time\" < 100) \u2502 MyTable    \u2502 WHERE   \u2502\n\u2514\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\
    \n\n-- Return detailed condition breakdown from a query\nSELECT * FROM parse_where_detailed('SELECT\
    \ * FROM MyTable WHERE time > 1 AND time < 100');\n\u250C\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 column_name \u2502 operator_type\
    \ \u2502  value  \u2502 table_name \u2502 context \u2502\n\u2502   varchar   \u2502\
    \    varchar    \u2502 varchar \u2502  varchar   \u2502 varchar \u2502\n\u251C\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u253C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u253C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u253C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u253C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 time\
    \        \u2502 >             \u2502 1       \u2502 MyTable    \u2502 WHERE  \
    \ \u2502\n\u2502 time        \u2502 <             \u2502 100     \u2502 MyTable\
    \    \u2502 WHERE   \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2518\n\n-- Parse a query with a BETWEEN condition\nSELECT * FROM\
    \ parse_where('SELECT * FROM MyTable WHERE time BETWEEN 1 AND 100');\n\u250C\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u252C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u252C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502\
    \         condition          \u2502 table_name \u2502 context \u2502\n\u2502 \
    \         varchar           \u2502  varchar   \u2502 varchar \u2502\n\u251C\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u253C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u253C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502\
    \ (\"time\" BETWEEN 1 AND 100) \u2502 MyTable    \u2502 WHERE   \u2502\n\u2514\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\
    \n\n-- Detailed parsing of a BETWEEN condition\nSELECT * FROM parse_where_detailed('SELECT\
    \ * FROM MyTable WHERE time BETWEEN 1 AND 100');\n\u250C\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 column_name \u2502 operator_type\
    \ \u2502  value  \u2502 table_name \u2502 context \u2502\n\u2502   varchar   \u2502\
    \    varchar    \u2502 varchar \u2502  varchar   \u2502 varchar \u2502\n\u251C\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u253C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u253C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u253C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u253C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 time\
    \        \u2502 >=            \u2502 1       \u2502 MyTable    \u2502 WHERE  \
    \ \u2502\n\u2502 time        \u2502 <=            \u2502 100     \u2502 MyTable\
    \    \u2502 WHERE   \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2518\n\n-- Extract function calls\nSELECT * FROM parse_functions('SELECT\
    \ upper(name), count(*) FROM users WHERE length(email) > 0');\n\u250C\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u252C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 function_name \u2502\
    \ schema  \u2502 context \u2502\n\u2502    varchar    \u2502 varchar \u2502 varchar\
    \ \u2502\n\u251C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u253C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u253C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502\
    \ upper         \u2502 main    \u2502 select  \u2502\n\u2502 count_star    \u2502\
    \ main    \u2502 select  \u2502\n\u2502 length        \u2502 main    \u2502 where\
    \   \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\
    \n\n-- Parse multi-statement as table\nSELECT * from  parse_statements('SELECT\
    \ 42; INSERT INTO log VALUES (1); SELECT 43;') as statements;\n\u250C\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2510\n\u2502          statement           \u2502\n\u2502       \
    \    varchar            \u2502\n\u251C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 SELECT\
    \ 42                    \u2502\n\u2502 INSERT INTO log (VALUES (1)) \u2502\n\u2502\
    \ SELECT 43                    \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n\n--\
    \ Count statements\nSELECT num_statements('SELECT 1; SELECT 2; SELECT 3;');\n\u250C\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
