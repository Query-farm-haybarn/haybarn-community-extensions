  extended_description: "`parser_tools` is a DuckDB extension that enables SQL query\
    \ introspection using DuckDB\u2019s native parser.\nIt allows you to analyze SQL\
    \ queries and extract structural information directly in SQL. \nFuture versions\
    \ may expose additional aspects of the parsed query structure.\nFor more details\
    \ and examples, visit the [extension repository](https://github.com/zacMode/duckdb_extension_parser_tools).\n"
