extension:
  name: trino_parity
  description: "Native Trino-compatible scalar functions (trino_*) for the cases where\
    \ DuckDB's built-ins diverge from Trino on Unicode and byte-level inputs \u2014\
    \ Trino's simple per-code-point case mapping, code-point reverse, Java-whitespace\
    \ trim, NFC normalize, and raw-bytes xxhash64/sha512/hmac_sha256"
  version: 0.5.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - apatrida
repo:
  github: brikk/duckdb-trino-parity-extension
  ref: dbdb85c502f82ddecab0779df092a6d1817f0b5a
docs:
  hello_world: "INSTALL trino_parity FROM community;\nLOAD trino_parity;\n\n-- Trino's\
    \ upper()/lower() are simple per-code-point mappings\n-- (Character.toUpperCase(int)),\
    \ so German sharp-S is unchanged \u2014\n-- DuckDB's built-in upper() gives 'STRA\u1E9E\
    E' (U+1E9E):\nSELECT trino_upper('stra\xDFe');     -- 'STRA\xDFE'\n\n-- Unicode\
    \ 16 data includes case pairs absent from older ICU snapshots:\nSELECT trino_lower(chr(11311))\
    \ = chr(11359) AS glagolitic_unicode16; -- true\n\n-- Java whitespace trim: tab\
    \ / LF / CR / FF / VT are stripped\n-- (DuckDB's built-in trim() only strips spaces):\n\
    SELECT trino_trim(E'\\tx\\n');       -- 'x'\n\n-- Code-point reverse (DuckDB's\
    \ built-in reverse is grapheme-aware):\nSELECT trino_reverse('a\U0001F600b');\
    \     -- 'b\U0001F600a'\n\n-- The catalog of functions this extension provides:\n\
    SELECT trino_name, arg_count, category FROM trino_meta();  -- 10 rows\n"
  extended_description: "`trino_parity` provides native `trino_<name>(...)` scalar\
    \ functions for the\nspecific cases where DuckDB's built-ins diverge from Trino's\
    \ documented\nbehaviour on Unicode and byte-level inputs.\n\nVersion 0.5.0 vendors\
    \ ICU 76.1 / Unicode 16.0, fixing newer case mappings\nand NFC normalization data\
    \ missing from the previous Unicode 13 snapshot.\nThe compatibility target is\
    \ Trino 483 on JDK 25. Matching version labels\nalone does not guarantee parity\
    \ with other Trino/JDK combinations.\n\nIt is designed to be loaded server-side\
    \ by anything that pushes Trino-shaped\npredicates down to DuckDB. If a Trino\
    \ connector naively pushes\n`WHERE lower(name) = 'apple'` down to DuckDB, the\
    \ filter runs with different\nUnicode semantics in each engine, and rows visible\
    \ to Trino can silently\ndisappear from the result. This extension supplies **only\
    \ the functions\nwhere that actually happens** \u2014 where DuckDB's built-in\
    \ genuinely diverges\nand a native C++ reimplementation is required to match Trino.\
    \ For the large\nmajority of Trino functions DuckDB's built-in is already equivalent\
    \ (or a\ntrivial rename / operator / one-line rewrite), so a caller emits those\n\
    directly against DuckDB \u2014 no extension needed.\n\n### Concrete divergences\
    \ fixed\n\n| Function | DuckDB built-in | Trino spec | `trino_*` result |\n|---|---|---|---|\n\
    | `upper('\xDF')` (U+00DF) | `'\u1E9E'` (U+1E9E, utf8proc special case) | `'\xDF\
    '` unchanged (simple per-code-point mapping) | matches Trino |\n| `reverse('cafe'+U+0301)`\
    \ | grapheme-aware | code-point-only | matches Trino |\n| `trim` (tab/LF/CR/FF/VT)\
    \ | not stripped | Java `Character.isWhitespace` strips them | matches Trino |\n\
    | `xxhash64(varbinary)` | no direct built-in | XXH64, big-endian bytes | matches\
    \ Trino |\n\n### Function inventory\n\n`trino_meta()` catalogs the ten native\
    \ functions the extension provides:\n\n- **String (ICU):** `trino_lower/1`, `trino_upper/1`,\
    \ `trino_reverse/1`,\n  `trino_trim/1`, `trino_ltrim/1`, `trino_rtrim/1`, `trino_normalize/1`\
    \ \u2014\n  simple per-code-point case mapping (Trino's `Character.toUpperCase(int)`\n\
    \  model \u2014 no `SpecialCasing` expansions or final-sigma rule), code-point\n\
    \  reverse, and `Character.isWhitespace` trim, via statically-linked ICU 76.1\n\
    \  vendored into the binary (so Unicode behaviour is independent of the host\n\
    \  DuckDB build).\n- **Hash (vendored):** `trino_xxhash64/1`, `trino_sha512/1`,\n\
    \  `trino_hmac_sha256/2` \u2014 over raw `VARBINARY`, self-contained (no\n  dependency\
    \ on the `crypto` / `hashfuncs` community extensions).\n  Empty HMAC keys are\
    \ rejected with `Empty key`, matching Trino; empty\n  messages and nonempty binary\
    \ keys remain supported.\n\nThe ten-function catalog and three-column `trino_meta()`\
    \ schema are\nunchanged. Validation against pinned OpenJDK 25 covers all 1,112,064\
    \ valid\nUnicode scalar values and 99,825 NFC conformance column checks, with\
    \ zero\nmismatches. See the [Unicode 16 validation report](https://github.com/brikk/duckdb-trino-parity-extension/blob/main/docs/REPORT-unicode16-validation.md)\n\
    for provenance, commands, and the limits of that validation.\n\nAligned Trino\
    \ functions (e.g. `length`, `abs`, `year`, `substring`,\n`regexp_extract`) are\
    \ intentionally NOT shipped \u2014 a caller emits them as\nbare DuckDB SQL. The\
    \ full per-function Trino\u2194DuckDB mapping and the\nempirical audits that justify\
    \ each decision are in the repository's `docs/`.\n\nSource and full divergence\
    \ catalog:\nhttps://github.com/brikk/duckdb-trino-parity-extension\n"
