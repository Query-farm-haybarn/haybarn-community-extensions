extension:
  name: maxmind
  description: Read MaxMind databases (GeoLite, GeoIP, and more)
  version: 0.10.0
  language: Zig
  build: cmake
  license: ISC
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads
  maintainers:
  - marselester
repo:
  github: marselester/duckdb-maxmind
  ref: dc2e6e60f619403c4714e95f014f6444a2653f9c
docs:
  hello_world: 'SELECT geolite_city(''./GeoLite2-City.mmdb'', ''1.0.64.0'', '''');

    '
  extended_description: "Read any MaxMind database using table and scalar functions.\n\
    GeoLite and GeoIP databases get typed columns;\nother MMDB files return JSON in\
    \ a `record` VARCHAR column.\n\nScan all IP network blocks with `read_mmdb()`.\n\
    Use the optional `network` parameter to limit the scan to a subnet,\ne.g., `read_mmdb(path,\
    \ network='1.0.0.0/8')`.\nEmpty records are excluded by default; use `include_empty=true`\
    \ to include them.\n\n```sql\nSELECT network, city.names.en\nFROM read_mmdb('./GeoLite2-City.mmdb')\n\
    WHERE city.names.en IS NOT NULL\nLIMIT 1;\n\u250C\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502   network   \u2502  \
    \  en     \u2502\n\u251C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u253C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2524\n\u2502 1.0.64.0/20 \u2502 Hiroshima \u2502\n\u2514\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\
    \nLook up a record by IP address with typed scalar functions that return structs.\n\
    The third parameter filters which fields to decode for faster lookups (pass `''`\
    \ for all fields).\n\n```sql\nSELECT geolite_city('./GeoLite2-City.mmdb', '1.0.64.0',\
    \ 'city').city.names.en AS en;\n\u250C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2510\n\u2502    en     \u2502\n\u251C\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 Hiroshima \u2502\
    \n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\
    \n```\n\nUse `mmdb_record()` to look up a record from any MMDB file as JSON:\n\
    \n```sql\nSELECT mmdb_record('./GeoLite2-City.mmdb', '1.0.64.0', 'city')::json\
    \ -> 'city' -> 'names' ->> 'en' AS en;\n\u250C\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2510\n\u2502    en     \u2502\n\u251C\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 Hiroshima\
    \ \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2518\n```\n"
