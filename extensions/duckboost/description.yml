extension:
  name: duckboost
  description: SQL-native histogram GBDT in DuckDB with vendor dump import and plain-SQL
    export
  version: 0.0.5
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - JavOrraca
repo:
  github: JavOrraca/duckboost
  ref: 0c9dc402641c7c6a25faee93e8aeb5bb70123a27
docs:
  hello_world: "LOAD duckboost;\nCREATE TABLE penguins AS\nSELECT\n  body_mass_g::DOUBLE\
    \ AS body_mass_g,\n  [bill_length_mm, bill_depth_mm, flipper_length_mm, (sex =\
    \ 'male')::DOUBLE] AS features\nFROM read_csv(\n  'https://raw.githubusercontent.com/allisonhorst/palmerpenguins/master/inst/extdata/penguins.csv',\n\
    \  nullstr = 'NA'\n)\nWHERE body_mass_g IS NOT NULL\n  AND bill_length_mm IS NOT\
    \ NULL\n  AND sex IS NOT NULL;\nCREATE TABLE models AS\nSELECT duckboost_train(\n\
    \  body_mass_g, features,\n  MAP {\n    'backend': 'native',\n    'n_estimators':\
    \ '40',\n    'max_depth': '3',\n    'learning_rate': '0.15',\n    'feature_names':\
    \ 'bill_length_mm,bill_depth_mm,flipper_length_mm,male'\n  }\n) AS model\nFROM\
    \ penguins;\nSELECT\n  round(body_mass_g, 0) AS body_mass_g,\n  round(duckboost_predict(model,\
    \ features), 0) AS pred_g\nFROM models, penguins\nORDER BY body_mass_g\nLIMIT\
    \ 5;\n"
  extended_description: '`duckboost` trains a dependency-free histogram GBDT inside
    DuckDB

    (`backend = ''native''`, alias `''reference''`), evaluates and inspects models
    in SQL,

    imports XGBoost / LightGBM / CatBoost dumps, and exports orbital-style SQL

    (`duckboost_to_sql`) for inference without the extension.


    The [Getting Started](https://javorraca.github.io/duckboost/getting-started.html)
    page

    walks through the same Palmer penguins first model using the package CSV over
    HTTPS.


    Default community binaries ship the native trainer plus dump import.

    Optional in-process XGBoost / LightGBM training requires rebuilding with

    `DUCKBOOST_WITH_XGBOOST` / `DUCKBOOST_WITH_LIGHTGBM`. CatBoost is import-only.

    '
