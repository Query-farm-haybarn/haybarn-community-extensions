extension:
  name: ossie
  description: The Apache Ossie (incubating) reference implementation for DuckDB.
    Reads Ossie semantic model files in YAML or JSON and answers semantic queries
    against the tables in DuckDB, from a single binary, with no infrastructure. Also
    exposes the semantic layer via MCP.
  version: 0.1.1
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - venkata-chikkam
  - iqea-ai
repo:
  github: iqea-ai/duckdb-ossie
  ref: 5180c67299ca14fde9d46806c7d35f9f53c2f1a9
docs:
  hello_world: "INSTALL ossie FROM community;\nLOAD ossie;\n\n-- A model is a file\
    \ you supply. This one is written inline so the example runs as pasted;\n-- normally\
    \ you would point ossie_load at a .yaml or .json file from your own repository.\n\
    CREATE TABLE orders(order_id INTEGER, customer_id INTEGER, amount DECIMAL(10,2));\n\
    CREATE TABLE customers(customer_id INTEGER, country VARCHAR);\nINSERT INTO orders\
    \ VALUES (1,1,100.00),(2,1,250.00),(3,2,75.00);\nINSERT INTO customers VALUES\
    \ (1,'US'),(2,'DE');\n\nCOPY (SELECT '{\n  \"version\": \"0.2.0.dev0\",\n  \"\
    semantic_model\": [{\n    \"name\": \"sales\",\n    \"datasets\": [\n      {\"\
    name\": \"orders\", \"source\": \"memory.main.orders\", \"fields\": [\n      \
    \  {\"name\": \"customer_id\", \"expression\": {\"dialects\": [{\"dialect\": \"\
    ANSI_SQL\", \"expression\": \"customer_id\"}]}},\n        {\"name\": \"amount\"\
    ,      \"expression\": {\"dialects\": [{\"dialect\": \"ANSI_SQL\", \"expression\"\
    : \"amount\"}]}}]},\n      {\"name\": \"customers\", \"source\": \"memory.main.customers\"\
    , \"primary_key\": [\"customer_id\"], \"fields\": [\n        {\"name\": \"customer_id\"\
    , \"expression\": {\"dialects\": [{\"dialect\": \"ANSI_SQL\", \"expression\":\
    \ \"customer_id\"}]}},\n        {\"name\": \"country\",     \"expression\": {\"\
    dialects\": [{\"dialect\": \"ANSI_SQL\", \"expression\": \"country\"}]}}]}],\n\
    \    \"relationships\": [{\"name\": \"orders_to_customers\", \"from\": \"orders\"\
    , \"to\": \"customers\",\n                       \"from_columns\": [\"customer_id\"\
    ], \"to_columns\": [\"customer_id\"]}],\n    \"metrics\": [{\"name\": \"revenue\"\
    , \"expression\": {\"dialects\": [\n                 {\"dialect\": \"ANSI_SQL\"\
    , \"expression\": \"SUM(orders.amount)\"}]}}]}]}'\n) TO 'sales_model.json' (FORMAT\
    \ csv, HEADER false, QUOTE '');\n\nCALL ossie_load('sales_model.json');\n\n--\
    \ Discover the vocabulary. An agent reads these before asking anything.\nSELECT\
    \ name, expression FROM ossie_metrics();\nSELECT dataset, name FROM ossie_fields();\n\
    \n-- Ask a question: metrics, dimensions, filters.\nSELECT * FROM ossie_query(['revenue'],\
    \ ['customers.country']);\n\n-- Or get the SQL without running it, for use where\
    \ DuckDB is not the executor.\nSELECT ossie_compile(['revenue'], ['customers.country'],\
    \ []);\n"
  extended_description: "Apache Ossie is a vendor-neutral file format for semantic\
    \ models: datasets bound to physical\ntables, fields, declared relationships,\
    \ and metrics written as aggregate expressions. It\ndescribes data in place and\
    \ never transforms it. What the format deliberately leaves open is\nthe *query*\
    \ those definitions go into -- the joins, the GROUP BY, and the grain -- because\n\
    those depend on the question being asked, and the file does not know the question.\n\
    \n**Every other shipped Ossie implementation is a converter**, translating definitions\
    \ into some\nvendor's semantic layer so that vendor's engine can run them. This\
    \ one executes the query\nitself. It is the first Ossie implementation that answers\
    \ a question rather than translating\none, and it needs no infrastructure: a model\
    \ file, your tables, and a single binary.\n\n**Functions**\n\n- `ossie_load(path,\
    \ ...)` -- parse and validate a model, YAML or JSON. Named arguments:\n  `rebind`\
    \ remaps warehouse-qualified source prefixes onto the local catalog,\n  `validate_sources`\
    \ requires every dataset's table to exist, and `allow_filter_functions`\n  sets\
    \ the filter policy at load so a caller supplying filters cannot widen its own\
    \ policy\n- `ossie_query(metrics, dimensions, filters)` -- compile the request\
    \ and execute it\n- `ossie_compile(metrics, dimensions, filters)` -- the same\
    \ SQL as text, without running it\n- `ossie_datasets()`, `ossie_fields()`, `ossie_metrics()`,\
    \ `ossie_relationships()` -- the\n  model's vocabulary, including `ai_context`\
    \ synonyms and cardinality derived from declared keys\n\n**Refusals are a feature**\n\
    \nThe primary consumer is an AI agent, which cannot check the number it receives,\
    \ so a plausible\nwrong answer is worse than an error. Where the model or the\
    \ request underdetermines the query,\nthe extension refuses and names the offending\
    \ object: metrics that aggregate at more than one\ngrain, joins that would fan\
    \ out and inflate every aggregate, and requests where two different\njoin paths\
    \ could produce two different numbers. Error text is part of the interface --\
    \ an agent\nreads it and retries -- so refusals are tested on their message, not\
    \ merely on the fact that\nthey threw.\n\n**Conformance**\n\nModels are validated\
    \ against the format's own `core-spec/ossie-schema.json`. The test suite\nincludes\
    \ five models published by other Ossie implementers -- Databricks, GoodData, NVIDIA,\n\
    Omni and OrionBelt -- vendored verbatim from apache/ossie; four load and answer\
    \ queries, and\nthe fifth carries only DATABRICKS expressions, which this extension\
    \ does not execute.\nGenerated SQL is diffed against hand-written TPC-DS equivalents\
    \ with symmetric EXCEPT over\ndsdgen(sf = 0.01) data, so correctness is measured\
    \ against the numbers rather than against our\nown output. That currently covers\
    \ total_sales and books_sales. The remaining metrics are\nexercised by golden-SQL,\
    \ grain or vocabulary tests, none of which can catch a wrong number.\n\nCurrent\
    \ limits are documented rather than hidden: ANSI_SQL expressions only, one semantic\
    \ model\nper file, table-backed sources only, all joins emitted as INNER, and\
    \ metrics spanning more than\none grain refused rather than answered wrongly.\
    \ See docs/limitations.md.\n\n**Serving a model to an AI agent**\n\n`examples/server.sql`\
    \ publishes a model over MCP via the duckdb_mcp community extension, giving\n\
    an agent a `semantic_query` tool plus `metrics` and `dimensions` resources to\
    \ discover names\nfrom. Within that tool the agent reaches nothing but the model's\
    \ own vocabulary: filters are\nallowlisted, subqueries are refused outright, and\
    \ no argument lets a caller widen that.\n\nThat holds for the connection, not\
    \ just the tool: server.sql disables every built-in duckdb_mcp\ntool -- query,\
    \ export, list_tables, describe, database_info -- so tools/list returns only\n\
    semantic_query and calling anything else is refused. Disabling query alone would\
    \ not be enough,\nbecause export takes an arbitrary SQL argument and reaches the\
    \ same data. A CI job asserts both\ndirections of this on every push.\n\nThis\
    \ is an independent implementation of the Apache Ossie file format. It is not\
    \ affiliated\nwith, endorsed by, or an official product of the Apache Software\
    \ Foundation.\n"
