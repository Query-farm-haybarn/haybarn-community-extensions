extension:
  name: decision_tune
  description: Classify rows, route messages and answer yes/no questions in SQL with
    the DecisionTune 1.0 model, on CPU via ONNX Runtime
  version: 0.1.0
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;linux_amd64_musl
  requires_toolchains: vcpkg
  maintainers:
  - redox
repo:
  github: altertable-ai/duckdb-decision_tune
  ref: a473343b7170efb8edbab3866bd122a606112ae8
docs:
  hello_world: "INSTALL decision_tune FROM community;\nLOAD decision_tune;\n\n-- DecisionTune\
    \ 1.0 (1.6 GB) is downloaded from Hugging Face and cached on first use.\nCREATE\
    \ TABLE tickets AS FROM (VALUES\n    ('Broken mug', 'The order arrived broken.\
    \ I want my money back.'),\n    ('Double charge', 'I was charged twice this month.')\n\
    ) t(subject, message);\n\n-- Route every ticket and flag refund requests: an answer,\
    \ its confidence and all probabilities per question.\nFROM tickets DECIDE (\n\
    \    CHOOSE 'Which team should handle this customer message?' AMONG (\n      \
    \  billing  'Billing: charges, refunds, invoices',\n        shipping 'Shipping:\
    \ delivery, lost or damaged packages',\n        tech     'Tech support: bugs,\
    \ crashes, login problems') AS team,\n    ASK 'Is the customer asking for a refund\
    \ or an exchange?' AS refund\n    GIVEN subject, message\n);\n\n-- The same decisions\
    \ as functions.\nSELECT decision_choose(message, 'Which team?', ['billing', 'shipping',\
    \ 'tech support']).choice,\n       decision_yes_no(message, 'Is the customer asking\
    \ for a refund?')\nFROM tickets;\n"
  extended_description: "**decision_tune** runs [DecisionTune 1.0](https://decisiontune.com/),\
    \ a 395M-parameter decision model, inside\nDuckDB. You give it a state, a question\
    \ and options; it picks an option and gives a probability for each, or\ngives\
    \ P(yes) for a yes/no question, in one encoder pass. There is no prompt engineering\
    \ of an LLM, no Python\nand no GPU: the network runs on CPU through a statically\
    \ linked ONNX Runtime.\n\n- `FROM t DECIDE (CHOOSE question AMONG (key 'description',\
    \ ...) AS name, ASK question AS name, ... GIVEN\n  columns)` adds `name`, `name_confidence`\
    \ and `name_probabilities` (a MAP of option to probability) per\n  question; filter\
    \ on them with an ordinary WHERE.\n- `decision_choose(state, question, options)`\
    \ returns the choice, its confidence and every option's\n  probability; options\
    \ are a list of texts, or a MAP or STRUCT of key to description.\n  `decision_yes_no(state,\
    \ question)` returns P(yes). Both also take the clause's words:\n  `decision_choose('Which\
    \ team?' AMONG (billing, tech) GIVEN subject, message)`.\n- A STRUCT, MAP or JSON\
    \ object state is read as `key: value | ...`, the way the reference engine reads\
    \ a dict.\n- `decision_tune_models()` lists the model files and whether they are\
    \ cached. Set `decision_tune_model_path`\n  to use a local copy offline.\n\nSend\
    \ `LOAD decision_tune` and the first `DECIDE` as two statements. A connection\
    \ that is already open picks\nup the new syntax when its current query ends.\n\
    \nThe tokenizer is a C++ port of the Hugging Face one and matches it token for\
    \ token; the probabilities match\nonnxruntime in Python to 1e-4. Rows run in parallel\
    \ on DuckDB's threads and repeated decisions are scored once.\n\nThe extension\
    \ is MIT licensed. The DecisionTune 1.0 weights are Apache-2.0. The model's probabilities\
    \ are not\ncalibrated; do not use it for high-risk decisions about people without\
    \ independent validation.\n"
