extension:
  name: finetype
  description: "Semantic type classification \u2014 detects 244 data types (emails,\
    \ URLs, dates, UUIDs, currencies, etc.) from raw strings"
  version: 0.6.36
  language: Rust
  build: cargo
  license: MIT
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;linux_amd64_musl;windows_amd64_mingw
  requires_toolchains: rust
  maintainers:
  - hughcameron
repo:
  github: meridian-online/finetype
  ref: b060785d29dab029aae4a23b514c5d1bc125f4c2
