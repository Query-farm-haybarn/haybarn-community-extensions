extension:
  name: finetype
  description: "Semantic type classification \u2014 detects 240 data types (emails,\
    \ URLs, dates, UUIDs, currencies, etc.) from raw strings"
  version: 0.6.22
  language: Rust
  build: cargo
  license: MIT
  excluded_platforms: linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
  requires_toolchains: rust
  maintainers:
  - hughcameron
repo:
  github: meridian-online/finetype
  ref: v0.6.22
