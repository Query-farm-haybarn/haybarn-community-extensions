  extended_description: "FineType is a semantic type classifier that detects 251 data\
    \ types from raw string values. A\nmulti-branch neural network labels each value,\
    \ mapping it into a three-level taxonomy:\n`domain.category.type`.\n\nFineType\
    \ is **column-oriented**: its accuracy comes from seeing a whole column at once,\
    \ so the\nprimary surface is the `ft_profile` / `ft_validate` **table verbs**\
    \ below. Per-value scalar\nfunctions are also provided for ad-hoc classification,\
    \ but a lone value that normally leans on its\ncolumn neighbours to disambiguate\
    \ (a bare UUID, a phone number) is classified less confidently\nthan the same\
    \ value seen in column context.\n\n## Table verbs\n\nThese take a table (or a\
    \ `LIST` of column values) and return **one row per column** \u2014 the natural\n\
    grain for profiling and validation.\n\n### `ft_profile(table_name VARCHAR)`\n\
    Profile every column of a table. Returns `(column_name, type, confidence, duckdb_type)`,\n\
    one row per column. The table is named as a string literal; FineType reaches into\
    \ the catalog to\nread its columns.\n\n```sql\nSELECT * FROM ft_profile('people');\n\
    ```\n\nNested `STRUCT` / `LIST` columns are **guarded, not silently rejected**:\
    \ rather than forcing them\nthrough per-value classification that would misreport\
    \ them, `ft_profile` returns a flatten hint in\nthe `type` column (with `confidence`\
    \ and `duckdb_type` left `NULL`). Flatten the column first if you\nneed it typed.\n\
    \n### `ft_validate(table_name VARCHAR, schema_json VARCHAR)`\nValidate a table's\
    \ columns against a JSON Schema. Returns one row per validated column with the\n\
    total values checked, the reject count, and a sample rejection message. The schema\
    \ can be supplied\ninline, via `getvariable`, or read from a file \u2014 a bare\
    \ path is read for you, while a string\nstarting with `{` is used as-is.\n\nThe\
    \ JSON Schema is keyed by column under a top-level `properties` object.\n\nThe\
    \ constraints that are **asserted** are `pattern`, `minLength`, `maxLength`, `enum`,\
    \ `type` and\n`required`. Per the JSON Schema specification, `format` is an annotation\
    \ rather than an assertion:\n`{\"format\":\"email\"}` describes the column and\
    \ rejects nothing. Use `pattern` when you want values\ncounted as rejects.\n\n\
    ```sql\n-- inline\nSELECT * FROM ft_validate('people', '{\"properties\":{\"email\"\
    :{\"type\":\"string\",\"pattern\":\"^[^@]+@[^@]+\\\\.[^@]+$\"}}}');\n\n-- via\
    \ a variable, when the schema is long enough to want a name\nSET VARIABLE email_schema\
    \ = '{\"properties\":{\"email\":{\"type\":\"string\",\"minLength\":6}}}';\nSELECT\
    \ * FROM ft_validate('people', getvariable('email_schema'));\n```\n\n## Aggregate\
    \ function\n\n### `ft_profile(value VARCHAR[, header VARCHAR]) \u2192 STRUCT(type\
    \ VARCHAR, confidence DOUBLE, duckdb_type VARCHAR)`\nProfile one column directly,\
    \ as an **aggregate** over its values \u2014 useful when the column is in\nhand\
    \ and you do not want to name a table. It goes in a `SELECT` rather than a `FROM`,\
    \ and returns\none `STRUCT` rather than a row per column.\n\n**Pass the column\
    \ name as the second argument.** FineType uses the header as evidence, so the\n\
    two-argument form is what reproduces the `ft_profile(table)` answer; without it\
    \ the same values\ncan land on a different type.\n\n```sql\nSELECT ft_profile(email,\
    \ 'email') FROM people;\n-- {'type': identity.person.email, 'confidence': 0.5915254950523376,\
    \ 'duckdb_type': VARCHAR}\n\nSELECT ft_profile(email) FROM people;  -- no header:\
    \ less evidence, different answer\n-- {'type': representation.text.plain_text,\
    \ 'confidence': 0.6070796251296997, 'duckdb_type': VARCHAR}\n```\n\nBecause it\
    \ is an aggregate, it cannot take `list(...)` \u2014 nesting one aggregate inside\
    \ another is a\nbinder error. Use `ft_detail(values LIST)` below if you already\
    \ hold the values as a list.\n\n## Scalar functions\n\nPer-value classification,\
    \ one value at a time. Strongest on values unambiguous in isolation (URLs,\nISO\
    \ dates, well-formed emails, IP addresses).\n\n### `ft_infer(value VARCHAR) \u2192\
    \ VARCHAR`\nClassify a single value. Returns the full semantic type label.\n\n\
    ```sql\nSELECT ft_infer('https://example.com');  -- technology.internet.url\n\
    SELECT ft_infer('2024-01-15');           -- datetime.date.iso\nSELECT ft_infer('true');\
    \                 -- representation.boolean.terms\n```\n\n### `ft_detail(value\
    \ VARCHAR) \u2192 VARCHAR`\nClassify with full detail. Returns JSON with the type,\
    \ confidence (0.0\u20131.0), the recommended\nDuckDB type, the number of samples\
    \ seen, the disambiguation path, and the per-label vote map.\n\n```sql\nSELECT\
    \ ft_detail('192.168.1.1');\n-- {\"type\": \"technology.internet.ip_v4\", \"confidence\"\
    : 0.829, \"duckdb_type\": \"INET\", ...}\n```\n\n### `ft_cast(value VARCHAR) \u2192\
    \ VARCHAR`\nNormalize a value for safe `TRY_CAST()` to its detected DuckDB type.\
    \ Handles date format\nconversion (US/EU \u2192 ISO), boolean normalization, UUID\
    \ lowercasing, numeric cleanup.\n\n```sql\nSELECT ft_cast('01/15/2024');  -- 2024-01-15\
    \ (US date \u2192 ISO)\n```\n\n### `ft_validate_text(value VARCHAR, schema_json\
    \ VARCHAR) \u2192 STRUCT(valid BOOLEAN, \"constraint\" VARCHAR, message VARCHAR)`\n\
    Validate a single value against a JSON Schema fragment. Returns a struct: `valid`\
    \ is `true` when\nthe value conforms (with `constraint` and `message` `NULL`);\
    \ on failure `valid` is `false` and\n`constraint` / `message` name the failing\
    \ keyword and the reason. This is the per-cell engine the\n`ft_validate` table\
    \ verb runs over every column.\n\n```sql\nSELECT ft_validate_text('not-an-email',\
    \ '{\"type\":\"string\",\"pattern\":\"^[^@]+@[^@]+\\\\.[^@]+$\"}');\n-- {'valid':\
    \ false, 'constraint': pattern, 'message': '\"not-an-email\" does not match \"\
    ^[^@]+@[^@]+\\.[^@]+$\"'}\n```\n\n### `ft_unpack(json VARCHAR) \u2192 VARCHAR`\n\
    Recursively classify every scalar value in a JSON document. Returns annotated\
    \ JSON carrying the\ntype, confidence, recommended DuckDB type, and original value\
    \ for each field.\n\n### `ft_version() \u2192 VARCHAR`\nReturns the extension\
    \ version string.\n\n> **Aliases.** The earlier un-prefixed scalar names (`finetype`,\
    \ `finetype_detail`,\n> `finetype_cast`, `finetype_unpack`, `finetype_validate`,\
    \ `finetype_version`) remain registered as\n> aliases of the `ft_` scalars, so\
    \ existing code keeps working. New code should use the `ft_` names.\n\n## Type\
    \ Taxonomy\n\n244 types organized into 7 domains:\n- **container**: JSON, XML,\
    \ CSV, arrays, key-value (11 types)\n- **datetime**: dates, times, timestamps,\
    \ epochs, durations, offsets (86 types)\n- **finance**: currencies, accounting,\
    \ market identifiers, transactions (28 types)\n- **geography**: coordinates, locations,\
    \ addresses, transportation (25 types)\n- **identity**: names, emails, phones,\
    \ payments, medical (33 types)\n- **representation**: booleans, numbers, text,\
    \ files, scientific (32 types)\n- **technology**: URLs, IPs, UUIDs, versions,\
    \ codes (29 types)\n\nFor more information, see the [FineType documentation](https://github.com/meridian-online/finetype).\n"
