    email\":\"user@example.com\",\"active\":true}') AS annotated;\n"
  extended_description: "FineType is a tiered CharCNN semantic type classifier that\
    \ detects 250 data types from raw string values.\nIt uses a hierarchical architecture\
    \ of 34 character-level convolutional neural networks to classify values\ninto\
    \ a three-level taxonomy: `domain.category.type`.\n\n## Functions\n\n### `finetype(value\
    \ VARCHAR) \u2192 VARCHAR`\nClassify a single value. Returns the full semantic\
    \ type label.\n\n```sql\nSELECT finetype('https://example.com');  -- technology.internet.url\n\
    SELECT finetype('2024-01-15');           -- datetime.date.iso\nSELECT finetype('true');\
    \                 -- representation.boolean.terms\n```\n\n### `finetype_detail(value\
    \ VARCHAR) \u2192 VARCHAR`\nClassify with full detail \u2014 returns JSON with\
    \ type, confidence (0.0\u20131.0), and recommended DuckDB type.\n\n```sql\nSELECT\
    \ finetype_detail('user@example.com');\n-- {\"type\":\"identity.person.email\"\
    ,\"confidence\":0.9992,\"duckdb_type\":\"VARCHAR\"}\n```\n\n### `finetype_cast(value\
    \ VARCHAR) \u2192 VARCHAR`\nNormalize a value for safe `TRY_CAST()` to its detected\
    \ DuckDB type.\nHandles date format conversion (US/EU \u2192 ISO), boolean normalization,\
    \ UUID lowercasing, numeric cleanup.\n\n```sql\nSELECT finetype_cast('01/15/2024');\
    \  -- 2024-01-15 (US date \u2192 ISO)\nSELECT finetype_cast('true');        --\
    \ true (boolean normalization)\n```\n\n### `finetype_unpack(json VARCHAR) \u2192\
    \ VARCHAR`\nRecursively classify all scalar values in a JSON document. Returns\
    \ annotated JSON with type/confidence/duckdb_type for each field.\n\n### `finetype_version()\
    \ \u2192 VARCHAR`\nReturns the extension version string.\n\n## Type Taxonomy\n\
    \n250 types organized into 7 domains:\n- **container**: JSON, XML, CSV, arrays,\
    \ key-value (12 types)\n- **datetime**: dates, times, timestamps, epochs, durations,\
    \ offsets (84 types)\n- **finance**: currencies, accounting, market identifiers,\
    \ transactions (31 types)\n- **geography**: coordinates, locations, addresses,\
    \ transportation (25 types)\n- **identity**: names, emails, phones, payments,\
    \ medical (34 types)\n- **representation**: booleans, numbers, text, files, scientific\
    \ (36 types)\n- **technology**: URLs, IPs, UUIDs, booleans, versions, codes (28\
    \ types)\n\n## Use Cases\n\n**Data profiling** \u2014 Detect column types in messy\
    \ CSV/Parquet data:\n```sql\nSELECT column_name, finetype(value) AS detected_type,\
    \ count(*) AS cnt\nFROM my_table UNPIVOT (value FOR column_name IN (*))\nGROUP\
    \ BY column_name, detected_type\nORDER BY column_name, cnt DESC;\n```\n\n**Schema\
    \ inference** \u2014 Get DuckDB-native type recommendations:\n```sql\nSELECT column_name,\n\
    \       finetype_detail(value)::JSON->>'duckdb_type' AS recommended_type\nFROM\
    \ my_table UNPIVOT (value FOR column_name IN (*))\nGROUP BY ALL;\n```\n\nFor more\
    \ information, see the [FineType documentation](https://github.com/meridian-online/finetype).\n"
