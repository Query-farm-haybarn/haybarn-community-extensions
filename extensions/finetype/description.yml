extension:
  name: finetype
  description: "Semantic type classification \u2014 detects 251 data types (emails,\
    \ URLs, dates, UUIDs, currencies, etc.) from raw strings"
  version: 0.6.57
  language: Rust
  build: cargo
  license: MIT
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;linux_amd64_musl;windows_amd64_mingw
  requires_toolchains: rust
  maintainers:
  - hughcameron
repo:
  github: meridian-online/finetype
  ref: c7662be0359d1e438fea399b133f5115aaa91b6d
