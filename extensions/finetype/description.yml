  extended_description: "FineType is a semantic type classifier that detects 240 data\
    \ types from raw string values. A\nmulti-branch neural network labels each value\
    \ in a single forward pass, mapping it into a\nthree-level taxonomy: `domain.category.type`.\n\
    \n> **Per-value classification.** These functions classify one value at a time,\
    \ with no column\n> context. They are strongest on values that are unambiguous\
    \ in isolation (URLs, ISO dates,\n> well-formed emails, IP addresses). A lone\
    \ value that normally relies on its column neighbours\n> to disambiguate (a bare\
    \ UUID, a phone number) may be classified less confidently. To profile a\n> whole\
    \ column or validate a table, use the [FineType CLI](https://github.com/meridian-online/finetype),\n\
    > which always sees the full column.\n\n## Functions\n\n### `finetype(value VARCHAR)\
    \ \u2192 VARCHAR`\nClassify a single value. Returns the full semantic type label.\n\
    \n```sql\nSELECT finetype('https://example.com');  -- technology.internet.url\n\
    SELECT finetype('2024-01-15');           -- datetime.date.iso\nSELECT finetype('true');\
    \                 -- representation.boolean.terms\n```\n\n### `finetype_detail(value\
    \ VARCHAR) \u2192 VARCHAR`\nClassify with full detail. Returns JSON with the type,\
    \ confidence (0.0\u20131.0), the recommended\nDuckDB type, the number of samples\
    \ seen, the disambiguation path, and the per-label vote map.\n\n```sql\nSELECT\
    \ finetype_detail('192.168.1.1');\n-- {\"type\": \"technology.internet.ip_v4\"\
    , \"confidence\": 0.901, \"duckdb_type\": \"INET\",\n--  \"samples\": 1, \"disambiguation\"\
    : \"multi-branch\", \"votes\": {\"technology.internet.ip_v4\": 0.901}}\n```\n\n\
    ### `finetype_cast(value VARCHAR) \u2192 VARCHAR`\nNormalize a value for safe\
    \ `TRY_CAST()` to its detected DuckDB type.\nHandles date format conversion (US/EU\
    \ \u2192 ISO), boolean normalization, UUID lowercasing, numeric cleanup.\n\n```sql\n\
    SELECT finetype_cast('01/15/2024');  -- 2024-01-15 (US date \u2192 ISO)\nSELECT\
    \ finetype_cast('true');        -- true (boolean normalization)\n```\n\n### `finetype_unpack(json\
    \ VARCHAR) \u2192 VARCHAR`\nRecursively classify every scalar value in a JSON\
    \ document. Returns annotated JSON carrying the\ntype, confidence, recommended\
    \ DuckDB type, and original value for each field.\n\n### `finetype_validate(value\
    \ VARCHAR, schema_json VARCHAR) \u2192 VARCHAR`\nValidate a single value against\
    \ a JSON Schema fragment. Returns `valid` when the value conforms,\nor the first\
    \ validation error otherwise.\n\n```sql\nSELECT finetype_validate('user@example.com',\
    \ '{\"type\":\"string\",\"pattern\":\"^[^@]+@[^@]+$\"}');  -- valid\nSELECT finetype_validate('abc',\
    \ '{\"type\":\"string\",\"minLength\":5}');                           -- error\
    \ message\n```\n\n### `finetype_version() \u2192 VARCHAR`\nReturns the extension\
    \ version string.\n\n## Type Taxonomy\n\n240 types organized into 7 domains:\n\
    - **container**: JSON, XML, CSV, arrays, key-value (11 types)\n- **datetime**:\
    \ dates, times, timestamps, epochs, durations, offsets (84 types)\n- **finance**:\
    \ currencies, accounting, market identifiers, transactions (28 types)\n- **geography**:\
    \ coordinates, locations, addresses, transportation (25 types)\n- **identity**:\
    \ names, emails, phones, payments, medical (33 types)\n- **representation**: booleans,\
    \ numbers, text, files, scientific (33 types)\n- **technology**: URLs, IPs, UUIDs,\
    \ versions, codes (26 types)\n\n## Use Cases\n\n**Data profiling** \u2014 Detect\
    \ column types in messy CSV/Parquet data:\n```sql\nSELECT column_name, finetype(value)\
    \ AS detected_type, count(*) AS cnt\nFROM my_table UNPIVOT (value FOR column_name\
    \ IN (*))\nGROUP BY column_name, detected_type\nORDER BY column_name, cnt DESC;\n\
    ```\n\n**Schema inference** \u2014 Get DuckDB-native type recommendations:\n```sql\n\
    SELECT column_name,\n       finetype_detail(value)::JSON->>'duckdb_type' AS recommended_type\n\
    FROM my_table UNPIVOT (value FOR column_name IN (*))\nGROUP BY ALL;\n```\n\nFor\
    \ more information, see the [FineType documentation](https://github.com/meridian-online/finetype).\n"
