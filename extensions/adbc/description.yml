extension:
  name: adbc
  description: Connects DuckDB to any database that has an Arrow Database Connectivity
    (ADBC) driver.
  version: 0.0.1
  language: C++
  build: cmake
  license: Apache-2.0
  maintainers:
  - columnar-tech
repo:
  github: columnar-tech/duckdb-adbc-client
  ref: e0c62ee9e6557c31fd2ea7ead773ea338567612a
docs:
