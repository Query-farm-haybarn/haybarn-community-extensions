extension:
  name: brew
  description: Get locally homebrew casks, packages and formulas and their dependencies
    as nicely types tables
  version: 0.8.1
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - adriens
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;windows_amd64;windows_amd64_mingw;windows_arm64;windows_amd64_rtools
repo:
  github: adriens/duckdb-brew
  ref: 60c96b1ad37ef63eb800c6ecba96c8db19774fd8
docs:
  hello_world: "-- Get brew version\nSELECT brew_version() as brew_version;\n\n--\
    \ View all configuration with categories\nSELECT name, value, category FROM brew_config();\n\
    \n-- Run brew doctor to check system health (categorized)\nFROM brew_doctor();\n\
    \n-- Get all casks\nfrom brew_casks();\n\n-- Get all packages\nfrom brew_packages();\n\
    \n-- Get all formulas\nfrom brew_formulas();\n\n-- Get dependencies between packages\n\
    from brew_dependencies();\n\n-- Reporting : Find outdated packages\nSELECT name,\
    \ version FROM brew_packages() WHERE outdated = true;\n\n-- Create brew_packages\
    \ table with constraints\nCREATE OR REPLACE TEMP TABLE brew_packages (\n  tap\
    \ VARCHAR,\n  name VARCHAR PRIMARY KEY,\n  version VARCHAR,\n  type VARCHAR,\n\
    \  description VARCHAR,\n  homepage VARCHAR,\n  license VARCHAR,\n  installed_on_request\
    \ BOOLEAN,\n  installed_as_dependency BOOLEAN,\n  installed_time TIMESTAMP,\n\
    \  outdated BOOLEAN,\n  pinned BOOLEAN,\n  deprecated BOOLEAN,\n  disabled BOOLEAN,\n\
    \  poured_from_bottle BOOLEAN,\n  built_as_bottle BOOLEAN,\n  dependencies VARCHAR,\n\
    \  aliases VARCHAR,\n  deprecation_reason VARCHAR,\n  disable_reason VARCHAR,\n\
    \  caveats VARCHAR,\n  size_bytes BIGINT\n);\n\n-- Populate from the function\n\
    INSERT INTO brew_packages\n  SELECT * FROM brew_packages();\n\n-- Create brew_dependencies\
    \ table with foreign key constraints\nCREATE OR REPLACE TEMP TABLE brew_dependencies\
    \ (\n    name VARCHAR,\n    dependency VARCHAR,\n    FOREIGN KEY (name) REFERENCES\
    \ brew_packages(name),\n    FOREIGN KEY (dependency) REFERENCES brew_packages(name)\n\
    );\n\n-- Populate from brew_packages function\nINSERT INTO brew_dependencies\n\
    SELECT\n    name,\n    unnest(string_split(dependencies, ', ')) as dependency\n\
    FROM brew_packages()\nWHERE dependencies IS NOT NULL\nORDER BY name;\n\nSELECT\
    \ \n  tap, \n  count(*) as package_count\nFROM brew_packages\nGROUP BY tap\nORDER\
    \ BY package_count DESC;\n"
extended_description: 'The `brew` extension add `brew` reporting capabilities to DuckDB,
  enabling structured analysis, package statistics, inluding file size reporting.


  **Documentation:** See [`QUICKSTART`](https://github.com/adriens/duckdb-brew/blob/main/QUICKSTART.md)
  for full usage instructions and `SQL` examples.


  **Key Features:**


  - Access local Homebrew casks, packages, and formulas as structured tables

  - Perform SQL queries for package management and reporting

  - Get file size statistics for installed packages

  - Identify outdated packages easily

  - Identify package dependencies and relationships


  **Core Functions:**


  - `brew_casks()` - Retrieve information about installed Homebrew casks

  - `brew_packages()` - Retrieve information about installed Homebrew packages

  - `brew_formulas()` - Retrieve information about available Homebrew formulas

  - `brew_dependencies()` - Get dependencies between packages



  **Example Use Cases:**


  - Generate reports on installed packages and their sizes

  - Monitor and manage package updates

  - Analyze package dependencies and relationships

  '
