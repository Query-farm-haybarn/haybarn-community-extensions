extension:
  name: emeans
  description: 'e-means clustering in SQL: mini-batch k-means with EMA updates and
    fitted scaling laws (Bessa et al. 2026), in memory or streamed from a query larger
    than memory.'
  version: 0.1.0
  language: C++
  build: cmake
  license: MIT
  requires_toolchains: python3
  maintainers:
  - oluies
repo:
  github: hugr-lab/duck-emeans
  ref: eb6d27d9df570a1874c45925e92ba7a684dfbb2b
docs:
  hello_world: "INSTALL emeans FROM community;\nLOAD emeans;\n\n-- Two unit squares;\
    \ each centroid ends at the mean of its square's four corners\nSELECT list_sort((emeans([[0,\
    \ 0], [0, 1], [1, 0], [1, 1],\n                          [10, 10], [10, 11], [11,\
    \ 10], [11, 11]], 2)).centroids);\n-- [[0.5, 0.5], [10.5, 10.5]]\n\n-- The nearest\
    \ centroid of one vector, 1-based, and the squared distance to it\nSELECT emeans_assign([9,\
    \ 9], [[0, 0], [10, 10]]);\n-- {'label': 2, 'sq_distance': 2.0}\n\n-- Streamed\
    \ from a query, for tables larger than memory: one row per cluster\nCREATE TABLE\
    \ points AS\nSELECT [(i % 2) * 10 + (i % 5) * 0.1, (i % 3) * 0.1]::FLOAT[2] AS\
    \ v FROM range(1000) t(i);\nSELECT centroid, n FROM emeans_stream('SELECT v FROM\
    \ points', 2) ORDER BY centroid[1];\n-- [0.2, 0.1]      500\n-- [10.2, 0.0998]\
    \  500\n"
  extended_description: "e-means (Bessa et al. 2026, arXiv 2611.09501) is mini-batch\
    \ k-means whose centroids follow an\nexponential moving average of their batch\
    \ means, with the batch size and step set by fitted\nscaling laws. The paper reports\
    \ Lloyd's 25-epoch loss beaten in 1.4 to 2.6 epochs. The extension\nreimplements\
    \ the reference in faiss/contrib/e_means; its objective is within 0.5% of faiss-cpu's.\n\
    \n- emeans(vectors, k [, nepochs [, seed]]): centroids, 1-based labels and the\
    \ objective per pass, for\n  FLOAT, DOUBLE or integer lists or fixed-size arrays\
    \ such as FLOAT[384]. emeans_spherical clusters\n  by direction, for embeddings\
    \ compared by cosine similarity.\n- emeans_stream(query, k, ...): data larger\
    \ than memory. It runs the query once per pass, ordered by a\n  hash, so DuckDB's\
    \ sort spills each pass, and holds only a batch and the centroids.\n- emeans_assign\
    \ / emeans_assign_spherical: the nearest centroid of a vector, an IVF partition\
    \ key.\n- emeans_agg and emeans_cluster_id(geom, k) OVER (...): clustering of\
    \ POINT geometries like PostGIS's\n  ST_ClusterKMeans, on the sphere for geographic\
    \ coordinate systems; emeans_assign_point.\n- emeans_recipe and emeans_trace:\
    \ the batch size and step the scaling laws pick, and a run frame by frame.\n\n\
    Every fit can be interrupted (Ctrl-C, con.interrupt(), max_execution_time), takes\
    \ its buffers from\nDuckDB's buffer manager, and gives the same result for the\
    \ same seed on any number of threads.\n\nDocumentation: https://hugr-lab.github.io/duck-emeans/\n"
