extension:
  name: anofox_decide
  description: "Natural-language decisions on your data inside DuckDB \u2014 yes/no\
    \ probabilities, one-of-N choices and ordinal scores with the answer sets written\
    \ in the query, from hosted (TypeSafe Jev, Liquid AI D1), local-server and in-process\
    \ ONNX decision models, plus calibration metrics"
  version: 2026.10.04
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - sipemu
  - jrosskopf
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;linux_amd64_musl;osx_amd64
repo:
  github: DataZooDE/anofox-decide
  ref: 65d3743b4f5cfe62948f96440622d243f80ca55d
docs:
  hello_world: "-- Try the SQL with the built-in test model: no key, no network. It\
    \ returns\n-- constants (0.5, the first option), so it can never pass for a real\
    \ answer.\nSELECT decide_probability('The customer requests a refund.', 'A refund\
    \ is requested.', model := 'stub') AS p;\n\n-- Real answers: register a hosted\
    \ model, opt in to remote calls, and ask.\n-- (export LIQUID_API_KEY=... before\
    \ starting DuckDB; a DuckDB secret overrides it)\nSET anofox_decide_allow_remote\
    \ = true;                 -- your text goes to the provider\nSELECT decide_register_model('d1:free',\
    \ 'liquid');\nSET anofox_decide_model = 'd1:free';\n\nSELECT id,\n       decide_probability(text,\
    \ 'A refund is requested.')                                    AS p_refund,\n\
    \       decide_choice(text, 'Which team owns this?', ['billing', 'defect', 'other'])\
    \          AS team,\n       decide_score(text, 'How frustrated is the writer?',\
    \ ['calm', 'frustrated', 'angry'])  AS frustration\nFROM (VALUES (1, 'I was charged\
    \ twice for my March invoice, please refund the extra 49 EUR.'),\n           \
    \  (2, 'The app crashes every time I open the export dialog on version 3.2.'))\
    \ t(id, text);\n\n-- Something not working? One row per check, with the fix for\
    \ each problem.\nSELECT * FROM decide_doctor();\n"
  extended_description: "**anofox_decide** turns natural-language questions about\
    \ text or structured data into SQL\nfunctions. Ask a yes/no question, choose one\
    \ of the options *you* define, or rate a text on an\nordered scale; purpose-built\
    \ decision models answer with **calibrated probabilities**, so you\nchoose the\
    \ threshold and can measure how good the answers are. No training, no prompt\n\
    engineering, no glue code: the questions and the answer sets are written in the\
    \ query.\n\n### Three kinds of question\n- **binary** \u2014 `decide_probability(state,\
    \ 'A refund is requested.')` is the probability that a\n  statement holds; `decide_decision(state,\
    \ question, 0.7)` applies an explicit threshold (never\n  guessed for you).\n\
    - **choice** \u2014 `decide_choice(state, 'Which team owns this?', ['billing','defect','other'])`\n\
    \  picks one option from a list you define at query time, with the probability\
    \ of each.\n- **score** \u2014 `decide_score(state, 'How frustrated is the writer?',\
    \ ['calm','frustrated','angry'])`\n  rates a text on an ordered rubric of 2 to\
    \ 10 levels and returns the expected level.\n\nSeveral questions about the same\
    \ text go in one request with `decide_many` (JSON), `decide_table`\n(one row per\
    \ question: probability, choice, score, per-option distribution) or `decide_answers`\n\
    (the same rows as a list you `unnest`, which scores a whole table concurrently).\n\
    \n### Pick the model that fits\nOne interface, several models, comparable in a\
    \ single query:\n\n- **Hosted:** TypeSafe **Jev** (`typesafe`), Liquid AI **D1**\
    \ (`liquid`) and Cloudflare **Clef** /\n  **Clef-flash** (`cloudflare`, on Workers\
    \ AI). Calls send the text you\n  score to the provider, so they sit behind an\
    \ explicit opt-in (`anofox_decide_allow_remote`),\n  off by default.\n- **Local\
    \ servers:** [strands-decider](https://github.com/strands-labs/strands-decider)\n\
    \  (`strands`, keyless, on loopback), Kev, or any System One compatible endpoint\
    \ (`systemone`).\n- **In-process and offline:** **Laya** (multilingual or typed-decisions)\
    \ and **Julia-1** on ONNX Runtime\n  (`local`). `CALL decide_download('laya-multilingual')`\
    \ fetches the upstream weights from Hugging\n  Face once (about 0.7 GB, pinned\
    \ and SHA-256 verified); after that it runs inside DuckDB with no\n  Python and\
    \ no network. Over-long text raises an error instead of being cut silently\n \
    \ (`decide_token_count` shows what fits).\n- **`stub`:** a built-in test model\
    \ that returns constants, so the SQL can be tried with no key.\n\nAPI keys come\
    \ from environment variables or DuckDB secrets\n(`CREATE SECRET (TYPE anofox_decide,\
    \ API_KEY '...', SCOPE 'api.liquid.ai')`); a secret always\noverrides the environment,\
    \ and a key is only ever sent to the host it was configured for. **The\nextension\
    \ ships no model weights**: local models download the upstream files on request.\n\
    \n### Built for many rows\nScalar calls over a table evaluate a chunk of rows\
    \ together: identical requests are sent once, up\nto `anofox_decide_max_concurrency`\
    \ remote requests run at the same time (default 8 for hosted\nproviders), connections\
    \ are reused, and a rate limit makes the query back off. On the real Liquid\n\
    D1 service, 8 tickets with three questions each took 176.7 s one at a time and\
    \ 23.1 s this way.\n\n### Know how good it is, and fix the cut-off\n`decide_accuracy`,\
    \ `decide_brier_score` and `decide_ece` aggregate over `(probability, label)`\n\
    pairs, so comparing models on your own labelled data is one query. A 200-ticket\
    \ evaluation of every\nsupported model on public data is in the repository (`docs/EVALUATION.md`).\n\
    \nSome models rank well but are wrong at the 0.5 cut-off. `decide_fit_calibration(p,\
    \ outcome)` fits\nPlatt scaling to a labelled sample and returns a spec you register\
    \ the model with\n(`MAP {'calibration': 'platt:1.92,-0.72'}`); the ranking never\
    \ changes, and choice and score answers\nare untouched. `decide_choice_distribution`\
    \ returns the probability of every option, so a\nlow-confidence answer can be\
    \ left undecided in plain SQL.\n\n### Errors that say what to do\nEvery error\
    \ is `<function>: <what went wrong>. Fix: <what to run>` and echoes the value\
    \ that\ncaused it. `decide_doctor()` checks the whole setup, and `decide_models()`\
    \ shows which models can\nbe called right now and why not.\n\n### Surface\n- `decide_probability`\
    \ / `decide_decision` / `decide_choice` / `decide_choice_distribution` / `decide_score`\
    \ \u2014 evaluate one question\n- `decide_many` / `decide_table` / `decide_answers`\
    \ \u2014 several questions about one text, as JSON, rows, or a list to `unnest`\n\
    - `decide_accuracy` / `decide_brier_score` / `decide_ece` / `decide_fit_calibration`\
    \ \u2014 quality metrics and calibration (aggregates)\n- `decide_register_model`\
    \ / `decide_unregister_model` / `decide_models` / `decide_doctor` \u2014 models\
    \ and diagnostics\n- `decide_download` / `decide_token_count` \u2014 fetch a local\
    \ model, count tokens for its window\n- `SET anofox_decide_*` settings (default\
    \ model, remote opt-in, concurrency, timeout, retries)\n\nEvery function is also\
    \ available as `anofox_decide_*`. See the\n[project repository](https://github.com/DataZooDE/anofox-decide)\
    \ for the full SQL API, examples\nand troubleshooting.\n"
