    \u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502     0 \u2502 545619.75 \u2502\
    \ 4724508.25 \u2502 {xmin: 545539.75, ...}         \u2502 POLYGON ((...))    \
    \     \u2502     0 \u2502      0 \u2502      0 \u2502   320 \u2502     8 \u2502\
    \ {...}      \u2502 ...        \u2502\n\u2502     1 \u2502 545619.75 \u2502 4724504.25\
    \ \u2502 {xmin: 545539.75, ...}         \u2502 POLYGON ((...))         \u2502\
    \     0 \u2502      0 \u2502      1 \u2502   320 \u2502     8 \u2502 {...}   \
    \   \u2502 ...        \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n\n-- Compute NDVI\
    \ directly in SQL using band algebra:\nWITH __input AS (\n    SELECT\n       \
    \ databand_1 AS red,\n        databand_2 AS nir\n    FROM\n        RT_Read('path/to/raster/file.tif',\
    \ blocksize_x := 512, blocksize_y := 512)\n)\nSELECT\n    RT_Cube2TypeFloat((nir\
    \ - red) / (nir + red)) AS ndvi\nFROM\n    __input\n;\n\n-- Extract pixel values\
    \ into SQL arrays for aggregate analysis:\nWITH __input AS (\n    SELECT RT_Cube2ArrayFloat(databand_1,\
    \ true) AS band\n    FROM RT_Read('path/to/raster/file.tif', blocksize_x := 512,\
    \ blocksize_y := 512)\n)\nSELECT\n    list_min(band.values)        AS band_min,\n\
    \    list_stddev_pop(band.values) AS band_stddev,\n    list_max(band.values) \
    \       AS band_max\nFROM __input\n;\n\n-- Write a raster file using COPY ...\
    \ FORMAT RASTER:\nCOPY (\n    SELECT geometry, databand_1, databand_2, databand_3\n\
    \    FROM RT_Read('path/to/raster/file.tif')\n)\nTO 'path/to/output/file.tif'\n\
    WITH (\n    FORMAT RASTER,\n    DRIVER 'COG',\n    CREATION_OPTIONS ('COMPRESS=LZW'),\n\
    \    RESAMPLING 'nearest',\n    COMPUTE_VALID_ENVELOPE true,\n    SRS 'EPSG:25830',\n\
    \    GEOMETRY_COLUMN 'geometry',\n    DATABAND_COLUMNS ['databand_3', 'databand_2',\
    \ 'databand_1']\n);\n\n-- Clip raster tiles to a polygon geometry and write to\
    \ a new file:\nLOAD spatial;\nLOAD json;\n\nCOPY (\n    WITH __clip_layer AS (\n\
    \        SELECT geom FROM ST_Read('./test/data/CATAST_Pol_Township-PNA.geojson')\n\
    \    ),\n    __dataset AS (\n        SELECT id, x, y, tile_x, tile_y, cols, rows,\
    \ geometry, databand_1, metadata\n        FROM\n            __clip_layer,\n  \
    \          RT_Read([\n                './test/data/mosaic/SCL.tif-land-clip00.tiff',\n\
    \                './test/data/mosaic/SCL.tif-land-clip01.tiff',\n            \
    \    './test/data/mosaic/SCL.tif-land-clip10.tiff',\n                './test/data/mosaic/SCL.tif-land-clip11.tiff'\n\
    \            ])\n        WHERE ST_Intersects(__clip_layer.geom, geometry)\n  \
    \  ),\n    __clipped AS (\n        SELECT\n            RT_CubeClip(databand_1,\n\
    \                        tile_x,\n                        tile_y,\n          \
    \              metadata,\n                        __clip_layer.geom,\n       \
    \                (metadata->'bands'->0->'nodata')::DOUBLE\n            ) AS databand,\n\
    \            * EXCLUDE(databand_1)\n        FROM __clip_layer, __dataset\n   \
    \ )\n    SELECT geometry, databand FROM __clipped\n)\nTO 'path/to/output/clipped.tiff'\n\
    WITH (\n    FORMAT RASTER,\n    DRIVER 'GTiff',\n    CREATION_OPTIONS ('COMPRESS=LZW'),\n\
    \    RESAMPLING 'nearest',\n    SRS 'EPSG:32630',\n    GEOMETRY_COLUMN 'geometry',\n\
    \    DATABAND_COLUMNS ['databand']\n);\n"
  extended_description: "Extension for DuckDB for reading and writing raster files\
    \ using SQL.\n\nThe main purpose with this extension is to be able to read raster\
    \ files as tables in DuckDB, and then perform band algebra operations on the raster\
    \ data using SQL.\nA raster is just a datacube, and the idea is to be able to\
    \ manipulate it as such.\n\nThe extension uses the [GDAL library](https://gdal.org/)\
    \ to read raster files, and it supports a wide range of raster formats.\n\nThe\
    \ `RT_Read` function is the main function to read raster files, extract metadata,\
    \ and perform basic operations on the raster data before returning a geoparquet-like\n\
    DuckDB table. The function takes the path to the raster file as an argument, and\
    \ other optional parameters, and returns a table with the following columns:\n\
    \n- `id`: A unique identifier for each tile.\n- `x`: The center x coordinate of\
    \ the tile.\n- `y`: The center y coordinate of the tile.\n- `bbox`: The bounding\
    \ box of the tile, represented as a struct with the following fields: `xmin`,\
    \ `ymin`, `xmax`, `ymax`.\n- `geometry`: The geometry of the tile, represented\
    \ as a polygon.\n- `level`: The zoom level of the tile.\n- `tile_x`: The x coordinate\
    \ of the tile in the zoom level.\n- `tile_y`: The y coordinate of the tile in\
    \ the zoom level.\n- `cols`: The number of columns in the tile.\n- `rows`: The\
    \ number of rows in the tile.\n- `metadata`: A JSON object with the metadata of\
    \ the tile.\n- `databand_x`: A BLOB with the data of the x-th band of the tile.\
    \ The number of bands and their names can be obtained from the `metadata` column.\n\
    \nThe `RT_Read` function provides a `datacube` option that allows to return a\
    \ single `datacube` BLOB column with the N-dimensional array with the\ndata of\
    \ all the bands of the tile, instead of one BLOB per band.\n\n`RT_Read` supports\
    \ filter pushdown on the non-BLOB columns, which allows you to prefilter the tiles\
    \ that are loaded based on their metadata or\nspatial location. For example, you\
    \ can filter the tiles that intersect with a certain geometry or that have a certain\
    \ value in the metadata.\n\nYou can also read raster data at the pixel level using\
    \ the `RT_ReadCells` function, which returns one row per value cell in the raster,\n\
    along with its pixels and spatial coordinates.\n\nThis is the list of columns\
    \ returned by `RT_ReadCells`:\n\n- `id` is a unique identifier for each cell of\
    \ the raster.\n- `x` the coordinates of the center of each cell in the raster.\
    \ The coordinate reference system is the same as the one of the raster file.\n\
    - `y` the coordinates of the center of each cell in the raster. The coordinate\
    \ reference system is the same as the one of the raster file.\n- `geometry` is\
    \ the point geometry of each cell.\n- `col` is the column index of each cell in\
    \ the raster, where 0 is the leftmost column.\n- `row` is the row index of each\
    \ cell in the raster, where 0 is the topmost row.\n- `band_1`, `band_2`, \u2026\
    \ are numeric columns, each containing the pixel values of a cell in the raster.\
    \ The number of bands depends on the input file, and the data type depends on\
    \ the raster data type.\n\n`COPY TO` with `FORMAT RASTER` allows to export a table\
    \ with the same structure as the one returned by `RT_Read` to a new raster file.\n\
    You can specify the driver and several creation options:\n\n- `DRIVER`: The GDAL\
    \ driver to use for writing the raster file. For example, `GTiff` or `COG`.\n\
    - `CREATION_OPTIONS`: A list of creation options to pass to the GDAL driver, specified\
    \ as strings in the format `KEY=VALUE`.\n- `RESAMPLING`: The resampling method\
    \ to use when writing the raster file. For example, `nearest`, `bilinear`, `cubic`,\
    \ etc.\n- `ENVELOPE`: The spatial extent of the raster file, specified as a list\
    \ of four values: `[xmin, ymin, xmax, ymax]`.\n- `SRS`: The spatial reference\
    \ system of the raster file, specified as an EPSG code (e.g. `EPSG:4326`) or a\
    \ WKT string.\n- `GEOMETRY_COLUMN`: The name of the column that contains the geometry\
    \ of the tiles. This column will be used to determine the spatial location and\
    \ the resolution of the tiles in the output raster file.\n- `DATABAND_COLUMNS`:\
    \ A list with the names of the columns that contain the data of the bands. The\
    \ order of the columns in the list will determine the order of the bands in the\
    \ output raster file.\n"
