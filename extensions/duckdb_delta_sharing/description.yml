extension:
  name: duckdb_delta_sharing
  description: The most efficient way to query Delta Lake tables directly from DuckDB
    via the Delta Sharing protocol.
  version: 0.3.2
  language: C++
  build: cmake
  license: Apache-2.0
  excluded_platforms: windows_amd64_mingw
  maintainers:
  - prequel-co
repo:
  github: prequel-co/DuckDB-Delta-Sharing
  ref: 5440afadc620643cfbffcfce0c325d32202e6cfe
docs:
  hello_world: "INSTALL duckdb_delta_sharing FROM community;\nLOAD duckdb_delta_sharing;\n\
    -- Required for network access\nINSTALL httpfs;\nLOAD httpfs;\n\n-- Basic Configuration\n\
    -- Set your sharing endpoint and bearer token using DuckDB Secrets:\nCREATE SECRET\
    \ (\n    TYPE delta_sharing,\n    PROVIDER config,\n    ENDPOINT 'https://your-delta-sharing-server.com/api/2.0/delta-sharing',\n\
    \    BEARER_TOKEN 'your_private_token'\n);\n\n-- Alternatively, if you have DELTA_SHARING_ENDPOINT\
    \ and DELTA_SHARING_BEARER_TOKEN set in your environment:\nCREATE SECRET (TYPE\
    \ delta_sharing, PROVIDER env);\n\n-- Discovering Content\nSELECT * FROM delta_share_list();\n\
    SELECT * FROM delta_share_list('my_share');\n\n-- Reading Tables\nSELECT * FROM\
    \ delta_share_read('my_share', 'my_schema', 'my_table') \nWHERE year = 2024 \n\
    LIMIT 100;\n\n-- Time Travel\nSELECT count(*) \nFROM delta_share_read('my_share',\
    \ 'my_schema', 'my_table', '2024-04-09 12:00:00');\n\n-- Change Data Feed (CDF)\n\
    SELECT * \nFROM delta_share_change_data_feed('my_share', 'my_schema', 'my_table',\
    \ 10);\n"
  extended_description: 'duckdb_delta_sharing is an extension for **querying Delta
    Lake tables directly

    from DuckDB**. It implements the Delta Sharing protocol, allowing you to stream

    data from remote Delta Sharing servers with native performance.


    **Capabilities:**

    - **Ultra-Fast Native Reader**: Built directly on DuckDB''s `MultiFileReader`
    and C++ Parquet scanner. No Python overhead.

    - **Time Travel**: Query your data as it existed at any point in history.

    - **Change Data Feed (CDF)**: Easily track incremental additions, removals, and
    updates.

    - **Advanced Predicate Pushdown**: Filters are pushed to the server to minimize
    data transfer.

    - **Secure by Design**: Supports OAuth/Bearer token authentication and industry-standard
    encryption.

    - **Query Telemetry**: Optional SQL tracking to help administrators optimize performance.


    **Architecture:**

    Traditional Delta Sharing clients often rely on heavy frameworks like Spark. This
    extension allows

    DuckDB to pull Parquet files directly into its memory. It natively handles partition
    discovery

    (automatically mapping folder structures to columns), deletion vectors (row-level
    deletes without

    rewriting files), and schema evolution (safely mapping Delta types to DuckDB''s
    native types).

    '
