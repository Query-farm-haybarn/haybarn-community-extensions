extension:
  # Haybarn: disabled because the extension does not yet build
  # against DuckDB 1.5.2 — upstream community-extensions also has
  # no v1.5.2 binary. Re-enable when upstream lands a v1.5.2-
  # compatible release (sync_from_upstream will pick up the bump).
  # Tracker: https://github.com/Hugoberry/duckdb-nanodbc-extension/issues/41
  excluded_platforms: linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
  name: nanodbc
  description: Connect to any ODBC-compatible database and query data directly from
    DuckDB
  version: 0.4.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - Hugoberry
repo:
  github: Hugoberry/duckdb-nanodbc-extension
  ref: 0740a99bc20a9c5d1c07c39b0779104e5b5b88e5
docs:
  hello_world: "-- Query a table using DSN\nSELECT * FROM odbc_scan(table_name='customers',\
    \ connection='MyODBCDSN');\n\n-- Execute custom SQL with connection string\nSELECT\
    \ * FROM odbc_query(\n    connection='Driver={SQL Server};Server=localhost;Database=mydb;',\n\
    \    query='SELECT id, name, amount FROM sales WHERE amount > 1000'\n);\n\n--\
    \ Attach all tables from an ODBC source\nCALL odbc_attach(connection='MyODBCDSN');\n"
  extended_description: 'The ODBC extension allows DuckDB to seamlessly connect to
    any database that provides an ODBC driver, enabling you to query and analyze data
    from a wide variety of data sources without leaving the DuckDB ecosystem.


    Key features: - `odbc_scan()`: Query tables from any ODBC data source - `odbc_query()`:
    Execute custom SQL queries against external databases - `odbc_exec()`: Execute
    DDL/DML statements without returning results - `odbc_attach()`: Attach all tables
    from an ODBC source as views in DuckDB - Cross-platform character encoding support
    - Automatic type conversion between ODBC and DuckDB types - Support for DSNs and
    direct connection strings


    The extension works on Windows, macOS, and Linux platforms and has been tested
    with SQL Server, MySQL,  PostgreSQL, Snowflake, SQLite, and many other databases.
    All functions use named parameters for better  readability and flexibility.

    '
