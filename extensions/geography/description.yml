extension:
  name: geography
  description: Global spatial data processing on the sphere
  version: 0.1.0
  language: C++
  build: cmake
  license: MIT
  # Haybarn: disabled — never builds against DuckDB 1.5.3 (reliability
  # 0/6; ~3.1h CPU/run wasted before failing or timing out). Dispatching
  # produces no binaries, so we exclude every platform. Re-enable when it
  # builds cleanly (sync_from_upstream will pick up a compatible bump).
  excluded_platforms: linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
  maintainers:
  - paleolimbot
repo:
  github: paleolimbot/duckdb-geography
  ref: ceaf2dcbd5f690b0048efc20f413b540271d6188
docs:
  hello_world: 'SELECT * FROM s2_data_countries();

    '
  extended_description: 'The geography extension provides global spatial indexing
    and analysis on the sphere

    using Google''s s2geometry library. For full documentation, see the

    [README](https://github.com/paleolimbot/duckdb-geography/blob/main/README.md)

    and [function documentation](https://github.com/paleolimbot/duckdb-geography/blob/main/docs/function-reference.md).

    '
