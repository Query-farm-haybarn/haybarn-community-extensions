extension:
  name: zim
  description: "Read and write .zim (Kiwix / openZIM) archives directly in DuckDB\
    \ via libzim, from local files or remote S3/HTTP \u2014 offline Wikipedia, WikiMed,\
    \ Stack Exchange, iFixit, and more, with a zim:// filesystem, full-text search,\
    \ and COPY TO for building archives from any query."
  version: 0.8.1
  language: C++
  build: cmake
  license: GPL-2.0-or-later
  excluded_platforms: windows_amd64;windows_amd64_mingw;windows_arm64;windows_amd64_rtools
  requires_toolchains: vcpkg
  maintainers:
  - teaguesterling
  vcpkg_commit: 84bab45d415d22042bd0b9081aea57f362da3f35
repo:
  github: teaguesterling/duckdb_zim
  ref: df80e1e713b08f75e4fb8f7e0a18250486b127f7
docs:
  hello_world: "-- Load the extension\nLOAD zim;\n\n-- List every content entry in\
    \ an archive (one row per entry).\n-- A listing scan is lazy: it never decompresses\
    \ the article bodies.\nSELECT path, title, mimetype FROM read_zim('wikipedia.zim')\
    \ LIMIT 10;\n\n-- A bare FROM on a .zim file is rewritten via a replacement scan.\n\
    SELECT count(*) FROM 'wikipedia.zim';\n\n-- Read across many archives at once:\
    \ a glob or a LIST of paths.\nSELECT * FROM read_zim('archives/*.zim');\nSELECT\
    \ * FROM read_zim(['wikimed.zim', 'wikipedia.zim']);\n\n-- Read a remote archive\
    \ over S3/HTTP (LOAD httpfs first): byte-range requests\n-- fetch only the bytes\
    \ a query touches, not the whole multi-GB file.\nSELECT zim_main_entry('https://dumps.wikimedia.org/.../wikipedia_en_simple.zim');\n\
    \n-- Narrow the scan: exact lookup, prefix listing, or a mimetype filter.\nSELECT\
    \ * FROM read_zim('wikipedia.zim', path := 'A/Berlin');\nSELECT * FROM read_zim('wikipedia.zim',\
    \ title_prefix := 'Aspirin');\nSELECT * FROM read_zim('wikipedia.zim', mimetype\
    \ := 'text/html');\n\n-- Bulk content, gated by mimetype: only matching entries\
    \ are decompressed,\n-- everything else keeps its row with NULL content (pushdown,\
    \ not a filter).\nSELECT path, content FROM read_zim('wikipedia.zim', include_content\
    \ := 'text/html');\n\n-- The zim:// filesystem: any path-reading function can\
    \ address an entry inside\n-- the archive (read_text / read_blob, or webbed's\
    \ read_html, etc.).\nSELECT * FROM read_text('zim://wikipedia.zim/A/Berlin');\n\
    SELECT * FROM read_blob('zim://wikipedia.zim/I/logo.png');\nSELECT * FROM read_text('zim://wikipedia.zim/A/B*');\
    \   -- glob over content paths\n\n-- Full-text search over the archive's Xapian\
    \ index.\nSELECT path, title, score, snippet\nFROM zim_search('wikipedia.zim',\
    \ 'photosynthesis', max_results := 20);\n\n-- Search a REMOTE archive without\
    \ downloading it: the Xapian index is read in\n-- place via byte-range requests\
    \ (a cold query fetches a fraction of a %, not the\n-- whole multi-GB file). with_snippet\
    \ := false skips fetching result bodies.\nSELECT path, title FROM zim_search(\n\
    \  'https://download.kiwix.org/zim/.../wikipedia_en_medicine.zim',\n  'insulin',\
    \ max_results := 10, with_snippet := false);\n\n-- Title autocomplete (works on\
    \ every build, incl. WebAssembly).\nSELECT path, title FROM zim_suggest('wikipedia.zim',\
    \ 'Photosyn');\n\n-- Federated: search across a whole shelf at once (glob or LIST);\
    \ the `file`\n-- column says which archive each hit came from.\nSELECT file, path,\
    \ title FROM zim_search('library/*.zim', 'insulin', max_results := 5);\n\n-- Write\
    \ an archive from any query: COPY ... TO ... (FORMAT zim).\n-- 'path' and 'content'\
    \ are required; title/mimetype/redirects are optional.\nCOPY (SELECT path, title,\
    \ mimetype, content FROM articles)\nTO 'out.zim' (FORMAT zim, TITLE 'My Archive',\
    \ LANGUAGE 'eng', INDEX true);\n\n-- read_zim's output is COPY's input, so a ZIM\
    \ -> ZIM copy is one statement.\n-- Read content as BLOB: content_as_varchar returns\
    \ NULL for non-UTF-8 entries\n-- (every image and font), which would write them\
    \ out empty.\nCOPY (SELECT * FROM read_zim('in.zim', include_content := true))\n\
    TO 'copy.zim' (FORMAT zim);\n\n-- Single-entry access, metadata, and utilities.\n\
    SELECT zim_get_text('wikipedia.zim', 'A/Berlin');\nSELECT zim_main_entry('wikipedia.zim');\n\
    SELECT * FROM read_zim_metadata('wikipedia.zim');\nSELECT zim_counter('wikipedia.zim');\
    \         -- mimetype -> count histogram\nSELECT zim_info('wikipedia.zim');  \
    \          -- counts, flags, uuid\nSELECT zim_illustration('wikipedia.zim'); \
    \   -- cover image / favicon (BLOB)\nSELECT zim_random('wikipedia.zim');     \
    \     -- a random entry's path\nSELECT zim_check('wikipedia.zim');           --\
    \ integrity check\n"
  extended_description: "The `zim` extension reads `.zim` files \u2014 the archive\
    \ format produced by\n[openZIM](https://openzim.org) and served by [Kiwix](https://kiwix.org)\
    \ \u2014\ndirectly inside DuckDB. ZIM packages an entire website into a single\n\
    compressed, content-addressed file: offline Wikipedia, WikiMed, Wiktionary,\n\
    Project Gutenberg, Stack Exchange, iFixit, TED, and hundreds of other\nlibraries.\
    \ This extension turns any such archive into a SQL-queryable table \u2014\nor\
    \ a queryable filesystem \u2014 without unpacking it.\n\n**Reading archives**:\
    \ `read_zim()` returns one row per content entry \u2014\n`path`, `title`, `mimetype`,\
    \ and the (lazily materialized) `content`. The\nscan supports **projection pushdown**\
    \ and lazy content: a query that only\ninspects the listing never decompresses\
    \ article bodies. Point it at a single\nfile, a **glob**, or a `LIST(VARCHAR)`\
    \ to read many archives at once, and a\nbare `FROM 'archive.zim'` is rewritten\
    \ automatically via a replacement scan.\nNarrow the scan with exact lookup (`path`\
    \ / `title`), prefix listing\n(`path_prefix` / `title_prefix`), a `mimetype` filter,\
    \ or\n`listing := 'path' | 'title'`. `include_content` accepts a mimetype or list\n\
    of mimetypes to decompress content for only the entries you want, and\n`WHERE\
    \ path`/`title`/`mimetype` predicates are pushed down into libzim.\n\n**Local\
    \ or remote**: archives are read from local files or, with `httpfs`\nloaded, straight\
    \ from **S3/HTTP** via byte-range requests \u2014 a query against a\nmulti-GB\
    \ remote archive fetches only the bytes it touches, and recently-used\nremote\
    \ handles are kept warm between calls.\n\n**The `zim://` filesystem**: a read-only\
    \ filesystem registers `zim://`, so any\npath-reading function \u2014 DuckDB's\
    \ own `read_text` / `read_blob`, or\n[`webbed`](https://github.com/teaguesterling/duckdb_webbed)'s\
    \ `read_html`, or\nanything else that goes through the file layer \u2014 can address\
    \ an entry inside an\narchive (`zim://wikipedia.zim/A/Photosynthesis`), including\
    \ globs. Redirects\nresolve like symlinks. This composes the whole ecosystem over\
    \ ZIM contents with\nno coupling and no GPL linkage into those extensions.\n\n\
    **Full-text search & suggestions**: when the archive carries a Xapian index,\n\
    `zim_search()` queries it, returning `(path, title, score, snippet, file)` ranked\n\
    by relevance; `zim_suggest()` gives title autocomplete and works on every build\n\
    (it falls back to a title-prefix listing without Xapian, so it's available on\n\
    WebAssembly too, where full-text search is not). Both are **federated**: the first\n\
    argument can be a single path, a glob, or a `LIST`, so a query runs across many\n\
    archives at once.\n\n**Writing archives**: `COPY (query) TO 'out.zim' (FORMAT\
    \ zim, ...)` builds a ZIM\nfrom any relation. Columns are resolved by name \u2014\
    \ `path` and `content` are\nrequired, with `title`, `mimetype`, `is_redirect`/`redirect_path`\
    \ and libzim's\n`front_article`/`compress` hints optional \u2014 and `read_zim`'s\
    \ own output schema is\naccepted directly, so a ZIM\u2192ZIM copy is a single\
    \ statement. Archive metadata,\na cover illustration, the main page, compression\
    \ and a Xapian full-text index\nare set through copy options, so the archive you\
    \ write is immediately\nsearchable with `zim_search`. Writing never overwrites\
    \ an existing file, and a\nfailed copy leaves nothing behind; `MAIN_PATH` and\
    \ every redirect target are\nvalidated against the entries actually written, because\
    \ libzim silently accepts\na missing main page and silently drops dangling redirects.\n\
    \n**Metadata, scalars & utilities**: `read_zim_metadata()`, `zim_metadata()` /\n\
    `zim_metadata_keys()`, `zim_counter()` (the self-describing mimetype histogram),\n\
    and `zim_info()` (counts, flags, uuid); plus `zim_get_content` / `zim_get_text`,\n\
    `zim_has_entry`, `zim_redirect_target`, `zim_mimetype`, `zim_main_entry`,\n`zim_illustration`\
    \ (cover image), `zim_random`, and `zim_check` (integrity).\n\nEvery VARCHAR output\
    \ is **binary-safe** \u2014 non-UTF-8 bytes come back as `NULL`\nrather than being\
    \ mangled. Built on [libzim](https://github.com/openzim/libzim);\nlicensed GPL-2.0-or-later,\
    \ inherited from libzim.\n"
