extension:
  # Haybarn: disabled because the extension does not yet build
  # against DuckDB 1.5.2 — upstream community-extensions also has
  # no v1.5.2 binary. Re-enable when upstream lands a v1.5.2-
  # compatible release (sync_from_upstream will pick up the bump).
  # Tracker: https://github.com/babaknaimi/duckdb-geotiff/issues/3
  excluded_platforms: linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
  name: geotiff
  description: Read GeoTIFF rasters as (cell_id, value) via GDAL
  version: 0.1.2
  language: C++
  build: cmake
  licence: MIT
  maintainers:
  - babaknaimi
repo:
  github: babaknaimi/duckdb-geotiff
  ref: 3fa51dbe85cb890dea8416c07c90f30147b9d6a4
docs:
  hello_world: '-- one band -> (cell_id, value)

    INSTALL geotiff FROM community;

    LOAD geotiff;

    SELECT * FROM read_geotiff(''cea.tif'', band := 1) LIMIT 5;


    -- multiple bands -> (cell_id, band1, band2, ...)

    SELECT * FROM read_geotiff(''cea.tif'', band := [1,2,3]) LIMIT 5;

    '
  extended_description: "The geotiff extension streams GeoTIFF rasters using GDAL\
    \ and exposes them as\nDuckDB table functions. For a single band it returns (cell_id\
    \ BIGINT, value DOUBLE).\nIf you pass multiple bands (e.g., band := [1,2,3]) it\
    \ returns a wide schema:\n(cell_id, band1, band2, \u2026). This is optimized for\
    \ fast CTAS/UPDATE patterns\nwhen building \u201Cwide\u201D raster tables inside\
    \ DuckDB."
