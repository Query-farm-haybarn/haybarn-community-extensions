extension:
  name: loki
  description: Query Grafana Loki from DuckDB in plain SQL, with label/time/line-filter
    pushdown into LogQL
  version: 1.0.1
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads
  vcpkg_commit: 84bab45d415d22042bd0b9081aea57f362da3f35
  maintainers:
  - prochac
repo:
  github: prochac/duckdb-loki
  ref: v1.0.1
docs:
  hello_world: "-- Store the Loki endpoint and credentials once with the Secret Manager.\n\
    CREATE SECRET my_loki (\n    TYPE loki,\n    ENDPOINT 'https://logs-prod.example.net',\n\
    \    TOKEN 'glc_...'            -- or USERNAME + PASSWORD for basic auth\n);\n\
    \n-- Query logs in plain SQL. WHERE predicates on promoted label columns, the\n\
    -- timestamp and the log line are translated into a LogQL stream selector,\n--\
    \ start/end bounds and line filters; anything else DuckDB applies as a residual.\n\
    SELECT timestamp, level, line\nFROM loki(selector := '{job=\"api\"}', labels :=\
    \ ['level'], secret := 'my_loki')\nWHERE level = 'error'\n  AND timestamp >= now()\
    \ - INTERVAL 2 HOUR\n  AND line LIKE '%timeout%';\n\n-- Or send raw LogQL through\
    \ untouched with loki_scan():\nSELECT * FROM loki_scan('{job=\"api\"} |= `timeout`',\
    \ secret := 'my_loki');\n"
  extended_description: "`loki` turns a Grafana Loki instance into a first-class,\
    \ queryable DuckDB data\nsource, so you can join your logs against Parquet, CSV,\
    \ Postgres, or anything\nelse DuckDB reads \u2014 without ever hand-writing an\
    \ HTTP request.\n\n- **`loki(selector := ...)`** \u2014 pushdown-driven. SQL `WHERE`\
    \ filters on promoted\n  label columns, `timestamp`, and `line` are translated\
    \ into the LogQL stream\n  selector, `start`/`end` time bounds, and line filters.\
    \ Untranslatable predicates\n  are left as residuals for DuckDB to apply, so results\
    \ are always correct.\n- **`loki_scan(query := ...)`** \u2014 a raw-LogQL escape\
    \ hatch for full control.\n- **`loki_labels()` / `loki_label_values()` / `loki_series()`**\
    \ \u2014 label discovery\n  helpers so the source is explorable and autocompletes\
    \ well.\n\nConnection and auth (bearer token, basic auth, `X-Scope-OrgID` tenant,\
    \ or arbitrary\nheaders) come from DuckDB's Secret Manager with per-call overrides.\
    \ A\n`CREATE SECRET (TYPE loki, PROVIDER env)` seeds the connection from the standard\n\
    logcli environment variables (`LOKI_ADDR`, `LOKI_BEARER_TOKEN`,\n`LOKI_USERNAME`/`LOKI_PASSWORD`,\
    \ `LOKI_ORG_ID`), with inline options overriding the\nenvironment. Results page\n\
    automatically over Loki's per-request entry cap, and projection pushdown skips\n\
    materialising the columns a query doesn't select. Timestamps keep Loki's nanosecond\n\
    resolution (`TIMESTAMP_NS`). See the\n[repository](https://github.com/prochac/duckdb-loki)\
    \ for full documentation.\n"
