  extended_description: "A DuckDB extension for reading data from SpatioTemporal Asset\
    \ Catalogs (STAC) using SQL.\n\nThe extension exposes STAC catalogs as relational\
    \ tables, following the GeoParquet STAC specification.\n\nEach row represents\
    \ a single STAC item. Almost all item fields are mapped to columns;\nnested JSON\
    \ structures are preserved as Parquet structs where possible, but item properties\
    \ are\npromoted to the top level for easier filtering and querying.\n\nThe extension\
    \ provides two table functions to read STAC catalogs:\n\n- `STAC_Read`:\n  Reads\
    \ the content of a SpatioTemporal Asset Catalog (STAC) catalog from the given\
    \ URL or JSON file and returns it as a table.\n\n  ```sql\n  SELECT * FROM STAC_Read('https://example.com/stac/collection.json');\n\
    \  ```\n\n- `STAC_Search`:\n\n  Searches the content of a SpatioTemporal Asset\
    \ Catalog (STAC) catalog based on the given STAC API - Item Search\n  filtering\
    \ criteria (https://api.stacspec.org/v1.0.0/item-search/) and returns matching\
    \ items as a table.\n\n  The `url` parameter specifies the base URL of the STAC\
    \ API - Item Search endpoint to query.\n\n  The optional parameters allow filtering\
    \ by different criteria:\n\n  - `collections`: A list of collection IDs to filter\
    \ the search results.\n  - `ids`: A list of item IDs to filter the search results.\n\
    \  - `bbox`: A bounding box to filter items by spatial intersection, specified\
    \ as an array of four floats representing the minimum longitude, minimum latitude,\
    \ maximum longitude, and maximum latitude.\n  - `intersects`: A geometry object\
    \ (EPSG:4326) to filter items by spatial intersection.\n  - `datetime`: A string\
    \ representing a temporal range to filter the search results, specified in the\
    \ format \"start_datetime/end_datetime\" (e.g., \"2021-01-01T00:00:00Z/2021-12-31T23:59:59Z\"\
    ).\n  - `max_items`: An integer specifying the maximum number of items to return\
    \ in each result page.\n\n  ```sql\n  SELECT\n      *\n  FROM\n      STAC_Search(\n\
    \          'https://earth-search.aws.element84.com/v0/search',\n          collections\
    \ := ['sentinel-s2-l2a-cogs'],\n          datetime := '2021-09-30/2021-10-30',\n\
    \          intersects := ST_MakeEnvelope(-1.695007724869786, 42.788757186108654,\
    \ -1.604482013650674, 42.84244150196227)::GEOMETRY('EPSG::4326')\n      )\n  ;\n\
    \  ```\n\n  ```sql\n  SELECT\n      *\n  FROM\n      STAC_Search(\n          'https://earth-search.aws.element84.com/v0/search',\n\
    \          collections := ['sentinel-s2-l2a-cogs'],\n          datetime := '2021-09-30/2021-10-30',\n\
    \          bbox := [-1.695007724869786, 42.788757186108654, -1.604482013650674,\
    \ 42.84244150196227]\n      )\n  ;\n  ```\n"
