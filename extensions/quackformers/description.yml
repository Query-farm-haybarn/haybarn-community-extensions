extension:
  # Haybarn: disabled until upstream bumps duckdb / libduckdb-sys to
  # =1.10502.0 (DuckDB 1.5.2). Tracker: https://github.com/martin-conur/quackformers/issues/22
  excluded_platforms: linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
  name: quackformers
  description: Bert-based embedding extension.
  version: 0.1.5.2
  language: Rust
  build: cargo
  license: MIT
  requires_toolchains: rust;python3
  maintainers:
  - martin-conur
repo:
  github: martin-conur/quackformers
  ref: fae2564d2766daef094b40a6c40c86023080da43
docs:
  hello_world: "SELECT embed('this is an embeddable sentence'); -- This is vanilla\
    \ BERT (https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2)\nSELECT\
    \ embed_jina('this is an embeddable sentence'); -- This is Jina BERT \n"
  extended_description: 'Quackformers, a DuckDB extension embeddings. Intended to
    be used alongside VSS vector search for RAG-type functionalities.

    Quackformers is based on DuckDB''s [Rust Extension Template](https://github.com/duckdb/extension-template-rs/)

    '
