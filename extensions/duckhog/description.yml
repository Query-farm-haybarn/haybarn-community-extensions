extension:
  name: duckhog
  description: "Query Arrow Flight SQL servers that expose DuckLake-based catalogs\
    \ and tables directly from DuckDB using standard SQL \u2014 including PostHog's\
    \ managed data warehouse via [Duckgres](https://github.com/PostHog/duckgres)."
  version: 0.2.0
  language: C++
  build: cmake
  # Haybarn: disabled (FLAKY, not broken) — builds against DuckDB 1.5.3
  # only intermittently (reliability 3/6 ~50%) while costing ~5.3h CPU/run.
  # Unlike the never-build exclusions, this DOES ship binaries on some
  # runs; disabled to stop wasted/retried CI churn. Re-enable once the
  # flaky build leg is fixed (it builds clean reliably).
  excluded_platforms: linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
  requires_toolchains: parser_tools
  license: MIT
  maintainers:
  - PostHog
repo:
  github: PostHog/duckhog
  ref: v0.2.0
docs:
  hello_world: 'ATTACH ''hog:my_database?user=username&password=pw&flight_server=grpc+tls://localhost:8815''
    AS posthog_db;

    SELECT * FROM posthog_db.events LIMIT 10;

    '
