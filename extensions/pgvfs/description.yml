extension:
  name: pgvfs
  description: DuckLake on PostgreSQL - a pgvfs:// filesystem storing data files as
    PostgreSQL rows, for one writer and many readers
  version: 0.2.0-beta.3
  language: C++
  build: cmake
  license: Apache-2.0
  requires_toolchains: rust
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_amd64_rtools
  opt_in_platforms: linux_amd64_musl;linux_arm64_musl
  maintainers:
  - adonm
repo:
  github: adonm/pgvfs
  ref: 29f834a99b53506d289e21181a256693d933af84
  ref_next: 29f834a99b53506d289e21181a256693d933af84
docs:
  hello_world: "-- One secret serves both the DuckLake catalog and the pgvfs data\
    \ files.\nCREATE SECRET (TYPE postgres, HOST 'db', DATABASE 'lake', USER 'lake',\
    \ PASSWORD '...');\nATTACH 'ducklake:postgres:' AS lake (DATA_PATH 'pgvfs://lake/');\n\
    \n-- Once per lake, before the first insert: small row groups and files for fast\n\
    -- lookups, zstd to keep PostgreSQL storage small (LZ4 reads faster, stores more).\n\
    CALL lake.set_option('parquet_compression', 'zstd');\nCALL lake.set_option('parquet_version',\
    \ 2);\nCALL lake.set_option('parquet_row_group_size', 8192);\nCALL lake.set_option('target_file_size',\
    \ '64MB');\n\nCREATE TABLE lake.events (site_id INTEGER, day DATE, value DOUBLE);\n\
    ALTER TABLE lake.events SET SORTED BY (site_id, day);\nINSERT INTO lake.events\n\
    \    SELECT range % 1000, DATE '2026-01-01' + (range % 365)::INTEGER, random()\
    \ FROM range(1000000);\n\n-- Readers, in other processes: SELECT-only roles, read\
    \ replicas welcome.\n-- ATTACH 'ducklake:postgres:' AS lake (READ_ONLY);\nSELECT\
    \ count(*) FROM lake.events WHERE site_id = 42 AND day = DATE '2026-03-01';\n\n\
    -- Counters for one process: opens, reads, bytes, time in pgvfs.\nSELECT pgvfs_stats()::JSON;\n"
  extended_description: "pgvfs is a DuckDB filesystem, `pgvfs://`, that stores DuckLake's\
    \ Parquet data\nfiles as rows in PostgreSQL. With the DuckLake catalog in the\
    \ same database,\none PostgreSQL is the whole lake: one secret, one backup, one\
    \ set of roles, and\nno object store or gateway.\n\n- **Many readers, one writer.**\
    \ Readers need only `SELECT`, take no locks and\n  work on streaming read replicas.\
    \ The first process to write holds the\n  writer lock; a second writer is refused.\n\
    - **Millisecond lookups.** Files are immutable, so DuckDB caches them without\n\
    \  revalidating, and reads are primary-key range queries straight into DuckDB's\n\
    \  buffers.\n- **Plain PostgreSQL 11+**, including Amazon Aurora. No PostgreSQL\
    \ extensions\n  or superuser. The first write installs pgvfs's schema.\n\nIt suits\
    \ lakes that fit comfortably in one PostgreSQL, with many concurrent\nreaders\
    \ doing lookups and dashboard-style queries. For scans over large lakes\nin object\
    \ storage, a plain DuckLake on S3 is the better fit.\n\nLayout decides most of\
    \ the read speed: set the lake options above before the\nfirst insert, declare\
    \ a sort order that matches your filters, and load big\ntables in key-range batches.\
    \ Credentials resolve like the `postgres`\nextension's: the secret named by `SET\
    \ pgvfs_secret`, else `$PGVFS_URL`, else\nthe default `postgres` secret. Remote\
    \ servers need `SSLMODE 'require'`.\n\nDocumentation: [install](https://pgvfs.adonm.dev/install.html),\n\
    [loading data](https://pgvfs.adonm.dev/loading.html),\n[how it works](https://pgvfs.adonm.dev/how-it-works.html)\
    \ and\n[performance](https://pgvfs.adonm.dev/performance.html).\n"
