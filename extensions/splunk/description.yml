extension:
  name: splunk
  description: Read logs from a Splunk search REST API into OTLP-shaped tables
  version: 0.1.0
  language: C++
  build: cmake
  license: MIT
  requires_toolchains: cmake, openssl
  maintainers:
  - smithclay
repo:
  github: smithclay/duckdb-splunk
  ref: 636b92030562f5c1e4a4b9d1aacd66f69ced0b6d
docs:
  hello_world: "-- Store your Splunk credentials once (kept out of query text; redacted\
    \ in duckdb_secrets()).\nCREATE SECRET (\n    TYPE splunk,\n    URL 'https://splunk.example.com:8089',\n\
    \    USERNAME '<username>',\n    PASSWORD '<password>'\n);\n\n-- Or authenticate\
    \ with a token instead of a username/password.\nCREATE SECRET (\n    TYPE splunk,\n\
    \    URL 'https://splunk.example.com:8089',\n    TOKEN '<token>',\n    TOKEN_TYPE\
    \ 'bearer'   -- 'bearer' for JWT auth tokens, 'splunk' for session keys\n);\n\n\
    -- Run SPL and get back OTLP log rows.\nSELECT time_unix_nano, service_name, severity_text,\
    \ body\nFROM read_splunk_logs(\n    query    => 'index=main error',\n    earliest\
    \ => '-1h',\n    latest   => 'now'\n);\n"
  extended_description: "This extension reads logs from a [Splunk search REST API](https://docs.splunk.com/Documentation/Splunk/latest/RESTREF/RESTsearch)\n\
    endpoint directly into DuckDB. Rows conform to the OTLP logs schema (matching\n\
    [duckdb-otlp](https://github.com/smithclay/otlp2records) `read_otlp_logs`), so\
    \ Splunk events drop\nstraight into an OTLP-shaped lakehouse alongside data from\
    \ other sources. Resource attribute keys\nalign with the OpenTelemetry Collector's\
    \ Splunk receivers (`host.name`, `com.splunk.*`) for interop.\n\nFeatures:\n-\
    \ **Credentials via DuckDB secrets** (`CREATE SECRET (TYPE splunk, ...)`), supporting\
    \ basic auth\n  or token auth; `PASSWORD`/`TOKEN` are redacted in `duckdb_secrets()`.\
    \ Set `INSECURE_TLS true`\n  for instances with self-signed certificates.\n- **HEC/JSON\
    \ event awareness**: Splunk does not extract JSON event fields at search time,\
    \ so the\n  extension parses `_raw` and resolves fields such as `level`, `trace_id`,\
    \ and `service` from it\n- **Automatic retries** for rate limits (HTTP 429), HTTP\
    \ 5xx, and transient network errors;\n  retry waits honor query cancellation\n\
    - **Projection pushdown**: only selected columns are decoded, so aggregations\
    \ skip the per-row\n  `_raw` parse and attribute JSON serialization\n- **Loud\
    \ failures on bad SPL**: server-side search errors are raised rather than looking\
    \ like zero matches\n- Splunk fields not mapped to the OTLP schema are exposed\
    \ as JSON in `log_attributes` for use with\n  DuckDB's JSON functions\n\n`read_splunk_logs`\
    \ accepts `query` (SPL, default `*`), `earliest` (default `-15m`), `latest`\n\
    (default `now`), `max_rows` (`0` = unlimited), `timeout`, `retries`, and `secret`\
    \ (to select a\nnamed secret). Logs are supported today. For full documentation,\
    \ visit the\n[extension repository](https://github.com/smithclay/duckdb-splunk).\n"
