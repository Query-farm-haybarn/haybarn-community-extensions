extension:
  name: dash
  description: A fully visual data explorer and GUI for DuckDB. Create interactive
    dashboards and DAG pipelines.
  version: 0.3.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - Gropaul
repo:
  github: gropaul/dash
  ref: c2c520e4667a42b3d5d6fa72b0f21f20b15bbdc1
docs:
  hello_world: '-- Start dash GUI

    PRAGMA dash;

    '
  extended_description: "The Dash extension brings interactive plots, data canvases,\
    \ and dashboards directly into DuckDB. Queries you build in the GUI are automatically\
    \ exposed as DuckDB macros, so you can reference them from the shell, Python,\
    \ or anywhere else:\n```sql SELECT * FROM dash.refs.my_query() ```\nThis keeps\
    \ your GUI queries and code in sync.\nDash also supports interactive widgets:\
    \ Visualize a query as a Dropdown, and macros referencing it will automatically\
    \ filter to the selected value.\n\u2192  [GitHub](https://github.com/gropaul/dash)\
    \ \xB7 [Web Version](https://www.app.dash.builders/) \xB7 [Documentation & Demo](https://www.dash.builders/)"
