docs:
  extended_description: For more information regarding usage, see the [documentation](https://query.farm/duckdb_extension_vgi.html).
extension:
  build: cmake
  description: VGI (Vector Gateway Interface) — DuckDB extension for extending DuckDB in any language over Apache Arrow IPC. No C++/compilation required.
  language: C++
  license: MIT
  # vgi is POSIX-only (Unix-domain sockets, sigaction/SIGPIPE, sys/select.h);
  # its headers #error on Windows. Exclude both Windows targets until Windows
  # support is implemented upstream.
  excluded_platforms: windows_amd64;windows_amd64_mingw
  maintainers:
  - rustyconover
  name: vgi
  requires_toolchains: parser_tools
  version: '2026052101'
repo:
  github: query-farm/vgi
  ref: 90efac47bede83d773eb1165bba84d0d35884be1
