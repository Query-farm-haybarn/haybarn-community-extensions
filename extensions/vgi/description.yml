docs:
  extended_description: For more information regarding usage, see the [documentation](https://query.farm/duckdb_extension_vgi.html).
extension:
  build: cmake
  description: VGI (Vector Gateway Interface) — DuckDB extension for extending DuckDB in any language over Apache Arrow IPC. No C++/compilation required.
  # Haybarn: not ported to 2.0 yet (~626 compile errors against the 2.0 API;
  # owner decision pending), so every 2.0 platform is excluded on haybarn-2.0
  # and `make dispatch` skips it. main (1.5) keeps windows_amd64_mingw only.
  excluded_platforms: linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
  language: C++
  license: MIT
  maintainers:
  - rustyconover
  name: vgi
  requires_toolchains: parser_tools;rust
  version: '2026102100'
repo:
  github: query-farm/vgi
  ref: 454fefa50b11f8bfe3065fb11aebf8f5761d7b3d
  variegata: 454fefa50b11f8bfe3065fb11aebf8f5761d7b3d
