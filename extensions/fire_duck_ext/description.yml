extension:
  name: fire_duck_ext
  description: Query Google Cloud Firestore directly from DuckDB using SQL
  version: 0.2.0
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: windows_amd64_mingw
  maintainers:
  - BorisBesky
repo:
  github: BorisBesky/fire_duck_ext
  ref: 62e9d803761436687b1feb84349149bbaed067b2
docs:
  hello_world: "LOAD fire_duck_ext;\n\n-- Authenticate with a service account JSON\
    \ file\nCREATE SECRET my_firestore (\n    TYPE firestore,\n    PROJECT_ID 'my-gcp-project',\n\
    \    SERVICE_ACCOUNT_JSON '/path/to/service-account.json'\n);\n\n-- Or use inline\
    \ JSON for the service account\nCREATE SECRET my_firestore (\n    TYPE firestore,\n\
    \    PROJECT_ID 'my-gcp-project',\n    SERVICE_ACCOUNT_JSON '{\n        \"type\"\
    : \"service_account\",\n        \"project_id\": \"my-gcp-project\",\n        \"\
    private_key_id\": \"key123abc\",\n        \"private_key\": \"-----BEGIN RSA PRIVATE\
    \ KEY-----\\n...\\n-----END RSA PRIVATE KEY-----\\n\",\n        \"client_email\"\
    : \"sa@my-gcp-project.iam.gserviceaccount.com\",\n        \"client_id\": \"123456789\"\
    ,\n        \"auth_uri\": \"https://accounts.google.com/o/oauth2/auth\",\n    \
    \    \"token_uri\": \"https://oauth2.googleapis.com/token\"\n    }'\n);\n\n--\
    \ Or authenticate with an API key (unauthenticated; request.auth is null)\nCREATE\
    \ SECRET my_firestore (\n    TYPE firestore,\n    PROJECT_ID 'my-gcp-project',\n\
    \    API_KEY 'AIzaSyYourApiKeyHere'\n);\n\n-- Or authenticate as a Firebase Auth\
    \ user (browser-safe; respects Security Rules)\n-- Email/password sign-in:\nCREATE\
    \ SECRET my_firestore (\n    TYPE firestore,\n    PROJECT_ID 'my-gcp-project',\n\
    \    API_KEY 'AIzaSyYourWebApiKey',\n    EMAIL 'user@example.com',\n    PASSWORD\
    \ 'hunter2'\n);\n\n-- Anonymous sign-in:\nCREATE SECRET my_firestore (\n    TYPE\
    \ firestore,\n    PROJECT_ID 'my-gcp-project',\n    API_KEY 'AIzaSyYourWebApiKey',\n\
    \    ANONYMOUS true\n);\n\n-- Or pass a pre-obtained Firebase ID token (e.g. minted\
    \ by your host app)\nCREATE SECRET my_firestore (\n    TYPE firestore,\n    PROJECT_ID\
    \ 'my-gcp-project',\n    API_KEY 'AIzaSyYourWebApiKey',  -- optional; enables\
    \ auto-refresh\n    ID_TOKEN 'eyJhbGciOi...',\n    REFRESH_TOKEN 'AMf-...'   \
    \      -- optional; auto-refreshed on expiry\n);\n\n-- Read documents\nSELECT\
    \ * FROM firestore_scan('users');\n\n-- Filter documents\nSELECT __document_id,\
    \ name, email\nFROM firestore_scan('users')\nWHERE status = 'active';\n\n-- Update\
    \ documents\nCALL firestore_update('users', 'user123', 'status', 'verified');\n\
    \n-- Batch update with DuckDB filtering\nSET VARIABLE ids = (\n    SELECT list(__document_id)\n\
    \    FROM firestore_scan('users')\n    WHERE status = 'pending'\n);\nCALL firestore_update_batch('users',\
    \ getvariable('ids'), 'status', 'reviewed', 'updated_at', now());\n\n-- Insert\
    \ documents from a subquery (auto-generated IDs)\nCALL firestore_insert('users',\
    \ (SELECT name, age FROM read_csv('new_users.csv')));\n\n-- Insert with explicit\
    \ document IDs from a column\nCALL firestore_insert('users',\n    (SELECT * FROM\
    \ read_csv('new_users.csv')),\n    document_id := 'user_id');\n\n-- Insert with\
    \ explicit document ID selected from a column\nCALL firestore_insert('users',\n\
    \    (SELECT 'Alice' AS name, 30 AS age, 'alice_user_id' AS user_id),\n    document_id\
    \ := 'user_id');\n\n-- Target a specific named database\nCREATE SECRET my_named_db\
    \ (\n    TYPE firestore,\n    PROJECT_ID 'my-gcp-project',\n    SERVICE_ACCOUNT_JSON\
    \ '/path/to/credentials.json',\n    DATABASE 'my-database'\n);\n\n-- Target multiple\
    \ databases with a single secret\nCREATE SECRET my_multi_db (\n    TYPE firestore,\n\
    \    PROJECT_ID 'my-gcp-project',\n    SERVICE_ACCOUNT_JSON '/path/to/credentials.json',\n\
    \    DATABASES ['(default)', 'analytics-db']\n);\n\n-- Target multiple databases\
    \ with an API key\nCREATE SECRET my_multi_db (\n    TYPE firestore,\n    PROJECT_ID\
    \ 'my-gcp-project',\n    API_KEY 'AIzaSyYourApiKeyHere',\n    DATABASES ['(default)',\
    \ 'analytics-db']\n);\n\n-- Connect to a specific database for the session\nCALL\
    \ firestore_connect('analytics-db');\n\n-- Collection group queries\nSELECT __document_id,\
    \ name, email\nFROM firestore_scan('~data_group')\nWHERE status = 'active';\n"
  extended_description: "fire_duck_ext lets you work with Google Cloud Firestore directly\
    \ from DuckDB using SQL. \nIf you are looking for a way to access Firestore database\
    \ data with SQL or connect \nFirebase/Firestore workflows to DuckDB, this extension\
    \ provides read and write \nsupport through familiar SQL statements. Scan data\
    \ with firestore_scan(),\nperform DML operations with firestore_update(), firestore_insert(),\n\
    and firestore_delete(). Batch operations with firestore_update_batch() and \n\
    firestore_delete_batch().\nTransform arrays with firestore_array_union(), firestore_array_remove(),\
    \ and firestore_array_append().\nQuery collection groups with firestore_scan('~collection').\
    \ \nList collection IDs with firestore_scan('collection/doc_id'). Manage credentials\
    \ with DuckDB secrets.\nPush down filters to Firestore with firestore_scan().\n\
    \n## Authentication\nSecrets require `PROJECT_ID` and one of three auth modes:\n\
    \n1. **Service account** (`SERVICE_ACCOUNT_JSON`) \u2014 admin access that bypasses\n\
    \   Security Rules. Accepts either a file path or the full inline JSON text of\
    \ a\n   Google Cloud service account key (must contain at least `type`, `project_id`,\n\
    \   `private_key`, and `client_email`). Requires OpenSSL for RS256 signing, so\
    \ it\n   is **native-only** (not available in the WebAssembly build).\n\n2. **API\
    \ key** (`API_KEY`) \u2014 unauthenticated access (`request.auth == null`),\n\
    \   suitable for development, testing, or public databases. Reads are still\n\
    \   subject to Security Rules. API key auth does not support `batchWrite`, so\n\
    \   batch operations fall back to individual requests.\n\n3. **Firebase Auth user**\
    \ \u2014 authenticated access that respects Security Rules and\n   is browser-safe\
    \ (works in the WebAssembly build). Provide the public Web\n   `API_KEY` plus\
    \ one of:\n   - `EMAIL` + `PASSWORD` \u2014 email/password sign-in,\n   - `ANONYMOUS\
    \ true` \u2014 anonymous sign-in,\n   - `ID_TOKEN` (+ optional `REFRESH_TOKEN`)\
    \ \u2014 a pre-obtained Firebase ID token\n     minted by your host app. `API_KEY`\
    \ is optional in this mode but enables\n     automatic token refresh.\n\n   The\
    \ extension sends `Authorization: Bearer <id_token>` and refreshes the token\n\
    \   automatically on expiry.\n\n`ANONYMOUS true` is not the same as a plain `API_KEY`.\
    \ Both pass the API key, but\nthe API key alone is unauthenticated (`request.auth\
    \ == null`), while anonymous\nsign-in obtains an ID token for a real (anonymous)\
    \ Firebase user, so\n`request.auth != null` and a `uid` is available in Security\
    \ Rules. Use a plain\nAPI key for public collections whose rules allow unauthenticated\
    \ reads; use\n`ANONYMOUS true` when rules require a signed-in user (`request.auth\
    \ != null`) but\nno specific identity is needed. Each anonymous sign-in gets a\
    \ fresh `uid`.\n\n**Admin-only features.** Firestore's index metadata (composite\
    \ indexes and\nsingle-field index configuration) is served by the Firestore Admin\
    \ API, which is\ngated by Google Cloud IAM and readable only with a **service\
    \ account**. With API\nkey or Firebase user auth the extension cannot query it,\
    \ skips it, and assumes\nFirestore's default single-field indexes. Features that\
    \ depend on this metadata\nare therefore unavailable to non-admin auth \u2014\
    \ most notably composite-index\ndetection for multi-field `ORDER BY`, which falls\
    \ back to a single-field\nserver-side sort (re-sorted in DuckDB) or surfaces Firestore's\
    \ \"query requires an\nindex\" error. Single-field filter and order pushdown are\
    \ unaffected.\n\nIf the `GOOGLE_APPLICATION_CREDENTIALS` environment variable\
    \ is set,\nthe extension automatically creates an internal secret on startup that\n\
    matches all databases (`DATABASE '*'`), so no `CREATE SECRET` is needed.\n\n##\
    \ WebAssembly (DuckDB-WASM)\nThe extension builds and runs in DuckDB-WASM (e.g.\
    \ in the browser). HTTP is\nrouted through DuckDB's HTTPUtil instead of raw sockets,\
    \ so reads, filtered\n`:runQuery` scans (including collection groups), and writes\
    \ all work in the\nbrowser. Authentication in WASM uses **API key** or **Firebase\
    \ Auth user**\ncredentials (email/password, anonymous, or a pre-obtained ID token);\n\
    **service-account** auth is native-only because it needs OpenSSL.\n\nTwo things\
    \ to know for rules-governed (API key / Firebase user) access:\n- `show_missing\
    \ := true` (the default) lists phantom/missing documents, which is\n  an Admin-only\
    \ operation; over rules-governed access Firestore returns\n  `403 PERMISSION_DENIED`\
    \ even when rules allow the read. Pass\n  `show_missing := false`.\n- The Firestore\
    \ Admin API (index metadata) is reachable only with a service\n  account; for\
    \ API-key / Firebase-user auth the extension skips it and assumes\n  default single-field\
    \ indexes.\n\nThe WASM build of the extension must match the DuckDB version bundled\
    \ by the\n`@duckdb/duckdb-wasm` runtime it is loaded into (the C++ extension ABI\
    \ is not\nstable across versions).\n\n## Type Mapping\n- `string` \u2192 VARCHAR\n\
    - `integer` \u2192 BIGINT\n- `double` \u2192 DOUBLE\n- `boolean` \u2192 BOOLEAN\n\
    - `timestamp` \u2192 TIMESTAMP\n- `array` \u2192 LIST\n- `map` \u2192 VARCHAR\
    \ (JSON string)\n- `vector` \u2192 ARRAY(DOUBLE, N) (embedding)\n- `null` \u2192\
    \ NULL\n- `geoPoint` \u2192 STRUCT(latitude DOUBLE, longitude DOUBLE)\n- `reference`\
    \ \u2192 VARCHAR\n- `bytes` \u2192 BLOB\n\n## Schema Inference\nWhen you call\
    \ `firestore_scan()`, the extension automatically infers the\nschema by sampling\
    \ up to 100 documents from the collection. For each\nfield, it determines the\
    \ DuckDB type using a voting system: the most\ncommon non-null Firestore type\
    \ across the sampled documents wins. Fields\nthat do not appear in every sampled\
    \ document are marked nullable.\n\nFor array fields, element types are also inferred\
    \ by sampling elements\nacross documents and selecting the most common element\
    \ type. If a field\nis only ever null across all samples, it defaults to VARCHAR.\n\
    \nA virtual `__document_id` column (VARCHAR) is always added as the first\ncolumn,\
    \ containing the Firestore document ID (or the full document path\nfor collection\
    \ group queries).\n\nDocuments with heterogeneous field types are handled gracefully\
    \ at read\ntime: values that cannot be converted to the inferred column type are\n\
    returned as NULL.\n\n## Null Semantics\nBoth missing fields and explicit Firestore\
    \ null values appear as NULL in\nDuckDB. There is no way to distinguish between\
    \ the two on read.\n\nWriting NULL to a field sets it to an explicit Firestore\
    \ null value; it\ndoes not delete the field from the document.\n\n`WHERE field\
    \ IS NULL` is not pushed down to Firestore because Firestore's\nIS_NULL operator\
    \ only matches fields that exist and are explicitly null,\nwhile DuckDB treats\
    \ missing fields as NULL. `WHERE field IS NOT NULL` is\npushed down safely.\n\n\
    ## Batch Operations\nBatch updates and deletes group writes into requests of up\
    \ to 500\noperations each using Firestore's batchWrite API. Note that batchWrite\n\
    is not atomic: individual writes within the batch may succeed or fail\nindependently.\
    \ If batchWrite is unavailable (e.g., API key auth), the\nextension falls back\
    \ to individual operations automatically.\n\n## Database Targeting\nBy default,\
    \ secrets target the `(default)` Firestore database. Use\n`DATABASE 'name'` for\
    \ a single named database, `DATABASE '*'` as a\nwildcard that matches any database,\
    \ or `DATABASES ['db1', 'db2']` to\nallow a single secret to match multiple named\
    \ databases. You cannot\nspecify both `DATABASE` and `DATABASES` in the same secret.\n\
    \nUse `CALL firestore_connect('db-name')` to set the session database.\nAll subsequent\
    \ queries use this database until\n`CALL firestore_disconnect()` is called. A\
    \ per-query `database :=`\nparameter always takes priority over the connected\
    \ session database.\n\n## Collection Group Queries\nUse the `~collection` prefix\
    \ to query across all subcollections with a\ngiven name. For example, `firestore_scan('~orders')`\
    \ reads all documents\nfrom every subcollection named \"orders\" regardless of\
    \ parent path.\n\n## SQL ORDER BY / LIMIT Pushdown\n`firestore_scan()` can automatically\
    \ push simple SQL `ORDER BY`,\n`LIMIT`, and `OFFSET` clauses down to Firestore,\
    \ reducing the number\nof documents fetched for sorted and top-N queries.\n\n\
    Supported patterns include:\n- `ORDER BY field`\n- `ORDER BY field DESC`\n- `ORDER\
    \ BY field1, field2`\n- `LIMIT n`\n- `ORDER BY ... LIMIT n`\n- `ORDER BY ... LIMIT\
    \ n OFFSET m` (pushed as `LIMIT n + m`, with\n  DuckDB applying the final offset)\n\
    \nNamed parameters still work and take precedence over SQL pushdown:\n- If `order_by:=`\
    \ is provided, that server-side ordering is used and\n  DuckDB applies any SQL\
    \ `ORDER BY` afterward.\n- If `scan_limit:=` is provided, that fetch limit is\
    \ used and DuckDB\n  applies any SQL `LIMIT` afterward.\n\nUse `EXPLAIN` to verify\
    \ when SQL ordering and limits are being pushed.\nFirestore will show entries\
    \ like `Firestore Pushed Order: score DESC`\nand `Firestore Pushed Limit: 5`.\n\
    \n## Collection ID Listings\nWhen `firestore_scan()` is given a document path\
    \ instead of a collection\npath, it lists that document's direct subcollection\
    \ IDs instead of\nreading documents. This is useful for discovering unknown nested\n\
    collection names.\n\nThe result contains a single `__document_id` column, where\
    \ each row is a\nsubcollection ID.\n\nDocument-path scans support:\n- Pagination\
    \ across large numbers of subcollections\n- SQL `ORDER BY __document_id` pushdown\n\
    - SQL `LIMIT` pushdown\n- Named `order_by:='__document_id'` or `order_by:='__document_id\
    \ DESC'`,\n  plus `scan_limit:=...`\n\nOther ordering expressions still work,\
    \ but they are evaluated in DuckDB\nafter fetching the subcollection IDs.\n\n\
    ## Missing Documents\nBy default, `firestore_scan()` includes phantom/missing\
    \ documents \u2014\ndocuments that have no fields but exist as parent paths for\n\
    subcollections. This matches Firebase Console behavior and is controlled\nby `show_missing`\
    \ (default: `true`). Set `show_missing := false` to\nonly return documents with\
    \ fields. When a collection contains only\nphantom documents, the result includes\
    \ just the `__document_id` column.\n\nListing phantom documents is an Admin-only\
    \ operation, so with rules-governed\naccess (API key or Firebase user) Firestore\
    \ returns `403 PERMISSION_DENIED`\neven when Security Rules allow the read. Use\
    \ `show_missing := false` with those\nauth modes, or authenticate with a service\
    \ account.\n"
