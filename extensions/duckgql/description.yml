extension:
  name: duckgql
  description: Adds ISO GQL graph querying and graph algorithms to DuckDB
  version: 0.2.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - rahul-iyer
repo:
  github: rahul-iyer/duckdb-gql
  ref: 44e77c6835f9e6758bb3e3bccb1a642981dbf1e7
docs:
  hello_world: "COPY (\n  SELECT * FROM (VALUES\n    ('p1', 'Ada', 'Person'),\n  \
    \  ('p2', 'Grace', 'Person')\n  ) nodes(\":ID(People)\", \"name:string\", \":LABEL\"\
    )\n) TO 'duckgql_nodes.csv' (FORMAT CSV, HEADER);\n\nCOPY (\n  SELECT * FROM (VALUES\n\
    \    ('p1', 'p2', 'KNOWS')\n  ) edges(\":START_ID(People)\", \":END_ID(People)\"\
    , \":TYPE\")\n) TO 'duckgql_edges.csv' (FORMAT CSV, HEADER);\n\nCREATE GRAPH social\
    \ ANY;\n\nCOPY GRAPH social FROM (\n  VERTICES 'duckgql_nodes.csv',\n  EDGES 'duckgql_edges.csv'\n\
    ) FORMAT GRAPH;\n\nSESSION SET GRAPH social;\n\nMATCH (person:Person)-[:KNOWS]->(friend:Person)\n\
    RETURN person.name, friend.name;\n"
  extended_description: "DuckGQL is an experimental C++17 extension that adds a growing\
    \ subset of\nISO/IEC 39075:2024 GQL to DuckDB. It combines graph pattern queries\
    \ and\nmutations with DuckDB's native relational storage and execution engine,\n\
    plus an explicit CSR layer for graph algorithms.\n\n**What works in v0.2.0**\n\
    \n* Managed property graphs backed by typed DuckDB vertex and edge tables.\n*\
    \ Read-only, zero-copy graph projections over existing DuckDB and DuckLake\n \
    \ tables, including multiple heterogeneous vertex and edge mappings.\n* Live DuckLake\
    \ projections that follow committed snapshots, or pinned\n  projections for reproducible\
    \ analysis.\n* Mapping-scoped integer source keys, optional edge keys, and DuckGQL-managed\n\
    \  dense element IDs, without application-maintained numeric ID ranges.\n* Inline\
    \ typed graph schemas that persist in the catalog and immediately\n  materialize\
    \ constrained vertex and edge tables without `COPY GRAPH`.\n* Graph-header CSV,\
    \ compressed CSV, and Parquet bulk import with optional\n  endpoint and identity\
    \ validation.\n* Directed `MATCH`, `OPTIONAL MATCH`, filtering, projection, aggregation,\n\
    \  ordering, paging, fixed multi-hop patterns, and a bounded\n  variable-length\
    \ path subset.\n* Standalone node and directed-path `INSERT`, fixed directed\n\
    \  `MATCH`-and-`INSERT`, single-node `INSERT RETURN`, property and label\n  mutation,\
    \ and edge/node deletion.\n* Native DuckDB ART indexes for selective vertex-property\
    \ equality lookups.\n* Explicit CSR-backed BFS, DFS, unweighted SSSP, PageRank,\
    \ weak and strong\n  components, Louvain community detection, degree, closeness,\
    \ local\n  clustering coefficient, and triangle counting.\n\n**Storage and execution\
    \ model**\n\nManaged vertices and edges remain authoritative ordinary DuckDB tables\n\
    rather than entity-attribute-value rows. For referenced graphs, the mapped\nDuckDB\
    \ or DuckLake source tables remain authoritative and DuckGQL persists\nonly the\
    \ typed graph mapping. Nodes retain their complete label set and each\nedge has\
    \ exactly one immutable type. DuckGQL lowers graph queries to native\nDuckDB relational\
    \ plans, allowing DuckDB to execute scans, joins,\naggregation, ordering, and\
    \ recursive CTEs. The graph optimizer can choose\ntable scans, native property\
    \ indexes, node-label postings, and selective\nfixed-hop CSR expansion. CSR snapshots\
    \ are immutable, database-instance\nscoped, version checked, and derived rather\
    \ than authoritative.\n\n**Project status**\n\nDuckGQL v0.2.0 is not yet a complete\
    \ or conforming ISO GQL implementation.\nGrammar recognition does not imply semantic\
    \ or transactional conformance.\nThe machine-readable conformance manifest currently\
    \ classifies 24 feature\nfamilies as partial and 12 as planned. Important restrictions\
    \ include\nautocommit-only graph lifecycle and CSR operations, a single vertex\
    \ and\nedge input per bulk load, and incomplete\ngeneral path searches, query\
    \ composition, procedures, and the complete GQL\nvalue/type system.\n\nSee the\
    \ [documentation](https://duckgql.com/docs/), inspect the\n[conformance manifest](https://github.com/rahul-iyer/duckdb-gql/blob/v0.2.0/test/conformance/iso-gql-2024.tsv),\n\
    or try the [browser playground](https://duckgql.com/).\n"
  known_limitations: "* DuckGQL implements a practical subset of ISO/IEC 39075:2024\
    \ GQL; it is\n  experimental and not yet a conforming implementation.\n* `CREATE\
    \ GRAPH`, `DROP GRAPH`, and full-load `COPY GRAPH` are\n  autocommit-only. `COPY\
    \ GRAPH` requires an empty graph.\n* Bulk import currently accepts one vertex\
    \ file, one edge file, at most one\n  scalar vertex-label column, and one edge-type\
    \ column. Every edge row must\n  contain exactly one non-empty type.\n* CSR construction\
    \ and CSR algorithms are autocommit-only. Snapshots are\n  database-instance scoped\
    \ and version checked. Graph mutations or direct\n  SQL writes invalidate managed\
    \ snapshots; the next algorithm call rebuilds\n  the required projection automatically.\n\
    * Weighted SSSP is not implemented. The current SSSP implementation is\n  unweighted.\n\
    * Multiple-path and undirected insertion, general runtime property maps,\n  and\
    \ open-graph schema evolution remain incomplete.\n* `INSERT RETURN` currently\
    \ supports one directly inserted node variable;\n  edge values, expressions, multiple\
    \ return items, ordering, and pagination\n  are not yet supported.\n* General\
    \ path modes and searches, shortest-path groups, complete\n  variable-length path\
    \ composition, procedure semantics, query composition,\n  named graph types, typed\
    \ storage enforcement, and the complete GQL\n  value/type system remain incomplete.\n\
    * Referenced DuckDB and DuckLake graphs are read-only, and all mapped tables\n\
    \  must belong to one attached catalog. Source keys are currently integer\n  typed,\
    \ and endpoint types must exactly match their vertex key types.\n* One referenced\
    \ table maps one static node or edge type. Composite and\n  string identities,\
    \ multi-table joins for one element, mapping predicates,\n  and write-through\
    \ mutations are not yet supported.\n"
