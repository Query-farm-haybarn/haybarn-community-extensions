extension:
  name: duckgql
  description: GQL graph queries, mutations, and algorithms over DuckDB and DuckLake
    tables
  version: 0.3.1
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - rahul-iyer
repo:
  github: rahul-iyer/duckdb-gql
  ref: e1be52d4ce7981e7197afeaa38f45ce637c0ec67
  variegata: 44e77c6835f9e6758bb3e3bccb1a642981dbf1e7
docs:
  hello_world: "COPY (\n  SELECT * FROM (VALUES\n    ('p1', 'Ada', 'Person'),\n  \
    \  ('p2', 'Grace', 'Person')\n  ) nodes(\":ID(People)\", \"name:string\", \":LABEL\"\
    )\n) TO 'duckgql_nodes.csv' (FORMAT CSV, HEADER);\n\nCOPY (\n  SELECT * FROM (VALUES\n\
    \    ('p1', 'p2', 'KNOWS')\n  ) edges(\":START_ID(People)\", \":END_ID(People)\"\
    , \":TYPE\")\n) TO 'duckgql_edges.csv' (FORMAT CSV, HEADER);\n\nCREATE GRAPH social\
    \ ANY;\n\nCOPY GRAPH social FROM (\n  VERTICES 'duckgql_nodes.csv',\n  EDGES 'duckgql_edges.csv'\n\
    ) FORMAT GRAPH;\n\nSESSION SET GRAPH social;\n\nMATCH (person:Person)-[:KNOWS]->(friend:Person)\n\
    RETURN person.name, friend.name;\n"
  extended_description: "DuckGQL is an experimental C++17 extension that adds a growing\
    \ subset of\nISO/IEC 39075:2024 GQL to DuckDB. It combines graph pattern queries\
    \ and\nmutations with DuckDB's native relational storage and execution engine,\n\
    plus an explicit CSR layer for graph algorithms.\n\n**What works in v0.3.1**\n\
    \nThis version targets DuckDB 2.0.0.\n\n* Managed property graphs backed by typed\
    \ DuckDB vertex and edge tables.\n* Zero-copy graph projections over existing\
    \ DuckDB and DuckLake tables,\n  including multiple heterogeneous vertex and edge\
    \ mappings. Live graphs\n  registered with `ACCESS_MODE 'READ_WRITE'` support\
    \ GQL `INSERT`, `SET`,\n  `REMOVE`, and `DELETE` against their mapped source tables.\n\
    * Live DuckLake projections that follow committed snapshots, or pinned\n  projections\
    \ for reproducible analysis.\n* Mapping-scoped integer source keys, optional edge\
    \ keys, and DuckGQL-managed\n  dense element IDs, without application-maintained\
    \ numeric ID ranges.\n* Inline typed graph schemas that persist in the catalog\
    \ and immediately\n  materialize constrained vertex and edge tables without `COPY\
    \ GRAPH`.\n* Graph-header CSV, compressed CSV, and Parquet bulk import with optional\n\
    \  endpoint and identity validation.\n* Directed `MATCH`, `OPTIONAL MATCH`, filtering,\
    \ projection, aggregation,\n  ordering, paging, fixed multi-hop patterns, and\
    \ a bounded\n  variable-length path subset, composed quantified patterns, shortest-path\n\
    \  search, and search-based reachability.\n* Standalone node and directed-path\
    \ `INSERT`, fixed directed\n  `MATCH`-and-`INSERT`, multiple directed insertion\
    \ paths, node and edge\n  `INSERT RETURN` values, property and label mutation,\
    \ and edge/node deletion.\n* Query parameters and native DuckDB ART indexes for\
    \ selective\n  vertex-property equality lookups.\n* Compact, buffer-managed CSR\
    \ snapshots with incremental insert deltas and\n  optional persistence in the\
    \ database file for reuse after reopening.\n* Explicit CSR-backed BFS, DFS, unweighted\
    \ and weighted SSSP, PageRank, weak\n  and strong components, Louvain community\
    \ detection, degree, closeness, local\n  clustering coefficient, and triangle\
    \ counting.\n* Experimental cost-based graph planning with plan diagnostics, directional\n\
    \  fanout and endpoint statistics, and costing across connected patterns.\n  Seed-degree\
    \ estimates and same-type degree bias improve expansion costing.\n  Enable it\
    \ with `SET gql_optimizer = 'cost'`; legacy planning is the default.\n* Snapshot-scoped\
    \ DuckLake identity caching and selective projected property\n  access, with source-version\
    \ pinning and prepared-query rebinding.\n\n**Storage and execution model**\n\n\
    Managed vertices and edges remain authoritative ordinary DuckDB tables\nrather\
    \ than entity-attribute-value rows. For referenced graphs, the mapped\nDuckDB\
    \ or DuckLake source tables remain authoritative and DuckGQL persists\nthe typed\
    \ graph mapping and derived caches. Nodes retain their complete label set and\
    \ each\nedge has exactly one immutable type. DuckGQL lowers graph queries to native\n\
    DuckDB relational plans, allowing DuckDB to execute scans, joins,\naggregation,\
    \ ordering, and recursive CTEs. The graph optimizer can choose\ntable scans, native\
    \ property indexes, node-label postings, and selective\nCSR expansion. CSR snapshots\
    \ are database-instance scoped, version checked,\nand derived rather than authoritative.\
    \ Inserts are read through a delta\nalongside the snapshot; updates and deletes\
    \ invalidate affected snapshots.\n`gql_build_csr` saves snapshots in the database\
    \ file by default. After\nreopening, saved pages load on demand through DuckDB's\
    \ buffer manager,\nincluding for read-only databases. Use `persist := false` for\
    \ memory-only\nsnapshots.\n\n**Project status**\n\nDuckGQL v0.3.1 is not yet a\
    \ complete or conforming ISO GQL implementation.\nGrammar recognition does not\
    \ imply semantic or transactional conformance.\nThe machine-readable conformance\
    \ manifest records partial and planned\nfeature families. Important restrictions\
    \ include\nautocommit-only graph lifecycle and CSR operations, a single vertex\
    \ and\nedge input per bulk load, and incomplete\ngeneral path searches, query\
    \ composition, procedures, and the complete GQL\nvalue/type system.\n\nSee the\
    \ [documentation](https://duckgql.com/docs/), inspect the\n[conformance manifest](https://github.com/rahul-iyer/duckdb-gql/blob/e1be52d4ce7981e7197afeaa38f45ce637c0ec67/test/conformance/iso-gql-2024.tsv),\n\
    or try the [browser playground](https://duckgql.com/).\n"
  known_limitations: "* DuckGQL implements a practical subset of ISO/IEC 39075:2024\
    \ GQL; it is\n  experimental and not yet a conforming implementation.\n* `CREATE\
    \ GRAPH`, `DROP GRAPH`, and full-load `COPY GRAPH` are\n  autocommit-only. `COPY\
    \ GRAPH` requires an empty graph.\n* Bulk import currently accepts one vertex\
    \ file, one edge file, at most one\n  scalar vertex-label column, and one edge-type\
    \ column. Every edge row must\n  contain exactly one non-empty type.\n* CSR construction\
    \ and CSR algorithms are autocommit-only. Snapshots are\n  database-instance scoped\
    \ and version checked. Inserts can be absorbed\n  incrementally; updates and deletes\
    \ invalidate affected snapshots.\n  Automatically built algorithm projections,\
    \ weighted projections, and\n  endpoint statistics remain memory-only.\n* Undirected\
    \ insertion, general runtime property maps,\n  and open-graph schema evolution\
    \ remain incomplete.\n* Standalone `INSERT RETURN` supports directly inserted\
    \ node and edge\n  variables; expressions, ordering, and pagination are not yet\
    \ supported.\n* General path modes and searches, shortest-path groups, complete\n\
    \  variable-length path composition, procedure semantics, query composition,\n\
    \  named graph types, typed storage enforcement, and the complete GQL\n  value/type\
    \ system remain incomplete.\n* Referenced graphs require all mapped tables to\
    \ belong to one attached\n  catalog. Source keys are currently integer typed,\
    \ and endpoint types must\n  exactly match their vertex key types. Write-through\
    \ access requires\n  `SNAPSHOT_POLICY 'LIVE'`; pinned snapshots remain read-only.\n\
    * One referenced table maps one static node or edge type. Composite and\n  string\
    \ identities, multi-table joins for one element, mapping predicates,\n  `MERGE`,\
    \ `INSERT ... RETURN`, and label changes on referenced graphs are\n  not yet supported.\n"
