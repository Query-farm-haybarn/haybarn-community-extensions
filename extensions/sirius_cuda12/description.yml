extension:
  name: sirius_cuda12
  description: CUDA 12 backend of Sirius, a GPU-native SQL engine that transparently
    runs DuckDB queries on NVIDIA GPUs; install it through the core extension with
    `INSTALL sirius; LOAD sirius;`, which picks the right backend for your driver.
  version: 0.0.0
  language: C++
  build: cmake
  license: Apache-2.0
  maintainers:
  - mbrobbel
  - bwyogatama
  requires_toolchains: cuda;rust
  excluded_platforms: linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;windows_amd64_rtools;wasm_mvp;wasm_eh;wasm_threads
  cuda_archs: 75-real;80-real;86-real;90a-real;100-real;120-real
  cuda_version: '12'
  skip_tests: true
  vcpkg_commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3
  extra_extension_config: "set(SIRIUS_DUCKDB_LINKAGE static CACHE STRING \"Sirius\
    \ library linkage\")\nduckdb_extension_load(\n  sirius_cuda12\n  SOURCE_DIR ${CMAKE_CURRENT_LIST_DIR}\n\
    \  INCLUDE_DIR ${CMAKE_CURRENT_LIST_DIR}/src/include)"
repo:
  github: sirius-db/sirius
  ref: 1290c3ea8429b4dc0f12541acf3d149c6c53cf87
  build_directory: sirius-duckdb
