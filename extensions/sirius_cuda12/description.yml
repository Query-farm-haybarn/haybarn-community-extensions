    \ stderr when\n-- the download starts and when it finishes.\nINSTALL sirius;\n\
    LOAD sirius;\nSELECT * FROM sirius_status();\n\u250C\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\u2500\u2500\u2500\
