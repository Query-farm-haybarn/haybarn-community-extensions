extension:
  name: dynamodb
  description: Adds a dynamodb_scan function that enables querying DynamoDB tables.
  version: 0.0.2
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads
  maintainers:
  - lukaswelsch
repo:
  github: lukaswelsch/duckdb-dynamodb
  ref: 2eb2dd68db65ef4a8590b30b9931471b3b30a75c
docs:
  hello_world: "-- Create a DynamoDB secret based on the credential_chain\nCREATE\
    \ OR REPLACE SECRET dynamo_secret (\n  TYPE dynamodb\n);\n\n-- Query a DynamoDB\
    \ table called 'orders'. The table has a GSI on status, to which this query restricts\
    \ results. \nFROM dynamodb_scan('orders')\nWHERE status='ACTIVE';\n\n-- Perform\
    \ a SUM aggregation on a full table, without a GSI or PK. This requires setting\
    \ allow_full_scan to true.\nSELECT SUM(amount) \nFROM dynamodb_scan('orders',\
    \ allow_full_scan=True) \nWHERE createdAt::timestamp > '2026-05-01 00:00:00'::TIMESTAMP;\n"
  extended_description: "This extension adds support for querying DynamoDB tables\
    \ directly from DuckDB. \nIt implements filter pushdown on partition keys, sort\
    \ keys, and GSIs to minimize read capacity consumption, with remaining filtering\
    \ and all aggregation handled by DuckDB's execution engine.\nFor a detailed description\
    \ take a look at the [extension repository](https://github.com/lukaswelsch/duckdb-dynamodb).\
    \ \n\nParameter reference:\n- **table_name ('orders')**: Target DynamoDB table\
    \ to scan.\n- **endpoint**: Custom connection URL (useful for local development).\n\
    - **allow_full_scan (false / true)**: Safety toggle to prevent accidental unindexed\
    \ full-table reads.\n- **parallel_segments**: Number of threads to divide and\
    \ speed up the scan.\n- **schema_mode ('hybrid'|'infer')**: Controls how DynamoDB\
    \ attributes are mapped to data types.\n  - hybrid (default): activates the hybrid\
    \ mode, in which rare attributes are stored in an _extra JSON column.\n  - infer:\
    \ same as hybrid_threshold=0; all attributes are converted to columns\n- **hybrid_threshold\
    \ (0.8)**: Attributes must appear in this percent of samples to be a column\n\
    - **sample_size (200)**: How many rows should be checked to infer the schema from.\n"
