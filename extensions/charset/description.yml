extension:
  name: charset
  description: "Character-encoding detection, transcoding & mojibake repair in SQL\
    \ \u2014 chardetng detection, WHATWG/encoding_rs codecs, UTF-8 validity"
  version: 0.1.0
  language: Rust
  build: cargo
  license: MIT
  requires_toolchains: rust
  maintainers:
  - alitrack
  excluded_platforms: linux_arm64;wasm_mvp;wasm_eh;wasm_threads
repo:
  github: alitrack/duckdb-charset
  ref: 09d85c919e0a73081e8131ca1fe96eb00a324f49
docs:
  hello_world: 'LOAD charset;


    -- Guess the encoding of a blob of windows-1252 "cafe" bytes and read it back

    SELECT detect_encoding(from_hex(''636166e9'')) AS detected;  -- windows-1252

    SELECT to_utf8(from_hex(''636166e9''))         AS text;      -- cafe


    -- Explicit-label decode (e.g. a Shift_JIS byte stream)

    SELECT to_utf8_from(from_hex(''93fa967b8cea''), ''shift_jis'') AS text;


    -- Encode for export (cafe -> windows-1252 bytes, round-trips losslessly)

    SELECT to_utf8_from(transcode(''cafe'', ''windows-1252''), ''windows-1252'') AS
    back;


    -- Repair garble: "Cafe" with a mojibake e is what you get when

    -- UTF-8 "Cafe" is misread as 1252

    SELECT fix_mojibake(''Caf\u00c3\u00a9'') AS fixed;


    -- Validate and enumerate

    SELECT is_valid_utf8(from_hex(''636166e9''));  -- false (0xE9 alone is not UTF-8)

    SELECT count(*) FROM supported_encodings();  -- 40

    '
  extended_description: "## charset \u2014 Character-encoding detection & transcoding\
    \ in SQL\n\nGuess the encoding of a `BLOB` of raw bytes, decode it to UTF-8,\n\
    encode a string back to a target codec, check UTF-8 validity, and\nrepair the\
    \ classic \"UTF-8 misread as Windows-1252\" garble.\n\nBuilt on two battle-tested\
    \ pure-Rust libraries that ship with Firefox:\n\n- **`chardetng`** \u2014 the\
    \ heuristic encoding *detector* (a Rust port of\n  the Mozilla chardet-style guesser).\n\
    - **`encoding_rs`** \u2014 the WHATWG Encoding Standard *codec* library\n  (decodes/encodes\
    \ every web-platform label, with lossy U+FFFD /\n  HTML-ref handling for unmappable\
    \ input).\n\nThe engine is ported verbatim from the MIT-licensed\n[Query-farm\
    \ `vgi-charset`](https://github.com/Query-farm/vgi-charset)\nVGI worker; only\
    \ the Arrow IPC transport layer was replaced with\ndirect DuckDB C-API vector\
    \ I/O (via\n[quack-rs](https://github.com/tomtom215/quack-rs)). No VGI, no Arrow\n\
    IPC, no JSON shims.\n\n**8 Functions:**\n\n| Function | Signature | Returns |\
    \ Notes |\n|----------|-----------|---------|-------|\n| `detect_encoding` | `(bytes\
    \ BLOB)` | `VARCHAR` | BOM first, then chardetng. Empty/NULL -> NULL |\n| `detect_confidence`\
    \ | `(bytes BLOB)` | `DOUBLE` | `[0,1]` decode-cleanliness proxy. Empty -> 0.0\
    \ |\n| `is_valid_utf8` | `(bytes BLOB)` | `BOOLEAN` | strict `from_utf8` check\
    \ |\n| `to_utf8` | `(bytes BLOB)` | `VARCHAR` | decode with *detected* encoding.\
    \ Undecodable -> U+FFFD |\n| `to_utf8_from` | `(bytes BLOB, label VARCHAR)` |\
    \ `VARCHAR` | decode with *explicit* label. Unknown label -> SQL error |\n| `transcode`\
    \ | `(text VARCHAR, to_encoding VARCHAR)` | `BLOB` | encode a string to bytes.\
    \ Unknown label -> SQL error |\n| `fix_mojibake` | `(text VARCHAR)` | `VARCHAR`\
    \ | repair UTF-8 -> 1252 double-encoding; no-op if unsure |\n| `supported_encodings`\
    \ | `()` | `table(encoding)` | the 40 WHATWG/`encoding_rs` canonical labels |\n\
    \nNULL/error policy: `to_utf8` / `to_utf8_from` never error on *dirty*\nbytes\
    \ \u2014 undecodable bytes become U+FFFD. Only an **unknown encoding\nlabel**\
    \ raises a SQL error. `fix_mojibake` is conservative: it repairs\nonly when the\
    \ re-decode provably reduces mojibake markers, otherwise\nit returns the input\
    \ unchanged.\n"
