extension:
  name: root
  description: Query CERN ROOT files directly from DuckDB. Explore TTrees, nested
    C++ objects and histograms, analyze selected event data, and build reusable indexes
    without converting the original ROOT files.
  version: 3.11.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - LordVitiate
  excluded_platforms: linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
  test_config: '{"test_env_variables":{"ROOT4DUCKDB_ROOT_CONFIG":"/duckdb_build_dir/.deps/community-root/bin/root-config","LD_LIBRARY_PATH":"/duckdb_build_dir/.deps/community-root/lib"}}'
repo:
  github: LordVitiate/root4duckdb
  ref: cbd7f32546d971ee0fa0113a7c655d5684dec7da
  variegata: bf55e4cd5491d9cc69e1d569009748ce457fe679
docs:
  hello_world: "INSTALL root FROM community;\nLOAD root;\n\nSELECT * FROM read_root('/data/events.root');\n\
    \nSELECT entry_id, vecTrack_idx, chi2tot\nFROM read_root(\n    '/data/events.root',\n\
    \    dictionary := '/data/libExperiment.so',\n    path_prefix := '/PaEvent/vecTrack/chi2tot'\n\
    )\nWHERE entry_id BETWEEN 1000 AND 2000\nLIMIT 20;\n"
  extended_description: "# ROOT4DuckDB \u2014 Query CERN ROOT Data Directly with SQL\n\
    \n## Quick start\n\nInstall and load ROOT4DuckDB:\n\n```sql\nINSTALL root FROM\
    \ community;\nLOAD root;\n```\n\nExplore the contents of a ROOT file:\n\n```sql\n\
    SELECT * FROM read_root('/data/events.root');\n```\n\nThis lists the available\
    \ top-level objects and paths. You can then inspect an object, select an individual\
    \ field, or query a collection as a relational dataset.\n\nROOT4DuckDB works with\
    \ existing ROOT files. No import or conversion step is required.\n\n## Explore\
    \ ROOT objects and their structure\n\nROOT files may contain primitive TTree branches\
    \ or complex experiment-specific C++ objects with nested collections.\n\nStart\
    \ by discovering the available content:\n\n```sql\nSELECT * FROM read_root('/data/events.root');\n\
    ```\n\nTo inspect the structure of an experiment-specific object, load its matching\
    \ ROOT dictionary and use `root_describe`:\n\n```sql\nSELECT path, name, root_type,\
    \ kind, is_container\nFROM root_describe(\n    '/data/events.root',\n    '/PaEvent/vecTrack',\n\
    \    dictionary := '/data/libExperiment.so'\n);\n```\n\nThis shows which members\
    \ are available, their ROOT types, and whether they represent collections or primitive\
    \ values.\n\nThe `PaEvent` paths in this documentation illustrate COMPASS-style\
    \ event data. Other experiments use their own object names, dictionaries and layouts.\n\
    \n## Read selected event data\n\nYou do not need to decode every member of an\
    \ event object to analyze one quantity.\n\nFor example, read the track-fit chi-square\
    \ values from a nested track collection:\n\n```sql\nSELECT entry_id, vecTrack_idx,\
    \ chi2tot\nFROM read_root(\n    '/data/events.root',\n    dictionary := '/data/libExperiment.so',\n\
    \    path_prefix := '/PaEvent/vecTrack/chi2tot'\n)\nWHERE entry_id BETWEEN 1000\
    \ AND 2000\nLIMIT 20;\n```\n\nHere:\n\n- `entry_id` identifies the event within\
    \ the ROOT file.\n- `vecTrack_idx` identifies the track within that event.\n-\
    \ `chi2tot` is the selected track quantity.\n- `path_prefix` selects the logical\
    \ field to read.\n- `dictionary` provides the C++ class information needed for\
    \ experiment-specific objects.\n\nNested ROOT collections are flattened into relational\
    \ rows while preserving their event and collection indices.\n\nPrimitive TTree\
    \ branches and supported histogram objects generally do not require experiment-specific\
    \ dictionaries.\n\n### Analyze values with SQL\n\nOnce a ROOT field is exposed\
    \ as a DuckDB relation, standard SQL operations become available:\n\n```sql\n\
    SELECT\n    count(*) AS tracks,\n    avg(chi2tot) AS mean_chi2,\n    min(chi2tot)\
    \ AS min_chi2,\n    max(chi2tot) AS max_chi2\nFROM read_root(\n    '/data/events.root',\n\
    \    dictionary := '/data/libExperiment.so',\n    path_prefix := '/PaEvent/vecTrack/chi2tot'\n\
    )\nWHERE chi2tot < 100;\n```\n\nSelections, aggregations, grouping and relational\
    \ operations can be expressed without writing a dedicated ROOT event loop for\
    \ each analysis.\n\n## Analyze multiple ROOT files\n\nROOT4DuckDB accepts individual\
    \ files, directories, filename patterns and file manifests.\n\n```sql\nSELECT\n\
    \    source_id,\n    count(DISTINCT entry_id) AS events,\n    count(*) AS tracks\n\
    FROM read_root(\n    '/data/run*.root',\n    dictionary := '/data/libExperiment.so',\n\
    \    path_prefix := '/PaEvent/vecTrack/chi2tot'\n)\nGROUP BY source_id\nORDER\
    \ BY source_id;\n```\n\nThe `source_id` and `source_path` columns identify the\
    \ source file when multiple files are read.\n\nROOT4DuckDB supports parallel reading\
    \ and can reduce unnecessary data decoding through field selection and entry-range\
    \ filtering. The actual performance depends on the ROOT layout, storage system\
    \ and selection conditions.\n\n## Query ROOT histograms\n\nSupported `TH1`, `TH2`,\
    \ `TH3` and `TProfile` objects can also be accessed as SQL relations.\n\nFor example,\
    \ read the bins of a one-dimensional histogram:\n\n```sql\nSELECT x_low, x_high,\
    \ content, error\nFROM read_root(\n    '/data/histograms.root',\n    path_prefix\
    \ := '/analysis/mass/bins'\n)\nORDER BY x_low;\n```\n\nDepending on the histogram\
    \ type and selected view, ROOT4DuckDB exposes bin contents, uncertainties, axis\
    \ information and histogram metadata.\n\nThis allows histogram contents to participate\
    \ in SQL-based inspection and analysis.\n\n## Build reusable indexes for larger\
    \ datasets\n\nDirect reading does not require an index. For repeated analyses\
    \ of many ROOT files, however, ROOT4DuckDB can build persistent metadata to identify\
    \ which files, baskets and event ranges may contain the requested values.\n\n\
    Indexing stores metadata separately from the original ROOT files. The event payloads\
    \ are not converted or duplicated.\n\nFor example:\n\n```sql\nSELECT file_path,\
    \ entries, flattened_values, status\nFROM root_build_dataset_index(\n    '/data/run*.root',\n\
    \    'PaEvent',\n    '[\n        \"/PaEvent/vecTrack/chi2tot\",\n        \"/PaEvent/vecTrack/xx0\"\
    \n    ]',\n    '/data/root-index',\n    dictionary := '/data/libExperiment.so',\n\
    \    catalog_mode := 'sqlite',\n    index_threads := 8,\n    max_in_flight_files\
    \ := 4\n);\n```\n\nThis creates a reusable index for two track quantities.\n\n\
    The metadata may include physical ROOT basket locations, event ranges, numerical\
    \ statistics and Bloom filters. These help identify potentially relevant data\
    \ before the original events are decoded.\n\nThe SQLite catalog mode publishes\
    \ versioned metadata through Apache Iceberg. The original ROOT event data remain\
    \ in ROOT format.\n\n### Query an indexed dataset\n\nOnce the index has been created,\
    \ use `read_root_dataset`:\n\n```sql\nSELECT source_id, entry_id, vecTrack_idx,\
    \ value AS chi2tot\nFROM read_root_dataset(\n    '/data/root-index',\n    '/PaEvent/vecTrack/chi2tot',\n\
    \    dictionary := '/data/libExperiment.so'\n)\nWHERE value < 10;\n```\n\nUnlike\
    \ a simple unindexed scan, an indexed query can use stored metadata to exclude\
    \ irrelevant ROOT files, baskets and entry ranges.\n\nIndexing is optional and\
    \ is most useful when a dataset will be queried repeatedly or when selective queries\
    \ can avoid substantial reading.\n\n## Inspect dataset statistics without rescanning\
    \ ROOT files\n\nROOT4DuckDB can answer some questions directly from stored index\
    \ metadata:\n\n```sql\nSELECT *\nFROM root_dataset_stats(\n    '/data/root-index',\n\
    \    '/PaEvent/vecTrack/chi2tot'\n);\n```\n\nThis returns information such as\
    \ the total value count, null and non-finite counts, minimum and maximum values,\
    \ and basket statistics without rereading the original event payloads.\n\nYou\
    \ can also inspect published Iceberg metadata:\n\n```sql\nSELECT *\nFROM root_iceberg_catalog('/data/root-index');\n\
    ```\n\n## SQL function reference\n\n| Function | Purpose |\n|---|---|\n| `read_root`\
    \ | Explore and read ROOT files, branches, nested objects and histograms |\n|\
    \ `root_describe` | Inspect the structure and members of ROOT C++ objects |\n\
    | `root_build_index` | Build reusable indexes and metadata for ROOT datasets |\n\
    | `root_build_dataset_index` | Production-facing interface for ROOT dataset indexing\
    \ |\n| `read_root_dataset` | Query indexed ROOT data with metadata-based pruning\
    \ |\n| `root_dataset_stats` | Retrieve stored statistics without reading event\
    \ payloads |\n| `root_iceberg_catalog` | Inspect published Apache Iceberg metadata\
    \ |\n\n## Reading modes and compatibility\n\nROOT4DuckDB supports two complementary\
    \ approaches to reading structured ROOT data:\n\n- **Serialized reading** accesses\
    \ selected supported values directly from ROOT's stored baskets.\n- **Object reading**\
    \ reconstructs C++ objects through ROOT and traverses their members.\n\nThe default\
    \ `reader_mode := 'auto'` selects the supported approach and falls back to object\
    \ reading when necessary.\n\nA compatible CERN ROOT runtime is required. Experiment-specific\
    \ C++ objects may require matching ROOT dictionaries and compatible libraries.\n\
    \nAvailability of prebuilt extensions depends on the DuckDB release and operating-system\
    \ platform. Refer to the compatibility matrix above for published binaries.\n\n\
    ## Documentation and examples\n\n- [Source repository](https://github.com/LordVitiate/root4duckdb)\n\
    - [Complete SQL interface](https://github.com/LordVitiate/root4duckdb/blob/main/docs/sql-interface.md)\n\
    - [ROOT reading architecture](https://github.com/LordVitiate/root4duckdb/blob/main/docs/root-reading-pipeline.md)\n\
    - [Build and installation guide](https://github.com/LordVitiate/root4duckdb/blob/main/docs/building-from-source.md)\n\
    - [Multi-file performance measurements](https://github.com/LordVitiate/root4duckdb/blob/main/docs/direct-multifile-scan.md)\n"
