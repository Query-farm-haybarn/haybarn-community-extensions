extension:
  name: dns
  description: The DNS Extension enables DNS lookups and reverse DNS lookups from
    within DuckDB
  version: 0.4.3
  language: Rust
  build: cargo
  license: MIT
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;linux_amd64_musl;
  requires_toolchains: rust;python3
  maintainers:
  - tobilg
repo:
  github: tobilg/duckdb-dns
  ref: 5da0cb2a576c4276068eb0a2a0d7da0f9cd5e715
