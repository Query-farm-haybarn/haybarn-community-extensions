extension:
  name: gatekeeper
  description: Authorization for untrusted read-only SQL from tenants, LLM agents,
    and dashboard builders. Validate a statement without executing it, or enforce
    a lockable policy on the connection itself, with an audit log of every decision.
  version: 0.3.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - derekperkins
  requires_toolchains: python3
  excluded_platforms: wasm_mvp;wasm_threads
  opt_in_platforms: linux_amd64_musl;linux_arm64_musl;windows_arm64
repo:
  github: nozzle/duckdb-gatekeeper
  ref: 9c3c7acb229be0e30c03ebf88867f291631ad0f1
  ref_next: 9c3c7acb229be0e30c03ebf88867f291631ad0f1
docs:
  hello_world: "-- Something to protect, and something that must stay hidden\nCREATE\
    \ SCHEMA reporting;\nCREATE TABLE reporting.orders (customer_id INTEGER, amount\
    \ DOUBLE);\nCREATE TABLE secrets (token VARCHAR);\n\n-- Trusted setup: install\
    \ the global ceiling, then freeze it.\n-- An omitted catalog matches any database;\
    \ add catalog: 'mydb' to pin one.\nCALL gatekeeper_configure(\n    allowed_tables\
    \ := [{schema: 'reporting', 'table': '*'}],\n    blocked_functions := ['md5']\n\
    );\n-- Success\n-- true\n\nSET lock_configuration = true;\n\n-- Allowed: an allowed\
    \ table with default (reviewed read-only) functions.\n-- The resolved dependencies\
    \ come back as binding evidence.\nSELECT allowed, code, objects[1].\"table\" AS\
    \ resolved_table\nFROM gatekeeper_validate('SELECT customer_id, sum(amount) FROM\
    \ reporting.orders GROUP BY customer_id');\n-- allowed | code | resolved_table\n\
    -- true    | ok   | orders\n\n-- Denied: DDL and DML are never allowed\nSELECT\
    \ allowed, code FROM gatekeeper_validate('DROP TABLE reporting.orders');\n-- allowed\
    \ | code\n-- false   | unsupported\n\n-- Denied: tables are matched by resolved\
    \ identity, with structured diagnostics\nSELECT allowed, code, violations[1].rule\
    \ AS rule, violations[1].schema AS schema, violations[1].\"table\" AS \"table\"\
    \nFROM gatekeeper_validate('SELECT * FROM secrets');\n-- allowed | code      |\
    \ rule  | schema | table\n-- false   | forbidden | table | main   | secrets\n\n\
    -- Denied: a request can narrow the global policy but never widen it\nSELECT allowed,\
    \ code, violations[1].rule AS rule, violations[1].function_name AS function_name\n\
    FROM gatekeeper_validate('SELECT md5(''x'')', blocked_functions := []);\n-- allowed\
    \ | code      | rule     | function_name\n-- false   | forbidden | function |\
    \ md5\n\n-- Narrowed: per-request options restrict a tenant to one table within\
    \ the ceiling\nSELECT allowed, code\nFROM gatekeeper_validate('SELECT count(*)\
    \ FROM reporting.orders',\n                         allowed_tables := [{schema:\
    \ 'reporting', 'table': 'orders'}]);\n-- allowed | code\n-- true    | ok\n\n--\
    \ Engine errors report their phase and are never 'ok'\nSELECT allowed, code, error_type\
    \ FROM gatekeeper_validate('SELECT * FROM missing_table');\n-- allowed | code\
    \    | error_type\n-- false   | binding | Catalog\n"
  extended_description: "Gatekeeper answers one question about SQL you did not write:\
    \ does this statement stay\ninside the lines you drew? It is built for multi-tenant\
    \ analytics, LLM agents, and\nembedded dashboard builders where the SQL text is\
    \ untrusted but the database is yours.\n\n- **Ask with `gatekeeper_validate`**:\
    \ the decision and structured diagnostics, without\n  executing anything.\n- **Draw\
    \ the lines once**: a lockable global policy that per-request options can narrow,\n\
    \  never widen.\n- **Or let DuckDB answer for itself**: `CALL gatekeeper_enforce()`\
    \ refuses denied\n  statements on that connection, with an audit log and a log-only\
    \ rollout mode.\n\n### Validate a query\n\n```sql\nSELECT allowed, code, violations,\
    \ error_message\nFROM gatekeeper_validate(?, allowed_tables := ?);  -- host-bound\
    \ parameters\n```\n\nValidation parses and binds the SQL on your connection, checks\
    \ the resolved objects\nand functions attributable to the caller, and checks the\
    \ plan for read-only operators.\nIt returns one row; it does not execute the query.\n\
    \nExecute only when **`allowed = true` and `code = 'ok'`**. Treat exceptions and\
    \ missing\nrows as denials, then execute the same SQL text on the same connection.\
    \ Binding can\nperform I/O; see [Security boundaries](#security-boundaries).\n\
    \n### Functions and options\n\n```text\nSELECT * FROM gatekeeper_validate(sql\
    \ VARCHAR, option := value, ...)  -- one result row\nCALL gatekeeper_configure(option\
    \ := value, ...)                       -- replaces the global policy\nCALL gatekeeper_enforce()\
    \                                             -- enforces the policy on this connection\n\
    ```\n\nThe first two take the same named options and accept host-bound parameters\
    \ (`?`,\n`$1`), so policies never need to be spliced into SQL text.\n\n| Option\
    \ | Type | Default | Notes |\n|--------|------|---------|-------|\n| `allowed_tables`\
    \ | STRUCT[] | unrestricted (non-internal) | `{catalog?, schema, table}`. `'*'`\
    \ matches any whole component; omitted or NULL catalog matches any. `[]` denies\
    \ all tables and views. Until this is set, every non-internal table and view is\
    \ readable. |\n| `blocked_tables` | STRUCT[] | `[]` | Same identity rules. A match\
    \ always denies what the caller names; does not reach inside trusted views, macros,\
    \ or attached tables. |\n| `use_default_functions` | BOOLEAN | `true` | `true`:\
    \ 953 reviewed defaults **plus** `allowed_functions`. `false`: only `allowed_functions`.\
    \ |\n| `allowed_functions` | VARCHAR[] | `[]` | Leaf names, ASCII case-folded.\
    \ No wildcards. |\n| `blocked_functions` | VARCHAR[] | `[]` | Always wins over\
    \ the allowlist for what the caller writes and the implementations DuckDB binds\
    \ for it. Does not reach inside trusted views, macros, or attached tables. |\n\
    \nOnly a whole-component `'*'` is a wildcard: `sales_*`, `?`, and `%` are literal\
    \ names.\nWildcards also match objects created or attached later, so prefer explicit\
    \ catalog\nnames when that scope is not intended.\n\n### Result columns\n\n| Column\
    \ | Type | Meaning |\n|--------|------|---------|\n| `allowed` | BOOLEAN | True\
    \ exactly when `code = 'ok'`. |\n| `code` | VARCHAR | `ok`, `forbidden`, `unsupported`,\
    \ `parser`, `binding`, `invalid_input`. |\n| `violations` | STRUCT[] | `rule`,\
    \ `message`, `catalog`, `schema`, `table`, `function_name`, `position`. Nonempty\
    \ only for `forbidden` and `unsupported`. |\n| `error_type` | VARCHAR | DuckDB\
    \ exception category (`parser`, `Catalog`, `Binder`, ...) for engine errors. |\n\
    | `error_message` | VARCHAR | The engine's message; empty for policy denials.\
    \ |\n| `position` | BIGINT | Zero-based parser byte offset, or NULL. |\n| `objects`\
    \ | STRUCT[] | Resolved `catalog`, `schema`, `table`, `type` (`table`, `view`,\
    \ `replacement`), including trusted dependencies. See `caller_objects` for the\
    \ caller-attributable catalog subset. Empty unless `ok`. |\n| `functions` | STRUCT[]\
    \ | Resolved `catalog`, `schema`, `name`, `type` the query bound to. Empty unless\
    \ `ok`. |\n| `caller_objects` | STRUCT[] | Caller-attributable catalog tables/views,\
    \ with the same fields as `objects`. Sorted, deduplicated subset of `objects`;\
    \ empty unless `ok`. |\n\nViolation `rule` values: `function`, `table`, `internal_object`,\
    \ `dynamic_sql`,\n`replacement_scan`, `bind_time_expression`, `statement`, `limit`,\n\
    `unsupported_structure`. Branch on `code` and `violations[].rule`, not on message\
    \ text.\n\n### Global policy\n\n- **Global ceiling:** `CALL gatekeeper_configure(...)`\
    \ replaces the policy for the\n  database instance. Omitted options take their\
    \ defaults; the policy is not persisted.\n- **Per-request narrowing:** options\
    \ on `gatekeeper_validate(...)` can restrict that\n  ceiling, never grant something\
    \ it denies. Blocks win for caller-attributable references.\n- **Defaults:** non-internal\
    \ tables and views are unrestricted until `allowed_tables`\n  is set. Caller functions\
    \ always need a reviewed default or an explicit grant.\n\n| Operation | SQL |\n\
    |-----------|-----|\n| Inspect | `SELECT current_setting('gatekeeper_policy')`\
    \ |\n| Reset to built-ins | `RESET gatekeeper_policy` or `CALL gatekeeper_configure()`\
    \ |\n| Freeze | `SET lock_configuration = true` after trusted setup |\n| Allow\
    \ later changes while locked | `SET allowed_configs = ['gatekeeper_policy']` before\
    \ locking |\n\n### Trusted views and macros\n\nAllow the outer view/table or macro\
    \ to expose it as a host-controlled capability.\nIts dependencies are **opaque\
    \ to table and function policy**, including blocks and\nthe never-bind list; Gatekeeper's\
    \ control plane remains refused on every route.\n\n- Allowing a view admits its\
    \ underlying tables. Block the view itself to withdraw it.\n- A caller's separate\
    \ reference to an underlying table or function is still checked.\n- A macro forwarding\
    \ a caller argument to `query_table(n)` delegates table selection;\n  caller table\
    \ restrictions do not constrain that selection.\n- `objects` and `functions` still\
    \ report the dependencies as binding evidence;\n  `caller_objects` lists only\
    \ the tables and views the caller reached.\n\nSee the [trusted-definition rules](https://github.com/nozzle/duckdb-gatekeeper/blob/v0.3.0/docs/security.md#function-enforcement-and-trusted-expansion)\n\
    for query-wide name overlaps and bound implementation checks.\n\n### Enforced\
    \ connections\n\nTo have DuckDB refuse denied statements automatically, finish\
    \ trusted setup first:\nload extensions, attach catalogs, configure policy and\
    \ host restrictions, enable logging,\nand lock configuration. Then, outside a\
    \ transaction, run this on each untrusted connection:\n\n```sql\nCALL gatekeeper_enforce();\n\
    ```\n\n- Denials raise a `Permission Error`; enforcement is permanent for that\
    \ connection.\n- Parameters and relation queries are covered; prepared executions\
    \ use the current policy.\n- The result includes host-setting `warnings`. Keep\
    \ a separate host connection for administration.\n\nSee the [enforcement guide](https://github.com/nozzle/duckdb-gatekeeper/blob/v0.3.0/docs/security.md#enforced-connections)\n\
    for setup and execution-boundary details, including parser-time side effects.\n\
    \n### Audit and log-only mode\n\nEnable logging during trusted setup, then inspect\
    \ decisions from a host connection:\n\n```sql\nCALL enable_logging('Gatekeeper');\n\
    SELECT boundary, code, violations, statement\nFROM duckdb_logs_parsed('Gatekeeper')\
    \ WHERE event = 'decision' AND NOT allowed;\n```\n\n- **Denials and policy changes:**\
    \ recorded at `INFO`.\n- **Allowed decisions:** also recorded with `SET logging_level\
    \ = 'debug'`.\n- **Trial rollout:** `SET gatekeeper_log_only = true` records decisions\
    \ without refusing\n  anything. Set it back to `false` to restore enforcement.\n\
    \nLog-only mode protects nothing while enabled. Before locking configuration,\
    \ plan how\nthe host will turn it off. See the [audit log](https://github.com/nozzle/duckdb-gatekeeper/blob/v0.3.0/docs/security.md#audit-log)\n\
    and [log-only guide](https://github.com/nozzle/duckdb-gatekeeper/blob/v0.3.0/docs/security.md#log-only-mode).\n\
    \n### What is never allowed\n\n- **Writes and administration:** DDL, DML, `COPY`,\
    \ `SET`, and `ATTACH` are unsupported.\n  The parser-generated temporary enum\
    \ for a dynamic `PIVOT` is the narrowly checked exception.\n- **Caller-written\
    \ elevated operations:** dynamic SQL, metadata readers, and sequence\n  and storage\
    \ functions on the never-bind list cannot be granted through options.\n- **Gatekeeper's\
    \ control plane:** policy, enforcement, and logging controls are refused\n  even\
    \ through trusted definitions.\n\nFile readers are grantable, but are **not defaults**.\
    \ Granting a reader permits its\nresource access; `allowed_tables` does not restrict\
    \ file paths. See the\n[function policy](https://github.com/nozzle/duckdb-gatekeeper/blob/v0.3.0/docs/security.md#never-bind-functions)\n\
    for the exact never-bind list and trusted-definition exceptions.\n\n### Security\
    \ boundaries\n\nGatekeeper is a **statement-level sandbox**. It does not filter\
    \ rows or columns,\nisolate the filesystem, or impose memory and time limits.\n\
    \n- **Binding can perform I/O.** Prepared statements may bind before enforcement\
    \ hooks run.\n- **Parsing can have side effects.** DuckDB evaluates some `PRAGMA`\
    \ arguments before\n  enforcement; validate complete text first if your host cannot\
    \ accept that residual.\n- **The host controls the environment.** Restrict external\
    \ access and autoloading where\n  possible, set resource limits, and lock configuration\
    \ before handing out connections.\n- **Diagnostics can reveal names.** Treat engine\
    \ error messages and audit logs as host data.\n\nRead the [security model](https://github.com/nozzle/duckdb-gatekeeper/blob/v0.3.0/docs/security.md)\n\
    for the full boundaries and setup requirements. Report suspected bypasses through\n\
    [SECURITY.md](https://github.com/nozzle/duckdb-gatekeeper/blob/v0.3.0/SECURITY.md).\n\
    \n### Compatibility\n\n- **Native:** release binaries target DuckDB 1.5.5, source\
    \ revision\n  `d8cdaa33fda8df955cc76ef58a280f68f4cd43fa`. Each binary requires\
    \ its matching engine.\n  Community builds can target other engines; builds and\
    \ regression tests establish compatibility.\n- **DuckDB 2.0:** the same source\
    \ builds against `v2.0-cyanoptera` (this descriptor's\n  `ref_next`), and the\
    \ community repository's 2.0 builds come from it; there are no GitHub\n  assets\
    \ for 2.0. Decisions are the same on both engines;\n  [Compatibility and review](https://github.com/nozzle/duckdb-gatekeeper/blob/v0.3.0/docs/security.md#compatibility-and-review)\n\
    \  lists what a host on 2.0 sees differently.\n- **Wasm:** EH only, browser-tested\
    \ with `@duckdb/duckdb-wasm@1.33.1-dev64.0`\n  embedding DuckDB 1.5.5. MVP and\
    \ threads/COI are excluded.\n- **API stability:** Gatekeeper is in early development\
    \ (0.x); options and result schemas\n  may change between releases.\n\nSee [build-pin\
    \ maintenance](https://github.com/nozzle/duckdb-gatekeeper/blob/v0.3.0/inventories/README.md#repinning-the-engine)\n\
    and [Wasm setup](https://github.com/nozzle/duckdb-gatekeeper/blob/v0.3.0/test/wasm/README.md).\n\
    \n### Benchmarks\n\nWhat each way of running Gatekeeper adds to a statement, against\
    \ the same statement on a\nplain connection:\n\n| | point lookup (1 K rows) |\
    \ aggregate (10 M rows) | large statement (11 KB) |\n| --- | ---: | ---: | ---:\
    \ |\n| plain connection | 64 \xB5s | 3.2 ms | 3.8 ms |\n| enforced connection\
    \ | 93 \xB5s (+28 \xB5s) | 3.4 ms (+166 \xB5s) | 7.0 ms (+3.3 ms) |\n| enforced,\
    \ audit log at debug | 142 \xB5s (+78 \xB5s) | 3.5 ms (+304 \xB5s) | 7.1 ms (+3.4\
    \ ms) |\n| validate, then execute | 229 \xB5s (+165 \xB5s) | 3.7 ms (+453 \xB5\
    s) | 7.2 ms (+3.4 ms) |\n| denied on an enforced connection | 322 \xB5s | 451\
    \ \xB5s | 2.7 ms |\n\nMedian of 1000 runs per cell after 20 warm-ups, `execute().fetchall()`\
    \ through the Python\nclient on one connection of an in-memory database; Apple\
    \ M3 Max, DuckDB 1.5.5, Gatekeeper\n0.3.0. The plain row is the client round trip\
    \ plus the engine's own work; in parentheses,\nwhat each mode adds to it.\n\n\
    The check is a second parse and bind of the statement plus the AST walk, so its\
    \ cost\nfollows the statement's size, not the data's. `gatekeeper_validate` runs\
    \ the same check;\nthe rest of its row is the second client round trip. A refusal\
    \ never reaches the engine.\nThe table is regenerated by\n[scripts/benchmark.py](https://github.com/nozzle/duckdb-gatekeeper/blob/v0.3.0/scripts/benchmark.py).\n\
    \nFull documentation, including a Python integration example, is in the\n[README](https://github.com/nozzle/duckdb-gatekeeper/blob/v0.3.0/README.md).\n"
