extension:
  name: quackscale
  description: DuckDB WireGuard Extension to Quack & Ducklake over Tailscale/Headscale
  version: 1.0.5
  language: c++
  build: cmake
  license: MIT
  excluded_platforms: windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads;osx_amd64
  maintainers:
  - lmangani
  - smithclay
repo:
  github: Query-farm/quackscale
  ref: 06af182878fb4098806fe4e81a35310899dd0f94
docs:
  hello_world: "-- Quack Service on Tailnet\nLOAD quack;\nLOAD quackscale;\n\nCALL\
    \ tailscale_up(\n    hostname  => 'my-duckdb-node',\n    state_dir => '~/.local/share/duckdb/quackscale'\n\
    );\n\nCALL quack_serve('quack:127.0.0.1:9494', allow_other_hostname => true, token\
    \ => quack_token());\nCALL tailscale_serve_local(port => 9494);\n\nFROM quack_discover();\
    \ \n\n-- Quack Client on Tailnet\nLOAD quack;\nLOAD quackscale;\n\nCALL tailscale_up(hostname\
    \ => 'my-client', state_dir => '~/.local/share/duckdb/quackscale-client');\n\n\
    CREATE SECRET (TYPE quack, TOKEN 'your-shared-token', SCOPE 'quack:100.x.x.x:9494');\n\
    ATTACH 'quack:100.x.x.x:9494' AS remote (TYPE quack, DISABLE_SSL true);\n\nFROM\
    \ remote.query('SELECT 42');\n\nDETACH remote;\nCALL tailscale_down();   -- a\
    \ one-shot client must close tsnet, or the process hangs\n"
extended_description: "QuackScale is a DuckDB WireGuard Community Extension enabling\
  \ Quack & Ducklake usage over Tailscale/Headscale\n\n# About QuackScale\nQuackScale\
  \ embeds a Tailscale client (libtailscale) inside DuckDB. A DuckDB process joins\
  \ your private Tailscale network (tailnet) and reaches its peers over encrypted\
  \ WireGuard. It needs no VPN sidecar and opens no public port.\n\nOnce your process\
  \ is on the tailnet, you read any HTTP asset a peer serves as if it sat on local\
  \ disk. FROM read_csv('http://my-laptop.ts.net:8000/sales.csv') pulls the file straight\
  \ off another machine over the encrypted mesh, with no public URL and no copy step.\n\
  \nPair it with DuckDB's Quack HTTP protocol and you have QuackTail: SQL engines\
  \ that find each other on `100.x` addresses and MagicDNS, then run `ATTACH`, `quack_query`,\
  \ and DuckLake workloads across the mesh.\n      \n"
