extension:
  # Haybarn: disabled because the extension does not yet build
  # against DuckDB 1.5.2 — upstream community-extensions also has
  # no v1.5.2 binary. Re-enable when upstream lands a v1.5.2-
  # compatible release (sync_from_upstream will pick up the bump).
  # Tracker: https://github.com/krokozyab/ofquack/issues/2
  excluded_platforms: linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
  name: ofquack
  description: The Ofquack extension provides seamless integration between DuckDB
    and Oracle Fusion via WSDL-based SOAP calls.
  version: 0.0.1
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - krokozyab
repo:
  github: krokozyab/ofquack
  ref: 4f71175a5c91526795a25e9ad6876608714eae6d
docs:
  extended_description: "The Ofquack extension provides seamless integration between\
    \ DuckDB and Oracle Fusion via WSDL-based SOAP calls.\nIt allows you to run arbitrary\
    \ SQL queries against Oracle Fusion database directly from DuckDB, inferring column\
    \ names at runtime and returning all data as VARCHAR columns\u2014as native DuckDB\
    \ tables and as resultsets that can be directly consumed by downstream applications."
