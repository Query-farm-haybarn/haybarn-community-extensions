extension:
  name: h3
  description: Hierarchical hexagonal indexing for geospatial data
  version: 1.5.6
  language: C++
  build: cmake
  license: Apache-2.0
  # Haybarn: wasm_threads excluded 2026-10-14. That leg has failed on Haybarn
  # since v1.5.5 (emscripten 5 and 6), and one failing leg skips the whole
  # deploy, so no platform was being published. Drop the exclusion once the
  # wasm_threads link is fixed.
  excluded_platforms: wasm_threads
  requires_toolchains: python3
  maintainers:
  - isaacbrodsky
repo:
  github: isaacbrodsky/h3-duckdb
  ref: ae1c424773752f775e0549971818454f61255291
docs:
  hello_world: 'SELECT h3_latlng_to_cell(37.7887987, -122.3931578, 9);

    '
  extended_description: 'The H3 extension adds support for the [H3 hierarchical hexagonal
    grid system](https://h3geo.org/).

    '
