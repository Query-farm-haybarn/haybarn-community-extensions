extension:
  name: pbix
  description: Extension that allows parsing the data model embedded in PowerBI (pbix)
    files
  version: 0.5.3
  language: C++
  build: cmake
  excluded_platforms: linux_amd64_musl
  license: MIT
  maintainers:
  - Hugoberry
repo:
  github: Hugoberry/duckdb-pbix-extension
  ref: 3d863fc006d22e9a6dcfae59fbf4a46edca8fd13
docs:
  hello_world: "-- Get metadata tables from a PowerBI file\nSELECT Name FROM pbix_meta('Adventure\
    \ Works DW 2020.pbix','table') WHERE isHidden=0;\n\n-- Read data from a specific\
    \ table in the PowerBI file\nSELECT \n  ResellerKey, \n  \"Business Type\", \n\
    \  Reseller, \n  \"Reseller ID\" \nFROM pbix_read('Adventure Works DW 2020.pbix','Reseller')\
    \ \nLIMIT 10;\n\n-- Read metadata about models in a folder of pbix files\nSELECT\n\
    \  file,\n  list_transform(pbix2vpax(file).Tables, t->t.TableName) as tab\nFROM\
    \ glob('data/**/*.pbix');\n"
  extended_description: "The PBIX extension allows you to parse the data model embedded\
    \ in PowerBI (pbix) files directly in DuckDB.\n\nIt provides three functions:\
    \ - `pbix_meta()`: Returns metadata tables for a data model (consult [MS-SSAS-T](https://learn.microsoft.com/en-us/openspecs/sql_server_protocols/ms-ssas-t/f85cd3b9-690c-4bc7-a1f0-a854d7daecd8)\
    \ for metadata structures) - `pbix_read()`: Returns the contents of a specific\
    \ table from a pbix file - `pbix2vpax()`: Generate comprehensive VPAX serialisation\
    \ of the entire data model (scalar function)\n\nFor a pure Python implementation\
    \ of the pbix parser, check out the [PBIXray](https://github.com/Hugoberry/pbixray)\
    \ library.\n\n*Note:* Current limitations include the inability of the WASM version\
    \ to parse `https` hosted files, and that pbix_read() will decompress the entire\
    \ model in memory. \n"
