extension:
  name: ducklink
  description: Run WebAssembly component extensions inside DuckDB
  version: 0.1.0
  language: Rust
  build: cargo
  license: MIT
  maintainers:
  - tegmentum
  requires_toolchains: rust;python3
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_rtools;windows_amd64_mingw;linux_amd64_musl
repo:
  github: tegmentum/ducklink-extension
  ref: v0.1.0
docs:
  hello_world: '-- The extension ships one built-in, so loading works with no component:

    LOAD ducklink;

    SELECT ducklink_version();   -- e.g. ''ducklink 0.1.0''


    -- To expose a component''s functions, point ducklink at one or more

    -- `duckdb:extension` WebAssembly components via the DUCKLINK_COMPONENTS

    -- environment variable BEFORE starting DuckDB, e.g.

    --   DUCKLINK_COMPONENTS=isin=/path/to/isin.wasm

    -- then every function the component registers becomes callable:

    --   LOAD ducklink;

    --   SELECT isin_is_valid(''US0378331005'');

    '
  extended_description: "ducklink lets a single, portable WebAssembly component \u2014\
    \ built once against\nthe `duckdb:extension` WIT world \u2014 load into DuckDB\
    \ on any supported platform\nwithout per-platform native builds. The extension\
    \ embeds wasmtime, loads each\ncomponent named in the `DUCKLINK_COMPONENTS` environment\
    \ variable (a\n`:`-separated list of `name=path` entries, read when `LOAD ducklink`\
    \ runs),\nruns its `load()` to capture the scalar/table/aggregate functions it\n\
    registers, and bridges them into DuckDB's function catalog. A built-in\n`ducklink_version()`\
    \ scalar is always available so the extension is usable\nand testable before any\
    \ component is configured. The same components run\nunchanged under the standalone\
    \ `ducklink` host (DuckDB-compiled-to-wasm), so\none artifact targets both directions.\n"
