extension:
  # Haybarn: disabled because the extension does not yet build
  # against DuckDB 1.5.2 — upstream community-extensions also has
  # no v1.5.2 binary. Re-enable when upstream lands a v1.5.2-
  # compatible release (sync_from_upstream will pick up the bump).
  # Tracker: https://github.com/dentiny/duckdb-distributed-execution/issues/116
  excluded_platforms: linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
  name: duckherder
  description: Run duckdb query on remote server
  version: 0.0.7
  language: C++
  build: cmake
  license: MIT
  requires_toolchains: parser_tools
  maintainers:
  - dentiny
repo:
  github: dentiny/duckdb-distributed-execution
  ref: 3191fc2f7ecd6d1b8a3f327a4a35af00fa706ca0
docs:
  hello_world: 'SELECT duckherder_start_local_server(8815); ATTACH DATABASE ''dh''
    (TYPE duckherder, server_host ''localhost'', server_port 8815);

    '
  extended_description: 'This extension is built on storage extension, to execute
    query on remote server and transfer data back with arrow flight.

    For remote and distributed execution, there''re two key components: driver and
    worker(s).

    As their names suggest, driver node is the control plane, and worker nodes do
    the real execution tasks.

    Users are allowed to implement their own driver and worker(s), and register to
    the duckdb client-side, as long they speaks duckherder dialect (i.e., grpc stubs
    and arrow flight).

    From users'' perspective, all DML and DDL SQL statements should be used exactly
    the same as local duckdb.

    '
