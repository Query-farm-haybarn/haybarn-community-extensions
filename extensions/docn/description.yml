extension:
  name: docn
  description: DigitalOcean AI-Native Cloud services as SQL functions
  version: 0.1.0
  language: C/C++
  build: CMake
  license: MIT
  requires_toolchains: vcpkg;python3
  vcpkg_commit: 84bab45d415d22042bd0b9081aea57f362da3f35
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw
  opt_in_platforms: osx_amd64;linux_amd64_musl;linux_arm64_musl;windows_arm64
  maintainers:
  - MehulBatra
repo:
  github: digitalocean-labs/duckdb-do
  ref: 02039868b47efa85a9fd0f14b38aac8f86cc92b3
docs:
  hello_world: "-- Set your key in the shell before starting DuckDB:\n--   export\
    \ DO_MODEL_ACCESS_KEY='...'\n-- or inside DuckDB: SET do_model_access_key = '...';\n\
    LOAD docn;\n\n-- List the available models (no key needed)\nSELECT name, type\
    \ FROM do_models() LIMIT 5;\n\n-- A few rows to work with\nCREATE TABLE reviews\
    \ AS\n    FROM (VALUES\n        ('The app crashes every time I upload a photo.'),\n\
    \        ('Fast delivery and great support, thank you!'),\n        ('I was charged\
    \ twice this month.')\n    ) t(review);\n\n-- Yes/no question per row: 0.97 means\
    \ very likely yes\nSELECT review, (do_decide(review, 'Is the customer happy?')\
    \ ->> 'noul')::DOUBLE AS happy\nFROM reviews;\n\n-- Pick one label per row: bug,\
    \ praise, billing\nSELECT review, do_decide(review, 'What is this about?', 'choice',\
    \ ['bug', 'billing', 'praise']) ->> 'choice' AS topic\nFROM reviews;\n\n-- Free\
    \ text answer per row\nSELECT review, do_prompt('Reply to this review in one sentence:\
    \ ' || review) AS reply\nFROM reviews;\n\n-- Similarity search with embeddings\n\
    SELECT review\nFROM reviews\nORDER BY list_cosine_similarity(do_embed(review),\
    \ do_embed('billing issue')) DESC\nLIMIT 1;\n"
  extended_description: 'The docn extension brings the DigitalOcean AI-Native Cloud
    to DuckDB. It exposes

    DigitalOcean services as SQL functions, starting with Serverless Inference:

    do_models lists the available models, do_decide answers closed questions

    (yes/no, choice, score) about text, do_prompt sends prompts to chat models and

    do_embed turns text into embedding vectors.

    See https://github.com/digitalocean-labs/duckdb-do for documentation.

    '
