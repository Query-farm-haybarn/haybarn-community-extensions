  - queryproc
  - iZarrios
repo:
  github: dais-polymtl/flock
  ref: adf457edbf74d95cc70fa35d778479d186a7360c
docs:
  hello_world: "-- After loading, any function call will throw an error if the provider's\
    \ secret doesn't exist\n\n-- Create your provider secret by following the [documentation](https://dais-polymtl.github.io/flock/docs/what-is-flock/).\
    \ For example, you can create a default OpenAI API key as follows:\nD CREATE SECRET\
    \ (TYPE OPENAI, API_KEY 'your-api-key');\n\n-- Call an OpenAI model with a predefined\
    \ prompt ('Tell me hello world') and default model ('gpt-4o-mini')\nD SELECT llm_complete({'model_name':\
    \ 'default'}, {'prompt_name': 'hello-world'});\n\u250C\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\
    \n\u2502 llm_complete(hello_world, default_model) \u2502\n\u2502             \
    \    varchar                  \u2502\n\u251C\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502   \
    \             Hello world               \u2502\n\u2514\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\
    \n\n-- Check the prompts and supported models\nD GET PROMPTS;\nD GET MODELS;\n\
    \n-- Create a new prompt for summarizing text\nD CREATE PROMPT('summarize', 'summarize\
    \ the text into 1 word: {{text}}');\n\n-- Create a variable name for the model\
    \ to do the summarizing\nD CREATE MODEL('summarizer-model', 'gpt-4o', 'openai');\n\
    \n-- Summarize text and pass it as parameter\nD SELECT llm_complete({'model_name':\
    \ 'summarizer-model'}, {'prompt_name': 'summarize','context_columns': [{'data':\
    \ 'We support more functions and approaches to combine relational analytics and\
    \ semantic analysis. Check our repo for documentation and examples.'}}]);\n"
  extended_description: "**Flock** is an experimental DuckDB extension that enables\
    \ seamless integration of large language models (LLMs) and retrieval-augmented\
    \ generation (RAG) directly within SQL.\n\nIt introduces `MODEL` and `PROMPT`\
    \ objects as first-class SQL entities, making it easy to define, manage, and reuse\
    \ LLM interactions. Core functions like `llm_complete`, `llm_filter`, and `llm_rerank`\
    \ allow you to perform generation, semantic filtering, and ranking\u2014all from\
    \ SQL.\n\n\U0001F4C4 For more details and examples, see the [Flock documentation](https://dais-polymtl.github.io/flock/docs/what-is-flock).\n\
    \n> *Note:* Flock is part of ongoing research by the [Data & AI Systems (DAIS)\
    \ Laboratory @ Polytechnique Montr\xE9al](https://github.com/dais-polymtl). It\
    \ is under active development, and some features may evolve. Feedback and contributions\
    \ are welcome!\n"
