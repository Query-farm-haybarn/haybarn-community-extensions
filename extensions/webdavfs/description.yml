extension:
  name: webdavfs
  description: Allows reading and writing files over WebDAV protocol
  version: '2026091401'
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
  requires_toolchains: vcpkg
  maintainers:
  - onnimonni
  vcpkg_commit: dd3097e305afa53f7b4312371f62058d2e665320
repo:
  github: midwork-finds-jobs/duckdb-webdavfs
  ref: 0259545780249ba6c9656b1cfca9a57168cfb63d
docs:
  hello_world: "-- Load the extension\nINSTALL webdavfs FROM community;\nLOAD webdavfs;\n\
    \n-- Authenticate with any WebDAV server eg nextcloud or owncloud\nCREATE SECRET\
    \ my_storagebox (\n  TYPE WEBDAV,\n  USERNAME 'u123456',\n  PASSWORD 'password',\n\
    \  SCOPE 'webdav://webdav-server.example.com/'\n);\n\n-- or with Hetzner specific\
    \ Storage Box\nCREATE SECRET my_storagebox (\n  TYPE WEBDAV,\n  USERNAME 'u123456',\n\
    \  PASSWORD 'password',\n  SCOPE 'storagebox://u123456'\n);\n\n-- Convert local\
    \ csv into parquet and upload it using WebDAV\nCOPY (\n    FROM 'local.csv'\n\
    ) TO 'storagebox://u123456/remote.parquet';\n\n-- Read The uploaded parquet file\
    \ using WebDAV\nSELECT * FROM 'storagebox://u123456/remote.parquet';\n"
  extended_description: 'DuckDB WebDAVfs extension enables seamless integration with
    WebDAV servers, allowing users to read from and write to remote file systems directly
    within DuckDB. This extension supports authentication mechanisms compatible with
    various WebDAV services, including Hetzner Storage Boxes.


    WebDAV is nice because it builds on top of HTTP/HTTPS protocols. This enables
    DuckDB to leverage http 1.1 range feature to only download parts of files when
    needed, making it efficient for working with large datasets stored remotely.


    Hetzner Storage Boxes are a popular choice for WebDAV storage being one of the
    cheapest storage options available.


    See: https://github.com/midwork-finds-jobs/duckdb-webdavfs/blob/main/README.md
    for more examples and details.

    '
