extension:
  # Haybarn: disabled because the extension does not yet build
  # against DuckDB 1.5.2 — upstream community-extensions also has
  # no v1.5.2 binary. Re-enable when upstream lands a v1.5.2-
  # compatible release (sync_from_upstream will pick up the bump).
  # Tracker: https://github.com/fhk/HiGHS-duckdb/issues/3
  excluded_platforms: linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
  name: highs
  description: HiGHS - High Performance Optimization Software
  version: 1.7.2
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - fhk
repo:
  github: fhk/highs-duckdb
  ref: 0c343b5d3b54fb63231b445617eaff847dbdc719
docs:
  hello_world: 'SELECT highs_version(''Test'');

    '
  extended_description: 'HiGHS is software for the definition, modification and solution
    of large scale sparse linear optimization models.


    HiGHS is freely available from [GitHub](https://github.com/ERGO-Code/HiGHS) under
    the MIT licence and has no third-party dependencies.

    '
