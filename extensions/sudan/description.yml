extension:
  name: sudan
  description: Unified SQL access to Sudan's humanitarian, development, and geospatial
    data from 5 international APIs (World Bank, WHO, FAO, UNHCR, ILO)
  version: 0.1.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - Osman-Geomatics93
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw
repo:
  github: Osman-Geomatics93/duckdb-sudan-
  ref: 724816644bbda6e9ede052b9962e9ce9fef329e4
docs:
  hello_world: '-- List all data providers

    SELECT * FROM SUDAN_Providers();


    -- Sudan population from World Bank

    SELECT year, value FROM SUDAN_WorldBank(''SP.POP.TOTL'')

    WHERE year >= 2020 ORDER BY year;


    -- Sudan''s 18 states with Arabic names

    SELECT state_name, state_name_ar, iso_code FROM SUDAN_States();

    '
  extended_description: "The Sudan extension brings unified SQL access to Sudan's\
    \ publicly available data across\n5 international APIs \u2014 World Bank, WHO,\
    \ FAO, UNHCR, and ILO.\n\nSudan is experiencing one of the world's largest humanitarian\
    \ crises, yet its data is\nscattered across dozens of international APIs with\
    \ incompatible formats. This extension\nenables analysts, researchers, and humanitarian\
    \ workers to query demographics, economics,\nhealth, agriculture, displacement,\
    \ and geospatial boundaries using standard SQL.\n\n**Data providers:**\n- **World\
    \ Bank** \u2014 Development indicators, GDP, population, education\n- **WHO**\
    \ \u2014 Health indicators, disease burden, mortality rates\n- **FAO** \u2014\
    \ Agricultural production, food security, land use\n- **UNHCR** \u2014 Refugees,\
    \ IDPs, asylum seekers, displacement data\n- **ILO** \u2014 Employment, labor\
    \ force, unemployment statistics\n\n**Key features:**\n- 12 SQL functions covering\
    \ data retrieval, indicator search, and geospatial queries\n- Bilingual support\
    \ (Arabic/English) for state names and provider metadata\n- Regional comparison\
    \ with 8 neighboring countries (Egypt, Ethiopia, Chad, South Sudan, Eritrea, Libya,\
    \ CAF)\n- Embedded GeoJSON boundaries for Sudan's 18 states (works offline)\n\
    - In-memory response caching for efficient repeated queries\n"
