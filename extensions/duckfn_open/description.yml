extension:
  name: duckfn_open
  description: "Wrap Rust's open and sanitize-filename crates for SQL \u2014 open\
    \ a path, a URL or the output of a query with your desktop's own program, and\
    \ turn a string into a usable file name"
  version: 0.1.0
  language: Rust
  build: cargo
  license: MIT
  requires_toolchains: rust;python3
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads
  maintainers:
  - shijianjs
repo:
  github: shijianjs/duckfn-open
  ref: 6995c11bb78279aab4caf5b11f3d0df3011fb3a7
  ref_next: 6995c11bb78279aab4caf5b11f3d0df3011fb3a7
docs:
  hello_world: '-- What would open this on the machine running the query, without
    opening anything

    SELECT op_open_commands(''report.html'');


    -- Hand an existing path to the desktop''s default program

    SELECT op_open_path(''./report.html'');


    -- Most query output is content, not a path: write it out and get the path back

    SELECT op_write_file(''{"a":1}'', ''json'');

    '
  extended_description: "`duckfn_open` wraps two mature Rust crates for SQL: [`open`](https://crates.io/crates/open),\
    \ which hands a\npath or a URL to whatever the desktop is configured to open it\
    \ with, and\n[`sanitize-filename`](https://crates.io/crates/sanitize-filename),\
    \ whose file-name rules it puts on SQL.\nNine scalar function names, in three\
    \ groups:\n\n- **Paths and URLs** \u2014 `op_open_path(path[, app])` and `op_open_path_detached(path[,\
    \ app])` hand an existing\n  file or link to the desktop, waiting for it or not;\
    \ `op_open_commands(path)` lists the commands a launch\n  would try, running none\
    \ of them.\n- **Content** \u2014 `op_write_file(content|blob, ext[, opts])` writes\
    \ text or bytes to a file and returns the\n  path, starting nothing; `op_open_content(\u2026\
    )` writes it and opens it in the same call; `op_open_html(content)`\n  is the\
    \ zero-configuration version of that; `op_print(text[, tail])` writes to stdout,\
    \ past the result set's\n  column formatting, and hands the text back. The optional\
    \ third argument is the registered\n  `op_write_file_options` STRUCT (`dir`, `name`,\
    \ `part`).\n- **File names** \u2014 `op_sanitize_filename(value[, replacement[,\
    \ truncate, windows]])` rewrites a value into a\n  usable name, and `op_sanitize_filename_check(\u2026\
    )` answers whether it already is one. This pair starts no\n  process and touches\
    \ no file, so a name taken from the data can be checked before anything is built\
    \ on it.\n\nIt is aimed at interactive work: a person is at the machine, running\
    \ DuckDB, and wants the result in front\nof them. A launcher is desktop software,\
    \ so DuckDB embedded in an application is outside what this is for \u2014\non\
    \ a machine with no desktop only the half that starts no process is of any use.\
    \ The extension starts a\nprocess and writes the file you ask for (into the directory\
    \ you name, or the system temp directory); it\nreads no configuration, opens no\
    \ network connection of its own, and does not inspect the content it passes\n\
    along. Requires **DuckDB 1.3 or newer**.\n\nDocumentation: [user guide](https://shijianjs.github.io/duckfn-open/docs/intro)\
    \ \xB7\n[function reference](https://shijianjs.github.io/duckfn-open/docs/category/functions)\
    \ \xB7\n[source and development notes](https://github.com/shijianjs/duckfn-open).\n"
