extension:
  name: tantivy
  description: "BM25 full-text search for DuckDB \u2014 tokenization and Snowball\
    \ stemming via tantivy, through DuckDB's C Extension API (quack-rs), no Arrow\
    \ IPC"
  version: 0.2.0
  language: Rust
  build: cargo
  license: MIT
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_rtools;windows_amd64_mingw;linux_amd64_musl
  requires_toolchains: rust;python3
  maintainers:
  - alitrack
repo:
  github: alitrack/duckdb-tantivy
  ref: a6b63f04351b8bd5f2ee979e0dc0a654d9620bdb
  ref_next: a6b63f04351b8bd5f2ee979e0dc0a654d9620bdb
docs:
  hello_world: 'INSTALL tantivy FROM community;

    LOAD tantivy;


    CREATE TABLE docs(doc_id BIGINT, body VARCHAR);

    INSERT INTO docs VALUES (0, ''the cat sat''), (1, ''a cat here''), (2, ''the dog
    barked'');


    SELECT * FROM bm25_search(''docs'', ''cat'');

    -- doc_id | score

    --        1 | 0.92...

    --        0 | 0.92...


    SELECT * FROM bm25_search(''docs'', ''cat'', top_k := 1);

    '
  extended_description: "## tantivy \u2014 BM25 Full-Text Search for DuckDB\n\nA native\
    \ Rust DuckDB loadable extension adding **BM25 full-text search**\n(via [tantivy](https://github.com/quickwit-oss/tantivy),\
    \ the Rust\nsearch engine behind Quickwit) plus **tokenization** and\n**Snowball\
    \ stemming** for 18 languages \u2014 written against DuckDB's\nC Extension API\
    \ (ABI v1.2.0) through\n[quack-rs](https://github.com/tomtom215/quack-rs). Table\
    \ functions\nbind to real tables and stream real columns: no Arrow IPC, no JSON\n\
    shims, no external search engine.\n\n### Functions\n\n| Function | Description\
    \ |\n|---|---|\n| `bm25_search(table, query, [id_column := ''], [text_column :=\
    \ 'body'], [language := 'english'], [top_k := 100])` | BM25 search over a table\
    \ \u2192 `doc_id BIGINT, score DOUBLE` |\n| `supported_languages()` | The 18 Snowball\
    \ languages tantivy can stem |\n| `tokenize(text)` / `tokenize(text, language)`\
    \ | Tokenize (+ stem if language given) \u2192 `VARCHAR[]` |\n| `stem(word, language)`\
    \ | Snowball-stem a single word |\n| `bm25_score(doc, query)` / `bm25_score(doc,\
    \ query, language)` | BM25 score of one doc against a query |\n| `tantivy_version()`\
    \ | Version string of the embedded tantivy |\n\nUnicode text is NFC-normalized\
    \ on both the indexed documents and the\nquery, so canonically-equivalent spellings\
    \ (precomposed vs decomposed)\nmatch.\n\n### Hard limits (by design \u2014 clean\
    \ SQL errors, never crashes or silent data loss)\n\n| Limit | Value |\n|---|---|\n\
    | `top_k` range | `[1, 100000]` |\n| Rows indexed per `bm25_search` call | 1,000,000\
    \ (plus a proportional text-bytes cap) \u2014 add a `WHERE` clause for larger\
    \ tables |\n| Per-text length | 16 MiB |\n\nEach call builds an in-RAM index;\
    \ the extension is a high-precision\nfull-text search layer for medium-sized tables,\
    \ not a persistent\nsearch-engine replacement.\n\n**Known limitation:** temporary\
    \ tables and uncommitted transactions are\nnot visible to `bm25_search` (the C-API\
    \ callbacks receive no caller\nconnection, so the extension queries through a\
    \ connection it opens\nitself). Permanent and attached tables work fine.\n\nWindows\
    \ and musl builds are excluded pending CI coverage, matching the\nother quack-rs\
    \ based community extensions.\n\n\u2192  [GitHub](https://github.com/alitrack/duckdb-tantivy)\n"
