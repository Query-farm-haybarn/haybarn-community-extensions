extension:
  name: tantivy
  description: "BM25 full-text search for DuckDB \u2014 tokenization, Snowball stemming\
    \ and Chinese (jieba) segmentation via tantivy, persistent named indexes (v0.3.0),\
    \ and dryrun-style pre-execution cost estimates (tantivy_stats, v0.4.0), through\
    \ DuckDB's C Extension API (quack-rs), no Arrow IPC"
  version: 0.4.0
  language: Rust
  build: cargo
  license: MIT
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_rtools;windows_amd64_mingw;linux_amd64_musl
  requires_toolchains: rust;python3
  maintainers:
  - alitrack
repo:
  github: alitrack/duckdb-tantivy
  ref: 44d372ac762e17f8e7a9edaaa284a6f651771ef2
  ref_next: 44d372ac762e17f8e7a9edaaa284a6f651771ef2
docs:
  hello_world: 'INSTALL tantivy FROM community;

    LOAD tantivy;


    CREATE TABLE docs(doc_id BIGINT, body VARCHAR);

    INSERT INTO docs VALUES (0, ''the cat sat''), (1, ''a cat here''), (2, ''the dog
    barked'');


    SELECT * FROM bm25_search(''docs'', ''cat'');

    -- doc_id | score

    --        1 | 0.92...

    --        0 | 0.92...


    SELECT * FROM bm25_search(''docs'', ''cat'', top_k := 1);

    '
  extended_description: "## tantivy \u2014 BM25 Full-Text Search for DuckDB\n\nA native\
    \ Rust DuckDB loadable extension adding **BM25 full-text search**\n(via [tantivy](https://github.com/quickwit-oss/tantivy),\
    \ the Rust\nsearch engine behind Quickwit) plus **tokenization** and\n**Snowball\
    \ stemming** for 18 languages and **Chinese (jieba)\nword segmentation** \u2014\
    \ written against DuckDB's C Extension API\nthrough [quack-rs](https://github.com/tomtom215/quack-rs).\n\
    Table functions bind to real tables and stream real columns: no Arrow\nIPC, no\
    \ JSON shims, no external search engine.\n\nv0.3.0 added **persistent named indexes**:\
    \ build once from a table\n(`tantivy_create_index`), store on disk (mmap-backed),\
    \ search any number\nof times (`tantivy_search_index`) with results bit-identical\
    \ to\n`bm25_search`, then `tantivy_save_index` / `tantivy_load_index` to move\n\
    indexes across processes and machines.\n\nv0.4.0 adds **`tantivy_stats(name, query)`**,\
    \ a duckdb-dryrun-style\n**pre-execution cost estimate**: exact postings+positions\
    \ byte ranges\nfrom TermInfo, doc-frequency bounds, confidence + notes; absent\
    \ terms\nreport 0 bytes (AND short-circuits). Never decodes postings, never\n\
    scores (~2ms).\n\n### Functions\n\n| Function | Description |\n|---|---|\n| `bm25_search(table,\
    \ query, [id_column := ''], [text_column := 'body'], [language := 'english'],\
    \ [top_k := 100])` | BM25 search over a table \u2192 `doc_id BIGINT, score DOUBLE`\
    \ |\n| `tantivy_create_index(name, table, [id_column := ''], [text_column := 'body'],\
    \ [language := 'english'], [path := ''])` | Build a persistent on-disk index `name`\
    \ from a table and register it (v0.3.0) |\n| `tantivy_search_index(name, query,\
    \ [top_k := 10])` | BM25 search against a registered persistent index, bit-identical\
    \ to `bm25_search` (v0.3.0) |\n| `tantivy_stats(name, query)` | Pre-execution\
    \ cost estimate for a query against a registered index (v0.4.0) |\n| `tantivy_save_index(name,\
    \ [path := ''])` | Copy a registered index to `path` (v0.3.0) |\n| `tantivy_load_index(name,\
    \ path := '...')` | Open a saved index from any process, read-only (v0.3.0) |\n\
    | `tantivy_list()` | The registered persistent indexes (v0.3.0) |\n| `tantivy_terms(table,\
    \ [text_column := 'body'])` | Raw-term dictionary of the table \u2192 `term VARCHAR,\
    \ df BIGINT` |\n| `supported_languages()` | The 18 Snowball languages plus `chinese\
    \ (jieba)` |\n| `tokenize(text)` / `tokenize(text, language)` | Tokenize (+ stem\
    \ if language given) \u2192 `VARCHAR[]`; `language := 'chinese'` uses jieba word\
    \ segmentation |\n| `stem(word, language)` | Snowball-stem a single word |\n|\
    \ `bm25_score(doc, query)` / `bm25_score(doc, query, language)` | BM25 score of\
    \ one doc against a query |\n| `tantivy_version()` | Version string of the embedded\
    \ tantivy |\n\nUnicode text is NFC-normalized on both the indexed documents and\
    \ the\nquery, so canonically-equivalent spellings (precomposed vs decomposed)\n\
    match. Ranking applies a deterministic tie-break over the full match\nset at the\
    \ cutoff.\n\n### Hard limits (by design \u2014 clean SQL errors, never crashes\
    \ or silent data loss)\n\n| Limit | Value |\n|---|---|\n| `top_k` range | `[1,\
    \ 100000]` |\n| Rows indexed per `bm25_search` call | 1,000,000 (plus a proportional\
    \ text-bytes cap) \u2014 add a `WHERE` clause for larger tables |\n| Per-text\
    \ length | 16 MiB |\n\n`bm25_search` builds an in-RAM index per call (high-precision\n\
    full-text search layer for medium-sized tables); for repeated queries\nover the\
    \ same corpus, use the persistent named indexes instead.\n\n**Known limitation:**\
    \ temporary tables and uncommitted transactions are\nnot visible to `bm25_search`\
    \ (the C-API callbacks receive no caller\nconnection, so the extension queries\
    \ through a connection it opens\nitself). Permanent and attached tables work fine.\n\
    \nWindows (rtools/mingw) and musl builds are excluded pending CI\ncoverage, matching\
    \ the other quack-rs based community extensions.\nThe wasm platforms (`wasm_mvp`\
    \ / `wasm_eh` / `wasm_threads`) are\nexcluded for now: the C-API Rust extension\
    \ wasm build path is not yet\nwired (it needs an `examples/` target plus an Emscripten\
    \ link for the\nC deps); wasm support is tracked as follow-up work.\n\n\u2192\
    \  [GitHub](https://github.com/alitrack/duckdb-tantivy)\n"
