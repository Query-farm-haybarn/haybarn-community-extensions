extension:
  name: st_read_multi
  description: Read multiple geospatial files
  version: 0.0.4
  language: Rust
  build: cargo
  license: MIT
  excluded_platforms: linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
  requires_toolchains: rust;python3
  maintainers:
  - yutannihilation
repo:
  github: yutannihilation/duckdb-ext-st-read-multi
  ref: eb01047043beb286f7649f3c670190d680feb0b1
docs:
  hello_world: 'LOAD spatial;


    SELECT * REPLACE (ST_GeomFromWkb(geometry) as geometry) FROM ST_Read_Multi(''path/to/*.geojson'');

    '
  extended_description: 'Read multiple geospatial files. Currently, only GeoJSON,
    GeoPackage, and Shapefile are supported.

    '
