extension:
  name: harbor
  description: "Client/server DuckDB over one HTTP port \u2014 web UI, JSON /sql,\
    \ and native ATTACH (TYPE harbor)"
  version: 0.4.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - shreeve
repo:
  github: shreeve/duckdb-harbor
  ref: 70a86f05775908e78b4479944c5beb40aac3e685
docs:
  hello_world: "-- Load the extension and start the server in the background.\n--\
    \ harbor_serve returns once the server is accepting connections;\n-- harbor_wait\
    \ keeps the process alive in daemon mode (containers,\n-- systemd).\nLOAD harbor;\n\
    CALL harbor_serve(bind := '127.0.0.1', port := 9494);\n--                    \
    \                              \u250C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2510\n--                                                  \u2502           \
    \  token               \u2502\n--                                            \
    \      \u251C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n--             \
    \                                     \u2502 a1b2c3d4e5f6...                 \u2502\
    \n--                                                  \u2514\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2518\n\n-- Hit it from another shell:\n--   curl http://127.0.0.1:9494/health\n\
    --   curl -H \"Authorization: Bearer <token>\" \\\n--        -X POST http://127.0.0.1:9494/sql\
    \ \\\n--        -H 'Content-Type: application/json' \\\n--        -d '{\"sql\"\
    :\"SELECT 42 AS the_answer\"}'\n--\n--   {\"ok\":true,\"kind\":\"select\",\"columns\"\
    :[{\"name\":\"the_answer\",\"duckdbType\":\"INTEGER\",\"lossless\":true}],\n--\
    \    \"data\":[[42]],\"rowCount\":1,\"timeMs\":0}\n\n-- Browser users open http://127.0.0.1:9494/\
    \ \u2014 the harbor login\n-- page asks for the token once, sets a HttpOnly SameSite=Strict\n\
    -- cookie, then proxies the official DuckDB UI through.\n\n-- A second DuckDB\
    \ attaches the server's catalog natively \u2014 catalog\n-- discovery and table\
    \ scans both ride /sql, so multi-table JOINs,\n-- projection pushdown, and CLI\
    \ autocomplete all work:\n--   LOAD harbor;\n--   ATTACH 'harbor:127.0.0.1:9494'\
    \ AS h (TYPE harbor, TOKEN '<token>');\n--   SELECT * FROM h.main.orders o JOIN\
    \ h.main.customers c USING (customer_id);\n\n-- Stop the server:\nCALL harbor_stop();\n"
  extended_description: "`harbor` is a single DuckDB extension. When loaded, your\
    \ DuckDB\ninstance turns into a client/server database on one HTTP port:\n\n|\
    \ Surface       | Endpoints                              | What it gives you \
    \                                                        |\n|---------------|----------------------------------------|---------------------------------------------------------------------------|\n\
    | JSON SQL      | `POST /sql`, `/sql/sessions/*`         | NDJSON streaming +\
    \ one-shot JSON, prepared params (incl. `LIST`/`STRUCT`/`MAP`), principal-owned\
    \ sessions, `harbor_query_timeout_s` enforcement |\n| Native attach | client-side\
    \ `ATTACH 'harbor:host' (TYPE harbor)` | Browse and query the server's catalog\
    \ from any DuckDB \u2014 multi-table JOINs, projection pushdown, and CLI autocomplete;\
    \ catalog + scans both ride `/sql` (read-only) |\n| DuckDB UI     | `GET /`, `/ddb/*`,\
    \ `/localEvents`      | Cookie-gated proxy to the official DuckDB UI; CSP+nonce\
    \ on the login page |\n| Admin         | `/health`, `/whoami`, `/tables`, `/schema/:db/:t`,\
    \ `/checkpoint`, `/sessions`, `/interrupt` | Centralized `__HARBOR_ADMIN__:resource:action`\
    \ default-deny + `harbor_allow_admin_without_authz` operator opt-in |\n| Auth\
    \          | `/auth/login`, `/auth/logout`          | Bearer / X-Harbor-Token\
    \ / HMAC-signed `harbor_session` cookie             |\n\nAll on the same port,\
    \ against the same in-process DuckDB, with the\nsame session pool and auth model.\n\
    \n**Use cases:**\n- Operate one DuckDB process and let users hit it via whatever\n\
    \  interface fits their tool: browser (UI), DuckDB CLI/clients\n  (`ATTACH ...\
    \ TYPE harbor`), backend code (`/sql`).\n- Bridge between SQL clients and apps\
    \ without standing up a separate\n  database server.\n- Container-native deployments\
    \ \u2014 `harbor_wait()` blocks until SIGTERM\n  so harbor runs cleanly under\
    \ systemd / Docker / Kubernetes.\n\n**Status:** v0.4 release, tested across the\
    \ DuckDB community-extension\nmatrix (linux_amd64/arm64, osx_amd64/arm64, windows_amd64/_mingw,\n\
    wasm_mvp/eh/threads).\n\nSource, design spec, contributor guide, full release\
    \ notes:\n[github.com/shreeve/duckdb-harbor](https://github.com/shreeve/duckdb-harbor).\n\
    \nVendors the official `duckdb-ui`; targets DuckDB v1.5.3.\n"
