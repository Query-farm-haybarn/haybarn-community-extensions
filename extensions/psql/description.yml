extension:
  name: psql
  description: Support for PSQL, a piped SQL dialect for DuckDB
  version: 1.0.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - ywelsch
repo:
  github: ywelsch/duckdb-psql
  ref: 4e310a6056dff4808de4be4bd0c0e571ed6d7a5a
docs:
  hello_world: "from 'https://raw.githubusercontent.com/ywelsch/duckdb-psql/main/example/invoices.csv'\
    \ |>\nwhere invoice_date >= date '1970-01-16' |>\nselect\n  *, \n  0.8 as transaction_fees,\n\
    \  total - transaction_fees as income |>\nwhere income > 1 |>\nselect\n  customer_id,\
    \ \n  avg(total), \n  sum(income) as sum_income, \n  count() as ct\n  group by\
    \ customer_id |>\norder by sum_income desc |>\nlimit 10 |>\nas invoices\n  join\
    \ 'https://raw.githubusercontent.com/ywelsch/duckdb-psql/main/example/customers.csv'\n\
    \    as customers\n  on invoices.customer_id = customers.customer_id |>\nselect\n\
    \  customer_id,\n  last_name || ', ' || first_name as name,\n  sum_income,\n \
    \ version() as db_version;\n"
  extended_description: 'PSQL extends DuckDB''s SQL with a pipe syntax to provide
    simple composable queries. It''s a lightweight variant of piped languages such
    as PRQL and Kusto, yet leveraging the full power of DuckDB''s SQL.

    '
