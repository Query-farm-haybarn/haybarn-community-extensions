extension:
  # Haybarn: disabled because the extension does not yet build
  # against DuckDB 1.5.2 — upstream community-extensions also has
  # no v1.5.2 binary. Re-enable when upstream lands a v1.5.2-
  # compatible release (sync_from_upstream will pick up the bump).
  # Tracker: https://github.com/midwork-finds-jobs/duckdb_http_request/issues/6
  excluded_platforms: linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
  name: http_request
  description: HTTP client extension for DuckDB with GET/POST/PUT/PATCH/DELETE and
    byte-range requests
  version: '2026020501'
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - onnimonni
repo:
  github: midwork-finds-jobs/duckdb_http_request
  ref: 1c0324d3749d7b2d82fbf35b289cd2ca4da62934
docs:
  hello_world: "-- Simple GET request\nSELECT http_get('https://example.com/');\n\n\
    -- Access response fields\nSELECT\n    r.status,\n    r.content_type,\n    r.content_length,\n\
    \    r.cookies[1].name as first_cookie\nFROM (SELECT http_get('https://example.com/')\
    \ as r);\n\n-- GET with custom headers\nSELECT http_get('https://httpbin.org/get',\
    \ headers := {'Accept': 'application/json'}).body;\n\n-- Byte-range request for\
    \ partial content\nSELECT http_get(\n    'https://example.com/largefile.gz',\n\
    \    {'Range': byte_range(0, 1024)}\n);\n"
  extended_description: 'HTTP client extension providing scalar and table functions
    for making HTTP requests.


    Features:

    - All HTTP methods: GET, HEAD, POST, PUT, PATCH, DELETE

    - Parallel execution: requests within a chunk run concurrently

    - Custom headers via STRUCT parameter

    - Query parameters via STRUCT

    - Byte-range requests with helper function

    - Auto-decompression of gzip/zstd responses

    - Form-encoded POST with http_post_form()

    - Multipart/form-data uploads with http_post_multipart()

    - Parsed Set-Cookie headers into structured cookies array

    - Convenience fields: content_type, content_length

    - Respects duckdb http and proxy settings

    - Configurable concurrency via http_max_concurrency setting (default: 32)

    - Global User-Agent override via http_user_agent setting

    - Request caching to prevent duplicate requests (http_request_cache setting)

    - Headers support both STRUCT and MAP syntax

    - Redirect control via http_follow_redirects setting (default: true)

    - HTTP_HEADERS type with case-insensitive [] access (headers[''Content-Type'']
    = headers[''content-type''])


    Uses DuckDB''s built-in httplib for HTTP connections.

    '
