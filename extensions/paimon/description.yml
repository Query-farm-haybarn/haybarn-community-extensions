extension:
  name: paimon
  description: Query Apache Paimon tables directly from DuckDB
  version: 0.1.0
  language: C++
  build: cmake
  license: Apache-2.0
  excluded_platforms: linux_amd64_gcc4;linux_amd64_musl;osx_amd64;osx_arm64;windows_amd64;windows_amd64_mingw;windows_amd64_rtools;windows_arm64;windows_arm64_mingw;wasm_mvp;wasm_eh;wasm_threads
  maintainers:
  - mrdrivingduck
repo:
  github: polardb/duckdb-paimon
  ref: 0764988fac3c37161ae465dd9232ff95213db329
docs:
  hello_world: "-- Query local Paimon tables\nSELECT * FROM paimon_scan('./data/testdb.db/testtbl');\n\
    \n-- Configure OSS credentials for remote tables\nCREATE SECRET my_oss (\n   \
    \ TYPE paimon,\n    key_id 'your-access-key-id',\n    secret 'your-access-key-secret',\n\
    \    endpoint 'oss-cn-hangzhou.aliyuncs.com'\n);\n\n-- Query Paimon tables on\
    \ OSS\nSELECT * FROM paimon_scan('oss://your-bucket/warehouse', 'your_db', 'your_table');\n\
    \n-- Attach as catalog\nATTACH 'oss://my-bucket/warehouse' AS paimon_lake (TYPE\
    \ paimon);\nSHOW ALL TABLES IN paimon_lake;\n"
  extended_description: "The Paimon extension enables DuckDB to read and query Apache\
    \ Paimon format data directly.\nApache Paimon is a lake format that enables building\
    \ a Realtime Lakehouse Architecture with\nFlink and Spark for both streaming and\
    \ batch operations.\n\nKey features:\n- Zero JVM dependency \u2014 Pure C++ implementation\n\
    - Apache Arrow data exchange for zero-copy transfers\n- Parallel scan architecture\
    \ utilizing multi-core CPUs\n- Secure credential management via DuckDB's Secret\
    \ Manager\n- Support for local and remote OSS storage\n- Projection pushdown optimization\n\
    \nBuilt on top of [paimon-cpp](https://github.com/alibaba/paimon-cpp), this extension\
    \ brings\nDuckDB's powerful local analytics to the Paimon data lake ecosystem.\n\
    \nFor more information, visit the [extension repository](https://github.com/polardb/duckdb-paimon).\n"
