extension:
  name: altertable
  description: Query Altertable's lakehouse directly from your local DuckDB.
  version: 0.5.0
  language: C++
  build: cmake
  excluded_platforms: linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
  license: MIT
  maintainers:
  - redox
  vcpkg_commit: 84bab45d415d22042bd0b9081aea57f362da3f35
  requires_toolchains: vcpkg;parser_tools
repo:
  github: altertable-ai/duckdb-altertable
  ref: 2d2be3fc58758f13899770bc37682fb9e333e888
docs:
  hello_world: "INSTALL altertable FROM community;\nLOAD altertable;\n\n-- Attach\
    \ an Altertable database\nCREATE SECRET my_altertable (\n    TYPE altertable,\n\
    \    USER 'my-user',\n    PASSWORD 'my-pass'\n);\nATTACH 'catalog=my-altertable-catalog'\
    \ AS db (TYPE ALTERTABLE, SECRET my_altertable);\n\n-- Query remote Altertable\
    \ tables with standard SQL\nSELECT * FROM db.main.events;\n\n-- Create and load\
    \ remote tables through the attached database\nCREATE TABLE db.main.example_events\
    \ (id INTEGER, name VARCHAR);\nINSERT INTO db.main.example_events VALUES (1, 'launch');\n\
    \nDETACH db;\n"
  extended_description: 'The Altertable extension connects DuckDB to Altertable databases
    over the

    high-performance Arrow Flight SQL protocol. It lets you attach remote

    Altertable catalogs and browse remote schemas and tables through DuckDB''s

    catalog.


    Features include:

    - `ATTACH` support for remote Altertable databases

    - direct reads from attached schemas and tables

    - attached writes with `CREATE TABLE`, `CREATE TABLE AS`, `INSERT`, `UPDATE` and
    `DELETE`

    - DuckDB secrets support for storing Altertable credentials

    '
