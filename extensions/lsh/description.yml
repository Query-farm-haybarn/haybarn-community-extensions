extension:
  name: lsh
  description: Extension for locality-sensitive hashing (LSH)
  version: 0.2.5
  language: Rust
  build: cargo
  license: MIT
  # Haybarn: disabled 2026-05-27 — pins an old DuckDB crate; the binary is
  # stamped v1.5.2 and won't load in the 1.5.3 engine. We already build the
  # latest upstream ref. Re-enable when upstream bumps the duckdb crate to
  # 1.5.3 (sync_from_upstream will pick up the bump).
  # Prior excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;linux_amd64_musl
  excluded_platforms: linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
  requires_toolchains: rust;python3
  maintainers:
  - yoonspark
  - ericmanning
repo:
  github: princeton-ddss/lsh
  ref: 66c2eb19ab6bc6f410a5fe07a5c3975d4aa158d9
docs:
  hello_world: "-- Create toy data\nCREATE TEMPORARY TABLE temp_names AS\nSELECT *\
    \ FROM (\n    VALUES\n        ('Alice Johnson'),\n        ('Robert Smith'),\n\
    \        (NULL),\n        ('Charlotte Brown'),\n) AS t(name);\n\n-- Apply MinHash\n\
    SELECT lsh_min(name, 2, 3, 2, 123) AS hash FROM temp_names;\n"
  extended_description: 'For more information regarding usage, see the [documentation](https://github.com/princeton-ddss/lsh).

    '
