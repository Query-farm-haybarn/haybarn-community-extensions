extension:
  name: duckpgq
  description: Extension that adds support for SQL/PGQ and graph algorithms
  version: 0.3.1
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - Dtenwolde
repo:
  github: cwida/duckpgq-extension
  ref: cbe4d9e58ebc3984d725a83c4dd46e6acd723cec
docs:
  hello_world: "CREATE TABLE Person AS SELECT * FROM 'https://gist.githubusercontent.com/Dtenwolde/2b02aebbed3c9638a06fda8ee0088a36/raw/8c4dc551f7344b12eaff2d1438c9da08649d00ec/person-sf0.003.csv';\n\
    CREATE TABLE Person_knows_person AS SELECT * FROM 'https://gist.githubusercontent.com/Dtenwolde/81c32c9002d4059c2c3073dbca155275/raw/8b440e810a48dcaa08c07086e493ec0e2ec6b3cb/person_knows_person-sf0.003.csv';\n\
    \nCREATE PROPERTY GRAPH snb\n  VERTEX TABLES (\n    Person\n  )\n  EDGE TABLES\
    \ (\n    Person_knows_person SOURCE KEY (Person1Id) REFERENCES Person (id)\n \
    \                       DESTINATION KEY (Person2Id) REFERENCES Person (id)\n \
    \   LABEL knows\n  );\n\nFROM GRAPH_TABLE (snb\n  MATCH (a:Person)-[k:knows]->(b:Person)\n\
    \  COLUMNS (a.id, b.id)\n)\nLIMIT 1;\n\nFROM GRAPH_TABLE (snb \n  MATCH p = ANY\
    \ SHORTEST (a:person)-[k:knows]->{1,3}(b:Person) \n  COLUMNS (a.id, b.id, path_length(p))\n\
    ) \nLIMIT 1;\n\nFROM local_clustering_coefficient(snb, person, knows);\n\nDROP\
    \ PROPERTY GRAPH snb; \n"
  extended_description: 'The DuckPGQ extension supports the SQL/PGQ syntax as part
    of the official SQL:2023 standard developed by ISO.


    It introduces visual graph pattern matching and a more concise syntax for path-finding.
    For more information, please see the [DuckPGQ documentation](https://duckpgq.org).


    *Disclaimer:* As this extension is part of an ongoing research project by the
    Database Architectures group at CWI, some features may still be under development.
    We appreciate your understanding and patience as we continue to improve it.

    '
