extension:
  name: gpudb
  description: GPU-accelerated analytical operators for DuckDB on NVIDIA CUDA and
    Apple Silicon Metal. First SQL execution engine that targets Apple Silicon GPUs.
  version: 0.1.3
  language: C++
  build: cmake
  license: Apache-2.0
  requires_toolchains: python3
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;windows_amd64;windows_amd64_rtools;windows_amd64_mingw
  maintainers:
  - singhpratech
repo:
  github: singhpratech/duckdbgpumetaldbram
  ref: 018d8a306ac2903f64c3391d42c59038b4fc2c28
docs:
  hello_world: "LOAD gpudb;\n-- GPU-accelerated SUM (CUDA on NVIDIA, Metal on Apple\
    \ Silicon, CPU fallback otherwise)\nSELECT gpu_sum(value::BIGINT) FROM range(1000000)\
    \ AS t(value);\n\n-- Verify against native sum\nSELECT\n  gpu_sum(value::BIGINT)\
    \ AS gpu,\n  sum(value::BIGINT) AS native\nFROM range(1000000) AS t(value);\n"
  extended_description: "`gpudb` adds GPU-accelerated aggregate operators that DuckDB\
    \ transparently\ndispatches to:\n\n  * `gpu_sum(BIGINT)` \u2014 GPU SUM\n  * `gpu_min(BIGINT)`\
    \ \u2014 GPU MIN\n  * `gpu_max(BIGINT)` \u2014 GPU MAX\n\nOn NVIDIA hardware (CUDA\
    \ backend, sm_70+) these run on the device with\nPCIe-amortized transfer. On Apple\
    \ Silicon (Metal backend, M1+) they use\nthe unified memory architecture so transfer\
    \ cost is zero.\n\n**v0.1.3** ships a hybrid Metal GROUP BY that auto-dispatches\
    \ between two\npaths per query: a 32K-partition slot-lock hash aggregate (sweet\
    \ spot at\n1024 \u2264 unique \u2264 16M) and an optimized multi-pass radix sort\
    \ (very low or\nvery high cardinality). This flipped TPC-H SF10 GROUP BY l_orderkey\
    \ from\nCPU 1.78\xD7 faster (v0.1.2) to Metal 1.30\xD7 faster.\n\nA hybrid CPU/GPU\
    \ planner picks the backend that wins for each cardinality\nregime \u2014 this\
    \ addresses the open problem from Rosenfeld/Bre\xDF CSUR 2022\nand Cao SIGMOD\
    \ 2024.\n\nApple Silicon (M4 Max) vs DuckDB CPU 16-thread (the actual CLI default,\n\
    not single-thread). All cells trace to BENCHMARK.md rows:\n  * TPC-H SF10 multi-agg\
    \ fusion l_quantity: Metal 25.5\xD7\n  * TPC-H SF10 multi-agg fusion l_extendedprice:\
    \ Metal 22.0\xD7\n  * TPC-H SF10 multi-agg fusion l_orderkey: Metal 9.7\xD7\n\
    \  * 1B int64 SUM HOT (resident column): Metal 2.6\xD7\n  * 500M \xD7 1M GROUP\
    \ BY synthetic: Metal 3.4\xD7\n  * 1B \xD7 1M GROUP BY synthetic: Metal 3.2\xD7\
    \n  * TPC-H SF10 GROUP BY l_extendedprice (1.35M unique): Metal 3.9\xD7\n  * TPC-H\
    \ SF10 GROUP BY l_orderkey (15M unique): Metal 1.30\xD7\n  * TPC-H SF1 GROUP BY\
    \ l_orderkey (1.5M unique): Metal 1.40\xD7\n  * Honest loss documented: TPC-H\
    \ SF10 GROUP BY l_quantity (50 unique):\n    CPU 14\xD7 faster (structural \u2014\
    \ L1-resident hash table on CPU)\n\nNVIDIA RTX 4090 (CUDA, vs single-thread CPU\
    \ baseline):\n  * Peak SUM ratio: ~22.8\xD7 (size-dependent, resident column)\n\
    \  * GROUP BY 50M rows \xD7 10M unique groups: 21.8\xD7\n  * TPC-H SF1 GROUP BY\
    \ (6M \xD7 1.5M unique): 3.56\xD7 (re-bench post-launch)\n\nThe extension auto-selects\
    \ the best backend at load time. If no GPU is\navailable it falls back cleanly\
    \ to the CPU implementation \u2014 same SQL\nsurface either way. Community-extension\
    \ binaries are built without the\nCUDA toolchain for now (CPU fallback on Linux;\
    \ full Metal on Apple\nSilicon); build from source for the CUDA backend. Honest\
    \ benchmark\nnotes (where GPU loses to CPU) are documented in the project's\n\
    BENCHMARK.md (append-only log).\n\nSource: https://github.com/singhpratech/duckdbgpumetaldbram\n"
  hardware_requirements: 'NVIDIA CUDA: any GPU with sm_70 or later. Driver 525+ recommended.

    Apple Metal: any Apple Silicon Mac (M1 or later). macOS 13+ for

    int64 atomics; macOS 15+ for MSL 3.2.

    Falls back to CPU otherwise.

    '
  known_limitations: "* Float64 SUM on Apple Silicon falls back to host loop (Apple\
    \ GPUs\n  do not implement IEEE-754 doubles in MSL); same correctness, no\n  GPU\
    \ speedup for that one type.\n* GROUP BY currently supports BIGINT keys + BIGINT\
    \ SUM; broader\n  type coverage planned in v0.2.\n* Window functions: SUM OVER\
    \ (), SUM OVER (ORDER BY), and\n  SUM OVER (PARTITION BY ... ORDER BY ...) all\
    \ supported and\n  verified against native sum() in the SQL test suite.\n* GROUP\
    \ BY at very low cardinality (\u2264 1K unique): CPU dominates\n  structurally\
    \ (L1-resident hash). Auto-dispatch routes these to the\n  radix-opt path; for\
    \ the bottom of the curve CPU still wins (e.g.,\n  TPC-H SF10 l_quantity at 50\
    \ unique groups: CPU 14\xD7 faster).\n"
