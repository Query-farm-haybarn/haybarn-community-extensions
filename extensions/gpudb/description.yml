extension:
  name: gpudb
  description: GPU-accelerated analytical operators for DuckDB on NVIDIA CUDA and
    Apple Silicon Metal. First SQL execution engine that targets Apple Silicon GPUs.
  version: 0.3.0
  language: C++
  build: cmake
  license: Apache-2.0
  requires_toolchains: python3
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;windows_amd64;windows_amd64_rtools;windows_amd64_mingw
  maintainers:
  - singhpratech
repo:
  github: singhpratech/duckdbgpumetaldbram
  ref: 2f416b1037a5d22662bd67b7fda26f0b96b82858
docs:
  hello_world: "LOAD gpudb;\n-- Drop-in aggregates (BIGINT and DOUBLE overloads)\n\
    SELECT gpu_sum(value::BIGINT) FROM range(1000000) AS t(value);\n\n-- Verify against\
    \ native sum\nSELECT\n  gpu_sum(value::BIGINT) AS gpu,\n  sum(value::BIGINT) AS\
    \ native\nFROM range(1000000) AS t(value);\n"
  extended_description: "`gpudb` adds drop-in aggregate functions:\n\n  * `gpu_sum(BIGINT\
    \ | DOUBLE)`\n  * `gpu_min(BIGINT | DOUBLE)`\n  * `gpu_max(BIGINT | DOUBLE)`\n\
    \nSmaller integer types (`INTEGER`, `SMALLINT`, `TINYINT`) widen implicitly\n\
    to the `BIGINT` overload. All three work in plain aggregation, `GROUP BY`,\nand\
    \ window frames (`OVER ()`, `OVER (ORDER BY ...)`,\n`OVER (PARTITION BY ... ORDER\
    \ BY ...)`), and match native DuckDB\nsemantics: empty input and all-NULL groups\
    \ return SQL `NULL` (v0.2.0),\nand the `DOUBLE` min/max overloads use the same\
    \ NaN-aware total order as\nnative DuckDB \u2014 NaN sorts greatest (v0.3.0).\n\
    \n**v0.3.0** replaces the buffered v0.1.x aggregate path with streaming\naccumulator\
    \ states. End-to-end queries through the SQL aggregates now run\nat parity with\
    \ native DuckDB (1.00\u20131.20\xD7 on rewritten TPC-H queries),\nwhere v0.1.x\
    \ could be substantially slower on the same queries. DuckDB\nfeeds aggregates\
    \ pre-grouped 2048-row chunks, so the SQL aggregate path\ndeliberately streams\
    \ running accumulators instead of round-tripping\nchunks through the GPU.\n\n\
    The GPU backends (CUDA on NVIDIA sm_70+, Metal on Apple Silicon M1+)\npower the\
    \ operator-level engine and benchmark tooling that ship in the\nsource tree, where\
    \ whole columns are resident on the device. Headline\noperator-level results,\
    \ all traceable to rows in the project's\nappend-only BENCHMARK.md with reproduction\
    \ steps:\n\n  * Apple M4 Max vs DuckDB CPU 16-thread: multi-aggregate fusion over\n\
    \    TPC-H SF10 columns 9.7\xD7\u201325.5\xD7; SF10 GROUP BY at 1.35M unique keys\n\
    \    3.9\xD7; honest loss documented at 50 unique keys (CPU 14\xD7 faster,\n \
    \   structural).\n  * NVIDIA RTX 4090: resident-column SUM ~17.9\xD7; GROUP BY\
    \ 50M rows \xD7\n    10M unique groups 13.7\xD7 (vs single-thread CPU baseline).\n\
    \nCommunity-extension binaries are built without the CUDA toolchain for\nnow (full\
    \ Metal path on Apple Silicon; clean CPU fallback on Linux);\nbuild from source\
    \ for the CUDA backend. If no GPU is available the\nextension falls back cleanly\
    \ \u2014 same SQL surface either way.\n\nSource: https://github.com/singhpratech/duckdbgpumetaldbram\n"
  hardware_requirements: 'NVIDIA CUDA: any GPU with sm_70 or later. Driver 525+ recommended.

    Apple Metal: any Apple Silicon Mac (M1 or later). macOS 13+ for

    int64 atomics; macOS 15+ for MSL 3.2.

    Falls back to CPU otherwise.

    '
  known_limitations: "* `gpu_sum(BIGINT)` wraps on int64 overflow where native `sum()`\n\
    \  promotes to `HUGEINT`.\n* `HUGEINT`, `DECIMAL`, and `FLOAT` arguments implicitly\
    \ cast to the\n  `DOUBLE` overload \u2014 values beyond 2^53 lose precision where\
    \ native\n  aggregates are exact, and the result type is `DOUBLE`. `VARCHAR`\n\
    \  arguments are a binder error (native `min`/`max` compare\n  lexicographically).\
    \ Use native aggregates where those types matter.\n* Apple GPUs do not implement\
    \ IEEE-754 doubles in MSL; operator-level\n  f64 work on Metal runs on host. This\
    \ does not affect the SQL\n  aggregate path.\n* `GPUDB_FORCE_BACKEND` no longer\
    \ affects the SQL aggregate path as of\n  v0.3.0 (operator-level tools still honor\
    \ backend selection).\n"
