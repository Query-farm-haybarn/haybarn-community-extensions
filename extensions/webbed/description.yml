extension:
  name: webbed
  description: Comprehensive processing extension for web markup languages (XML and
    HTML) with SAX streaming for large files, intelligent schema inference, XPath-based
    data extraction, and HTML table parsing.
  version: 2.1.0
  language: C++
  build: cmake
  license: MIT
  requires_toolchains: vcpkg
  maintainers:
  - teaguesterling
  vcpkg_commit: 68a1c387f660632f2f65cdb7e8cd093a08840e5d
repo:
  github: teaguesterling/duckdb_webbed
  ref: 3ccf005124491090a6e291a6cde2e848044e6992
docs:
  docs_url: https://duckdb-webbed.readthedocs.io
  hello_world: '-- Load the extension

    LOAD webbed;


    -- Read XML files directly into tables

    SELECT * FROM ''data.xml'';

    SELECT * FROM read_xml(''config/*.xml'');


    -- Parse and extract from XML content using XPath

    SELECT xml_extract_text(''<book><title>Database Guide</title></book>'', ''//title'');

    -- Result: "Database Guide"


    -- Parse and extract from HTML content

    SELECT html_extract_text(''<html><body><h1>Welcome</h1></body></html>'', ''//h1'');

    -- Result: "Welcome"


    -- Extract HTML tables directly into DuckDB

    SELECT * FROM html_extract_tables(''<table><tr><th>Name</th><th>Age</th></tr><tr><td>John</td><td>25</td></tr></table>'');


    -- Extract links and images from HTML pages

    SELECT html_extract_links(''<a href="https://example.com">Click here</a>'');

    SELECT html_extract_images(''<img src="photo.jpg" alt="Photo" width="800">'');


    -- Parse XML strings directly (without files)

    SELECT * FROM parse_xml(''<books><book><title>DuckDB</title><price>29.99</price></book></books>'');


    -- Convert between XML and JSON formats

    SELECT xml_to_json(''<person><name>John</name><age>30</age></person>'');

    SELECT json_to_xml(''{"name":"John","age":"30"}'');


    -- Convert HTML to structured document blocks

    SELECT html_to_duck_blocks(''<h1>Title</h1><p>Paragraph with <strong>bold</strong>
    text.</p>'');

    '
  extended_description: "DuckDB XML is a comprehensive extension that brings powerful\
    \ XML and HTML processing capabilities to DuckDB, enabling SQL-native analysis\
    \ of structured documents. The extension provides four core areas of functionality:\n\
    \n**XML Processing & Analysis**: Parse, validate, and extract data from XML documents\
    \ using full XPath 1.0 expressions. Functions include `xml_extract_text()`, `xml_extract_elements()`,\
    \ `xml_extract_attributes()`, `xml_valid()`, and `xml_stats()` for comprehensive\
    \ document analysis. The extension handles namespaces with intelligent 'auto'\
    \ mode detection, comments, CDATA sections, and provides utilities like `xml_pretty_print()`\
    \ and `xml_minify()`.\n\n**HTML Processing & Web Scraping**: Advanced HTML parsing\
    \ capabilities with specialized functions for web data extraction. Extract text\
    \ content with `html_extract_text()`, parse HTML tables into structured data with\
    \ `html_extract_tables()`, extract links with metadata using `html_extract_links()`,\
    \ and extract images with attributes using `html_extract_images()`. Perfect for\
    \ web scraping and HTML document analysis workflows.\n\n**Document Block Processing**:\
    \ Convert HTML documents to and from structured block representations with `html_to_duck_blocks()`\
    \ and `duck_blocks_to_html()`. Supports paragraphs, headings, code blocks, tables,\
    \ lists, inline formatting (bold, italic, links, etc.), and frontmatter preservation.\
    \ Integrates with the `duck_block_utils` extension for full Markdown support.\n\
    \n**Smart Schema Inference & File Reading**: Automatically flatten XML/HTML documents\
    \ into relational tables with intelligent type detection for dates, numbers, booleans,\
    \ and nested structures. Functions like `read_xml()` and `read_html()` provide\
    \ direct file-to-table conversion with configurable options including `datetime_format`\
    \ presets, `nullstr` for custom NULL values, and schema customization. **SAX streaming**\
    \ (v2.0) automatically handles files over 16MB using a push parser that processes\
    \ XML in 64KB chunks \u2014 peak memory stays proportional to a single record,\
    \ not the file size.\n\n**Key XML Functions**:\n- `read_xml(pattern)` - Read XML\
    \ files with automatic schema inference\n- `xml_extract_text(xml, xpath)` - XPath-based\
    \ text extraction\n- `xml_extract_elements(xml, xpath)` - Extract structured elements\n\
    - `xml_extract_attributes(xml, xpath)` - Extract attributes as structs\n- `xml_to_json(xml)`\
    \ / `json_to_xml(json)` - Format conversions\n- `xml_stats(xml)` - Document statistics\
    \ and analysis\n- `xml_validate_schema(xml, xsd)` - XSD schema validation\n- `xml_find_undefined_prefixes(xml,\
    \ xpath)` - Detect undeclared namespace prefixes\n- `xml_add_namespace_declarations(xml,\
    \ map)` - Inject namespace declarations\n- `parse_xml(content)` - Parse XML strings\
    \ with schema inference\n- `parse_xml_objects(content)` - Parse XML strings to\
    \ raw XML type\n\n**Key HTML Functions**:\n- `read_html(pattern)` - Read HTML\
    \ files into tables\n- `html_extract_tables(html)` - Extract HTML tables as structured\
    \ data (this will often require post-processing given the possible complexity\
    \ of HTML tables)\n- `html_extract_links(html)` - Extract all links with metadata\n\
    - `html_extract_images(html)` - Extract images with attributes\n- `html_extract_text(html,\
    \ xpath)` - XPath-based HTML text extraction\n- `parse_html(content)` - Parse\
    \ HTML strings with schema inference\n- `parse_html_objects(content)` - Parse\
    \ HTML strings to raw HTML type\n- `html_to_duck_blocks(html)` - Convert HTML\
    \ to structured document blocks\n- `duck_blocks_to_html(blocks)` - Convert document\
    \ blocks back to HTML\n\nSee https://duckdb-webbed.readthedocs.io for comprehensive\
    \ documentation and examples.\n\nBuilt on libxml2 for robust, standards-compliant\
    \ parsing with comprehensive error handling and memory-safe RAII implementation.\
    \ 68 test suites with 2511 assertions, including DOM/SAX equivalence testing.\
    \ The extension supports mixed file systems, configurable schema inference, and\
    \ efficient processing of large document collections.\n"
