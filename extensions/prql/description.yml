extension:
  # Haybarn: disabled because the extension does not yet build
  # against DuckDB 1.5.2 — upstream community-extensions also has
  # no v1.5.2 binary. Re-enable when upstream lands a v1.5.2-
  # compatible release (sync_from_upstream will pick up the bump).
  # Tracker: https://github.com/ywelsch/duckdb-prql/issues/23
  excluded_platforms: linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
  name: prql
  description: Support for PRQL, the Pipelined Relational Query Language
  version: 1.0.0
  language: C++
  build: cmake
  requires_toolchains: rust
  license: MIT
  maintainers:
  - ywelsch
repo:
  github: ywelsch/duckdb-prql
  ref: 0b411575bb454e96cd5bd8aa97ba1d73ed689a34
docs:
  hello_world: "let invoices = s\"select * from 'https://raw.githubusercontent.com/PRQL/prql/0.8.0/prql-compiler/tests/integration/data/chinook/invoices.csv'\"\
    \nlet customers = s\"select * from 'https://raw.githubusercontent.com/PRQL/prql/0.8.0/prql-compiler/tests/integration/data/chinook/customers.csv'\"\
    \nfrom invoices\nfilter invoice_date >= @1970-01-16\nderive {\n  transaction_fees\
    \ = 0.8,\n  income = total - transaction_fees\n}\nfilter income > 1\ngroup customer_id\
    \ (\n  aggregate {\n    average total,\n    sum_income = sum income,\n    ct =\
    \ count total,\n  }\n)\nsort {-sum_income}\ntake 10\njoin c=customers (==customer_id)\n\
    derive name = f\"{c.last_name}, {c.first_name}\"\nselect {\n  c.customer_id, name,\
    \ sum_income\n}\nderive db_version = s\"version()\"\n"
  extended_description: 'The PRQL extension adds support for the [Pipelined Relational
    Query Language](https://prql-lang.org).

    '
