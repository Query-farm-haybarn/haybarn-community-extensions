extension:
  name: malloy
  description: A semantic layer an AI agent builds itself, and a query surface, inside
    DuckDB
  version: 0.1.0
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads
  maintainers:
  - lloydtabb
repo:
  github: lloydtabb/malloy-duckdb
  ref: 01c8a266840c0c10af3349b613706d1df3ab7f1f
  variegata: bc7b375ce46c3ebf3ee54374d6c69d225cd2a18a
docs:
  hello_world: "-- Ask Claude:\n--   \"Load duckdb with the malloy extension. Run\
    \ 'malloy;' to learn how it\n--   works. Read <your context: questions, existing\
    \ SQL, docs> and then\n--   create a Malloy model so I can ask you questions.\"\
    \n-- Here the context is TPC-H. These are the steps Claude takes.\n\n-- 1. Install\
    \ and load the extension\nINSTALL malloy FROM community;\nLOAD malloy;\n\n-- 2.\
    \ Learn the extension: every command, and where the language help is\nmalloy;\n\
    \n-- 3. The data: TPC-H, generated by DuckDB's tpch extension\nINSTALL tpch;\n\
    LOAD tpch;\nCALL dbgen(sf = 0.01);\n\n-- 4. Write a model and save it as tpch.malloy\
    \ (here with COPY, so the\n--    example runs as pasted; Claude writes the file\
    \ directly)\nCOPY (SELECT '\nsource: customers is duckdb.table(''customer'') extend\
    \ {\n  primary_key: c_custkey\n}\nsource: orders is duckdb.table(''orders'') extend\
    \ {\n  primary_key: o_orderkey\n  join_one: customers with o_custkey\n  measure:\n\
    \    order_count is count()\n    revenue is o_totalprice.sum()\n  view: by_segment\
    \ is {\n    group_by: customers.c_mktsegment\n    aggregate: order_count, revenue\n\
    \    order_by: revenue desc\n  }\n}\n') TO 'tpch.malloy' (FORMAT csv, HEADER false,\
    \ QUOTE '');\n\n-- 5. Load it into this connection\nmalloy import 'tpch.malloy';\n\
    \n-- 6. Check what it built\nmalloy describe orders;\n\n-- 7. Answer from the\
    \ model\nrun: orders -> by_segment;\n\n-- 8. Keep it: install the model in the\
    \ database, so every connection can\n--    query its sources by name (and later\
    \ sessions too, in a database file)\nmalloy install 'tpch.malloy';\n"
  extended_description: "**malloy** gives an AI agent a semantic layer it builds itself\
    \ and a query\nsurface, inside DuckDB.\n\nPoint an agent at the extension and\
    \ have it run `malloy;`. That lists every\ncommand, and `malloy help` carries\
    \ Malloy's language reference, so the agent\nlearns Malloy from the extension.\
    \ Give it your tables and whatever context you\nhave (the questions people ask,\
    \ existing SQL, documentation) and it writes a\nMalloy model: sources, joins,\
    \ dimensions, measures and views. Later questions\nare answered from that model,\
    \ so \"revenue\" or \"an order's customer\" means the\nsame thing in every answer.\n\
    \nIn a cold-start test on TPC-H (sf=1), Claude built a model from the 11\nodd-numbered\
    \ queries, then answered the 11 even ones without changing it. All\n22 matched\
    \ the official answers, with no hand-written SQL.\n\nMalloy aggregates stay correct\
    \ across joins that fan out, and results can be\nnested.\n\n- `run:` statements,\
    \ and `%{ ... }%` for a Malloy query anywhere SQL takes a table\n- a model per\
    \ connection (`source:`, `query:`, `malloy import 'model.malloy'`),\n  or installed\
    \ in the database for every connection (`malloy install`)\n- `malloy sources`,\
    \ `malloy describe <source>`: what a model contains, with\n  each field's description\n\
    \nDocumentation: https://github.com/lloydtabb/malloy-duckdb\n"
