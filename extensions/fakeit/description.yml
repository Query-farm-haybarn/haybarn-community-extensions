extension:
  name: fakeit
  description: The FakeIt Extension enables generation of realistic fake/test data
    directly in SQL queries
  version: 0.3.4
  language: Rust
  build: cargo
  license: MIT
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;linux_amd64_musl
  requires_toolchains: rust;python3
  maintainers:
  - tobilg
repo:
  github: tobilg/duckdb-fakeit
  ref: 93733f9fa4008407b06555b177b7d7857a0ab66f
docs:
