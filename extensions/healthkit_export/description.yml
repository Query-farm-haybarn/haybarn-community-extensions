extension:
  name: healthkit_export
  description: Read Apple Health app exports (HealthKit export.zip / export.xml) as
    typed DuckDB tables (records, workouts, activity rings, workout routes and GPX
    points).
  version: 0.3.1
  language: C
  build: cmake
  license: Apache-2.0
  requires_toolchains: python3
  maintainers:
  - Mjboothaus
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads
repo:
  github: Mjboothaus/duckdb-healthkit-export
  ref: 0063896b1b6ce515c9430c90d1624637139d9ba9
docs:
  hello_world: '-- After INSTALL healthkit_export FROM community; LOAD healthkit_export;

    -- Use a Health app export.zip (or test fixture path when developing from source)

    SELECT type_short, count(*) AS n

    FROM read_healthkit_export(''export.zip'')

    GROUP BY 1

    ORDER BY n DESC

    LIMIT 10;

    '
  extended_description: "**healthkit_export** is a DuckDB scanner for exports produced\
    \ by the\n[Apple Health](https://www.apple.com/ios/health/) app (HealthKit `export.zip`\
    \ /\n`export.xml`). Written in **C** on DuckDB's **stable C API**\n([extension-template-c](https://github.com/duckdb/extension-template-c)).\n\
    \n**Not affiliated with, endorsed by, or sponsored by Apple Inc.** Apple, Apple\
    \ Health,\nand HealthKit are trademarks of Apple Inc.\n\n### Table functions\n\
    - `read_healthkit_export(path)` \u2014 top-level Health records\n- `healthkit_workouts(path)`\
    \ \u2014 workouts\n- `healthkit_activity_summaries(path)` \u2014 daily activity\
    \ rings\n- `healthkit_workout_routes(path)` \u2014 route metadata + GPX path\n\
    - `healthkit_workout_route_points(path)` \u2014 GPX track points\n\n`path` may\
    \ be `export.zip`, a directory containing `export.xml`, or `export.xml` itself.\n\
    \n### Design notes\nLarge exports are a full **scan** (first pass can be memory-heavy).\
    \ Prefer materialising\nslices with `COPY \u2026 TO '\u2026.parquet'` for day-to-day\
    \ analytics.\n\nTop-level `<Record>` only \u2014 nested Correlation children are\
    \ skipped (same samples usually\nalso appear top-level).\n\n### Platform\nCommunity\
    \ builds target **DuckDB 2.0.0** on **macOS arm64**, **Linux**, and **Windows**.\n\
    **Wasm** and **osx_amd64** are excluded. Prior CDN artifacts for DuckDB 1.5.x\
    \ remain\navailable for older clients until EOL.\n\n### Rename note\nThis listing\
    \ **replaces** the short-lived `apple_health` community id (unintended branding).\n\
    Use `INSTALL healthkit_export FROM community` going forward.\n\n### Source\nhttps://github.com/Mjboothaus/duckdb-healthkit-export\
    \ \u2014 optional Python helpers in-repo are\n**not** part of this extension binary.\n"
