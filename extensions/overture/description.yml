extension:
  name: overture
  description: Overture Maps helpers for DuckDB - geocoding, category normalization,
    spatial tiling, and reader macros for places, buildings, roads, and addresses
  version: 0.1.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - flipbitsnotburgers
repo:
  github: cubilica/duckdb-overture
  ref: 26d03c207f575d8fbf3d6884c4b6acdc497cac68
docs:
  hello_world: "-- Forward geocoding\nSELECT * FROM geocode('n\xF8rrebrogade', west:=12.4,\
    \ east:=12.7, south:=55.6, north:=55.8);\n\n-- Reverse geocoding\nSELECT * FROM\
    \ reverse_geocode(55.6836, 12.5716);\n\n-- Map Overture categories\nSELECT overture_category('coffee_shop');\n\
    \n-- Spatial tile key\nSELECT st_tile_index(52.52, 13.405);\n\n-- Read Overture\
    \ places with bbox filtering and category mapping (requires spatial + httpfs)\n\
    LOAD spatial; LOAD httpfs;\nSET s3_region='us-west-2';\nSELECT * FROM read_overture_places(west:=13.0,\
    \ east:=13.8, south:=52.3, north:=52.7) LIMIT 10;\n"
  extended_description: "DuckDB extension for working with Overture Maps data. Provides\
    \ forward and reverse geocoding\nagainst Overture addresses, category normalization\
    \ (80+ Overture categories to ~30 normalized\nones, customizable via SQL), spatial\
    \ grid tiling, and table macros for reading places,\nbuildings, roads, and addresses\
    \ with bbox filtering.\n\nThe S3 bucket and Overture release version are configurable\
    \ via variables:\n  SET VARIABLE overture_release = '2026-03-18.0';\n  SET VARIABLE\
    \ overture_s3_base = 's3://my-mirror/overture';\n\nWorks in both native DuckDB\
    \ and DuckDB-WASM.\n"
