extension:
  name: level_pivot
  description: Storage extension wrapping LevelDB with pivot semantics for structured
    relational tables over key-value pairs
  version: 1.0.0
  language: C++
  build: cmake
  license: GPL-3.0
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads
  maintainers:
  - halgari
repo:
  github: halgari/duckdb-level-pivot
  ref: 005c79629fbb9b6959c183249d3f722b9d300c2f
docs:
  hello_world: "-- Attach a LevelDB database\nATTACH '/tmp/mydb' AS kv (TYPE level_pivot,\
    \ CREATE_IF_MISSING true);\n\n-- Create a pivot table: rows decompose into LevelDB\
    \ key-value pairs\n-- Key pattern: users##<group>##<id>##<attribute_name> \u2192\
    \ attribute_value\nCALL level_pivot_create_table('kv', 'users', 'users##{group}##{id}##{attr}',\
    \ ['group', 'id', 'name', 'email']);\n\n-- Insert data\nINSERT INTO kv.users VALUES\
    \ ('admins', 'u1', 'Alice', 'alice@example.com');\nINSERT INTO kv.users VALUES\
    \ ('admins', 'u2', 'Bob', 'bob@example.com');\n\n-- Query with standard SQL (filter\
    \ pushdown on identity columns)\nSELECT * FROM kv.users;\nSELECT * FROM kv.users\
    \ WHERE \"group\" = 'admins' AND id = 'u1';\n"
  extended_description: 'LevelPivot is a DuckDB storage extension that wraps LevelDB
    with pivot

    semantics. It maps relational rows to LevelDB key-value pairs using

    configurable key patterns, enabling structured multi-column SQL tables

    on top of a key-value store.


    Tables are created via level_pivot_create_table() with a key pattern

    like ''users##{group}##{id}##{attr}'' that defines how rows decompose

    into LevelDB entries. Identity columns ({group}, {id}) form the key

    prefix; attribute columns (name, email) each become a separate

    LevelDB key-value pair.


    Key Features:

    - Pivot mode: decomposes rows into per-attribute LevelDB entries

    - Raw mode: simple 2-column key-value access

    - Configurable key patterns with identity columns and delimiters

    - Typed columns: VARCHAR, BIGINT, INTEGER, DOUBLE, BOOLEAN

    - Filter pushdown on identity columns for efficient prefix scans

    - Full DML support: INSERT, INSERT INTO...SELECT, UPDATE, DELETE

    - SIMD-optimized key parsing (AVX2, SSE2, NEON)

    - Data persistence across DETACH/ATTACH cycles

    '
