extension:
  name: func_apply
  description: Dynamic function invocation - call any scalar function or macro by
    name at runtime
  version: 0.4.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - teaguesterling
repo:
  github: teaguesterling/duckdb_func_apply
  ref: 9f119877ef5c10ef84c8cc593ee98ee199be5302
  variegata: 9f119877ef5c10ef84c8cc593ee98ee199be5302
  ref_next: 9f119877ef5c10ef84c8cc593ee98ee199be5302
docs:
  hello_world: '-- Load the extension

    LOAD func_apply;


    -- Call scalar functions dynamically

    SELECT apply(''upper'', ''hello world'');

    -- Result: HELLO WORLD


    SELECT apply(''substr'', ''hello world'', 7, 5);

    -- Result: world


    -- Call table functions dynamically

    SELECT * FROM apply_table(''range'', 5);

    -- Returns: 0, 1, 2, 3, 4


    SELECT * FROM apply_table(''generate_series'', 1, 10, 2);

    -- Returns: 1, 3, 5, 7, 9


    -- Check if a function exists before calling

    SELECT function_exists(''my_custom_func'');

    -- Result: true/false

    '
  extended_description: "The FuncApply extension enables dynamic function invocation\
    \ in DuckDB, allowing you to\ncall any scalar function or macro by name at runtime.\
    \ This is useful for data-driven\ntransformations, dynamic SQL generation, and\
    \ building flexible data pipelines.\n\n## Functions\n\n| Function | Description\
    \ |\n|----------|-------------|\n| `apply(func_name, ...args)` | Call a function\
    \ by name with arguments |\n| `apply_with(func_name, args, kwargs)` | Call a function\
    \ with arguments as a list |\n| `apply_table(func_name, ...args)` | Call a table\
    \ function by name with arguments |\n| `apply_table_with(func_name, args, kwargs)`\
    \ | Call a table function with arguments as a list |\n| `func_dispatch(routes,\
    \ key, ...args)` | Dispatch to the function named by `routes[key]`, with real\
    \ return types |\n| `function_exists(name)` | Check if a function exists |\n\n\
    ## Use Cases\n\n### Data-Driven Transformations\n\n```sql\n-- Store transformation\
    \ rules in a table\nCREATE TABLE transforms (column_name VARCHAR, func_name VARCHAR);\n\
    INSERT INTO transforms VALUES ('name', 'upper'), ('email', 'lower');\n\n-- Apply\
    \ transformations dynamically\nSELECT apply(t.func_name, d.value) as result\n\
    FROM data d JOIN transforms t ON d.column = t.column_name;\n```\n\n### Routing\
    \ With func_dispatch\n\n```sql\nCREATE MACRO clean_git(p)   AS regexp_replace(p,\
    \ '^git://', '');\nCREATE MACRO clean_http(p)  AS regexp_replace(p, '^https?://',\
    \ '');\nCREATE MACRO clean_other(p) AS p;\n\nSELECT func_dispatch(MAP{'git': \
    \  'clean_git',\n                         'https': 'clean_http',\n           \
    \              '*':     'clean_other'},\n                     split_part(url,\
    \ ':', 1),\n                     url) AS cleaned\nFROM urls;\n```\n\nThe `'*'`\
    \ entry catches any key the map does not name. Unlike `apply()` with a\nfunction\
    \ name that is not a constant, `func_dispatch` binds every candidate in a\nconstant\
    \ routing map at plan time, so the result keeps its real type instead of\ncollapsing\
    \ to `VARCHAR`:\n\n```sql\nCREATE MACRO pair(x) AS [x, x];\nSELECT typeof(func_dispatch(MAP{'a':\
    \ 'pair'}, 'a', 7));  -- INTEGER[]\n```\n\nAll routes in a constant map must accept\
    \ the forwarded arguments, and the\nsession security policy applies to every route\
    \ including `'*'`.\n\n### Dynamic Function Selection\n\n```sql\n-- Choose function\
    \ based on data type\nSELECT apply(\n    CASE typeof(value)\n        WHEN 'VARCHAR'\
    \ THEN 'upper'\n        WHEN 'INTEGER' THEN 'abs'\n    END,\n    value\n) FROM\
    \ my_table;\n```\n\n## Supported Function Types\n\n- Scalar functions (e.g., `upper`,\
    \ `abs`, `substr`)\n- Macros (e.g., `list_sum`, `list_reverse`)\n\nAggregate and\
    \ table functions are not supported.\n\n## Security Model\n\n`apply` and `apply_table`\
    \ run on the **caller's own context** \u2014 they add no\nprivilege beyond the\
    \ SQL the caller could already execute directly. They are\na dynamic-dispatch\
    \ convenience, **not a sandbox**.\n\nFor scenarios that embed func_apply and want\
    \ to restrict which functions can\nbe invoked (e.g. accepting a function name\
    \ from less-trusted input), an\noptional, opt-in policy is available. It is **per\
    \ session** and defaults to\n`none` (no restriction):\n\n| Function | Description\
    \ |\n|----------|-------------|\n| `func_apply_set_security_mode(mode)` | `'none'`,\
    \ `'blacklist'`, `'whitelist'`, or `'validator'` |\n| `func_apply_set_whitelist([...])`\
    \ / `func_apply_set_blacklist([...])` | Set the allowed/denied function names\
    \ |\n| `func_apply_lock_security()` | Irreversibly lock the current session's\
    \ policy |\n\nThe policy lives on the session's `ClientContext` and does not leak\
    \ across\nconnections. Versions before 0.2.0 stored it process-globally and could\n\
    quote-escape injected identifiers \u2014 see security advisory\nGHSA-55g5-vp25-phpg;\
    \ upgrade to 0.2.0 (DuckDB v1.5.4 track).\n"
