extension:
  name: func_apply
  description: Dynamic function invocation - call any scalar function or macro by
    name at runtime
  version: 0.1.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - teaguesterling
repo:
  github: teaguesterling/duckdb_func_apply
  ref: 2013ac345d6f19e61ee78cacae161eb272cf1837
docs:
  hello_world: '-- Load the extension

    LOAD func_apply;


    -- Call scalar functions dynamically

    SELECT apply(''upper'', ''hello world'');

    -- Result: HELLO WORLD


    SELECT apply(''substr'', ''hello world'', 7, 5);

    -- Result: world


    -- Call table functions dynamically

    SELECT * FROM apply_table(''range'', 5);

    -- Returns: 0, 1, 2, 3, 4


    SELECT * FROM apply_table(''generate_series'', 1, 10, 2);

    -- Returns: 1, 3, 5, 7, 9


    -- Check if a function exists before calling

    SELECT function_exists(''my_custom_func'');

    -- Result: true/false

    '
  extended_description: "The FuncApply extension enables dynamic function invocation\
    \ in DuckDB, allowing you to\ncall any scalar function or macro by name at runtime.\
    \ This is useful for data-driven\ntransformations, dynamic SQL generation, and\
    \ building flexible data pipelines.\n\n## Functions\n\n| Function | Description\
    \ |\n|----------|-------------|\n| `apply(func_name, ...args)` | Call a function\
    \ by name with arguments |\n| `apply_with(func_name, args, kwargs)` | Call a function\
    \ with arguments as a list |\n| `apply_table(func_name, ...args)` | Call a table\
    \ function by name with arguments |\n| `apply_table_with(func_name, args, kwargs)`\
    \ | Call a table function with arguments as a list |\n| `function_exists(name)`\
    \ | Check if a function exists |\n\n## Use Cases\n\n### Data-Driven Transformations\n\
    \n```sql\n-- Store transformation rules in a table\nCREATE TABLE transforms (column_name\
    \ VARCHAR, func_name VARCHAR);\nINSERT INTO transforms VALUES ('name', 'upper'),\
    \ ('email', 'lower');\n\n-- Apply transformations dynamically\nSELECT apply(t.func_name,\
    \ d.value) as result\nFROM data d JOIN transforms t ON d.column = t.column_name;\n\
    ```\n\n### Dynamic Function Selection\n\n```sql\n-- Choose function based on data\
    \ type\nSELECT apply(\n    CASE typeof(value)\n        WHEN 'VARCHAR' THEN 'upper'\n\
    \        WHEN 'INTEGER' THEN 'abs'\n    END,\n    value\n) FROM my_table;\n```\n\
    \n## Supported Function Types\n\n- Scalar functions (e.g., `upper`, `abs`, `substr`)\n\
    - Macros (e.g., `list_sum`, `list_reverse`)\n\nAggregate and table functions are\
    \ not supported.\n"
