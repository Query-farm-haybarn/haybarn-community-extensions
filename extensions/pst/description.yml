extension:
  name: pst
  description: Read and edit in place Microsoft PST files with rich schemas for common
    MAPI types (emails, contacts, appointments, tasks)
  version: 0.2.1
  language: C++
  build: cmake
  excluded_platforms: windows_amd64_mingw
  license: MIT
  maintainers:
  - mach-kernel
repo:
  github: intellekthq/duckdb-pst
  ref: d0a69a498c7726b7b75ed32616c7feac3271ff55
docs:
  hello_world: "-- Count all messages across PST files (supports globs)\nD SELECT\
    \ count(*) FROM read_pst_messages('enron/*.pst');\n\u250C\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\
    \n\u2502  count_star()  \u2502\n\u2502     int64      \u2502\n\u251C\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2524\n\u2502    1227193     \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n\n--\
    \ Query contacts (supports remote URIs)\nD SELECT given_name, surname FROM read_pst_contacts('https://example.com/outlook.pst');\n\
    \u250C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u252C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 given_name\
    \ \u2502 surname \u2502\n\u2502  varchar   \u2502 varchar \u2502\n\u251C\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253C\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 John       \u2502\
    \ Doe     \u2502\n\u2502 Jane       \u2502 Smith   \u2502\n\u2514\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2518\n\n-- Read messages with limit (applied\
    \ during planning for large files)\nD SELECT subject, sender_email_address, message_delivery_time\n\
    \  FROM read_pst_messages('*.pst', read_limit=100);\n\n-- Preview an in-place\
    \ delete. Without `really := true` the call\n-- opens read-only and reports what\
    \ it would do per row.\nD SELECT status, count(*) FROM delete_pst_messages(\n\
    \    SELECT pst_path, node_id FROM read_pst_messages('/tmp/hr.pst')\n    WHERE\
    \ sender_email_address = 'terminated@example.com'\n  ) GROUP BY status;\n\u250C\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2510\n\u2502  status   \u2502 count_star() \u2502\n\u2502  varchar  \u2502 \
    \   int64     \u2502\n\u251C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u253C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2524\n\u2502 PREVIEWED \u2502           17 \u2502\n\u2514\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2518\n"
  extended_description: 'A DuckDB extension for reading and editing in place Microsoft
    PST files, with rich schemas for common MAPI types. Built on Microsoft''s official
    [PST SDK](https://github.com/enrondata/microsoft-pst-sdk). Query emails, contacts,
    appointments, and more. Use it to analyze PST data in-place (locally or on object
    storage), import to DuckDB tables, export to Parquet, or delete from a store in
    place to scrub PII, drop out-of-scope custodian mail before a production, or strip
    attachments.


    ### Table Functions


    | Function                      | MAPI Class        | Description                            |

    |-------------------------------|-------------------|----------------------------------------|

    | `read_pst_folders`            | `*`               | Folder hierarchy                       |

    | `read_pst_messages`           | `*`               | All messages with base IPM.Note
    schema |

    | `read_pst_notes`              | `IPM.Note`        | Email messages                         |

    | `read_pst_contacts`           | `IPM.Contact`     | Contacts with 78+ fields               |

    | `read_pst_distribution_lists` | `IPM.DistList`    | Distribution lists with
    members        |

    | `read_pst_appointments`       | `IPM.Appointment` | Calendar appointments and
    meetings     |

    | `read_pst_sticky_notes`       | `IPM.StickyNote`  | Sticky note items                      |

    | `read_pst_tasks`              | `IPM.Task`        | Task items                             |


    ### In-place Deletion


    | Function                  | Input Table                                                                 |
    Deletes                                         |

    |---------------------------|-----------------------------------------------------------------------------|-------------------------------------------------|

    | `delete_pst_messages`     | `(pst_path VARCHAR, node_id UINTEGER)`                                      |
    One message, and its attachments                |

    | `delete_pst_folders`      | `(pst_path VARCHAR, node_id UINTEGER)`                                      |
    A folder, its subfolders and everything in them |

    | `delete_pst_attachments`  | `(pst_path VARCHAR, message_node_id UINTEGER, attachment_node_id
    UINTEGER)` | One attachment, leaving the message             |

    | `wipe_pst_free_space`     | a path or glob                                                              |
    Overwrites bytes no node points at              |


    Gated behind `SET pst_allow_delete = true` (session) plus `really := true` per
    call. Without `really` the call opens read-only, resolves every target, and reports
    `PREVIEWED` or `FAILED` per row. Bind errors abort the statement; anything found
    later is reported per row so a mid-statement throw cannot leave already-committed
    deletes with no record of what went. Node IDs are checked against the mode, so
    `delete_pst_messages` refuses a folder or the store''s root.


    ### Performance Features


    - **Query pushdown**: projection and statistics pushdown

    - **Concurrent planning**: parallel partition planning for directories with many
    PST files

    - **Late materialization**: filter on virtual columns before expanding full projections


    ### Parameters


    | Parameter              | Default     | Description                                              |

    |------------------------|-------------|----------------------------------------------------------|

    | `read_body_size_bytes` | `1000000`   | Max bytes to read into body/body_html
    (0 for unlimited)  |

    | `read_attachment_body` | `false`     | Whether to read attachment bytes                         |

    | `read_limit`           | `NULL`      | Max items to read (applied during planning)              |


    For full schema documentation and usage examples, see the [GitHub repository](https://github.com/intellekthq/duckdb-pst).

    '
