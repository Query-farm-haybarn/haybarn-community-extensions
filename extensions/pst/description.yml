extension:
  name: pst
  description: Read Microsoft PST files with rich schemas for common MAPI types (emails,
    contacts, appointments, tasks)
  version: 0.1.2
  language: C++
  build: cmake
  excluded_platforms: windows_amd64_mingw
  license: MIT
  maintainers:
  - mach-kernel
repo:
  github: intellekthq/duckdb-pst
  ref: v0.1.2
docs:
  hello_world: "-- Count all messages across PST files (supports globs)\nD SELECT\
    \ count(*) FROM read_pst_messages('enron/*.pst');\n\u250C\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\
    \n\u2502  count_star()  \u2502\n\u2502     int64      \u2502\n\u251C\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2524\n\u2502    1227193     \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n\n--\
    \ Query contacts (supports remote URIs)\nD SELECT given_name, surname FROM read_pst_contacts('https://example.com/outlook.pst');\n\
    \u250C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u252C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 given_name\
    \ \u2502 surname \u2502\n\u2502  varchar   \u2502 varchar \u2502\n\u251C\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253C\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 John       \u2502\
    \ Doe     \u2502\n\u2502 Jane       \u2502 Smith   \u2502\n\u2514\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2518\n\n-- Read messages with limit (applied\
    \ during planning for large files)\nD SELECT subject, sender_email_address, message_delivery_time\n\
    \  FROM read_pst_messages('*.pst', read_limit=100);\n"
  extended_description: 'A DuckDB extension for reading Microsoft PST files with rich
    schemas for common MAPI types. Built on Microsoft''s official [PST SDK](https://github.com/enrondata/microsoft-pst-sdk).
    Query emails, contacts, appointments, and more. Use it to analyze PST data in-place
    (locally or on object storage), import to DuckDB tables, or export to Parquet.


    ### Table Functions


    | Function                      | MAPI Class        | Description                            |

    |-------------------------------|-------------------|----------------------------------------|

    | `read_pst_folders`            | `*`               | Folder hierarchy                       |

    | `read_pst_messages`           | `*`               | All messages with base IPM.Note
    schema |

    | `read_pst_notes`              | `IPM.Note`        | Email messages                         |

    | `read_pst_contacts`           | `IPM.Contact`     | Contacts with 78+ fields               |

    | `read_pst_distribution_lists` | `IPM.DistList`    | Distribution lists with
    members        |

    | `read_pst_appointments`       | `IPM.Appointment` | Calendar appointments and
    meetings     |

    | `read_pst_sticky_notes`       | `IPM.StickyNote`  | Sticky note items                      |

    | `read_pst_tasks`              | `IPM.Task`        | Task items                             |


    ### Performance Features


    - **Query pushdown**: projection and statistics pushdown

    - **Concurrent planning**: parallel partition planning for directories with many
    PST files

    - **Late materialization**: filter on virtual columns before expanding full projections


    ### Parameters


    | Parameter              | Default     | Description                                              |

    |------------------------|-------------|----------------------------------------------------------|

    | `read_body_size_bytes` | `1000000`   | Max bytes to read into body/body_html
    (0 for unlimited)  |

    | `read_attachment_body` | `false`     | Whether to read attachment bytes                         |

    | `read_limit`           | `NULL`      | Max items to read (applied during planning)              |


    For full schema documentation and usage examples, see the [GitHub repository](https://github.com/intellekthq/duckdb-pst).

    '
