extension:
  name: ggsql
  description: "Bindings to ggsql \u2014 Grammar of Graphics based visualizations\
    \ in SQL"
  version: 0.5.2
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - thomasp85
  requires_toolchains: rust
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads
repo:
  github: posit-dev/ggsql-duckdb
  ref: 2fde2fb16e38a175a19283bddcd9357b90bcae2a
docs:
  hello_world: 'SELECT 1 AS x, 2 AS y VISUALISE x, y DRAW point;

    '
  extended_description: 'ggsql extends DuckDB''s SQL with the visual query language
    defined by ggsql

    (https://ggsql.org) to allow direct visualization from DuckDB. Results are

    served from an in-process HTTP server and opened in the default browser.

    The session setting `ggsql_output` switches to returning a URL, the raw

    vega-lite spec, or a self-contained HTML document instead.

    '
