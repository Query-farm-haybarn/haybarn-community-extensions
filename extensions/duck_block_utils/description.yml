extension:
  name: duck_block_utils
  description: Build, transform, validate, and extract content from structured documents
    using the duck_block type
  version: 1.2.1
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - teaguesterling
repo:
  github: teaguesterling/duckdb_duck_block_utils
  ref: 125662df9e5450105dc9b7957ad955cb53d7beec
docs:
  hello_world: "-- Build a document programmatically\nSELECT db_assemble([\n    db_heading(1,\
    \ 'Hello World'),\n    db_paragraph([\n        db_text('This is '),\n        db_bold('important'),\n\
    \        db_text(' content.')\n    ]),\n    db_code('sql', 'SELECT * FROM documents')\n\
    ]);\n\n-- Works with markdown extension for reading/writing files\nLOAD markdown;\n\
    LOAD duck_block_utils;\n\n-- Extract table of contents from markdown\nSELECT *\
    \ FROM db_blocks_toc(\n    (SELECT list(b) FROM read_markdown_blocks('README.md')\
    \ b)\n);\n\n-- Convert blocks to plain text\nSELECT db_blocks_to_text(\n    (SELECT\
    \ list(b) FROM read_markdown_blocks('doc.md') b)\n);\n\n-- Validate document structure\n\
    SELECT db_blocks_validate(\n    (SELECT list(b) FROM read_markdown_blocks('doc.md')\
    \ b)\n);\n"
  extended_description: "The Duck Block Utils extension provides tools for building,\
    \ transforming, validating, and\nextracting content from structured documents.\
    \ All functions use the `duck_block` type - a\nunified representation for document\
    \ elements that works across formats.\n\n**Documentation:** [duck-block-utils.readthedocs.io](https://duck-block-utils.readthedocs.io)\n\
    \n## The duck_block Type\n\nA unified struct for both block-level and inline elements:\n\
    \n```sql\nSTRUCT(\n    kind VARCHAR,                       -- 'block' or 'inline'\n\
    \    element_type VARCHAR,               -- 'heading', 'paragraph', 'bold', 'link',\
    \ etc.\n    content VARCHAR,                    -- Text content (NULL if element\
    \ has children)\n    level INTEGER,                      -- Structural depth (1=block,\
    \ 2+=inline children)\n    encoding VARCHAR,                   -- 'text', 'json',\
    \ 'html', etc.\n    attributes MAP(VARCHAR, VARCHAR),   -- Element-specific metadata\n\
    \    element_order INTEGER               -- Position in document\n)\n```\n\n##\
    \ V2 API Design\n\nAll builder functions return `LIST(duck_block)` for uniform\
    \ composition:\n\n```sql\n-- Builders can be nested naturally\nSELECT db_paragraph([\n\
    \    db_text('Click '),\n    db_link('https://example.com', 'here'),\n    db_text('\
    \ for more.')\n]);\n```\n\n## Block Builders\n\n| Function | Description |\n|----------|-------------|\n\
    | `db_heading(level, content)` | Create heading (h1-h6) |\n| `db_paragraph(content)`\
    \ | Create paragraph |\n| `db_code(language, content)` | Create fenced code block\
    \ |\n| `db_blockquote(content)` | Create block quote |\n| `db_list_block(ordered,\
    \ items[])` | Create ordered/unordered list |\n| `db_hr()` | Create horizontal\
    \ rule |\n| `db_image(src, alt, title)` | Create image block |\n| `db_metadata(content)`\
    \ | Create YAML frontmatter |\n| `db_raw(format, content)` | Create raw content\
    \ block |\n\n## Inline Builders\n\n| Function | Description |\n|----------|-------------|\n\
    | `db_text(content)` | Plain text |\n| `db_bold(content)` | Bold/strong text |\n\
    | `db_italic(content)` | Italic/emphasis text |\n| `db_link(href, content)` |\
    \ Hyperlink |\n| `db_inline_code(content)` | Inline code |\n| `db_math(content)`\
    \ | Math expression |\n| `db_strikethrough(content)` | Strikethrough text |\n\
    | `db_superscript(content)` | Superscript |\n| `db_subscript(content)` | Subscript\
    \ |\n\n## Assembly Functions\n\n| Function | Description |\n|----------|-------------|\n\
    | `db_assemble(blocks[])` | Combine blocks into document |\n| `db_document(blocks[])`\
    \ | Alias for db_assemble |\n| `db_section(level, title, children[])` | Create\
    \ section with heading |\n| `db_concat(blocks1, blocks2)` | Concatenate block\
    \ lists |\n| `db_rebase_levels(blocks, offset)` | Adjust heading levels |\n\n\
    ## Extraction Functions\n\n| Function | Description |\n|----------|-------------|\n\
    | `db_blocks_to_text(blocks)` | Extract plain text |\n| `db_blocks_headings(blocks)`\
    \ | Extract heading hierarchy |\n| `db_blocks_toc(blocks)` | Generate table of\
    \ contents |\n\n## Validation\n\n| Function | Description |\n|----------|-------------|\n\
    | `db_blocks_validate(blocks)` | Validate document structure |\n\n## Pandoc Integration\n\
    \nConvert between Pandoc JSON AST and duck_block without requiring Pandoc:\n\n\
    | Function | Description |\n|----------|-------------|\n| `pandoc_inlines_to_db_inlines(json)`\
    \ | Parse Pandoc inline AST |\n| `db_inlines_to_pandoc(blocks)` | Convert to Pandoc\
    \ inline AST |\n\n## Ecosystem Integration\n\nDuck Block Utils works seamlessly\
    \ with other DuckDB document extensions:\n\n- **[duckdb_markdown](https://github.com/teaguesterling/duckdb_markdown)**\
    \ - Read markdown files with `read_markdown_blocks()`, write with `COPY ... TO\
    \ ... (FORMAT markdown, MARKDOWN_MODE duck_block)`\n- **[duckdb_webbed](https://github.com/teaguesterling/duckdb_webbed)**\
    \ - HTML parsing and generation\n\n```sql\n-- Read markdown, manipulate with duck_block_utils,\
    \ write back\nLOAD markdown;\nLOAD duck_block_utils;\n\n-- Add a disclaimer to\
    \ all documents\nCOPY (\n    SELECT block.* FROM (\n        SELECT unnest(db_assemble([\n\
    \            (SELECT list(b) FROM read_markdown_blocks('doc.md') b),\n       \
    \     db_hr(),\n            db_paragraph('Generated by DuckDB')\n        ])) as\
    \ block\n    )\n) TO 'output.md' (FORMAT markdown, MARKDOWN_MODE duck_block);\n\
    ```\n"
