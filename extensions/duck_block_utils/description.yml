extension:
  name: duck_block_utils
  description: Build, transform, validate, and extract content from structured documents
    using the duck_block type
  version: 3.2.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - teaguesterling
repo:
  github: teaguesterling/duckdb_duck_block_utils
  ref: 079123dc2ddbacf256da261c78652bb5d1455858
  ref_next: 079123dc2ddbacf256da261c78652bb5d1455858
docs:
  hello_world: "-- Build a document programmatically\nSELECT duck_blocks_assemble([\n\
    \    duck_block_heading(1, 'Hello World'),\n    duck_block_paragraph([\n     \
    \   duck_block_text('This is '),\n        duck_block_bold('important'),\n    \
    \    duck_block_text(' content.')\n    ]),\n    duck_block_code('sql', 'SELECT\
    \ * FROM documents')\n]);\n\n-- Render it as plain text\nSELECT duck_blocks_to_text(duck_blocks_assemble([\n\
    \    duck_block_heading(1, 'Hello World'),\n    duck_block_paragraph('Some prose.')\n\
    ]));\n\n-- Works with the markdown extension for reading and writing files\nLOAD\
    \ markdown;\nLOAD duck_block_utils;\n\n-- Table of contents from a markdown file\n\
    SELECT * FROM duck_blocks_toc_rows(\n    (SELECT list(b) FROM read_markdown_blocks('README.md')\
    \ b)\n);\n\n-- Validate document structure\nSELECT duck_blocks_validate(\n   \
    \ (SELECT list(b) FROM read_markdown_blocks('doc.md') b)\n);\n"
  extended_description: "The Duck Block Utils extension provides tools for building,\
    \ transforming, validating, and\nextracting content from structured documents.\
    \ All functions use the `duck_block` type - a\nunified representation for document\
    \ elements that works across formats.\n\n**Documentation:** [duck-block-utils.readthedocs.io](https://duck-block-utils.readthedocs.io)\n\
    \n## 2.0.0 is a breaking rename\n\nEvery `db_*` function was renamed to `duck_block_*`\
    \ (builders) or `duck_blocks_*`\n(operations on a list). 54 names present in 1.6.1\
    \ are gone and there is no alias\npath, so 1.6.1 queries must be updated. The\
    \ mapping is mechanical:\n\n```sql\ndb_heading(1, 'Title')      ->  duck_block_heading(1,\
    \ 'Title')\ndb_assemble(blocks)         ->  duck_blocks_assemble(blocks)\ndb_blocks_to_text(blocks)\
    \   ->  duck_blocks_to_text(blocks)\ndb_page                     ->  page_break\n\
    ```\n\n## The duck_block Type\n\nA unified struct for block-level, inline and\
    \ metadata-value elements:\n\n```sql\nSTRUCT(\n    kind VARCHAR,             \
    \          -- 'block', 'inline' or 'value'\n    element_type VARCHAR,        \
    \       -- 'heading', 'paragraph', 'bold', 'link', etc.\n    content VARCHAR,\
    \                    -- text, iff the element has a single text child\n    level\
    \ INTEGER,                      -- depth in a depth-first ordering; top is 1\n\
    \    encoding VARCHAR,                   -- 'text', 'json', 'yaml', 'html', 'xml',\n\
    \                                        --   'latex', 'markdown', 'toml'\n  \
    \  attributes MAP(VARCHAR, VARCHAR),   -- element-specific metadata\n    element_order\
    \ INTEGER               -- position in the document\n)\n```\n\n`level` is structural\
    \ depth, never a heading rank - a heading's rank lives in\n`attributes['heading_level']`.\
    \ `content` is populated if and only if an element has\na single text child; a\
    \ heading additionally keeps a flattened title alongside its\nrich children.\n\
    \n## Builders\n\nAll builder functions return `LIST(duck_block)` so they compose\
    \ by nesting:\n\n```sql\nSELECT duck_block_paragraph([\n    duck_block_text('Click\
    \ '),\n    duck_block_link('https://example.com', 'here'),\n    duck_block_text('\
    \ for more.')\n]);\n```\n\n| Function | Description |\n|----------|-------------|\n\
    | `duck_block_heading(level, content)` | Heading (h1-h6) |\n| `duck_block_paragraph(content)`\
    \ | Paragraph |\n| `duck_block_code(language, content)` | Fenced code block |\n\
    | `duck_block_blockquote(content)` | Block quote |\n| `duck_block_list_block(ordered,\
    \ items[])` | Ordered or unordered list |\n| `duck_block_hr()` | Horizontal rule\
    \ |\n| `duck_block_image(src, alt, title)` | Image |\n| `duck_block_metadata(content)`\
    \ | Metadata blob (YAML frontmatter) |\n| `duck_block_raw(format, content)` |\
    \ Raw content block |\n| `duck_block_text(content)` | Plain text |\n| `duck_block_bold(content)`\
    \ | Bold |\n| `duck_block_italic(content)` | Italic |\n| `duck_block_link(href,\
    \ content)` | Hyperlink |\n| `duck_block_inline_code(content)` | Inline code |\n\
    | `duck_block_math(content)` | Math |\n| `duck_block_strikethrough(content)` |\
    \ Strikethrough |\n| `duck_block_superscript(content)` / `duck_block_subscript(content)`\
    \ | Super/subscript |\n\n## Assembly\n\n| Function | Description |\n|----------|-------------|\n\
    | `duck_blocks_assemble(blocks[])` | Combine blocks into a document |\n| `duck_blocks_document(blocks[])`\
    \ | Alias for assemble |\n| `duck_block_section(level, title, children[])` | Section\
    \ with a heading |\n| `duck_blocks_concat(a, b)` | Concatenate block lists |\n\
    | `duck_blocks_rebase_levels(blocks, offset)` | Shift heading levels |\n\n## Query\
    \ and extraction\n\n| Function | Description |\n|----------|-------------|\n|\
    \ `duck_blocks_to_text(blocks)` | Plain text |\n| `duck_blocks_headings(blocks)`\
    \ | Heading hierarchy |\n| `duck_blocks_toc_rows(blocks)` | Table of contents,\
    \ one row per entry |\n| `duck_blocks_get_section(blocks, pattern)` | One section\
    \ by title or id |\n| `duck_blocks_sections_like(blocks, term)` | Sections whose\
    \ text matches |\n| `duck_blocks_page_rows(blocks)` | Page boundaries, separate\
    \ from the outline |\n| `duck_blocks_get_pages(blocks, first, last)` | A page\
    \ range |\n| `duck_blocks_links(blocks)` | Every link |\n| `duck_blocks_stats(blocks)`\
    \ / `duck_blocks_structure(blocks)` | Document shape |\n| `duck_blocks_diff(before,\
    \ after)` | ADDED / REMOVED / MOVED between two versions |\n\n## Validation\n\n\
    | Function | Description |\n|----------|-------------|\n| `duck_blocks_validate(blocks)`\
    \ | Spec conformance: valid, plus errors |\n| `duck_blocks_repair(blocks)` | Deterministic\
    \ fixes for the list-level rules: wrap orphans, rebase, renumber |\n| `duck_block_implicit_parent(type,\
    \ kind)` | The wrapper a fragment of that element gets, from the spec table |\n\
    | `duck_block_is_body(kind, element_type)` | Is this element body text: block\
    \ or inline, and not the metadata blob |\n| `duck_blocks_lint(blocks)` | Advisory\
    \ conformance warnings |\n| `duck_blocks_quality(blocks)` | Document quality,\
    \ which is NOT conformance |\n| `duck_block_spec_version()` | The spec version\
    \ this build implements |\n\n## Rendering\n\n| Function | Description |\n|----------|-------------|\n\
    | `duck_blocks_render_ansi(blocks, width)` | Terminal rendering with themes |\n\
    \n## Pandoc integration\n\nConvert between Pandoc's JSON AST and `duck_block`\
    \ without invoking Pandoc:\n\n| Function | Description |\n|----------|-------------|\n\
    | `pandoc_ast_to_blocks(json)` | Parse a Pandoc AST |\n| `duck_blocks_to_pandoc_ast(blocks)`\
    \ | Emit a full Pandoc document |\n| `duck_blocks_to_pandoc_blocks(blocks)` |\
    \ Emit just the block list |\n| `read_pandoc_ast(path)` / `write_pandoc_ast(path,\
    \ blocks)` | Read and write AST files |\n\n## Ecosystem\n\n- **[duckdb_markdown](https://github.com/teaguesterling/duckdb_markdown)**\
    \ - `read_markdown_blocks()`, and `COPY ... TO ... (FORMAT markdown, MARKDOWN_MODE\
    \ duck_block)`\n- **[duckdb_webbed](https://github.com/teaguesterling/duckdb_webbed)**\
    \ - HTML parsing and generation\n\n```sql\n-- Read markdown, append to it, write\
    \ it back\nLOAD markdown;\nLOAD duck_block_utils;\n\nCOPY (\n    SELECT unnest(duck_blocks_concat(\n\
    \        (SELECT list(b) FROM read_markdown_blocks('doc.md') b),\n        duck_blocks_assemble([\n\
    \            duck_block_hr(),\n            duck_block_paragraph('Generated by\
    \ DuckDB')\n        ])\n    )) AS block\n) TO 'output.md' (FORMAT markdown, MARKDOWN_MODE\
    \ duck_block);\n```\n"
