extension:
  name: marc21
  description: Read, write, validate and edit MARC 21 bibliographic data (ISO 2709,
    MARCXML, MARC-in-JSON, breaker, Aleph; UTF-8 and MARC-8)
  version: 1.0.1
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - mgbilby
repo:
  github: mgbilby/duckdb-marc21
  ref: b8d76107050ad1d46815c2f37dfff44844bde5d8
docs:
  hello_world: "-- 1. Read a binary MARC dump (gzip and globs work; MARC-8 and UTF-8\n\
    --    are detected per record and decoded to NFC Unicode)\nSELECT control_number,\n\
    \       marc_subfield(fields, '245', 'a')  AS title,\n       marc_subfields(fields,\
    \ '650', 'a') AS subjects\nFROM read_marc('catalogue/*.mrc.gz');\n\n-- 2. One\
    \ row per subfield, for frequency and completeness work\nSELECT tag, code, count(*)\
    \ FROM read_marc_subfields('dump.mrc')\nGROUP BY ALL ORDER BY 3 DESC;\n\n-- 3.\
    \ MARCXML, MARC-in-JSON (incl. FOLIO SRS shape), breaker, Aleph\nSELECT * FROM\
    \ read_marcxml('export.xml');\nSELECT * FROM read_marcjson('records.ndjson');\n\
    \n-- 4. Address by MARCspec; validate structurally or against Avram\nSELECT marc_spec(leader,\
    \ fields, '008/35-37') FROM read_marc('dump.mrc');\nSELECT marc_validate(leader,\
    \ fields)          FROM read_marc('dump.mrc');\n\n-- 5. Batch-edit and write back\
    \ \u2014 full encoding crosswalk\nCOPY (SELECT marc_set_subfield(fields, '040',\
    \ 'a', 'XX-XxUND') AS fields,\n             leader\n      FROM read_marc('in.mrc'))\n\
    TO 'out.mrc' (FORMAT marc, ENCODING 'marc8');\n\n-- 6. Or write MARCXML / breaker\
    \ / MARC-in-JSON\nCOPY (SELECT * FROM read_marc('in.mrc')) TO 'out.xml' (FORMAT\
    \ marcxml);\n"
  extended_description: "A cleanly licensed MARC 21 toolkit for DuckDB, aimed at cataloging\
    \ and\nmetadata librarians: the parser, MARC-8 tables and writer are implemented\n\
    from ISO 2709 and the Library of Congress specifications only, not from\nprevious\
    \ software, and verified by differential fuzzing and round-trip\ntesting.\n\n\
    ### Read\n`read_marc` (nested LIST(STRUCT) per record), `read_marc_subfields`\n\
    (one row per subfield), `read_marc_raw` (original bytes + error column),\n`read_marcxml`,\
    \ `read_marc_breaker`, `read_marcjson` (community shape,\nNDJSON and FOLIO SRS\
    \ envelopes), `read_alephseq`.  Glob patterns, gzip,\nand DuckDB FileSystem protocols\
    \ (httpfs URLs \u2014 including SRU and OAI-PMH\nresponses, whose envelopes are\
    \ handled).  `read_z3950` retrieves records\nlive from Z39.50 servers (Library\
    \ of Congress, OCLC, most ILSes) with a\nbuilt-in dependency-free client.  Scans\
    \ parallelise across and within\nfiles.\n\n### Write\n`COPY ... TO (FORMAT marc\
    \ | marcxml | mrk | marcjson)`.  ISO 2709 output\nin UTF-8 or MARC-8 (full LC\
    \ code tables: ANSEL, Cyrillic, Greek, Hebrew,\nArabic, EACC with escape designations;\
    \ NCR fallback), round-trip tested.\n\n### Query, validate, edit\nMARCspec addressing\
    \ (`marc_spec`), structural and Avram-schema validation\n(`marc_validate`, `marc_validate_avram`),\
    \ format detection, record\nediting (`marc_set_subfield`, `marc_remove_fields`,\
    \ `marc_replace_values`,\n...), merge with field protection (`marc_merge`), record\
    \ diff\n(`marc_diff`), identifier normalisation (`marc_isbn13`, `marc_issn`,\n\
    `marc_lccn`, `marc_oclc`), NACO normalisation and match keys for\ndeduplication,\
    \ and a FOLIO Source Record Storage bridge\n(`marc_parse_json`) for in-place analytics\
    \ on an ATTACHed FOLIO database.\n"
