extension:
  name: yardstick
  description: Measure-aware SQL implementing Julian Hyde's 'Measures in SQL' paper
  version: 0.7.0
  language: C++
  build: cmake
  license: MIT
  requires_toolchains: rust
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads
  maintainers:
  - sidequery
repo:
  github: sidequery/yardstick
  ref: f19d73fa93f2601cfa81ca3ebad841dffcc5f609
docs:
  hello_world: "-- Create a view with measures\nCREATE VIEW sales_v AS\nSELECT\n \
    \   year,\n    region,\n    SUM(amount) AS MEASURE revenue,\n    COUNT(*) AS MEASURE\
    \ order_count\nFROM sales;\n\n-- Query with AGGREGATE() and AT modifiers\nSELECT\n\
    \    year,\n    region,\n    AGGREGATE(revenue) AS revenue,\n    AGGREGATE(revenue)\
    \ AT (ALL region) AS year_total,\n    AGGREGATE(revenue) / AGGREGATE(revenue)\
    \ AT (ALL region) AS pct_of_year\nFROM sales_v;\n"
  extended_description: '`yardstick` implements Julian Hyde''s "Measures in SQL" paper
    ([arXiv:2406.00251](https://arxiv.org/abs/2406.00251)), adding measure-aware SQL
    to DuckDB.


    Measures are aggregations that know how to re-aggregate themselves when the query
    context changes. This enables:


    **Percent of total** calculations without CTEs or window functions:

    ```sql

    SELECT region, AGGREGATE(revenue) / AGGREGATE(revenue) AT (ALL) AS pct

    FROM sales_v;

    ```


    **Year-over-year comparisons** with simple syntax:

    ```sql

    SELECT year, AGGREGATE(revenue) AT (SET year = year - 1) AS prior_year

    FROM sales_v;

    ```


    **AT Modifiers**:

    - `AT (ALL)` - Grand total across all dimensions

    - `AT (ALL dim)` - Total excluding specific dimension

    - `AT (SET dim = val)` - Fix dimension to specific value

    - `AT (SET dim = expr)` - Fix dimension to expression

    - `AT (WHERE cond)` - Pre-aggregation filter

    - `AT (VISIBLE)` - Use query''s WHERE clause


    For more details, visit the [extension repository](https://github.com/sidequery/yardstick).

    '
