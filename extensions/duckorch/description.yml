extension:
  name: duckorch
  description: "Asset-centric data orchestration with JSON ingestion, partitions,\
    \ declarative automation sensor, Snowflake-compatible CREATE DYNAMIC ASSET, MCP\
    \ server, lineage and OpenLineage emission \u2014 all on DuckDB"
  version: 0.3.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - nkwork9999
repo:
  github: nkwork9999/duck-orch
  ref: a5f55790e10c872c439ff58ba9cbe4ee82f9d0e8
docs:
  hello_world: "LOAD duckorch;\n\n-- 1. Set up state schema and register a directory\
    \ of *.sql task files.\nPRAGMA orch_init;\nPRAGMA orch_register('./tasks/');\n\
    \n-- 2. Run the DAG (topological order, per-layer parallelism).\nSET orch_max_parallel\
    \ = 4;\nPRAGMA orch_run;\n\n-- 3. Asset-aware features (Phase 13+):\nPRAGMA orch_asset_list;\
    \                            -- all registered Assets\nPRAGMA orch_asset_partitions('analytics.daily');\
    \   -- per-partition status\nPRAGMA orch_backfill('analytics.daily', '2026-01-01',\
    \ '2026-12-31');\n\n-- 4. Snowflake-compatible declaration (Phase 17):\nPRAGMA\
    \ orch_create_dynamic_asset(\n  'analytics.region_total',\n  '5 minutes',\n  'SELECT\
    \ region, SUM(total) AS rt FROM analytics.daily GROUP BY region');\n\n-- 5. Sensor\
    \ \u2014 auto-materializes when upstream updates (Phase 15):\nPRAGMA orch_sensor_set_interval(30);\n\
    PRAGMA orch_sensor_start;\n\n-- 6. Mermaid lineage:\nPRAGMA orch_visualize('lineage');\n\
    \n-- 7. JSON ingestion (Phase 19): nested JSON becomes flat parent/child\n-- \
    \   tables, and later-arriving columns are absorbed automatically.\nPRAGMA orch_ingest_preview('orders.jsonl',\
    \ 'raw.orders');   -- shape only\nPRAGMA orch_ingest_run('orders/*.jsonl', 'raw.orders');\n\
    PRAGMA orch_ingest_run('orders.jsonl', 'raw.orders',\n                       disposition\
    \ = 'merge', primary_key = 'id');\nPRAGMA orch_ingest_http('https://api.example.com/orders',\
    \ 'raw.orders',\n                        secret = 'orders_api', paginate = 'cursor',\n\
    \                        records_path = 'data', cursor_path = 'meta.next',\n \
    \                       cursor_param = 'cursor');\n"
  extended_description: "duckorch is a **DuckDB-native, single-file Asset orchestrator**\
    \ that\nbrings Dagster's declarative automation and Snowflake's\n`CREATE DYNAMIC\
    \ TABLE` semantics into a `LOAD duckorch;`. Designed to\nrun on a laptop or in\
    \ a plane without a cloud control plane.\n\n**Task definition (SQLMesh-style headers\
    \ in plain .sql files):**\n\n    -- @asset name=analytics.user_stats\n    -- @asset_group\
    \ sales\n    -- @partitions_by daily(start=2026-01-01)\n    -- @param partition_key:DATE\n\
    \    -- @automation eager AND NOT in_progress()\n    -- @freshness max_lag=60min\n\
    \    -- @check name=positive \"SELECT MIN(rev) FROM ${asset}\" expect gt 0\n\n\
    \    CREATE OR REPLACE TABLE analytics.user_stats AS\n    SELECT country, SUM(rev)\
    \ AS rev\n    FROM analytics.clean_users\n    WHERE event_date = $partition_key\n\
    \    GROUP BY country;\n\nInputs auto-extracted via `sqlparser-rs`. `$partition_key`\
    \ bound via\nDuckDB `PREPARE` (multi-statement aware).\n\n**Capabilities:**\n\
    - **Tasks + DAG** (Phase 0-9): directory-loaded SQL files, topological\n  execution,\
    \ per-layer parallelism, exponential backoff retry, downstream\n  skip, `@test`,\
    \ Mermaid (`lineage` / `dag` / `combined`), OpenLineage\n  events, table- and\
    \ column-level lineage with subtype taxonomy, opt-in\n  ad-hoc query capture,\
    \ DuckLake-aware OL namespace.\n- **MCP server** (Phase 11): `duck-orch-mcp` stdio\
    \ server (rmcp 0.3)\n  with 9 tools for Claude Code integration (`list_assets`,\
    \ `run_pipeline`\n  with `dry_run` default, etc.).\n- **Asset** (Phase 13): `@asset`\
    \ headers promote outputs to first-class\n  Assets in `__orch__.assets` with materialization\
    \ history, code_version\n  hash, declared edges. Backward compatible with `@outputs`.\n\
    - **Partition** (Phase 14): `@partitions_by daily/static/multi`,\n  `$partition_key`\
    \ bind, `orch_backfill`, calendar-style \u2705\u26AA ASCII view.\n- **AutomationCondition\
    \ + Sensor** (Phase 15): DSL\n  (`eager / on_cron / on_missing / freshness_violated\
    \ / in_progress`\n  + `&` / `|` / `!`), `@target_lag` throttle, background `std::thread`\n\
    \  sensor that polls and auto-fires `RunSingleTask` when conditions met.\n- **Freshness\
    \ + Asset Check** (Phase 16): `@freshness max_lag=...`,\n  `@check name=N \"<SQL>\"\
    \ expect <op> <value>` with auto-run on success\n  and `severity=error` blocking\
    \ downstream.\n- **Snowflake `CREATE DYNAMIC ASSET`** (Phase 17): `PRAGMA\n  orch_create_dynamic_asset(name,\
    \ target_lag, sql)` synthesizes Asset +\n  `automation_condition='eager()'` so\
    \ the sensor picks it up. The\n  `duck-orch dynamic migrate-from-snowflake <dump>`\
    \ CLI parses Snowflake\n  dumps and registers each block (skipping `WAREHOUSE`/`REFRESH_MODE`).\n\
    \n- **JSON ingestion** (Phase 19): `orch_ingest_run` / `orch_ingest_http`\n  normalize\
    \ nested JSON into parent/child tables (structs flatten into\n  the parent, arrays\
    \ become child tables linked by `_orch_parent_id` /\n  `_orch_index`). A schema\
    \ ledger versions each shape and absorbs added\n  columns and widening types via\
    \ `ALTER`; incompatible changes fail the\n  load with the column named. Write\
    \ dispositions `append` / `replace` /\n  `merge` (`primary_key`-driven, children\
    \ included). HTTP sources support\n  `page` / `offset` / `cursor` / `link` pagination,\
    \ bearer tokens from a\n  DuckDB secret, resume cursors, and a reported page ceiling.\
    \ A\n  three-part target (`lake.raw.orders`) loads into an attached catalog,\n\
    \  so DuckLake is just another destination. Loaded tables register as\n  Assets\
    \ with lineage back to the source URI.\n\n**3-route surface**: every feature reachable\
    \ from CLI (`duck-orch ...`),\nSQL (`PRAGMA orch_*`), and MCP (Claude Code).\n\
    \n**Companion CLI:** `duck-orch` with `register / run / status / graph /\ntest\
    \ / validate / impact / lineage / schedule / asset / backfill /\nautomation /\
    \ sensor / check / dynamic` subcommands, all `--json`-capable.\n\n**State tables:**\
    \ `__orch__.{tasks, runs, lineage_edges, column_lineage,\ntask_edges, tests, schedules,\
    \ assets, asset_materializations,\nasset_edges, asset_partitions, automation_evaluations,\
    \ asset_checks,\nasset_check_results, ingest_schemas, ingest_schema_changes,\n\
    ingest_loads, ingest_state, ingest_fetches}`.\n\n**Architecture:** thin C++ shim\
    \ (~3000 lines, registers PRAGMAs, runs\nSQL via per-thread Connection, hosts\
    \ the sensor thread, exposes\nOptimizerExtension for ad-hoc capture) plus a Rust\
    \ workspace\n(orch_common / orch_dag / orch_lineage / orch_runtime / orch_ol /\n\
    orch_ingest / orch_core / orch_cli / orch_mcp), keeping all logic in\nRust while\
    \ the\nC++ layer handles DuckDB-internal calls.\n"
