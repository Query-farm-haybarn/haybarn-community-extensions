extension:
  name: dbn
  description: Read Databento DBN (Databento Binary Encoding) market-data files, including
    Zstd-compressed .dbn.zst captures, directly as SQL tables
  version: 0.1.0
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads
  maintainers:
  - tbeason
repo:
  github: tbeason/duckdb-dbn
  ref: f02302ca18112032dbcc13a63e82179f43d64f5b
docs:
  hello_world: '-- Inspect a DBN file (works on .dbn and .dbn.zst)

    SELECT * FROM dbn_metadata(''XNAS-20240101.trades.dbn.zst'');


    -- Query a schema-specific reader

    SELECT ts_event, instrument_id, price, size, side

    FROM read_dbn_trades(''XNAS-20240101.trades.dbn.zst'')

    WHERE side = ''B''

    ORDER BY ts_event

    LIMIT 10;


    -- Polymorphic reader dispatches on the file''s metadata.schema

    SELECT count(*) FROM read_dbn(''capture.dbn.zst'');


    -- Globs read many files in order as one table

    SELECT * FROM read_dbn_mbp1(''data/2024-01-*.mbp-1.dbn.zst'');

    '
  extended_description: "The `dbn` extension reads [Databento](https://databento.com)\
    \ DBN\n(Databento Binary Encoding) files directly as SQL tables \u2014 no conversion\n\
    step and no Python. It supports every DBN market-data schema (trades, mbo,\nmbp-1/mbp-10,\
    \ tbbo, bbo/cbbo/cmbp-1/tcbbo, ohlcv, status, imbalance,\nstatistics, definition),\
    \ DBN versions 1\u20133, and transparent Zstd\ndecompression of the `.dbn.zst`\
    \ captures Databento ships.\n\nEach schema has a dedicated reader (`read_dbn_trades`,\
    \ `read_dbn_mbo`, \u2026),\nplus a polymorphic `read_dbn(path)` that dispatches\
    \ on the file's metadata,\n`dbn_metadata(path)` for file inspection, and `dbn_records(path)`\
    \ for raw\nrecord access. Filter and projection pushdown run inside the scan,\
    \ all\n`ts_*` columns are `TIMESTAMP_NS`, and DBN \"undefined\" sentinels are\n\
    surfaced as SQL `NULL`. For live captures, `symbols := true` resolves\n`instrument_id`\
    \ to its raw symbol inline.\n\nDecoding is differentially verified bit-identical\
    \ to the official\n`databento` Python decoder across every schema and DBN version.\
    \ This is an\nindependent reader, not affiliated with Databento.\n"
