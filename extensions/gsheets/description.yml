extension:
  name: gsheets
  description: Read and write Google Sheets using SQL
  version: 0.0.9
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: windows_amd64_rtools;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
  maintainers:
  - archiewood
  - mharrisb1
repo:
  github: evidence-dev/duckdb_gsheets
  ref: a209d8a42c8e35cd571467dd7ae2eb65fcb96f75
docs:
  hello_world: "-- Authenticate with Google Account in the browser (easiest)\nCREATE\
    \ SECRET (TYPE gsheet);\n\n-- OR create a secret with your Google API access token\
    \ (boring, see extension docs)\nCREATE SECRET (\n  TYPE gsheet, \n  PROVIDER access_token,\
    \ \n  TOKEN '<your_token>'\n);\n\n-- Read a spreadsheet by full URL\nFROM read_gsheet('https://docs.google.com/spreadsheets/d/11QdEasMWbETbFVxry-SsD8jVcdYIT1zBQszcF84MdE8/edit');\n\
    \n-- Read a spreadsheet by full URL, implicitly\nFROM 'https://docs.google.com/spreadsheets/d/11QdEasMWbETbFVxry-SsD8jVcdYIT1zBQszcF84MdE8/edit';\n\
    \n-- Read a spreadsheet by spreadsheet id\nFROM read_gsheet('11QdEasMWbETbFVxry-SsD8jVcdYIT1zBQszcF84MdE8');\n\
    \n-- Read a spreadsheet with no header row\nSELECT * FROM read_gsheet('11QdEasMWbETbFVxry-SsD8jVcdYIT1zBQszcF84MdE8',\
    \ headers=false);\n\n-- Read all values in as varchar, skipping type inference\n\
    SELECT * FROM read_gsheet('11QdEasMWbETbFVxry-SsD8jVcdYIT1zBQszcF84MdE8', all_varchar=true);\n\
    \n-- Read a sheet other than the first sheet using the sheet name\nSELECT * FROM\
    \ read_gsheet('11QdEasMWbETbFVxry-SsD8jVcdYIT1zBQszcF84MdE8', sheet='Sheet2');\n\
    \n-- Read a sheet other than the first sheet using the sheet id in the URL\nSELECT\
    \ * FROM read_gsheet('https://docs.google.com/spreadsheets/d/11QdEasMWbETbFVxry-SsD8jVcdYIT1zBQszcF84MdE8/edit?gid=644613997#gid=644613997');\n\
    \n-- Write a spreadsheet from a table by spreadsheet id\nCOPY <table_name> TO\
    \ '11QdEasMWbETbFVxry-SsD8jVcdYIT1zBQszcF84MdE8' (FORMAT gsheet);\n\n-- Write\
    \ a spreadsheet from a table by full URL\nCOPY <table_name> TO 'https://docs.google.com/spreadsheets/d/11QdEasMWbETbFVxry-SsD8jVcdYIT1zBQszcF84MdE8/edit?usp=sharing'\
    \ (FORMAT gsheet);\n\n-- Create a sheet if it doesn't already exist\nCOPY <table_name>\
    \ TO 'https://docs.google.com/spreadsheets/d/11QdEasMWbETbFVxry-SsD8jVcdYIT1zBQszcF84MdE8/edit'\
    \ (FORMAT gsheet, sheet 'Woot', create_if_not_exists true);\n\n-- Write a spreadsheet\
    \ to a specific sheet using the sheet id in the URL\nCOPY <table_name> TO 'https://docs.google.com/spreadsheets/d/11QdEasMWbETbFVxry-SsD8jVcdYIT1zBQszcF84MdE8/edit?gid=1295634987#gid=1295634987'\
    \ (FORMAT gsheet);\n"
  extended_description: 'The DuckDB GSheets Extension allows reading and writing of
    data in Google Sheets from DuckDB.

    For detailed setup and usage instructions, visit the docs at [duckdb-gsheets.com](https://duckdb-gsheets.com).

    '
