extension:
  name: snowflake
  description: Snowflake data source extension - query Snowflake databases directly
    from DuckDB
  version: 0.5.2
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - iqea-ai
repo:
  github: iqea-ai/duckdb-snowflake
  ref: b61f5ad827373db9a5614e5183c1477f601cc82c
install_notes: "**Important:** This extension requires the ADBC Snowflake driver (a\
  \ separate shared library) to function.\n\nInstall it either with the [dbc](https://docs.columnar.tech/dbc/)\
  \ driver manager:\n\n    dbc install snowflake\n\nor with the repository's installer\
  \ script. No environment variable is needed in either case: the\nextension discovers\
  \ the driver next to itself, through standard ADBC driver manifests, and (on\nWindows)\
  \ through the ADBC registry keys.\n\nFor platform-specific setup and troubleshooting,\
  \ see the\n**[ADBC Driver Installation Guide](https://github.com/iqea-ai/duckdb-snowflake#adbc-driver-setup)**\n\
  in the [extension repository](https://github.com/iqea-ai/duckdb-snowflake).\n"
docs:
  hello_world: "-- Install and load the extension\nINSTALL snowflake FROM community;\n\
    LOAD snowflake;\n\n-- Create a Snowflake secret with password authentication\n\
    CREATE SECRET my_snowflake (\n    TYPE snowflake,\n    ACCOUNT 'your-account',\n\
    \    USER 'your-username',\n    PASSWORD 'your-password',\n    DATABASE 'your-database'\n\
    );\n\n-- Query Snowflake data using pass-through query function\nSELECT * FROM\
    \ snowflake_query(\n    'SELECT * FROM customers WHERE state = ''CA''',\n    'my_snowflake'\n\
    );\n\n-- Attach Snowflake database for direct SQL access\nATTACH '' AS sf (TYPE\
    \ snowflake, SECRET my_snowflake, READ_ONLY);\nSELECT * FROM sf.schema.customers\
    \ WHERE state = 'CA';\n"
  extended_description: "This community-maintained extension allows DuckDB to connect\
    \ to Snowflake using Arrow ADBC drivers. \nIt provides seamless connectivity between\
    \ DuckDB and Snowflake, supporting multiple authentication methods \n(password,\
    \ key pair, OAuth, external browser/SSO, Okta), predicate pushdown optimization,\
    \ and comprehensive SQL operations.\n\n**Features:**\n- Multiple authentication\
    \ methods (Password, Key Pair, OAuth, External Browser/SSO, Okta)\n- Direct SQL\
    \ passthrough via `snowflake_query()` function\n- ATTACH support for mounting\
    \ Snowflake databases as DuckDB catalogs\n- Native `GEOMETRY`/`GEOGRAPHY` support\
    \ via GeoArrow\n- Predicate pushdown optimization (optional)\n- Hybrid queries:\
    \ join Snowflake tables with local DuckDB tables\n- Full DML read operations:\
    \ SELECT with WHERE, JOIN, aggregations, subqueries\n\n**Prerequisites:** The\
    \ ADBC Snowflake driver must be installed separately (`dbc install snowflake`\
    \ or the repository's installer script).\n**See the [ADBC Driver Installation\
    \ Guide](https://github.com/iqea-ai/duckdb-snowflake#adbc-driver-setup) \nfor\
    \ complete setup instructions.** For comprehensive usage examples, authentication\
    \ methods, and \nadvanced features, visit the [extension repository](https://github.com/iqea-ai/duckdb-snowflake).\n"
