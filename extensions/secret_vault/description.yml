extension:
  name: secret_vault
  description: 'Encrypted local storage for persistent secrets: a drop-in SecretStorage
    (local_encrypted) that writes AES-256-GCM ciphertext instead of plaintext, with
    keyring/passphrase/env key providers, migration, rotation, and one-time-envelope
    export/import'
  version: 0.2.1
  language: C++
  build: cmake
  license: BSL 1.1
  excluded_platforms: linux_amd64_musl;osx_amd64;osx_arm64;wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw
  requires_toolchains: rust
  maintainers:
  - robert-guangzhou
  - xiehuiqiang
repo:
  github: robert-guangzhou/duckdb-secret-vault
  ref: 05711e360231f0149a700d664bbfba3a2de50f63
docs:
  hello_world: "INSTALL secret_vault FROM community;\nLOAD secret_vault;\n\n-- Persistent\
    \ secrets are now written encrypted (DSVLT + AES-256-GCM).\n-- The default key\
    \ provider is 'keyring' (OS keychain).\nCREATE PERSISTENT SECRET my_s3 IN local_encrypted\
    \ (\n    TYPE s3, KEY_ID 'AKIA...', SECRET 'shhh', REGION 'us-east-1');\n\nSELECT\
    \ name, storage, secret_string FROM duckdb_secrets();\n-- my_s3 | local_encrypted\
    \ | ... secret=redacted ...\n\n-- On servers and in CI, use the 'env' provider\
    \ instead.\n-- It requires SECRET_VAULT_KEY (base64, 32 bytes) to be set before\
    \ DuckDB starts:\n-- SET secret_vault_provider = 'env';\n"
  extended_description: "DuckDB stores persistent secrets on disk in **unencrypted**\
    \ binary form\n(`~/.duckdb/stored_secrets`). secret_vault registers an alternative\
    \ storage,\n`local_encrypted`, that writes every secret as AES-256-GCM ciphertext\
    \ with a\nper-file random nonce and an AEAD tag bound to the secret name (rename/tamper\n\
    fails loudly). Files keep 600 permissions; the key never touches disk:\n\n- **keyring**\
    \ (default): a random 256-bit master key in the OS keychain\n  (Windows Credential\
    \ Manager / macOS Keychain / Linux Secret Service),\n  generated on first use.\n\
    - **passphrase**: Argon2id (64 MiB, t=3) with a per-file random salt.\n- **env**:\
    \ a base64 32-byte key injected per run for schedulers/CI.\n\nAlso ships `secret_vault_status()`,\
    \ `secret_vault_migrate()` (plaintext\nlocal_file secrets -> encrypted, conflict-safe),\
    \ `secret_vault_rotate()`\n(re-encrypt everything under a new provider/key), `secret_vault_reload()`\n\
    (pick up secrets added, changed or removed on disk by another instance),\nand\
    \ one-time encrypted **envelopes** (`secret_vault_export`/`import`) to\nmove secrets\
    \ between instances without ever putting a key in the\nenvironment: the envelope\
    \ is sealed under a single-use 256-bit transport\ncode (base32, entered via stdin),\
    \ and the importing instance re-encrypts\nwith its own local key. Works with any\
    \ secret type (s3, mysql, postgres,\nnats_rw, ...) because it encrypts DuckDB's\
    \ own serialization blob.\n\nA key-generation guide is in the README; the threat\
    \ model and the\ndevelopment / repin docs are in the repo's `docs/` directory.\n"
