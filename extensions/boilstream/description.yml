extension:
  name: boilstream
  description: Secure remote secrets storage with OPAQUE PAKE authentication, email/password
    registration, MFA login, and automatic ducklake mounting
  version: 0.6.0
  language: C++, Rust
  build: cmake
  license: MIT
  maintainers:
  - dforsber
  requires_toolchains: rust
repo:
  github: dforsber/boilstream-extension
  ref: bd3c28def8d92921728729f499471cd165b90dc4
docs:
  hello_world: "-- Setup: Install and load boilstream extension\nINSTALL httpfs; LOAD\
    \ httpfs;\nINSTALL boilstream FROM community;\nLOAD boilstream;\n\n-- Option 1:\
    \ Login with email/password/MFA (establishes OPAQUE session)\n--     NOTE: Remember\
    \ to clean up your ~/.duckdb/history\nPRAGMA boilstream_login('https://api.example.com/user@example.com',\
    \ 'password', '123456');\n\u250C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u252C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502         status      \
    \   \u2502     expires_at      \u2502 ducklakes_attached \u2502\n\u251C\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253C\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u253C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2524\n\u2502 Session token obtained \u2502 2025-11-21 10:30:00 \u2502      \
    \            2 \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\
