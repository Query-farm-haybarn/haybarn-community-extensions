    \u2500\u2500\u2500\u2500\u2500\u2500\u2518\n\n-- Option 2: Authenticate with bootstrap\
    \ token (from SSO/web UI)\nPRAGMA boilstream_bootstrap_session('https://api.example.com/secrets:TOKEN');\n\
    \u250C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\
