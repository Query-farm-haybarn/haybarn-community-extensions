    \u2500\u2500\u2500\u2510\n\u2502        name         \u2502   type   \u2502  \
    \   expires_at      \u2502\n\u251C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u253C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253C\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 my_analytics        \u2502\
    \ ducklake \u2502 2026-11-19 20:00:00 \u2502\n\u2502 my_analytics_s3     \u2502\
    \ s3       \u2502 2026-11-19 20:00:00 \u2502\n\u2502 my_analytics_pg     \u2502\
    \ postgres \u2502 2026-11-19 20:00:00 \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n\n-- Create\
    \ new ducklake\nPRAGMA boilstream_create_ducklake('new_catalog', 'My new ducklake');\n\
    \n-- Query ducklake (automatically attached)\nUSE my_analytics;\nSHOW TABLES;\n\
    \n-- Create persistent secret onto BoilStream server\nCREATE PERSISTENT SECRET\
    \ s3_minio IN boilstream (\n    TYPE S3,\n    KEY_ID 'minioadmin',\n    SECRET\
    \ 'minioadmin',\n    REGION 'eu-west-1',\n    ENDPOINT 'localhost:9000',\n   \
    \ USE_SSL false,\n    URL_STYLE 'path',\n    SCOPE 's3://ingestion-data/'\n);\n"
  extended_description: "Boilstream extension provides enterprise-grade remote secrets\
    \ storage for multi-tenant DuckDB deployments.\n\n**Features:**\n- \U0001F510\
    \ **OPAQUE PAKE Authentication** - Password-less authentication (IETF RFC 9807)\n\
    - \U0001F512 **End-to-end Encryption** - AES-256-GCM/ChaCha20-Poly1305 for secrets\
    \ and responses\n- \U0001F511 **Cryptographic Key Derivation** - HKDF-SHA256 with\
    \ domain separation\n- \U0001F6E1\uFE0F **Defense in Depth** - HMAC verification\
    \ before AEAD decryption\n- \U0001F3AF **Session Protection** - Lock-step sequence\
    \ protocol prevents hijacking\n- \U0001F5C4\uFE0F **Ducklake Support** - Auto-attach\
    \ multi-tenant data catalogs\n- \U0001F310 **SSO Integration** - Bootstrap token\
    \ exchange for web environments\n\n**Security:**\n- Facebook's audited OPAQUE\
    \ implementation (Rust + C++ FFI)\n- Protects against MITM attacks even if TLS\
    \ is compromised\n- One-time bootstrap tokens with anonymous authentication\n\
    - Session resumption with encrypted refresh tokens\n- Comprehensive test vectors\
    \ and security specification\n\n**API Functions:**\n- `PRAGMA boilstream_register_user(url_with_email,\
    \ password)` - Register new user with MFA (displays QR code)\n- `PRAGMA boilstream_verify_mfa(totp_code)`\
    \ - Complete registration and get backup codes\n- `PRAGMA boilstream_login(url_with_email,\
    \ password, mfa_code)` - Email/password/MFA login\n- `PRAGMA boilstream_bootstrap_session(url_with_token)`\
    \ - Authenticate with bootstrap token\n- `boilstream_ducklakes()` - List available\
    \ ducklakes\n- `boilstream_secrets()` - List cached secrets with expiration\n\
    - `boilstream_buckets()` - List available storage buckets\n- `PRAGMA boilstream_create_ducklake(name,\
    \ description)` - Create new ducklake\n- `PRAGMA boilstream_help` - Show all available\
    \ commands\n\n**Requirements:**\n- httpfs extension (auto-loaded)\n- postgres_scanner\
    \ extension (auto-loaded)\n- ducklake extension (auto-loaded)\n- Compatible REST\
    \ API server (see [API specification](https://github.com/dforsber/boilstream-extension/blob/main/src/README.md))\n\
    \nFor detailed documentation, security specification, and setup instructions,\
    \ visit the [extension repository](https://github.com/dforsber/boilstream-extension).\n"
