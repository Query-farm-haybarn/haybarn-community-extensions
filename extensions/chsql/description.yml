  hello_world: "-- Use 100+ boring ClickHouse SQL function macros in DuckDB SQL queries.\n\
    \nD SELECT toString('world') AS hello, toInt8OrZero('world') AS zero;\n\u250C\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2510\n\u2502  hello  \u2502 zero  \u2502\n\u2502 varchar \u2502\
    \ int64 \u2502\n\u251C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253C\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 world   \u2502     0\
    \ \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2518\n\nD SELECT IPv4NumToString(167772161),\
    \ IPv4StringToNum('10.0.0.1');\n\u250C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\
    \n\u2502 ipv4numtostring(167772161) \u2502 ipv4stringtonum('10.0.0.1') \u2502\n\
    \u2502          varchar           \u2502            int32            \u2502\n\u251C\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u253C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 10.0.0.1                  \
    \ \u2502                   167772161 \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2518\n\n-- Query a remote ClickHouse instance via HTTP/S API using multiple\
    \ formats\n\nD SELECT * FROM ch_scan(\"SELECT number * 100 FROM numbers(3)\",\"\
    https://play.clickhouse.com\", format := 'Parquet');\n\u250C\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 multiply(number, 100)\
    \ \u2502\n\u2502        varchar        \u2502\n\u251C\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 0                     \u2502\n\u2502\
    \ 100                   \u2502\n\u2502 200                   \u2502\n\u2514\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n\n-- Query the emulated\
    \ system tables to explore columns, rows, types, storage, etc\nD SELECT * FROM\
    \ system.tables;\nD SELECT * FROM system.columns;\nD SELECT * FROM system.functions;\n\
    D SELECT * FROM system.uptime;\nD SELECT * FROM system.disks;\n\u250C\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\u2500\u2500\u2500\u2500\
