  extended_description: "\n## DuckDB ClickHouse SQL extension    \nThe DuckDB chsql\
    \ community extension implements 100+ popular [ClickHouse SQL Macros](https://duckdb.org/community_extensions/extensions/chsql#added-functions),\
    \ functions and helpers making it easier for users to transition between OLAP\
    \ systems \u2B50 \n\n### Motivation\nDuckDB is our favourite OLAP engine but ClickHouse\
    \ has lots of integrations and users. This extension is dedicated to ClickHouse\
    \ refugeess.\n\n```\n\u2714 DuckDB SQL is awesome and full of great functions.<br>\n\
    \u2714 ClickHouse SQL is awesome and full of great functions.\n\n\u2714 The DuckDB\
    \ library is ~51M and modular. Can LOAD extensions.<br>\n\u274C The ClickHouse\
    \ monolith is ~551M and growing. No extensions.\n\n\u2714 DuckDB is open source\
    \ and protected by a no-profit foundation.<br>\n\u274C ClickHouse is open core\
    \ and controlled by for-profit corporation.\n\n\u2714 DuckDB embedded is fast,\
    \ mature and elegantly integrated in many languages.<br>\n\u274C chdb is still\
    \ experimental, unstable and currently only supports Python.\n``` \n\n### Extensions\n\
    - [chsql_native](https://duckdb.org/community_extensions/extensions/chsql_native)\
    \ provides a native clickhouse client (binary) and a reader for ClickHouse Native\
    \ format files\n\n#### Legal Disclaimer\n> DuckDB \xAE is a trademark of DuckDB\
    \ Foundation. ClickHouse\xAE is a trademark of ClickHouse Inc. All trademarks,\
    \ service marks, and logos mentioned or depicted are the property of their respective\
    \ owners. The use of any third-party trademarks, brand names, product names, and\
    \ company names is purely informative or intended as parody and does not imply\
    \ endorsement, affiliation, or association with the respective owners.\n"
