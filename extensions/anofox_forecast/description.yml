extension:
  name: anofox_forecast
  # Haybarn: its CMake pins Rust 1.86.0 for wasm (upstream's emscripten 3.1.71 needs it, Haybarn's 6.0.13 does not);
  # build with ci-tools' nightly so std is rebuilt for wasm_threads atomics and native wasm EH.
  haybarn_wasm_cmake_flags: "-DANOFOX_WASM_RUST_TOOLCHAIN="
  version: 2026.10.22
  description: Statistical timeseries forecasting in DuckDB. Supports ARIMA, ETS, Theta, TBATS, MFLES, MSTL, Croston, GARCH, and other models.
  language: C++
  build: cmake
  excluded_platforms: "windows_amd64;windows_amd64_rtools;windows_amd64_mingw;"
  license: BSL 1.1
  requires_toolchains: rust
  maintainers:
    - sipemu
repo:
  github: DataZooDE/anofox-forecast
  ref: b2fbfbe2b7c1f55b9081d77029d484012ff5fd11
