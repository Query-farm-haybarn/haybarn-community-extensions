extension:
  name: vcatbridge
  description: Add RLS to DuckDB
  version: 0.2.3
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: wasm_mvp;wasm_eh
  maintainers:
  - srossross
repo:
  github: n6k-io/duckdb-virtual-catalog
  ref: 68adf2cdd3ddf933d42458815e9eb96f91c7e8f8
docs:
  hello_world: "-- On the SOURCE instance: register a bridge and grant tables.\nLOAD\
    \ vcatbridge;\nSELECT vcatbridge_register_source('b1', 'source_catalog', 'my-secret');\n\
    SELECT vcatbridge_configure_policy('b1', '{\n  \"policy_version\": 1,\n  \"tables\"\
    : {\n    \"main.users\": {\"select\": true, \"update\": \"tenant_id = $tenant\"\
    }\n  }\n}');\nSELECT vcatbridge_set_context('b1', 'tenant', 42);\n\n-- On the\
    \ TARGET instance (same process): redeem the token.\nLOAD vcatbridge;\nATTACH\
    \ '' AS my_bridge (TYPE vcatbridge, ID 'b1', TOKEN 'my-secret');\nSELECT * FROM\
    \ my_bridge.main.users;\n"
  extended_description: 'Row-level security for DuckDB. A private source database
    shares selected tables

    with a target catalog in the same process, with per-table, per-verb grants and

    row rules.


    [Quack](https://duckdb.org/quack/) serves a DuckDB database over the network but

    can''t limit which tables or rows clients see. Serve a `vcatbridge` catalog through

    Quack and clients only see what the policy allows.


    Documentation: https://github.com/n6k-io/duckdb-virtual-catalog/blob/main/docs/vcatbridge.md

    '
