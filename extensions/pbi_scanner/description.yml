docs:
  extended_description: 'Query Power BI Semantic Models from DuckDB using DAX via
    XMLA endpoint.


    - The `dax_query` function executes DAX and returns results as DuckDB tables.

    - `pbi_tables`, `pbi_columns`, `pbi_measures`, and `pbi_relationships` expose
    INFO.VIEW metadata results for model exploration.


    The easiest way to get started is Azure CLI auth (`az login`) with `SET pbi_scanner_auth_mode
    = ''azure_cli''`, but Azure CLI is not required.


    You may also use the DuckDB `azure` extension to create an Azure secret. More
    details and examples are in the [pbi_scanner repository](https://github.com/crazy-treyn/pbi_scanner).

    '
  hello_world: "INSTALL pbi_scanner FROM community;\nLOAD pbi_scanner;\nSET pbi_scanner_auth_mode\
    \ = 'azure_cli';\n\nSELECT *\nFROM dax_query(\n    'Data Source=powerbi://api.powerbi.com/v1.0/myorg/Example%20Workspace;Initial\
    \ Catalog=example_semantic_model;',\n    'EVALUATE TOPN(500, FactSales)'\n);\n"
extension:
  name: pbi_scanner
  description: DuckDB extension for querying Power BI Semantic Models with DAX.
  version: 0.0.4
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;osx_amd64
  maintainers:
  - crazy-treyn
repo:
