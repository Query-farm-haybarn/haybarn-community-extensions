extension:
  name: yaml
  description: Read YAML files into DuckDB with native YAML type support, comprehensive
    extraction functions, and seamless JSON interoperability
  version: 1.6.6
  excluded_platforms: windows_amd64;windows_amd64_mingw
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - teaguesterling
  vcpkg_commit: 656be05781442d5c4cb14978f6c7bf47b6e12b32
repo:
  github: teaguesterling/duckdb_yaml
  ref: 8a1d8444af06682a3cb2933068a6a35af0fec3b2
docs:
  hello_world: "-- Load the extension\nLOAD yaml;\n\n-- Query YAML files directly\n\
    SELECT * FROM 'config.yaml';\nSELECT * FROM 'data/*.yml' WHERE active = true;\n\
    \n-- Create tables with YAML columns\nCREATE TABLE configs(id INTEGER, config\
    \ YAML);\nINSERT INTO configs VALUES (1, E'server: production\\nport: 8080\\nfeatures:\
    \ [logging, metrics]');\n\n-- Extract data using YAML functions\nSELECT\n    config\
    \ ->> '$.server' AS environment,  -- Arrow operator\n    yaml_extract(config,\
    \ '$.port') AS port,\n    yaml_value(config, '$.port') AS port_scalar\nFROM configs;\n\
    \n-- Analyze YAML structure\nSELECT yaml_structure(config) FROM configs;\n-- Returns:\
    \ {\"server\":\"VARCHAR\",\"port\":\"UBIGINT\",\"features\":[\"VARCHAR\"]}\n\n\
    -- Check containment and merge documents\nSELECT yaml_contains(config, 'server:\
    \ production') AS is_prod FROM configs;\nSELECT yaml_merge_patch(config, 'debug:\
    \ true') AS with_debug FROM configs;\n\n-- Convert between YAML and JSON\nSELECT\
    \ yaml_to_json(config) AS json_config FROM configs;\nSELECT to_yaml({name: 'John',\
    \ age: 30}) AS yaml_person;\n\n-- Write query results to YAML\nCOPY (SELECT *\
    \ FROM users) TO 'output.yaml' (FORMAT yaml, STYLE block);\n"
  extended_description: "The YAML extension brings comprehensive YAML support to DuckDB,\
    \ enabling seamless integration of YAML data within SQL queries. \n\n**Key Features:**\n\
    \n- **Native YAML Type**: Full YAML type support with automatic casting between\
    \ YAML, JSON, and VARCHAR\n- **File Reading**: Read YAML files with `read_yaml()`\
    \ and `read_yaml_objects()` functions supporting multi-document files, top-level\
    \ sequences, and robust error handling\n- **Direct File Querying**: Query YAML\
    \ files directly using `FROM 'file.yaml'` syntax\n- **Extraction Functions**:\
    \ Query YAML data with `yaml_extract()`, `yaml_type()`, `yaml_exists()`, `yaml_value()`,\
    \ `->>` operator, and path-based extraction\n- **Document Operations**: Check\
    \ containment with `yaml_contains()`, merge documents with `yaml_merge_patch()`,\
    \ and analyze structure with `yaml_structure()`\n- **Type Detection**: Comprehensive\
    \ automatic type detection for temporal types (DATE, TIME, TIMESTAMP), optimal\
    \ numeric types, and boolean values\n- **Column Type Specification**: Explicitly\
    \ define column types when reading YAML files for schema consistency\n- **YAML\
    \ Output**: Write query results to YAML files using `COPY TO` with configurable\
    \ formatting styles\n- **Multi-Document Support**: Handle files with multiple\
    \ YAML documents separated by `---`\n- **Error Recovery**: Continue processing\
    \ valid documents even when some contain errors\n- **JSON Interoperability**:\
    \ Seamless conversion between YAML and JSON formats\n- **Frontmatter Extraction**:\
    \ Extract YAML frontmatter metadata from other files\n\n**Example Use Cases:**\n\
    \n- Configuration file management and querying\n- Log file analysis and processing\
    \  \n- Data migration between YAML and relational formats\n- Integration with\
    \ YAML-based CI/CD pipelines\n- Processing Kubernetes manifests and Helm charts\n\
    \nThe extension is built using yaml-cpp and follows DuckDB's extension development\
    \ best practices, ensuring reliable performance and cross-platform compatibility.\n\
    \n**Note**: This extension was written primarily using Claude and Claude Code\
    \ as an exercise in AI-driven development.\n"
