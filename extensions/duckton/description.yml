extension:
  name: duckton
  description: "Turn DuckDB into a node of a trustless peer-to-peer query grid \u2014\
    \ SQL is cross-checked by independent hosts to a verifiable quorum over QUIC,\
    \ with optional pay-per-query compute settled on TON"
  version: 0.6.2
  language: Rust
  build: cmake
  license: Apache-2.0
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;linux_amd64_musl;linux_arm64_musl;windows_amd64_mingw;windows_amd64_rtools
  requires_toolchains: rust;python3
  maintainers:
  - Angelerator
repo:
  github: Angelerator/duckton
  ref: 310b6fb4e1bf8e802b08f95731464dd139b0ef39
docs:
  hello_world: "-- Inspect the protocol identity exposed by the extension.\nSELECT\
    \ * FROM p2p_info();\n\u250C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u252C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2510\n\u2502          key          \u2502    value     \u2502\
    \n\u2502        varchar        \u2502   varchar    \u2502\n\u251C\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253C\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502 protocol_name\
    \         \u2502 duckdb-p2p   \u2502\n\u2502 protocol_version      \u2502 1.0.0\
    \        \u2502\n\u2502 min_supported_version \u2502 1.0.0        \u2502\n\u2502\
    \ schema_version        \u2502 1            \u2502\n\u2502 extension_version \
    \    \u2502 0.6.2        \u2502\n\u2502 alpn                  \u2502 duckdb-p2p/1\
    \ \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2518\n\n-- Run SQL through the grid. With no peers configured the query\
    \ executes on\n-- the free local path (an in-process, locked-down DuckDB) and\
    \ streams the\n-- verified rows back through SQL \u2014 so it works out of the\
    \ box.\nSELECT * FROM p2p_query('SELECT 42 AS answer');\n\u250C\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 answer \u2502\n\u2502 int32  \u2502\
    \n\u251C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502   42  \
    \ \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n\n-- The\
    \ companion p2p_query_meta() surfaces the execution/verification outcome\n-- (whether\
    \ it ran locally, whether quorum verified it, the row count, ...).\nSELECT key,\
    \ value FROM p2p_query_meta('SELECT * FROM range(3)')\nWHERE key IN ('executed_locally',\
    \ 'verified', 'result_rows');\n\u250C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502       key     \
    \   \u2502  value  \u2502\n\u2502     varchar      \u2502 varchar \u2502\n\u251C\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u253C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2524\n\u2502 executed_locally \u2502 true    \u2502\n\u2502 verified\
    \         \u2502 true    \u2502\n\u2502 result_rows      \u2502 3       \u2502\
    \n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2518\n"
  extended_description: "**Can you trust a query result you didn't compute yourself?**\
    \ `duckton` turns\nDuckDB into a node of a peer-to-peer query grid that answers\
    \ that question with\ncryptography instead of faith. A query is dispatched to\
    \ several independent\nhosts that run it redundantly over **QUIC** (TLS 1.3, mutually\
    \ authenticated);\neach result is reduced to a canonical, **order-independent\
    \ BLAKE3 hash**, and an\nanswer is accepted only once a configurable **quorum**\
    \ of those hashes agree\nbyte-for-byte. A single broken \u2014 or actively dishonest\
    \ \u2014 host can't slip a wrong\nresult past the quorum. It's distributed compute\
    \ you can actually verify, all\nfrom plain SQL table functions, with no external\
    \ daemon to run.\n\n### Works out of the box, zero config\nWith no peers configured,\
    \ `p2p_query` runs on a **free, in-process locked-down\nDuckDB**: no network egress,\
    \ no local-filesystem access, configuration locked so\nan untrusted query can't\
    \ pry it back open. So the extension is useful and safe\nthe moment you `LOAD`\
    \ it \u2014 point it at a swarm only when you want to.\n\n```sql\nINSTALL duckton\
    \ FROM community;\nLOAD duckton;\nSELECT * FROM p2p_query('SELECT 42 AS answer');\
    \   -- runs locally, verified\n```\n\n### How a distributed query works\nWhen\
    \ peers are available, the coordinator hedges: it races `k` workers, accepts\n\
    the first result that reaches quorum, and `RESET`s the losers \u2014 so a slow\
    \ or\nstalled host costs you latency, not a wrong answer. `p2p_query_meta()` exposes\n\
    exactly what happened (executed_locally, verified, agreement vs. quorum, the\n\
    winning host, the agreed hash, participant/receipt counts), so verification is\n\
    observable, not a black box.\n\n### Trust that compounds\nHosts earn a confidence-aware\
    \ (Wilson-shrunk) reputation from **signed, gossiped\nreceipts**, and host selection\
    \ weighs that reputation alongside attestation tier\n(L0/L1/L2), vouchers and\
    \ stake. Every node also keeps its own local deny-list\n(`p2p_block` / `p2p_unblock`)\
    \ and decides independently whom to serve \u2014 there is\nno central authority\
    \ in the data path.\n\n### Optional paid compute, settled on TON\nPublic jobs\
    \ are free and fully off-chain. When you want guaranteed, accountable\ncompute,\
    \ jobs can be **paid** through a per-job escrow on **The Open Network\n(TON)**\
    \ \u2014 strictly opt-in and default-off. The economics are enforced on-chain:\n\
    the escrow must cover all parties, with the platform fee (**15%**) and the\nnon-winner\
    \ verifier commission (**5%** per agreeing replica) paid out correctly\non settlement,\
    \ plus stake/slashing and per-epoch Merkle anchoring of job records.\nThe free\
    \ grid never instantiates a chain client.\n\n### Key SQL surface\n- `p2p_query(sql,\
    \ [overrides...])` \u2014 run SQL on the grid (local-first; or\n  `prefer => 'remote'`\
    \ to dispatch to hosts). Per-call overrides include\n  `replicas`, `quorum`, `min_trust`,\
    \ `min_attestation`, `payment`, `prefer`,\n  `network`, `groups`, `regions`, `nodes`,\
    \ `require_staked_hosts`.\n- `p2p_query_meta(sql, ...)` \u2014 the verification/execution\
    \ metadata for a query.\n- `p2p_info()` / `p2p_peers()` / `p2p_status()` / `p2p_config()`\
    \ \u2014 inspect\n  protocol identity, discovery seeds, node status and effective\
    \ configuration.\n- `p2p_join(...)` / `p2p_share(...)` \u2014 join a swarm by\
    \ seed, or donate this\n  node's compute (memory/threads/jobs) to become a host.\n\
    - Admin/economics setters: `p2p_trust`, `p2p_economics`, `p2p_wallet`,\n  `p2p_block`\
    \ / `p2p_unblock` / `p2p_blocklist`, and more.\n\n### New in v0.6.2\nA security-hardening\
    \ and capability release over v0.6.1. It closes a set of\naudit findings across\
    \ transport/admission, trust, sandbox and settlement \u2014\nmost notably binding\
    \ a `Dispatch` to a prior accepting `Bid` from the same\nauthenticated peer (so\
    \ the offer-phase admission/SSRF-fail-safe gates can't be\nskipped), cryptographically\
    \ binding the attestation tier into its signed\nevidence (no level inflation),\
    \ a panic-free/bounded BoC parser, interrupting\nabandoned/over-deadline queries,\
    \ and capped result materialization. On-chain it\nadds **participation-commission\
    \ (\u03BA) enforcement** in the per-job escrow and a\n**timelocked code upgrade**\
    \ for the record-anchor contract, alongside\nchain-synced fee binding and fail-closed\
    \ treasury handling. New capability:\n**per-call node targeting** \u2014 `p2p_query(...,\
    \ nodes => ['b3:...'])` pins a job\nto exact node id(s), composable with `replicas`/`quorum`/`prefer`\
    \ to route a\nwhole query to a single chosen node (or run it locally). Plus detailed\n\
    structured troubleshooting logs across admission, dispatch, attestation,\nexecution\
    \ and the on-chain escrow lifecycle. v0.6.1 was a bug-fix release\n(two-node-grid\
    \ hang bound + secure-spill hardening) over v0.6.0's size-aware\nrouting, capacity\
    \ governor, presigned-URL credentials and stake weighting.\n\n### Built on solid\
    \ foundations (and honest about limits)\nA Rust extension built against DuckDB's\
    \ **stable C extension API** (loadable\nextension), templated with `extension-ci-tools`,\
    \ Apache-2.0 licensed.\nConfiguration is layered: built-in defaults <- a TOML\
    \ file (`P2P_CONFIG` /\n`P2P_CONFIG_DIR`) <- environment <- per-call SQL overrides.\
    \ It targets native\nglibc **Linux, macOS and MSVC Windows**. WebAssembly, musl,\
    \ and the MinGW/RTools\nWindows toolchains are excluded because the QUIC/TLS stack\
    \ (quinn + rustls + ring)\nand async runtime aren't supported there.\n"
