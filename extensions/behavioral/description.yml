extension:
  name: behavioral
  description: Behavioral analytics functions inspired by ClickHouse (sessionize,
    retention, window_funnel, window_funnel_events, sequence_match, sequence_count,
    sequence_match_events, sequence_next_node)
  version: 0.11.0
  language: Rust
  build: cargo
  license: MIT
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_rtools;windows_amd64_mingw;linux_amd64_musl
  requires_toolchains: rust;python3
  maintainers:
  - tomtom215
repo:
  github: tomtom215/duckdb-behavioral
  ref: 69f96cb7d30a79f3634dcbeb899f25f093a287a1
docs:
  hello_world: "-- Funnel: how far did each user get through view -> cart -> buy within\
    \ 1 hour?\nSELECT user_id,\n       window_funnel(INTERVAL '1 hour', ts, e = 'view',\
    \ e = 'cart', e = 'buy') AS furthest_step\nFROM (VALUES (1, TIMESTAMP '2024-01-01\
    \ 10:00', 'view'), (1, TIMESTAMP '2024-01-01 10:05', 'cart'),\n             (1,\
    \ TIMESTAMP '2024-01-01 10:20', 'buy'),  (2, TIMESTAMP '2024-01-01 11:00', 'view'),\n\
    \             (2, TIMESTAMP '2024-01-01 15:00', 'cart')) t(user_id, ts, e)\nGROUP\
    \ BY user_id ORDER BY user_id;\n\n-- Sessions: a new session after 30 minutes\
    \ of inactivity\nSELECT ts, sessionize(ts, INTERVAL '30 minutes') OVER (ORDER\
    \ BY ts) AS session_id\nFROM (VALUES (TIMESTAMP '2024-01-01 10:00'), (TIMESTAMP\
    \ '2024-01-01 10:10'),\n             (TIMESTAMP '2024-01-01 11:00')) t(ts);\n"
  extended_description: 'Behavioral analytics functions for DuckDB, following ClickHouse''s
    parametric

    behavioral functions (differentially tested against ClickHouse 26.10):


    - **sessionize**: Session IDs over an ordered window, based on timestamp gaps

    - **retention**: Cohort retention analysis returning boolean arrays

    - **window_funnel**: Conversion funnel step tracking with 6 composable modes

    - **window_funnel_events**: Timestamps of the best funnel chain as LIST(TIMESTAMP)

    - **sequence_match**: Pattern matching over event sequences

    - **sequence_count**: Count non-overlapping pattern matches

    - **sequence_match_events**: Return matched condition timestamps

    - **sequence_next_node**: Find the next event value after a pattern match

    - **behavioral_version**: Diagnostic scalar returning the loaded extension version


    Up to 32 event conditions per call. Invalid configuration (unknown modes,

    malformed patterns, month-based intervals) raises descriptive SQL errors.

    Built on DuckDB''s stable C API; pure Rust, with no unsafe code outside the

    FFI layer.


    Known DuckDB limitation (duckdb/duckdb#26109, affects every C API

    aggregate, fixed on DuckDB 2.0.0 only): on earlier releases, including

    the 1.4.5 and 1.5.6 builds, do not call these functions with ORDER BY

    inside the call, with OVER (), or over a frame written UNBOUNDED

    PRECEDING AND UNBOUNDED FOLLOWING; DuckDB can crash. On 1.3.2 through

    1.4.5, OVER (PARTITION BY x) without ORDER BY crashes too.

    The functions sort by timestamp themselves, so none of these is needed.

    '
