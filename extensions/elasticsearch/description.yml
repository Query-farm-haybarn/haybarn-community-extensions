extension:
  name: elasticsearch
  description: Query Elasticsearch indices directly using SQL
  version: 1.0.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - tlinhart
  # Haybarn: disabled — never builds against DuckDB 1.5.3 (reliability
  # 0/7; ~6h CPU/run wasted before failing or timing out). Dispatching
  # produces no binaries, so we exclude every platform. Re-enable when it
  # builds cleanly (sync_from_upstream will pick up a compatible bump).
  excluded_platforms: linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
repo:
  github: tlinhart/duckdb-elasticsearch
  ref: 5b340f5460e22e282f469eb3e021d3cce0b9d747
  ref_next: e89032ec14cd3746917645c7542171409a97f2f3
docs:
  hello_world: "-- Basic query.\nSELECT * FROM elasticsearch_query(\n    host := 'localhost',\n\
    \    index := 'products'\n);\n\n-- Query with authentication.\nSELECT * FROM elasticsearch_query(\n\
    \    host := 'localhost',\n    index := 'logs-*',\n    username := 'elastic',\n\
    \    password := 'secret',\n    use_ssl := true\n);\n\n-- Filter pushdown \u2013\
    \ WHERE clauses are translated to Elasticsearch Query DSL.\nSELECT name, price\
    \ FROM elasticsearch_query(\n    host := 'localhost',\n    index := 'products'\n\
    )\nWHERE category = 'electronics' AND price > 100;\n\n-- Geospatial query pushdown\
    \ (requires the DuckDB spatial extension).\nINSTALL spatial;\nLOAD spatial;\n\n\
    SELECT name FROM elasticsearch_query(\n    host := 'localhost',\n    index :=\
    \ 'places'\n)\nWHERE ST_Intersects(ST_GeomFromGeoJSON(geometry), ST_Point(-122.4194,\
    \ 37.7749));\n\n-- Combine WHERE clause with a base Elasticsearch query.\nSELECT\
    \ title, author FROM elasticsearch_query(\n    host := 'localhost',\n    index\
    \ := 'books',\n    query := '{\"match\": {\"description\": \"science fiction\"\
    }}'\n)\nWHERE in_stock = true\nLIMIT 10;\n"
  extended_description: "The DuckDB Elasticsearch extension enables querying Elasticsearch\
    \ indices directly using SQL.\nIt supports filter, projection and limit pushdown\
    \ for optimized queries, automatic schema\ninference from index mappings and handles\
    \ complex types like nested objects, arrays and\ngeospatial types.\n\nKey features:\n\
    - Filter pushdown \u2013 `WHERE` clauses are translated to Elasticsearch Query\
    \ DSL.\n- Projection pushdown \u2013 only requested columns are fetched via `_source`\
    \ filtering.\n- Limit pushdown \u2013 `LIMIT`/`OFFSET` clauses are pushed to Elasticsearch.\n\
    - Automatic schema inference from index mappings with array detection.\n- Support\
    \ for multi-index queries (e.g. `logs-*`).\n- Geospatial types (`geo_point`, `geo_shape`)\
    \ converted to GeoJSON format.\n- SSL/TLS support with configurable certificate\
    \ verification.\n- Automatic retry with exponential backoff for transient errors.\n\
    \nFor detailed documentation, visit the [extension repository](https://github.com/tlinhart/duckdb-elasticsearch).\n"
