extension:
  name: apt
  description: Query the apt/dpkg package manager of Debian-based systems with SQL
    - installed packages, dependencies, repositories and their trust, package origins,
    pending security updates and change history
  version: 0.1.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - adriens
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;windows_amd64;windows_amd64_mingw;windows_arm64;osx_amd64;osx_arm64;linux_amd64_musl;linux_arm64_musl
  requires_toolchains: vcpkg
repo:
  github: adriens/duckdb-apt
  ref: 14746b3542d12ab547e5e9720ee48e0b94cddc95
docs:
  hello_world: "INSTALL apt FROM community;\nLOAD apt;\n\n-- Version of apt\nSELECT\
    \ apt_version();\n\n-- What did I install on purpose?\nSELECT name, version\n\
    FROM apt_packages()\nWHERE NOT auto_installed\nORDER BY name;\n\n-- Which packages\
    \ will apt never update?\nSELECT name, version\nFROM apt_packages()\nANTI JOIN\
    \ apt_package_origins()\n    USING (name, architecture);\n\n-- Pending security\
    \ updates\nSELECT name, current_version, new_version\nFROM apt_upgradable()\n\
    WHERE is_security;\n\n-- Repositories without a pinned signing key, or fetched\
    \ over plain HTTP\nSELECT uri, suite, signed_by\nFROM apt_sources()\nWHERE enabled\n\
    \  AND (signed_by IS NULL OR uri LIKE 'http://%');\n\n-- Who changed what lately?\n\
    SELECT start_time, action, package, requested_by\nFROM apt_history()\nORDER BY\
    \ start_time DESC\nLIMIT 20;\n\n-- Compare Debian versions like dpkg\nSELECT apt_version_compare('1:1.0',\
    \ '2.0');\n\n-- Package URLs for vulnerability scanners\nCOPY (SELECT purl FROM\
    \ apt_packages()) TO 'purls.csv';\n"
  extended_description: 'The apt extension reads the files of the apt and dpkg package
    managers (/var/lib/dpkg, /etc/apt,

    /var/lib/apt/lists, /var/log/apt) and exposes them as tables, so that the software
    installed on a

    Debian, Ubuntu or derived system can be audited with SQL: inventory, dependency
    graph, repository

    configuration and freshness, the repository each package comes from (and the packages
    no repository

    updates anymore), pending updates flagged as security fixes, held packages and
    the change history with

    who requested each change.


    Files are read through DuckDB''s file system, so enable_external_access and allowed_directories
    apply.

    Every table function accepts a root parameter to audit another system, such as
    a mounted disk image or a

    container filesystem. On systems without apt, the functions return no rows.


    Documentation: https://adriens.github.io/duckdb-apt/


    A Quarto notebook in the repository turns these tables into a PDF security report.

    '
