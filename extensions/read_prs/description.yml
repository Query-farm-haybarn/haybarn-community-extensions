extension:
  name: read_prs
  description: Read SAS, Stata and SPSS files directly in SQL, and write query results
    to Stata, SPSS and SAS files.
  version: 0.1.0
  language: Rust
  build: cargo
  license: Apache-2.0
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_amd64_rtools;linux_amd64_musl
  requires_toolchains: rust;python3
  maintainers:
  - jrothbaum
repo:
  github: jrothbaum/duckdb_prs
  ref: 66e74057621b80ccfa889b73ebdd417270b96f3a
docs:
  hello_world: "INSTALL read_prs FROM community;\nLOAD read_prs;\n\n-- Write a small\
    \ Stata file, then read it back\nCOPY (SELECT 1 AS id, 'Ada' AS name, DATE '1815-12-10'\
    \ AS born)\n    TO 'read_prs_example.dta' (FORMAT dta);\nSELECT * FROM read_prs('read_prs_example.dta');\n\
    -- id | name | born\n-- 1  | Ada  | 1815-12-10\n\n-- Only the columns a query\
    \ uses are read from the file\nSELECT name FROM read_prs('read_prs_example.dta')\
    \ WHERE id = 1;\n"
  extended_description: "`read_prs(path)` is a table function that reads SAS (`.sas7bdat`),\
    \ Stata (`.dta`) and SPSS\n(`.sav`, `.zsav`) files, and the less common SAS transport\
    \ (`.xpt`) and SPSS portable (`.por`)\nformats. The format is taken from the file\
    \ extension.\n\n```sql\nSELECT age, income FROM read_prs('survey.sav') WHERE age\
    \ >= 18;\nCREATE TABLE survey AS SELECT * FROM read_prs('survey.sas7bdat');\n\
    ```\n\n- Only the columns a query uses are read from the file.\n- Files are opened\
    \ through DuckDB's file system, so `s3://` paths use your DuckDB secrets and\n\
    \  settings.\n- Options follow polars_readstat: `preserve_order`, `row_index_name`,\n\
    \  `value_labels_as_strings`, `missing_string_as_null`, `row_offset`, `n_rows`,\
    \ `threads` and\n  `batch_size`.\n- `COPY ... TO` writes any query result as Stata\
    \ (`FORMAT dta`), SPSS (`FORMAT sav`), a CSV\n  plus a SAS script that loads it\
    \ (`FORMAT sas_csv`), SAS transport (`FORMAT xpt`) or SPSS\n  portable (`FORMAT\
    \ por`), with variable labels.\n\nIt reads files with the same Rust core as [polars_readstat](https://github.com/jrothbaum/polars_readstat).\n\
    Documentation: https://github.com/jrothbaum/duckdb_prs\n"
