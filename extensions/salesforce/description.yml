extension:
  name: salesforce
  description: "Read-only access to Salesforce orgs as DuckDB SQL tables over the\
    \ official REST and Bulk APIs \u2014 OAuth refresh-token or JWT-bearer auth (credentials\
    \ from inline options, environment variables, or an SFDX auth URL), native ATTACH,\
    \ projection + predicate pushdown, COUNT pushdown, explicit server-side aggregates\
    \ with GROUP BY, lazy/auto/Bulk transports with PK chunking (Bulk blob/base64\
    \ compatibility guard), a per-job API quota governor, parent + grandparent relationship\
    \ STRUCT columns with diagnostics, queryAll (archived + deleted), Tooling-API\
    \ fast schema, and metadata helpers (manual cache refresh, picklist values, record\
    \ types). Requires DuckDB v1.5.4 or newer."
  version: 0.19.2
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - flozer
  excluded_platforms: osx_amd64;wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;linux_amd64_musl;linux_arm64;linux_arm64_musl;windows_arm64
repo:
  github: flozer/duckdb-salesforce
  ref: 2c96c1916c6067d979f578c1b73d7872457425d3
docs:
  hello_world: '-- Published build is signed: INSTALL salesforce FROM community; LOAD
    salesforce;

    -- Connect with an OAuth refresh-token Connected App.

    -- Set SF_CLIENT_ID, SF_CLIENT_SECRET, SF_REFRESH_TOKEN, and optionally SF_LOGIN_URL.

    ATTACH ''salesforce://myorg'' AS sf (TYPE salesforce, auth_source ''env'');

    SELECT Id, Name FROM sf.Account WHERE Name = ''Acme'' LIMIT 10;

    '
  extended_description: "duckdb-salesforce attaches a Salesforce org as a read-only\
    \ DuckDB catalog.\nTables map to sObjects; SELECT runs over REST /query (or /queryAll\
    \ for\narchived + soft-deleted rows), Bulk API 2.0 (lazy-streamed, optional\n\
    parallel PK chunking), or an auto-selected transport, with SOQL projection +\n\
    predicate pushdown and COUNT pushdown. salesforce_aggregate() runs explicit\n\
    server-side SOQL aggregates (MIN/MAX/SUM/AVG/COUNT, optional filter and\nGROUP\
    \ BY) without dragging rows down, and salesforce_relationships() reports\nparent/grandparent\
    \ expansion. Read-only metadata helpers are available too:\nsalesforce_refresh_metadata()\
    \ (manual per-ATTACH cache refresh),\nsalesforce_picklist_values(), and salesforce_record_types().\
    \ A Bulk\nblob/base64 compatibility guard keeps incompatible scans off Bulk, and\n\
    blob bodies / epoch datetimes have clear documented limitations. Opt-in\nparent-\
    \ and grandparent-relationship STRUCT columns, a per-job API quota\ngovernor,\
    \ and Tooling-API fast schema discovery round it out. Authentication\nis OAuth\
    \ 2.0 refresh-token or JWT\nbearer, with credentials from inline options, environment\
    \ variables, or an\nSFDX auth URL; credentials stay in memory and are never logged;\
    \ TLS\nserver-certificate verification is always on. Read-only: all mutating\n\
    catalog operations throw. Since v0.15.1 every function self-documents\nthrough\
    \ duckdb_functions() (description, runnable example, real parameter\nnames), so\
    \ SQL clients and AI agents can discover the surface from the\nconnection. Since\
    \ v0.16.0-v0.17.0, no-group COUNT, COUNT(DISTINCT), MIN\nand MAX queries push\
    \ down transparently (kill-switch\nsf_aggregate_pushdown; MIN/MAX need a sortable\
    \ numeric/temporal/boolean\nfield; SUM/AVG deliberately stay local \u2014 the\
    \ server sums in floating\npoint), salesforce_relationship_graph recurses child\
    \ relationships up to\nmax_depth with cycle protection, and the Report Bridge\
    \ resolves a report's\nbase object from the official reportTypeMetadata when the\
    \ first category\nis unambiguous. Built and tested against DuckDB v1.5.4, v1.5.5\
    \ and\nv1.5.6 (v1.5.2/v1.5.3 support was dropped in v0.15.0 \u2014 see CHANGELOG.md).\n\
    Full change history in this repo's CHANGELOG.md.\nSince v0.19.2, salesforce_deleted_ids\
    \ returns latest_date_covered (the\ngetDeleted coverage frontier, for wide-window\
    \ sweep checkpoints), the\nread_only ATTACH option is accepted as a documented\
    \ no-op (the catalog is\nread-only by design), Id literals in =/!=/IN filters\
    \ are validated at\nplan time (15/18 alphanumeric chars; clear error instead of\
    \ Salesforce's\ngeneric INVALID_QUERY_FILTER_OPERATOR), and the per-attempt HTTP\
    \ read\ntimeout is tunable via sf_timeout_read_s (default 60s, cap 3600s).\nSince\
    \ v0.19.1,\nsalesforce_deleted_ids paginates its queryAll sweep (v0.19.0 truncated\
    \ at\nexactly 2,000 ids) and uses the Replication API getDeleted() as the\ndefault\
    \ source for ANY window width (the 15-minute cap was an incorrect\nassumption;\
    \ latestDateCovered resume + boundary dedup), covering objects\nwith no IsDeleted\
    \ field (e.g. User).\nSince v0.19.0, salesforce_deleted_ids(catalog, object, since,\
    \ until)\nsurfaces the ids deleted in the org within a window (Replication API\n\
    getDeleted for exact deletion timestamps; a queryAll IsDeleted scan as\nfallback\
    \ for wider windows), salesforce_bulk_resume(catalog, job_id)\nre-streams the\
    \ results of an existing Bulk query job (recovery without\nre-running it), salesforce_scan(catalog,\
    \ object, filter, ...) scans an\nsObject directly with per-call overrides, transient\
    \ HTTP failures retry\nwith tunable sf_retry_max/sf_retry_backoff_ms, and well-known\
    \ Salesforce\nerrorCodes surface with embedded remedy hints.\n"
