extension:
  name: duck_diff
  description: Diff two relations (tables, queries) off a primary key, reporting per-key
    status (identical/different/left_only/right_only), a JSON summary of changed columns,
    and per-column left/right values.
  version: 0.3.1
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - avaitla
repo:
  github: avaitla/duck_diff
  ref: 9afb9a05ab3ab1b1cfbc27a8fdf2e81b157ed0b4
docs:
  hello_world: "LOAD duck_diff;\n\n-- Create two sample snapshots\nCREATE TABLE users_v1\
    \ AS SELECT * FROM (VALUES\n    (1, 'Ada',   'ada@x.com',   100),\n    (2, 'Linus',\
    \ 'linus@x.com',  50),\n    (3, 'Grace', 'grace@x.com',  75)\n) t(id, name, email,\
    \ credits);\n\nCREATE TABLE users_v2 AS SELECT * FROM (VALUES\n    (1, 'Ada',\
    \   'ada@x.com',   120),   -- credits changed\n    (2, 'Linus', 'linus@x.com',\
    \  50),   -- unchanged\n    (4, 'Mike',  'mike@x.com',   10)    -- new (id 3 removed)\n\
    ) t(id, name, email, credits);\n\n-- Diff them off the primary key\nSELECT id,\
    \ diff_status, diff_data, credits_left, credits_right\nFROM table_diff('FROM users_v1',\
    \ 'FROM users_v2', pk := 'id')\nORDER BY id;\n\n-- Or get counts and percentages\
    \ per status\nSELECT * FROM table_diff_summary('FROM users_v1', 'FROM users_v2',\
    \ pk := 'id');\n"
  extended_description: "`duck_diff` finds the difference between two tables \u2014\
    \ which can be on\nentirely different systems if needed. Typical uses:\n\n- Checking\
    \ a copy is faithful: CDC pipelines, read replicas, warehouse\n  ELT, migrations.\
    \ Per-key results show stale rows, missed deletes, and\n  missing inserts that\
    \ row counts hide.\n- Verifying a SQL rewrite (refactor, dialect translation,\
    \ performance\n  work) returns the same rows as the original.\n- Letting a coding\
    \ agent such as Claude verify its own changes: the check\n  is deterministic (`n_total\
    \ = n_identical`), so an agent can rewrite,\n  run the diff, and repeat until\
    \ it passes \u2014 with Claude Code's\n  [`/goal`](https://code.claude.com/docs/en/goal),\
    \ set the diff returning\n  true as the completion condition and it keeps working\
    \ across turns\n  until that verifiably holds.\n\nEach key gets a status (`identical`\
    \ / `different` / `left_only` /\n`right_only`), a JSON `diff_data` of the changed\
    \ columns, and\n`<c>_left` / `<c>_right` / `<c>_diff_status` columns. Composite\
    \ keys are\nsupported; `upcast_types`, `numeric_tolerance`, `timestamp_precision`,\n\
    `null_equals_empty`, and `columns` / `ignore` / `context` control the\ncomparison\
    \ across engines.\n\n**Links:**\n[website & cross-database recipe builder](https://avaitla.github.io/duck_diff/)\
    \ \xB7\n[function reference](https://github.com/avaitla/duck_diff/blob/main/docs/functions.md)\
    \ \xB7\n[runnable demos (MySQL, Postgres, ClickHouse, BigQuery, Snowflake, Iceberg,\
    \ DuckLake, S3 Tables)](https://github.com/avaitla/duck_diff/tree/main/demo) \xB7\
    \n[AI-assisted migration guide](https://github.com/avaitla/duck_diff/blob/main/docs/ai-assisted-migration.md)\n\
    \n**Functions:**\n\n| Function | Returns | Purpose |\n|----------|---------|---------|\n\
    | `table_diff(left, right, pk := ...)` | table | one row per key: key column(s),\
    \ `diff_status`, `diff_data`, expanded columns |\n| `table_diff_summary(left,\
    \ right, pk := ...)` | one row | counts (and percentages) per status |\n| `schema_diff(left,\
    \ right)` | table | per-column name/type comparison \u2014 reads no rows |\n"
