extension:
  name: ai
  description: "AI functions for SQL \u2014 completions, classification, extraction,\
    \ embeddings, and read-only SQL generation across local and hosted model providers"
  version: 0.4.14
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads
  maintainers:
  - leonardovida
repo:
  github: leonardovida/duckdb-ai
  ref: 9b7b16a5d5bfa97180b8be48d69bd9a4a4106419
docs:
  hello_world: '-- Use a free local model via Ollama (https://ollama.com)

    SET duckdb_ai_provider = ''ollama'';

    SET duckdb_ai_model = ''gemma4:e4b'';


    SELECT ai_summarize(''DuckDB is an analytical database built for fast local queries.'');


    -- Or a hosted provider, with the key kept in a DuckDB secret

    CREATE SECRET openai_ai (TYPE duckdb_ai, AI_PROVIDER ''openai'', API_KEY ''...'',
    MODEL ''gpt-4o-mini'');

    SELECT ai_classify(''invoice overdue'', ''billing, support'', secret := ''openai_ai'');

    '
  extended_description: "The ai extension adds model-backed analytical functions to\
    \ SQL: completions\n(`ai_complete`), text tasks (`ai_summarize`, `ai_classify`,\
    \ `ai_extract`,\n`ai_translate`, `ai_redact`, `ai_filter`), structured output\
    \ validated\nagainst a JSON Schema (`ai_complete_json`, `ai_complete_record`,\n\
    `ai_extract_record`), embeddings and similarity (`ai_embed`,\n`ai_similarity`,\
    \ `ai_rerank`), aggregates (`ai_agg`, `ai_summarize_agg`),\nand a SQL assistant\
    \ that only returns parser-validated read-only `SELECT`\nstatements (`ai_sql`,\
    \ `ai_query_data`).\n\nIt supports local Ollama, llama.cpp, and OpenAI-compatible\
    \ servers as well as OpenAI,\nAzure OpenAI, Anthropic, Gemini, Mistral, DeepSeek,\
    \ OpenRouter, Databricks,\nSnowflake Cortex, and Z.ai. Credentials come from environment\
    \ variables or\nDuckDB `TYPE duckdb_ai` secrets \u2014 never SQL arguments. The\
    \ runtime includes\nconcurrency/rate controls, retries with backoff, opt-in response\
    \ and\nprovider-side prompt caching, batched embedding requests, a network egress\n\
    allowlist, and local usage/cost tracking via `ai_usage()`.\n\nThe extension performs\
    \ no network calls at load time; providers are only\ncontacted when an `ai_*`\
    \ function that needs one is executed. Full docs:\nhttps://github.com/leonardovida/duckdb-ai\n"
