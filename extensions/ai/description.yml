extension:
  name: ai
  description: Call LLMs from SQL to classify, summarize, extract typed fields, embed
    and search text, or query your tables, with local models or 35+ hosted APIs
  version: 0.8.0
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads
  maintainers:
  - leonardovida
repo:
  github: leonardovida/duckdb-ai
  ref: 2f0cab8321489c4c8663044a56160ab40dc47ff4
docs:
  hello_world: "-- 1. Choose where the model runs.\n--    Local: any model server\
    \ on your machine, so data never leaves it. This example uses\n--    Ollama with\
    \ its default model (`ollama pull llama3.2`); llama.cpp, LM Studio and vLLM work\
    \ too.\nSET duckdb_ai_provider = 'ollama';\n--    Hosted: put the key in the environment\
    \ (OPENAI_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY, ...)\n--    and pick the\
    \ provider instead, for example: SET duckdb_ai_provider = 'anthropic';\n\n-- 2.\
    \ Run model functions over a table like any other SQL function.\nCREATE TABLE\
    \ tickets AS SELECT * FROM (VALUES\n    (1, 'I was charged twice for the same\
    \ invoice. Please refund one of them.'),\n    (2, 'The dashboard has been down\
    \ for every user since 9am.')\n) t(id, body);\n\n-- A label, a yes/no check and\
    \ a summary for every row\nSELECT id,\n       ai_classify(body, MAP {'billing':\
    \ 'Charges, invoices and refunds',\n                              'outage': 'Something\
    \ is down for users',\n                              'other': 'Anything else'})\
    \ AS category,\n       ai_filter(body, 'asks for a refund') AS wants_refund,\n\
    \       ai_summarize(body) AS summary\nFROM tickets;\n\n-- Typed fields from a\
    \ JSON Schema, returned as a STRUCT\nSELECT id, r.product_area, r.urgency\nFROM\
    \ (SELECT id, ai_extract_record(body, '{\"type\": \"object\",\n        \"properties\"\
    : {\"product_area\": {\"type\": \"string\"}, \"urgency\": {\"type\": \"integer\"\
    }},\n        \"required\": [\"product_area\", \"urgency\"]}') AS r\n      FROM\
    \ tickets);\n\n-- 3. See what it cost: calls, tokens, failures and estimated spend\
    \ (NULL for local models)\nSELECT sum(calls) AS calls, sum(total_tokens) AS tokens,\
    \ sum(failures) AS failures,\n       sum(estimated_cost_usd) AS estimated_usd\n\
    FROM ai_usage_summary();\n"
  extended_description: "The `ai` extension brings language models into DuckDB SQL.\
    \ Point a function at a column and it calls\nthe model once per row, several rows\
    \ at a time, and returns an ordinary DuckDB value (`VARCHAR`,\n`BOOLEAN`, `DOUBLE`,\
    \ a typed `STRUCT`, a `LIST` or an embedding) that you can filter, join, aggregate\n\
    and save like any other column.\n\n**What you can do**\n\n- Label and rewrite\
    \ text: `ai_classify`, `ai_classify_labels`, `ai_sentiment`, `ai_summarize`,\n\
    \  `ai_translate`, `ai_fix_grammar`, `ai_redact`, `ai_complete`.\n- Get typed\
    \ answers instead of free text: `ai_extract_record` returns a `STRUCT` from a\
    \ JSON Schema\n  (pydantic schemas work), `ai_filter` a `BOOLEAN`, `ai_score`\
    \ a `DOUBLE` from 0 to 1, and\n  `ai_complete_json` validated JSON.\n- Ask several\
    \ typed questions per row with decision models: `ai_decide` returns probabilities\
    \ and\n  confidences from TypeSafe Jev, Cloudflare Clef, Perplexity or a local\
    \ decision model.\n- Search by meaning: `ai_embed`, `ai_similarity` and `ai_rerank`,\
    \ with `ai_generate_chunks` and\n  `ai_prep_search` to split long documents.\n\
    - Summarize groups with the `ai_agg` and `ai_summarize_agg` aggregates.\n- Ask\
    \ questions about your data: `ai_sql` writes a validated read-only `SELECT` from\
    \ your schema, and\n  `ai_query_data` runs it.\n\n**Any model, local or hosted**\n\
    \nLocal model servers keep data on your machine: Ollama, llama.cpp, LM Studio,\
    \ vLLM or any\nOpenAI-compatible endpoint. Hosted APIs include OpenAI, Anthropic,\
    \ Google Gemini and Vertex AI, Azure\nOpenAI, Amazon Bedrock, Mistral, DeepSeek,\
    \ Groq, Together, OpenRouter, Databricks and Snowflake Cortex,\namong more than\
    \ 35 providers. Switching is one setting; the SQL stays the same. Replies are\
    \ read the way\nsmall models write them, so a label in markdown or followed by\
    \ an explanation still counts.\n\n**Safe to run on real tables**\n\n- API keys\
    \ come only from environment variables or `TYPE duckdb_ai` secrets, never from\
    \ SQL arguments.\n  Loading the extension makes no network calls, and `allowed_hosts`\
    \ limits where data can be sent.\n- `ai_completion_request_json` shows a request\
    \ without sending it. `ai_usage()` and\n  `ai_usage_summary()` track calls, tokens,\
    \ failures and estimated cost.\n- Per-row error handling (`on_error := 'null'`,\
    \ `ai_try_complete`), retries with backoff, rate and\n  concurrency limits, and\
    \ an opt-in response cache keep long batch runs predictable.\n\n**Learn more**\n\
    \n- Documentation: https://leonardovida.github.io/duckdb-ai/docs\n- Function reference:\
    \ https://leonardovida.github.io/duckdb-ai/docs/functions\n- Cookbooks for ticket\
    \ triage, semantic search, resumable batch runs and cost tracking:\n  https://leonardovida.github.io/duckdb-ai/docs/cookbooks\n\
    - For agents, the full docs as one text file: https://leonardovida.github.io/duckdb-ai/llms-full.txt\n"
