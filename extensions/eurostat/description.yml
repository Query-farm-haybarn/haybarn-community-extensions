  extended_description: "This is an extension for DuckDB for reading data from EUROSTAT\
    \ database using SQL.\n\n[Eurostat](https://ec.europa.eu/eurostat/) is the official\
    \ statistical office of the European Union, responsible for providing high-quality,\
    \ comparable, and harmonised statistics on Europe\u2019s economy, society, environment,\
    \ and more.\n\nEurostat develops harmonised definitions, classifications and methodologies\
    \ for the production of European official statistics, in cooperation with national\
    \ statistical authorities. It calculates aggregate data for the European Union\
    \ and eurozone, using data collected by national statistical authorities according\
    \ to the harmonised standards. Eurostat makes European statistics freely available\
    \ to decision\u2011makers and citizens via the Eurostat website, social media\
    \ and other channels.\n\nRun the following query to see the available data providers\
    \ and their descriptions:\n\n```sql\nSELECT provider_id, organization, description\
    \ FROM EUROSTAT_Endpoints();\n\n\u250C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u252C\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502\
    \ provider_id \u2502 organization \u2502                     description     \
    \                 \u2502\n\u2502   varchar   \u2502   varchar    \u2502      \
    \                 varchar                        \u2502\n\u251C\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253C\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253C\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2524\n\u2502 ECFIN       \u2502 DG ECFIN     \u2502 Economic and\
    \ Financial Affairs                       \u2502\n\u2502 EMPL        \u2502 DG\
    \ EMPL      \u2502 Employment, Social Affairs and Inclusion             \u2502\
    \n\u2502 ESTAT       \u2502 EUROSTAT     \u2502 EUROSTAT database            \
    \                        \u2502\n\u2502 GROW        \u2502 DG GROW      \u2502\
    \ Internal Market, Industry, Entrepreneurship and SMEs \u2502\n\u2502 TAXUD  \
    \     \u2502 DG TAXUD     \u2502 Taxation and Customs Union                  \
    \         \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\n```\n\nEach provider\
    \ has multiple dataflows (datasets) available, which can be listed with\nthe following\
    \ query:\n\n```sql\nSELECT * FROM EUROSTAT_Dataflows();\nSELECT * FROM EUROSTAT_Dataflows(providers\
    \ = ['ESTAT','ECFIN'], language := 'en');\n\n--- You can also filter by specific\
    \ dataflows:\n\nSELECT\n    provider_id, dataflow_id, class, version, label\n\
    FROM\n    EUROSTAT_Dataflows(providers = ['ESTAT'], dataflows = ['DEMO_R_D2JAN'],\
    \ language := 'de')\n;\n\n\u250C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u252C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u252C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u252C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2510\n\u2502 provider_id \u2502  dataflow_id \u2502\
    \  class  \u2502 version \u2502                               label          \
    \                     \u2502\n\u2502   varchar   \u2502   varchar    \u2502 varchar\
    \ \u2502 varchar \u2502                              varchar                 \
    \             \u2502\n\u251C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u253C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u253C\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u253C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u253C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2524\n\u2502 ESTAT       \u2502 DEMO_R_D2JAN \u2502 dataset\
    \ \u2502 1.0     \u2502 Bev\xF6lkerung am 1. Januar nach Alter, Geschlecht und\
    \ NUTS-2-Region \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2518\n```\n\nTo return information of the data structure\
    \ of an EUROSTAT Dataflow, run the following query:\n\n```sql\nSELECT\n    provider_id,\
    \ dataflow_id, position, dimension, concept\nFROM\n    EUROSTAT_DataStructure('ESTAT',\
    \ 'DEMO_R_D2JAN', language := 'en')\n;\n\n\u250C\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\u2500\u2500\
