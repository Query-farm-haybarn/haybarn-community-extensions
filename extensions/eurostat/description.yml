    \u2500\u2500\u2500\u2500\u2518\n```\n\nExtension supports pushdown of T-SQL filters\
    \ on dimensions, which are encoded and sent to the\nEUROSTAT API to filter the\
    \ data before being loaded into DuckDB.\n\nEUROSTAT API only supports filtering\
    \ on dimensions with equality conditions (e.g. `WHERE geo = 'DE'`)\nor IN conditions\
    \ (e.g. `WHERE geo IN ('DE', 'FR')`). Other types of filters (e.g. `WHERE geo\
    \ LIKE 'D%'`)\nare not supported and will be evaluated locally in DuckDB after\
    \ loading the data.\n\nTime filters (e.g. `WHERE time_period >= '2000' AND time_period\
    \ <= '2010'`) are also supported\nand will be encoded as range filters in the\
    \ EUROSTAT API.\n"
