    \ ESTAT       \u2502 DEMO_R_D2JAN \u2502       -1 \u2502 geo_level   \u2502 NUTS\
    \ classification level       \u2502\n\u2502 ESTAT       \u2502 DEMO_R_D2JAN \u2502\
    \        6 \u2502 time_period \u2502 Time                            \u2502\n\u2514\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
