    \ position \u2502  dimension  \u2502             concept             \u2502\n\u2502\
    \   varchar   \u2502   varchar    \u2502  int32   \u2502   varchar   \u2502  \
    \           varchar             \u2502\n\u251C\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253C\u2500\u2500\u2500\u2500\u2500\
