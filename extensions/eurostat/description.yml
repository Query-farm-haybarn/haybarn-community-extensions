    \  1 \u2502 freq        \u2502 Time frequency                  \u2502\n\u2502\
    \ ESTAT       \u2502 DEMO_R_D2JAN \u2502        2 \u2502 unit        \u2502 Unit\
    \ of measure                 \u2502\n\u2502 ESTAT       \u2502 DEMO_R_D2JAN \u2502\
