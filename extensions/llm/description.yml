docs:
  extended_description: "Call LLM APIs directly from SQL with support for OpenAI,\
    \ Gemini, Cloudflare Workers AI, and local OpenAI-compatible servers.\n\n## Features\n\
    \n- `llm()` table function with lateral join and named parameter support\n- `prompt()`\
    \ scalar function with auto-detection of API keys\n- `llm_and_cache()` for immediate\
    \ responses with caching\n- `llm_batch_and_cache()` for 50% cheaper batch API\
    \ processing\n- `llm_hash()` for LEFT JOIN support with cached results\n- CREATE\
    \ SECRET support for secure API key storage\n- Structured output with `return_type`\
    \ and `json_schema`\n\n## Structured Output Examples\n\n**Integer output:**\n\
    ```sql\nSELECT response FROM llm('What is 15 + 27?',\n    provider := 'gemini',\
    \ model := 'gemini-2.5-flash',\n    return_type := 'INTEGER');\n-- Returns: {\"\
    value\":42}\n```\n\n**Array output:**\n```sql\nSELECT response FROM llm('List\
    \ the first 5 prime numbers.',\n    provider := 'gemini', model := 'gemini-2.5-flash',\n\
    \    return_type := 'INTEGER[]');\n-- Returns: {\"value\": [2, 3, 5, 7, 11]}\n\
    ```\n\n**Struct output:**\n```sql\nSELECT response FROM llm('Info about Paris.',\n\
    \    provider := 'gemini', model := 'gemini-2.5-flash',\n    json_schema := '{\n\
    \        \"type\": \"OBJECT\",\n        \"properties\": {\n            \"city\"\
    : {\"type\": \"STRING\"},\n            \"country\": {\"type\": \"STRING\"},\n\
    \            \"population\": {\"type\": \"INTEGER\"}\n        },\n        \"required\"\
    : [\"city\", \"country\", \"population\"]\n    }');\n-- Returns: {\"city\": \"\
    Paris\", \"country\": \"France\", \"population\": 2140000}\n```\n\n**Array of\
    \ structs:**\n```sql\nSELECT response FROM llm('List 3 European capitals.',\n\
    \    provider := 'gemini', model := 'gemini-2.5-flash',\n    json_schema := '{\n\
    \        \"type\": \"OBJECT\",\n        \"properties\": {\n            \"cities\"\
    : {\n                \"type\": \"ARRAY\",\n                \"items\": {\n    \
    \                \"type\": \"OBJECT\",\n                    \"properties\": {\n\
    \                        \"name\": {\"type\": \"STRING\"},\n                 \
    \       \"country\": {\"type\": \"STRING\"}\n                    }\n         \
    \       }\n            }\n        }\n    }');\n-- Returns: {\"cities\": [{\"name\"\
    : \"Paris\", \"country\": \"France\"}, ...]}\n```\n\nFor more information, see\
    \ the [documentation](https://github.com/midwork-finds-jobs/duckdb-llm).\n"
extension:
  build: cmake
  description: Call LLM APIs (OpenAI, Gemini, Cloudflare) directly from SQL with structured
    output support.
  excluded_platforms: wasm_eh;wasm_mvp;windows_amd64_mingw
  language: C++
  license: MIT
  maintainers:
  - onnimonni
  name: llm
  requires_extensions:
  - http_request
  version: '2026020501'
repo:
