extension:
  name: delta_classic
  description: Attach a directory of Delta tables as a single DuckDB database with
    automatic schema discovery
  version: 0.2.0
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads
  maintainers:
  - djouallah
repo:
  github: djouallah/delta_classic
  ref: 3b930e3dd1aded4738c65410bf5026693e862e56
docs:
  hello_world: '-- Load required extensions

    LOAD delta;

    LOAD delta_classic;


    -- Attach a directory of Delta tables as a single database

    ATTACH ''s3://bucket/lake'' AS mydb (TYPE delta_classic, PIN_SNAPSHOT);


    -- Query tables directly

    SELECT * FROM mydb.main.orders LIMIT 10;


    -- Time travel on one table

    SELECT count(*) FROM mydb.main.orders AT (VERSION => 3);


    -- Read every table as of a point in time

    ATTACH ''s3://bucket/lake'' AS asof (TYPE delta_classic, TIMESTAMP ''2026-10-01
    00:00:00+00'');

    '
  extended_description: "Delta Classic lets you attach a directory of Delta Lake tables\
    \ as a single\nDuckDB database, instead of attaching each table individually.\
    \ It discovers\ntables by scanning for subdirectories containing a _delta_log\
    \ folder.\n\nThe extension supports three layouts:\n- Single table: the attached\
    \ path is itself a Delta table\n- Single-schema: the attached path directly contains\
    \ Delta tables\n- Multi-schema: the attached path contains subdirectories, each\
    \ treated as\n  a schema, with Delta tables inside them\n\nAll Delta reading is\
    \ delegated to the Delta extension via internal\nATTACH ... (TYPE DELTA). The\
    \ ATTACH options PIN_SNAPSHOT, TIMESTAMP,\nPUSHDOWN_FILTERS and PUSHDOWN_PARTITION_INFO\
    \ are passed to every table, and\nAT (VERSION => ...) / AT (TIMESTAMP => ...)\
    \ work per query. Works with all\nstorage backends (local filesystem, S3 and S3-compatible\
    \ stores, ABFSS, GCS).\nRead-only. Not available in DuckDB-WASM, because the Delta\
    \ extension has no\nWASM build.\n"
