extension:
  name: delta_classic
  description: Attach a directory of Delta tables as a single DuckDB database with
    automatic schema discovery
  version: 0.3.0
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads
  maintainers:
  - djouallah
repo:
  github: djouallah/delta_classic
  ref: 978446fec90702a754c590aaf29db833427783b4
docs:
  hello_world: '-- Load required extensions

    LOAD delta;

    LOAD delta_classic;


    -- Attach a directory of Delta tables as a single database

    -- (lake/sales/orders/_delta_log, lake/hr/people/_delta_log, ...)

    ATTACH ''s3://bucket/lake'' AS lake (TYPE delta_classic);


    -- Query tables directly: <db>.<schema>.<table>

    SELECT * FROM lake.sales.orders LIMIT 10;


    -- Time travel on one table

    SELECT count(*) FROM lake.sales.orders AT (VERSION => 3);


    -- Read every table as of a point in time

    ATTACH ''s3://bucket/lake'' AS asof (TYPE delta_classic, TIMESTAMP ''2026-10-01
    00:00:00+00'');


    -- Write: read-only by default, READ_ONLY false allows CREATE SCHEMA, CREATE TABLE
    (AS) and INSERT

    ATTACH ''s3://bucket/lake'' AS rw (TYPE delta_classic, READ_ONLY false);

    CREATE SCHEMA rw.staging;

    CREATE TABLE rw.staging.orders_2026 AS SELECT * FROM rw.sales.orders WHERE year(order_date)
    = 2026;

    '
  extended_description: "Delta Classic lets you attach a directory of Delta Lake tables\
    \ as a single\nDuckDB database, instead of attaching each table individually.\
    \ It discovers\ntables by scanning for subdirectories containing a _delta_log\
    \ folder.\n\nThe extension supports these layouts:\n- Single table: the attached\
    \ path is itself a Delta table\n- Single-schema: the attached path directly contains\
    \ Delta tables\n- Multi-schema: the attached path contains subdirectories, each\
    \ treated as\n  a schema, with Delta tables inside them. A directory inside a\
    \ schema that\n  is not a table is a nested schema (db.sales.eu.orders)\n- Microsoft\
    \ Fabric: a OneLake workspace attaches as\n  <workspace>.<lakehouse>.<schema>.<table>,\
    \ a lakehouse as\n  <lakehouse>.<schema>.<table>\n\nAll Delta reading and writing\
    \ is delegated to the Delta extension via\ninternal ATTACH ... (TYPE DELTA). The\
    \ ATTACH options PIN_SNAPSHOT,\nTIMESTAMP, PUSHDOWN_FILTERS and PUSHDOWN_PARTITION_INFO\
    \ are passed to every\ntable, and AT (VERSION => ...) / AT (TIMESTAMP => ...)\
    \ work per query.\nWorks with all storage backends (local filesystem, S3 and S3-compatible\n\
    stores, GCS, Azure and OneLake).\n\nRead-only by default. Attached with READ_ONLY\
    \ false, CREATE SCHEMA,\nCREATE TABLE, CREATE TABLE AS SELECT and INSERT write\
    \ Delta tables in the\nschema directories; UPDATE, DELETE, MERGE and DROP are\
    \ not supported. Not\navailable in DuckDB-WASM, because the Delta extension has\
    \ no WASM build.\n"
