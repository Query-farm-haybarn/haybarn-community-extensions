  extended_description: "## DuckDB PCAP Reader\n`pcap_reader` is a DuckDB community\
    \ extension that empowers network analysts to directly query and analyze IPv4\
    \ and IPv6 PCAP files using SQL. \n\nBuilt with Rust for performance and safety,\
    \ it leverages the `pcap-parser` crate to efficiently process packet capture data.\n\
    \n#### Features\n- Direct PCAP Access: Load PCAP files directly into DuckDB without\
    \ external tools.\n- SQL-PCAP Analysis: Use DuckDB to filter, aggregate, and analyze\
    \ IPv4/IPv6 network traffic.\n\n> The PCAP Reader Extension is experimental, use\
    \ at your own risk!\n"
