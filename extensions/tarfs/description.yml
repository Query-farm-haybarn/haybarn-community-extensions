extension:
  # Haybarn: disabled because the extension does not yet build
  # against DuckDB 1.5.2 — upstream community-extensions also has
  # no v1.5.2 binary. Re-enable when upstream lands a v1.5.2-
  # compatible release (sync_from_upstream will pick up the bump).
  # Tracker: https://github.com/Maxxen/duckdb_tarfs/issues/5
  excluded_platforms: linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
  name: tarfs
  description: glob, open and read files within `.tar` archives
  version: 1.0.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - Maxxen
repo:
  github: Maxxen/duckdb_tarfs
  ref: 6d468b45f38f16d58e49032edd76aa76c2a2b078
docs:
  hello_world: 'SELECT filename FROM read_blob(''tar://data/csv/tar/ab.tar/*'');

    '
  extended_description: 'This extension provides a duckdb file-system abstraction
    to read and glob files within __uncompressed__ tar archives.

    For more information and information regarding usage, limitations and performance,
    see the [tarfs README](https://github.com/Maxxen/duckdb_tarfs).

    '
