extension:
  name: duckdb_geoip_rs
  description: Retrieve geo ip data from MMDB database
  version: 0.2.2
  language: Rust
  build: cmake
  license: MIT
  excluded_platforms: windows_amd64_rtools;windows_amd64_mingw;linux_amd64_musl;wasm_mvp;wasm_eh;wasm_threads
  requires_toolchains: rust;python3
  maintainers:
  - william-billaud
repo:
  github: william-billaud/duckdb-geoip-rs
  ref: 21b9b661b9bcdd70b7d4a6740df8e2c251ec0872
docs:
  hello_world: "-- Before, export mmdb path : export MAXMIND_MMDB_DIR=\"`pwd`\"\n\n\
    INSTALL 'duckdb_geoip_rs' FROM community;\nLOAD 'duckdb_geoip_rs';\n\n-- Create\
    \ sample data\nCREATE TABLE ip_list (ip VARCHAR);\nINSERT INTO ip_list VALUES\
    \ ('1.1.1.1'), ('8.8.8.8'), ('80.8.8.8'), ('90.9.250.1'), ('not_anip');\n\n--\
    \ Get associated geo ip data\nSELECT ip, geoip_asn_org(ip),geoip_asn_num(ip),geoip_city(ip),\
    \ geoip_country_iso(ip) from ip_list;\n\n\u250C\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u252C\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u252C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502     ip  \
    \   \u2502 geoip_asn_org(ip) \u2502 geoip_asn_num(ip) \u2502 geoip_city(ip) \u2502\
    \ geoip_country_iso(ip) \u2502\n\u2502  varchar   \u2502      varchar      \u2502\
    \      varchar      \u2502    varchar     \u2502        varchar        \u2502\n\
    \u251C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u253C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u253C\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u253C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u253C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2524\n\u2502 1.1.1.1    \u2502 Cloudflare, Inc.  \u2502 13335\
    \             \u2502                \u2502 AU                    \u2502\n\u2502\
    \ 8.8.8.8    \u2502 Google LLC        \u2502 15169             \u2502        \
    \        \u2502 US                    \u2502\n\u2502 80.8.8.8   \u2502 Orange\
    \            \u2502 3215              \u2502 Le Tampon      \u2502 RE        \
    \            \u2502\n\u2502 90.9.250.1 \u2502 Orange            \u2502 3215  \
    \            \u2502 Lyon           \u2502 FR                    \u2502\n\u2502\
    \ not_anip   \u2502 NULL              \u2502 NULL              \u2502 NULL   \
    \        \u2502 NULL                  \u2502\n\u2514\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2534\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2534\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
