extension:
  # Haybarn: disabled because the extension does not yet build
  # against DuckDB 1.5.2 — upstream community-extensions also has
  # no v1.5.2 binary. Re-enable when upstream lands a v1.5.2-
  # compatible release (sync_from_upstream will pick up the bump).
  # Tracker: https://github.com/Mooncake-Labs/duckdb_mooncake/issues/3
  excluded_platforms: linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
  name: mooncake
  description: Read Iceberg tables written by moonlink in real time
  version: 0.0.1
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - dpxcc
  requires_toolchains: rust
repo:
  github: Mooncake-Labs/duckdb_mooncake
  ref: bd9e5f3ade4ae41d5d13d9cfd4b37b09b39996ab
docs:
  hello_world: 'ATTACH DATABASE ''mooncake'' (TYPE mooncake, URI ''/var/lib/postgresql/data/pg_mooncake/moonlink.sock'',
    DATABASE ''postgres'');

    SELECT * FROM mooncake.public.c;

    '
  extended_description: 'For more information regarding usage, see [README.md](https://github.com/Mooncake-Labs/duckdb_mooncake/blob/v0.0.1/README.md).

    '
