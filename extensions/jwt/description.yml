extension:
  # Haybarn: disabled because the extension does not yet build
  # against DuckDB 1.5.2 — upstream community-extensions also has
  # no v1.5.2 binary. Re-enable when upstream lands a v1.5.2-
  # compatible release (sync_from_upstream will pick up the bump).
  # Tracker: https://github.com/GalvinGao/duckdb_jwt/issues/2
  excluded_platforms: linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
  name: jwt
  description: Decode and work with JWT (JSON Web Token) in SQL queries
  version: 0.0.1
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - GalvinGao
repo:
  github: GalvinGao/duckdb_jwt
  ref: 9511967148dd532b45e4088182501187559f1829
docs:
  decode_jwt: '-- Decode a JWT token payload

    SELECT jwt_decode_payload(''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c'')
    AS payload;

    '
  extract_claim: "-- Extract the 'sub' claim from a JWT token\nSELECT \n  json_extract(\n\
    \    jwt_decode_payload('eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c'),\n\
    \    '$.sub'\n  ) AS subject;\n"
  extended_description: "The JWT extension provides functionality to decode and work\
    \ with JWT (JSON Web Token) directly in DuckDB SQL queries. \n\n## Features\n\n\
    - `jwt_decode_payload(token)`: Decodes the payload part of a JWT token and returns\
    \ it as a JSON string\n- Base64 URL-safe decoding for JWT token components\n\n\
    ## Use Cases\n\n- Analyzing JWT tokens in your data\n- Extracting claims from\
    \ authentication tokens\n- Debugging JWT-based authentication systems\n- Working\
    \ with JWT tokens in data pipelines\n\nYou can combine the JWT functions with\
    \ DuckDB's built-in JSON functionality to extract specific claims from tokens. "
