extension:
  name: duckthink
  description: "ASK() \u2014 natural-language SQL for DuckDB, grounded in your dbt\
    \ Semantic Layer"
  version: 0.1.0
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;windows_amd64;windows_amd64_mingw
  maintainers:
  - pedro-filardi
repo:
  github: pedro-filardi/duckthink
  ref: a5b93d09875d3c48124d3bb7640730708cc8f36e
docs:
  hello_world: "CREATE SECRET oai (TYPE openai, API_KEY 'sk-...');\nCREATE MODEL('gpt',\
    \ 'gpt-4o-mini', 'openai');\nSET ask_model = 'gpt';\n-- Ground ASK in your dbt\
    \ Semantic Layer: metrics, entities and tags come from the\n-- manifest, and a\
    \ tag scopes the question to a business domain \u2014 no ON (...) needed.\nSET\
    \ ask_dbt_semantic_manifest = 'target/manifest.json';\nSET ask_dbt_scope_tags\
    \ = 'support';\nASK('average ticket resolution time by team this month')\n  RETURN\
    \ (team VARCHAR, avg_hours DECIMAL);\n"
  extended_description: "duckthink brings ASK() \u2014 natural-language-to-SQL \u2014\
    \ to DuckDB, grounded in your dbt Semantic\nLayer. Point it at a dbt manifest\
    \ (SET ask_dbt_semantic_manifest) and generation uses your\nreal semantic models,\
    \ metrics, entities and tags \u2014 so \"gross margin\" or \"attrition rate\"\n\
    resolve to their exact definitions instead of the model's best guess \u2014 and\
    \ a dbt tag\n(SET ask_dbt_scope_tags) scopes a question to a business domain.\
    \ ASK writes exactly one\nread-only SELECT over the tables in scope, executes\
    \ it, and returns typed rows. It also runs\nover the plain DuckDB catalog with\
    \ no dbt, and optional embedding-based table retrieval\n(SET ask_embed_model)\
    \ scales it to large schemas. Works with OpenAI, Ollama or Anthropic.\n"
