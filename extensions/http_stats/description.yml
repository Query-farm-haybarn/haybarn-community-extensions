    \          \u2502\u2502\n-- \u2502\u2502     in: 429 bytes  out: 0 bytes    \u2502\
    \u2502\n-- \u2502\u2502          Total Time: 1.12s         \u2502\u2502\n-- \u2502\
    \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\u2502\
    \n-- \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2518\n"
  extended_description: 'The HTTP stats extension transparently intercepts all HTTP
    traffic and collects

    request statistics (request counts, bytes sent and received and request time)
    on a

    per-host basis. The collected statistics are surfaced through DuckDB''s `EXPLAIN
    ANALYZE`

    output.


    The extension works alongside the HTTPFS extension, which provides DuckDB with
    HTTP(S)

    and S3 file system support. When both extensions are loaded, HTTP stats wraps
    HTTPFS''s

    HTTP backend to measure traffic while HTTPFS handles the actual transport.


    Key advantages over HTTPFS''s built-in profiling:

    - Works correctly when querying DuckDB databases stored on S3.

    - Provides per-host breakdown for queries that fetch data from multiple remote
    servers.


    For detailed documentation, visit the [extension repository](https://github.com/tlinhart/duckdb-http-stats).

    '
