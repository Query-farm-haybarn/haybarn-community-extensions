  hello_world: "-- Run a query against remote source(s) with profiling enabled.\n\
    EXPLAIN ANALYZE SELECT * FROM (\n    SELECT count(*) FROM read_json('https://httpbin.org/json')\n\
    \    UNION ALL\n    SELECT count(*) FROM read_json('https://jsonplaceholder.typicode.com/todos/1')\n\
    );\n\n-- \u250C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2510\n-- \u2502\u250C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2510\u2502\n-- \u2502\u2502             HTTP Stats             \u2502\u2502\
    \n-- \u2502\u2502                                    \u2502\u2502\n-- \u2502\u2502\
    \    jsonplaceholder.typicode.com    \u2502\u2502\n-- \u2502\u2502    \u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \    \u2502\u2502\n-- \u2502\u2502          Total Requests: 2         \u2502\u2502\
    \n-- \u2502\u2502           HEAD: 1  GET: 1          \u2502\u2502\n-- \u2502\u2502\
    \     in: 83 bytes  out: 0 bytes     \u2502\u2502\n-- \u2502\u2502          Total\
    \ Time: 0.19s         \u2502\u2502\n-- \u2502\u2502                          \
    \          \u2502\u2502\n-- \u2502\u2502             httpbin.org            \u2502\
    \u2502\n-- \u2502\u2502             \u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500            \u2502\u2502\n-- \u2502\u2502          Total\
