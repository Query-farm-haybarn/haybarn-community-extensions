extension:
  # Haybarn: Upstream repo (moj-analytical-services/splink_udfs) currently
  # returns 404 — the rebuild can't checkout the source. Upstream
  # community-extensions has the same broken descriptor; their last
  # binary at v1.5.2 predates the repo going dark.
  # Companion issue filed at duckdb/community-extensions to fix the
  # descriptor upstream:
  # https://github.com/duckdb/community-extensions/issues/1924
  # Once the URL is corrected (or descriptor removed), sync_from_upstream
  # will pull the fix and we re-enable.
  excluded_platforms: linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
  name: splink_udfs
  description: Phonetic, text normalization and address matching functions for record
    linkage.
  version: 0.0.11
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - RobinL
repo:
  github: moj-analytical-services/splink_udfs
  ref: cf00056f887486d0aee0a853a764f9775aa40438
docs:
  hello_world: "LOAD splink_udfs;\nSELECT soundex(unaccent('J\xFCrgen'));  -- returns\
    \ 'J625'\n"
  extended_description: 'The splink_udfs extension provides functions for data cleaning
    and phonetic matching.


    Includes `soundex(str)`, `strip_diacritics(str)`, `unaccent(str)`,

    `ngrams(list,n)`, `double_metaphone(str)`

    and faster versions of `levenshtein` and `damerau_levenshtein`.

    '
