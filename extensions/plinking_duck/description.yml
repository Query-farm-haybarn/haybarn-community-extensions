extension:
  name: plinking_duck
  description: Read and write PLINK 2 genomics file formats and run common genetic
    analyses directly in SQL
  version: 0.17.0
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: windows_amd64;windows_amd64_mingw;windows_amd64_rtools;wasm_mvp;wasm_eh;wasm_threads;linux_amd64_musl
  maintainers:
  - teaguesterling
repo:
  github: teaguesterling/plinking_duck
  ref: b808cfe4809be72c1951add834dbe85b3f992aa9
  variegata: 7a34f3ab8d76534aaebed0aaa88e8ef27099f4e6
  ref_next: b808cfe4809be72c1951add834dbe85b3f992aa9
docs:
  hello_world: '-- Read variant metadata from a .pvar file

    SELECT CHROM, POS, ID, REF, ALT

    FROM read_pvar(''cohort.pvar'')

    WHERE CHROM = ''22'';


    -- Read genotypes in tidy format (one row per variant x sample)

    SELECT chrom, pos, iid, genotype

    FROM read_pfile(''cohort'', orient := ''genotype'')

    LIMIT 10;


    -- Compute allele frequencies

    SELECT * FROM plink_freq(''cohort.pgen'')

    WHERE ALT_FREQ > 0.01;


    -- Run a GWAS association test

    SELECT * FROM plink_glm(''cohort'')

    WHERE p_value < 5e-8;

    '
  extended_description: "PlinkingDuck brings [PLINK 2](https://www.cog-genomics.org/plink/2.0/)\
    \ genotype,\nvariant, and sample data into DuckDB, letting you query genomics\
    \ datasets with\nstandard SQL instead of format-specific command-line tools.\n\
    \n**File readers:**\n- `read_pvar(path | [paths])` \u2014 variant metadata (.pvar/.bim);\
    \ a list row-concatenates multiple files\n- `read_psam(path)` \u2014 sample metadata\
    \ (.psam/.fam)\n- `read_pgen(path)` \u2014 binary genotypes (.pgen)\n- `read_pfile(prefix\
    \ | [prefixes])` \u2014 unified fileset reader with orient modes (variant/genotype/sample),\
    \ sample subsetting, region and variant filtering; a list of prefixes reads a\
    \ variant-sharded fileset (identical samples) as one table, and `combine_samples\
    \ := 'concatenate' | 'disjoint'` reads a sample-sharded cohort (one shared `.pvar`)\
    \ as one table; and `read_pfile(catalog := '<cohort>.pfile.json')` reads a version-2\
    \ matrix as one 2-D cohort across its variant and sample blocks. `read_pfile('<prefix>')`\
    \ now also discovers a `<prefix>.pfile.json` catalog beside the prefix, `catalog\
    \ :=` reads version-1 catalogs (a sharded cohort or single fileset) as well, and\
    \ a `WHERE` on `CHROM`/`POS` or `IID` prunes catalog cells on both axes before\
    \ they are read\n- `read_plink_vcf(path)` \u2014 fast biallelic genotype extraction\
    \ from VCF/VCF.gz (~3x faster than htslib)\n\n**Writing & catalogs:**\n- `COPY\
    \ (\u2026) TO 'out' (FORMAT pvar | psam | pgen | pfile)` \u2014 write PLINK 2\
    \ filesets from SQL. `shard_by '<col>'` splits a cohort into one fileset per key\
    \ (e.g. per chromosome); `shard_samples {label: [iids], \u2026}` splits it along\
    \ the sample axis into named groups over one shared `.pvar`; giving both at once\
    \ writes a **matrix** \u2014 an M \xD7 N grid of filesets described by a `\"pfile_catalog\"\
    : 2` catalog. A `COPY` errors if its output already exists \u2014 add `force`\
    \ to replace it\n- `.pfile.json` catalog \u2014 a thin JSON catalog over a set\
    \ of filesets (a shared `.pvar`/`.psam` plus per-file partition and genomic-range\
    \ annotations); the sharded writers emit one as their manifest. The **matrix form**\
    \ (`\"pfile_catalog\": 2`) tiles a sparse 2-axis variants \xD7 samples grid of\
    \ filesets with catalog-defined typed keys, pruned on both axes\n- `ATTACH 'cohort.pfile.json'\
    \ (TYPE pfile_catalog)` \u2014 expose any catalog (a single fileset, a sharded\
    \ cohort, or a matrix) as a read-only database with `variants`, `samples`, `genotypes`,\
    \ `cells`, and per-axis block relations; pushdown-aware and DETACH-clean\n- `read_pfile_catalog(path)`\
    \ \u2014 parse, verify, and prune a catalog (1-D or the v2 matrix), returning\
    \ one row per surviving shard/cell with resolved companion paths (text or parquet)\n\
    - `read_pfile_catalog_metadata(path)` / `read_pfile_catalog_layout(path)` \u2014\
    \ inspect a catalog without reading data: its declared schema, and its full chunk\
    \ map (one row per cell, holes included)\n\n**Analysis functions:**\n- `plink_freq`\
    \ \u2014 per-variant allele frequencies via fast genotype counting\n- `plink_hardy`\
    \ \u2014 Hardy-Weinberg equilibrium exact test\n- `plink_missing` \u2014 per-variant\
    \ or per-sample missingness rates\n- `plink_ld` \u2014 pairwise linkage disequilibrium\
    \ (r\xB2, D, D')\n- `plink_score` \u2014 polygenic risk scoring with mean imputation\n\
    - `plink_glm` \u2014 per-variant GWAS regression (linear, logistic, Firth)\n-\
    \ `plink_pca` \u2014 principal component analysis via randomized SVD\n\n**Genotype\
    \ output modes:**\n- `genotypes='struct'` \u2014 STRUCT with named fields per\
    \ sample\n- `genotypes='counts'` \u2014 fast genotype counting (no decompression)\n\
    - `genotypes='stats'` \u2014 counts + AF, MAF, missingness, heterozygosity\n\n\
    **Flexible inputs:**\n- Unified `variants` parameter: indices, rsids, CPRA strings/structs,\
    \ ranges\n- Parquet/CSV/table companions for variant and sample metadata\n- `af_range`\
    \ / `ac_range` filter pushdown, and `include_genotypes` (hardcall\n  category)\
    \ / `genotype_range` for fast carrier lookups \u2014 in `orient := 'sample'`\n\
    \  only the matching subjects are materialized\n\n**Remote / cloud reads:**\n\
    - Read `.pgen` filesets directly from `s3://`, `https://`, and other DuckDB\n\
    \  filesystems (companions too) \u2014 targeted/region queries fetch only the\
    \ bytes\n  they need via HTTP range reads. `plinking_pgen_io := 'localize'` downloads\
    \ once\n  for remote full scans. Split-index (`.pgen.pgi`) filesets are read transparently.\n\
    \nAll functions support projection pushdown (skip genotype decompression for\n\
    metadata-only queries), parallel scanning, sample subsetting, and region\nfiltering.\
    \ Legacy PLINK 1 formats (.bim/.fam) are auto-detected.\n\nBuilt on [pgenlib](https://github.com/chrchang/plink-ng)\
    \ for efficient access\nto the compressed .pgen binary format without full decompression.\n\
    \nFor full documentation, see [plinking-duck.readthedocs.io](https://plinking-duck.readthedocs.io).\n"
