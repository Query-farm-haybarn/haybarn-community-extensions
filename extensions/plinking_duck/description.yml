extension:
  name: plinking_duck
  description: Read PLINK 2 genomics file formats and run common genetic analyses
    directly in SQL
  version: 0.8.2
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: windows_amd64;windows_amd64_mingw;windows_amd64_rtools;wasm_mvp;wasm_eh;wasm_threads;linux_amd64_musl
  maintainers:
  - teaguesterling
repo:
  github: teaguesterling/plinking_duck
  ref: b32b0cde755ee261ad4e25ca6634e9bc1c560786
docs:
  hello_world: '-- Read variant metadata from a .pvar file

    SELECT CHROM, POS, ID, REF, ALT

    FROM read_pvar(''cohort.pvar'')

    WHERE CHROM = ''22'';


    -- Read genotypes in tidy format (one row per variant x sample)

    SELECT chrom, pos, iid, genotype

    FROM read_pfile(''cohort'', orient := ''genotype'')

    LIMIT 10;


    -- Compute allele frequencies

    SELECT * FROM plink_freq(''cohort.pgen'')

    WHERE ALT_FREQ > 0.01;


    -- Run a GWAS association test

    SELECT * FROM plink_glm(''cohort'')

    WHERE p_value < 5e-8;

    '
  extended_description: "PlinkingDuck brings [PLINK 2](https://www.cog-genomics.org/plink/2.0/)\
    \ genotype,\nvariant, and sample data into DuckDB, letting you query genomics\
    \ datasets with\nstandard SQL instead of format-specific command-line tools.\n\
    \n**File readers:**\n- `read_pvar(path | [paths])` \u2014 variant metadata (.pvar/.bim);\
    \ a list row-concatenates multiple files\n- `read_psam(path)` \u2014 sample metadata\
    \ (.psam/.fam)\n- `read_pgen(path)` \u2014 binary genotypes (.pgen)\n- `read_pfile(prefix\
    \ | [prefixes])` \u2014 unified fileset reader with orient modes (variant/genotype/sample),\
    \ sample subsetting, region and variant filtering; accepts a list of prefixes\
    \ to read a variant-sharded fileset (identical samples) as one table\n- `read_plink_vcf(path)`\
    \ \u2014 fast biallelic genotype extraction from VCF/VCF.gz (~3x faster than htslib)\n\
    \n**Analysis functions:**\n- `plink_freq` \u2014 per-variant allele frequencies\
    \ via fast genotype counting\n- `plink_hardy` \u2014 Hardy-Weinberg equilibrium\
    \ exact test\n- `plink_missing` \u2014 per-variant or per-sample missingness rates\n\
    - `plink_ld` \u2014 pairwise linkage disequilibrium (r\xB2, D, D')\n- `plink_score`\
    \ \u2014 polygenic risk scoring with mean imputation\n- `plink_glm` \u2014 per-variant\
    \ GWAS regression (linear, logistic, Firth)\n- `plink_pca` \u2014 principal component\
    \ analysis via randomized SVD\n\n**Genotype output modes:**\n- `genotypes='struct'`\
    \ \u2014 STRUCT with named fields per sample\n- `genotypes='counts'` \u2014 fast\
    \ genotype counting (no decompression)\n- `genotypes='stats'` \u2014 counts +\
    \ AF, MAF, missingness, heterozygosity\n\n**Flexible inputs:**\n- Unified `variants`\
    \ parameter: indices, rsids, CPRA strings/structs, ranges\n- Parquet/CSV/table\
    \ companions for variant and sample metadata\n- `af_range` / `ac_range` filter\
    \ pushdown, and `include_genotypes` (hardcall\n  category) / `genotype_range`\
    \ for fast carrier lookups \u2014 in `orient := 'sample'`\n  only the matching\
    \ subjects are materialized\n\n**Remote / cloud reads:**\n- Read `.pgen` filesets\
    \ directly from `s3://`, `https://`, and other DuckDB\n  filesystems (companions\
    \ too) \u2014 targeted/region queries fetch only the bytes\n  they need via HTTP\
    \ range reads. `plinking_pgen_io := 'localize'` downloads once\n  for remote full\
    \ scans. Split-index (`.pgen.pgi`) filesets are read transparently.\n\nAll functions\
    \ support projection pushdown (skip genotype decompression for\nmetadata-only\
    \ queries), parallel scanning, sample subsetting, and region\nfiltering. Legacy\
    \ PLINK 1 formats (.bim/.fam) are auto-detected.\n\nBuilt on [pgenlib](https://github.com/chrchang/plink-ng)\
    \ for efficient access\nto the compressed .pgen binary format without full decompression.\n\
    \nFor full documentation, see [plinking-duck.readthedocs.io](https://plinking-duck.readthedocs.io).\n"
