extension:
  name: midi
  description: Read, analyze, generate, and play MIDI files with SQL. Provides table
    functions for parsing Standard MIDI Files, scalar functions for note/frequency
    conversion, and macOS playback via AudioToolbox.
  version: 0.1.0
  language: C++
  build: cmake
  license: MIT
  # Haybarn: disabled 2026-05-27 — catalog dir 'duckdb_midi' ≠ extension.name
  # 'midi', so the prepare step fails before building. Re-enable by renaming
  # the dir to 'midi' (or aligning the descriptor name).
  excluded_platforms: linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
  requires_toolchains: ''
  maintainers:
  - nkwork9999
repo:
  github: nkwork9999/duckdb-midi
  ref: b50ec402b5c522c3cd43c5d42a982a71e5a81998
docs:
  hello_world: '-- Load the extension

    LOAD midi;


    -- Generate a test MIDI file

    SELECT midi_gen(''/tmp/test.mid'', ''scale'');


    -- Read all events

    SELECT * FROM read_midi(''/tmp/test.mid'') LIMIT 10;


    -- Analyze notes with pairing

    SELECT note_name, count(*) as freq, round(avg(duration_sec), 2) as avg_dur

    FROM midi_notes(''/tmp/test.mid'')

    GROUP BY note_name ORDER BY freq DESC;


    -- Play (macOS only)

    SELECT midi_play(''/tmp/test.mid'');

    '
  extended_description: "duckdb-midi brings MIDI file support to DuckDB. Parse, analyze,\
    \ generate, and play\nStandard MIDI Files entirely from SQL.\n\n**Table Functions**:\n\
    - `read_midi(path)` - All MIDI events as a table (note_on, note_off, control_change,\
    \ meta, etc.)\n- `midi_notes(path)` - Note-on/off pairs with duration, velocity,\
    \ and note name\n- `midi_meta(path)` - Meta events (tempo, time signature, key\
    \ signature, track names)\n\n**Scalar Functions**:\n- `midi_note_name(60)` \u2192\
    \ `'C4'`\n- `midi_note_number('C4')` \u2192 `60`\n- `midi_note_freq(69)` \u2192\
    \ `440.0`\n- `midi_bpm_to_uspqn(120.0)` \u2192 `500000`\n- `midi_uspqn_to_bpm(500000)`\
    \ \u2192 `120.0`\n\n**Write / Generate**:\n- `midi_write(path, notes[], durations[],\
    \ velocities[], bpm)` - Create MIDI from arrays\n- `midi_gen(path, preset)` -\
    \ Generate test MIDI (scale, chord, arpeggio, drum, chromatic)\n\n**Playback (macOS)**:\n\
    - `midi_play(path)` - Play MIDI file (blocks until finished)\n- `midi_stop()`\
    \ - Stop playback\n\nUses [craigsapp/midifile](https://github.com/craigsapp/midifile)\
    \ for SMF parsing/writing\nand macOS AudioToolbox for playback.\n"
