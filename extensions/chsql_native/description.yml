  extended_description: '## chsql_native

    This experimental community extension implements a Native Clickhouse client for
    DuckDB.


    ### Client Configuration

    The extension can be configured the following using ENV variables

    ```

    CLICKHOUSE_URL

    CLICKHOUSE_USER

    CLICKHOUSE_PASSWORD

    ```


    Authentication and connection parameters can be included in the URL

    ```

    export CLICKHOUSE_URL="tcp://user:pass@remote:9440/?secure=true&skip_verify=true"

    -- export CLICKHOUSE_URL="tcp://localhost:9000"

    ```


    > This extension is experimental and potentially unstable. Do not use in production.
    See README for full examples.

    '
