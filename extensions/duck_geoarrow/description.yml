extension:
  name: duck_geoarrow
  description: DuckDB extension for converting GEOMETRY/WKB to and from GeoArrow native
    encodings, powered by geoarrow-c.
  version: 0.1.4
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - am2222
repo:
  github: am2222/duck_geoarrow
  ref: 56f57f0e2c10f87c7455d5b585777e3412ee11a9
docs:
  hello_world: "INSTALL duck_geoarrow FROM community;\nLOAD duck_geoarrow;\n\n-- Read\
    \ a GeoArrow-encoded GeoParquet file written by geopandas. A geometry column\n\
    -- written with encoding=\"polygon\" arrives as STRUCT(x DOUBLE, y DOUBLE)[][].\n\
    SELECT county_name, st_geomfromgeoarrow('polygon', geometry) AS geom\nFROM read_parquet('county_regions.parquet');\n\
    \n-- Write GEOMETRY back out as a GeoArrow native encoding\nCOPY (SELECT county_name,\
    \ st_asgeoarrowpolygon(geom) AS geometry FROM counties)\nTO 'counties.parquet';\n\
    \n-- GEOMETRY -> GeoArrow native encoding, one function per geometry type\nSELECT\
    \ st_asgeoarrowpoint('POINT(30 10)'::GEOMETRY);\n-- {'x': 30.0, 'y': 10.0}\n\n\
    SELECT st_asgeoarrowpolygon('POLYGON((0 0, 1 0, 1 1, 0 0))'::GEOMETRY);\n-- [[{'x':\
    \ 0.0, 'y': 0.0}, {'x': 1.0, 'y': 0.0}, {'x': 1.0, 'y': 1.0}, {'x': 0.0, 'y':\
    \ 0.0}]]\n\n-- GeoArrow native encoding -> GEOMETRY; the type name disambiguates\
    \ colliding shapes\nSELECT st_geomfromgeoarrow('linestring', [{'x': 0.0, 'y':\
    \ 0.0}, {'x': 1.0, 'y': 1.0}]),\n       st_geomfromgeoarrow('multipoint', [{'x':\
    \ 0.0, 'y': 0.0}, {'x': 1.0, 'y': 1.0}]);\n-- LINESTRING (0 0, 1 1)  |  MULTIPOINT\
    \ (0 0, 1 1)\n\n-- Z and M: reading infers them from the value, writing takes\
    \ them as an argument\nSELECT st_geomfromgeoarrow('point', {'x': 1.0, 'y': 2.0,\
    \ 'z': 3.0});\n-- POINT Z (1 2 3)\nSELECT st_asgeoarrowpoint('POINT Z (1 2 3)'::GEOMETRY,\
    \ 'xyz');\n-- {'x': 1.0, 'y': 2.0, 'z': 3.0}\n\n-- Flat struct form: one struct\
    \ per geometry with parallel coordinate arrays\nSELECT st_asgeoarrow('POINT(30\
    \ 10)'::GEOMETRY);\n-- {'geometry_type': 1, 'xs': [30.0], 'ys': [10.0], 'ring_offsets':\
    \ [], 'geom_offsets': []}\n\nSELECT duck_geoarrow_version();\n"
  extended_description: "`duck_geoarrow` converts between DuckDB `GEOMETRY` (or WKB\
    \ `BLOB`) and the\n[GeoArrow](https://geoarrow.org/) coordinate encodings, powered\
    \ by the\n[geoarrow-c](https://github.com/geoarrow/geoarrow-c) library.\n\nTwo\
    \ GeoArrow representations are supported:\n\n- **Native encodings**: nested lists\
    \ of separated coordinates (`STRUCT(x, y)[][]` for a\n  Polygon, and so on). This\
    \ is what GeoParquet, geoarrow-pyarrow and geopandas produce,\n  so it is the\
    \ one to reach for when reading or writing files.\n- **A flat struct**: one struct\
    \ per geometry holding parallel coordinate and offset\n  arrays (`geometry_type`,\
    \ `xs`, `ys`, optional `zs` / `ms`, `ring_offsets`,\n  `geom_offsets`). Convenient\
    \ for hand-building geometries in SQL.\n\nBoth directions support XY, XYZ, XYM\
    \ and XYZM.\n\n### Functions\n\n| Function | Direction | Notes |\n|---|---|---|\n\
    | `st_geomfromgeoarrow(type, value)` | GeoArrow \u2192 GEOMETRY | Generic: any\
    \ native encoding, type given as a string |\n| `st_geomfromgeoarrow<type>(value)`\
    \ | GeoArrow \u2192 GEOMETRY | One name per geometry type |\n| `st_geomfromgeoarrow(struct)`\
    \ | GeoArrow \u2192 GEOMETRY | Flat struct form |\n| `st_asgeoarrow<type>(geom[,\
    \ dims])` | GEOMETRY \u2192 GeoArrow | Native encoding for one geometry type |\n\
    | `st_asgeoarrow(geom[, dims])` | GEOMETRY \u2192 GeoArrow | Flat struct form\
    \ |\n| `duck_geoarrow_version()` | \u2014 | Extension and geoarrow-c versions\
    \ |\n\n`<type>` is one of `point`, `linestring`, `polygon`, `multipoint`, `multilinestring`\
    \ or\n`multipolygon`. All conversion functions accept either `GEOMETRY` or a `BLOB`\
    \ holding WKB.\n\n### Native encodings\n\n| Geometry type | DuckDB type | GEOMETRY\
    \ \u2192 GeoArrow | GeoArrow \u2192 GEOMETRY |\n|---|---|---|---|\n| Point | `STRUCT(x,\
    \ y)` | `st_asgeoarrowpoint` | `st_geomfromgeoarrowpoint` |\n| LineString | `STRUCT(x,\
    \ y)[]` | `st_asgeoarrowlinestring` | `st_geomfromgeoarrowlinestring` |\n| Polygon\
    \ | `STRUCT(x, y)[][]` | `st_asgeoarrowpolygon` | `st_geomfromgeoarrowpolygon`\
    \ |\n| MultiPoint | `STRUCT(x, y)[]` | `st_asgeoarrowmultipoint` | `st_geomfromgeoarrowmultipoint`\
    \ |\n| MultiLineString | `STRUCT(x, y)[][]` | `st_asgeoarrowmultilinestring` |\
    \ `st_geomfromgeoarrowmultilinestring` |\n| MultiPolygon | `STRUCT(x, y)[][][]`\
    \ | `st_asgeoarrowmultipolygon` | `st_geomfromgeoarrowmultipolygon` |\n\nThese\
    \ are the separated-coordinate layouts from the\n[GeoArrow specification](https://geoarrow.org/format),\
    \ so the values interoperate\ndirectly with other GeoArrow implementations.\n\n\
    The generic `st_geomfromgeoarrow(type, value)` exists because the DuckDB types\
    \ collide:\nLineString and MultiPoint are both `STRUCT(x, y)[]`, and Polygon and\
    \ MultiLineString are\nboth `STRUCT(x, y)[][]`. The type name is resolved at bind\
    \ time, so an unknown type or a\nmismatched shape is a binder error rather than\
    \ a runtime one. Names are case- and\nseparator-insensitive and may carry a `z`,\
    \ `m` or `zm` suffix.\n\n### Z and M dimensions\n\nGeoArrow carries extra ordinates\
    \ in the coordinate struct (`STRUCT(x, y, z)`,\n`STRUCT(x, y, m)`, `STRUCT(x,\
    \ y, z, m)`), and the flat struct gains matching `zs` / `ms`\nlists. Reading needs\
    \ no extra argument since the value's type says which ordinates are\npresent.\
    \ Writing takes the dimensions as an argument (`xy`, `xyz`, `xym`, `xyzm`) because\n\
    a SQL function's return type must be fixed before any data is seen; omitting it\
    \ means\n`xy`. Dropping ordinates is allowed, inventing them is not: asking for\
    \ `xyz` from a 2D\ngeometry raises an error rather than filling in NaNs.\n\n###\
    \ Notes\n\n- `NULL` input produces `NULL` output. A `NULL` inside a list (a null\
    \ ring, say) is read\n  as an empty ring, since the GeoArrow native encoding only\
    \ carries validity at the top\n  level.\n- GeometryCollection, and the `geoarrow.box`\
    \ and interleaved-coordinate encodings, are\n  not supported.\n"
