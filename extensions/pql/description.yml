extension:
  name: pql
  description: Predictive queries as SQL. TRAIN a model on the tables you already
    have, PREDICT with it, BACKTEST it, and OPTIMIZE a plan from its predictions.
  version: 0.3.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - waelbenamara
repo:
  github: Guepard-Corp/duckdb-pql
  variegata: 021b33aebe70bb427f6fbc3d8bd367bd25cfe9f5
  ref: 246e4d08436ae750fbfea1f0bf709df6ff9d5f70
docs:
  hello_world: "-- 1,200 customers, their orders, and a question about the future.\n\
    CREATE TABLE customers AS\n  SELECT i AS id, 1 + i % 4 AS tier,\n         DATE\
    \ '2025-01-01' + INTERVAL (i % 300) DAY AS last_seen\n  FROM range(1200) t(i);\n\
    CREATE TABLE orders AS\n  SELECT c.id AS customer_id,\n         c.last_seen -\
    \ INTERVAL (7 * k + (c.id * 7 + k * 13) % 5) DAY AS ts,\n         10 + (c.id *\
    \ 31 + k * 17) % 90 AS amount\n  FROM customers c, range(1, 9) t(k)\n  WHERE k\
    \ <= c.tier + c.id % 3;\nINSERT INTO orders\n  SELECT id, last_seen + INTERVAL\
    \ (1 + id * 13 % 28) DAY, 10 + id * 3 % 90\n  FROM customers WHERE tier * 20 +\
    \ id * 37 % 60 > 70;\n\n-- Will each customer order again within 30 days of when\
    \ we last saw them?\nTRAIN MODEL reorder PREDICT EXISTS(orders) FOR customers\
    \ AT last_seen HORIZON 30 DAYS;\n\n-- One row per customer, with a probability.\n\
    PREDICT EXISTS(orders) FOR customers WHERE tier >= 3 USING MODEL reorder;\n"
  extended_description: "PQL adds predictive statements to SQL. A model is trained\
    \ directly on the\ntables in the catalog: PQL follows the foreign keys, builds\
    \ features from the\nrelated tables (counts, averages, recency, spacing), holds\
    \ out a slice by\ntime, and reports how good the model is before you use it. No\
    \ feature\nengineering, no export, no separate service.\n\n### The statements\n\
    \n```sql\nTRAIN [OR REPLACE] MODEL <name>\n  PREDICT <target>                \
    \        -- a column, or COUNT / EXISTS / SUM / AVG / MIN / MAX over a related\
    \ table\n  FOR <table> [AS <alias>]\n  [ WHERE <filter> ]                    \
    \  -- which entities take part\n  [ AT <column> | EVERY <n> <unit> ]      -- the\
    \ anchor time of each example\n  [ HORIZON <n> <unit> ]                  -- how\
    \ far ahead the target is counted\n  [ USING GRAPH (<table>, ...) ]          --\
    \ restrict the tables used\n  [ EXCLUDE (<column>, ...) ]             -- columns\
    \ the model must not see\n  [ SPLIT TEMPORAL VALIDATE FROM <ts> TEST FROM <ts>\
    \ ]\n  [ OPTIONS (<key> = <value>, ...) ];\n\nPREDICT <target> FOR <table> [ WHERE\
    \ <filter> ] USING MODEL <name>;\nBACKTEST MODEL <name> [ FROM <ts> ] [ TO <ts>\
    \ ];   -- replay it row by row against what happened\nEXPLAIN MODEL <name>;  \
    \                              -- which features it relies on\nDROP MODEL [IF\
    \ EXISTS] <name>;\n\n[EXPLAIN] OPTIMIZE <table> [ WHERE <filter> ]       -- a\
    \ plan from the predictions (three forms, below)\n  [ CHOOSE <column> IN (<value>,\
    \ ...) | ASSIGN <column> OVER <table>.<key> [ ... ] ]\n  MAXIMIZE | MINIMIZE <total>\
    \ [ SUBJECT TO <limit> [ AND ... ] ]\n  USING MODEL <name>;\n```\n\nEvery statement\
    \ is also a table function, `pql_exec('<statement>')`, so a\nprediction joins\
    \ to anything. `pql_models()` lists the models in the session.\n\n### What TRAIN\
    \ returns\n\nThe hello-world above prints one row like this:\n\n```text\nmodel\
    \    target          train_rows val_rows test_rows metric  val    test   pr_auc\
    \  baseline features\nreorder  EXISTS(orders)  710        237      237       auroc\
    \   0.871  0.815  0.891   0.608    26\n```\n\n- `test` is the number to trust:\
    \ scored once, on a later slice the model never\n  saw during selection.\n- `baseline`\
    \ is what you get with no model at all: the positive rate for a\n  yes/no target,\
    \ \"the same as last window\" for a quantity. If `test` does not\n  beat it, PQL\
    \ has just told you so.\n- `pr_auc` is average precision, the honest score when\
    \ positives are rare.\n- `val` picked the epoch and is optimistic by construction.\
    \ Do not quote it.\n\n### Two kinds of question\n\n**A column that already exists**\
    \ is imputation and needs no dates:\n\n```sql\nTRAIN MODEL vip PREDICT customers.is_vip\
    \ FOR customers;\n```\n\n**Something in the future** is a forecast. `AT` says\
    \ where \"now\" is for each\nrow, `HORIZON` how far to look, and the target is\
    \ any aggregate over a related\ntable, optionally narrowed:\n\n```sql\nTRAIN MODEL\
    \ spend   PREDICT SUM(orders.amount) FOR customers AT last_seen HORIZON 60 DAYS;\n\
    TRAIN MODEL refunds PREDICT EXISTS(orders WHERE orders.status = 'refunded')\n\
    \  FOR customers AT last_seen HORIZON 60 DAYS;\n```\n\nFor forecasts the engine\
    \ computes the label itself from the window after the\nanchor and builds features\
    \ only from before it, so the answer cannot leak\ninto the inputs. Rows without\
    \ a natural timestamp can use `EVERY 1 MONTH`\nto generate a grid of anchors from\
    \ the data's own span.\n\n### See why, and check it row by row\n\n```sql\nEXPLAIN\
    \ MODEL reorder;\n```\n```text\nfeature              slots importance\ntier  \
    \               1     0.381\norders: count 365d   1     0.018\norders: count 30d\
    \    1     0.010\n```\n\nEach feature group is shuffled in turn and `importance`\
    \ is what the model\nloses. If something you did not expect sits at the top, that\
    \ is usually a\nleak; `EXCLUDE (that_column)` removes it before anything is fitted.\n\
    \n```sql\nSELECT count(*) AS n,\n       round(avg(abs(error)), 2)            \
    \ AS model_mae,\n       round(avg(abs(baseline - actual)), 2) AS persistence_mae\n\
    FROM pql_exec('BACKTEST MODEL spend FROM ''2025-09-15''');\n```\n\n### From a\
    \ prediction to a plan: OPTIMIZE\n\n`OPTIMIZE` is one statement. It turns a model's\
    \ predictions into a plan that\nmaximises or minimises a total under limits, in\
    \ one of three forms:\n\n| form | decides | limits | rows interact |\n|---|---|---|---|\n\
    | `OPTIMIZE t ... SUBJECT TO ...` | which rows to act on | totals over the plan\
    \ | only through the totals |\n| `OPTIMIZE t CHOOSE col IN (...)` | one value\
    \ per row, from a list | totals over the plan | only through the totals |\n| `OPTIMIZE\
    \ t ASSIGN col OVER r.key` | which row of another table each row goes to, or none\
    \ | per resource (`PER col`), and with `SEQUENCE` order, setups and time windows\
    \ | through the resource they share |\n\n```sql\n-- Which rows: fifty calls, to\
    \ the customers worth most who would not reorder on their own.\nOPTIMIZE customers\n\
    \  MAXIMIZE SUM((1 - prediction) * tier * 100)\n  SUBJECT TO COUNT(*) <= 50\n\
    \  USING MODEL reorder;\n\n-- A value per row: the offer for each customer, under\
    \ a budget.\nOPTIMIZE customers\n  CHOOSE offer IN ('none', '10%', '20%')\n  MAXIMIZE\
    \ SUM(prediction - CASE offer WHEN '10%' THEN 10 WHEN '20%' THEN 20 ELSE 0 END)\n\
    \  SUBJECT TO SUM(CASE offer WHEN '10%' THEN 10 WHEN '20%' THEN 20 ELSE 0 END)\
    \ <= 5000\n  USING MODEL spend;\n\n-- A resource per row, in sequence: jobs on\
    \ crews, with travel, time windows and each crew's hours.\nOPTIMIZE jobs WHERE\
    \ open = 1 AT received_at\n  ASSIGN crew OVER crews.crew ELSE 'none'\n    ONLY\
    \ IF resource.kind = kind\n    SEQUENCE FROM resource.free_from\n      START \
    \   DISTANCE(resource.lat, resource.lon, from_lat, from_lon) / 40\n      SETUP\
    \    DISTANCE(prev.to_lat, prev.to_lon, from_lat, from_lon) / 40\n      DURATION\
    \ miles / 40 + 1\n      WINDOW BETWEEN window_from AND window_to\n  MAXIMIZE SUM(prediction\
    \ - plan.setup * 60)\n  SUBJECT TO SUM(plan.setup + plan.duration) PER crew <=\
    \ resource.hours\n  USING MODEL job_margin;\n```\n\nWith `CHOOSE`, one row's choice\
    \ never changes what another row is worth. With\n`ASSIGN` it does: a job uses\
    \ its crew's hours, and its travel depends on the job\nbefore it. So `ASSIGN`\
    \ has its own solver and plan columns (`sequence`, `begin`,\n`setup`, `duration`).\
    \ In every form, `EXPLAIN OPTIMIZE` reports the plan's total\nbeside a bound no\
    \ plan can beat; when the two are equal, the plan is proven best.\n\n### It is\
    \ still SQL\n\n```sql\nSELECT c.tier, round(avg(p.prediction), 3) AS chance_to_reorder\n\
    FROM pql_exec('PREDICT EXISTS(orders) FOR customers USING MODEL reorder') p\n\
    JOIN customers c ON c.id = p.id\nGROUP BY c.tier ORDER BY 1;\n```\n\n### Good\
    \ to know\n\n- Needs DuckDB v1.5.5 or later; built against the current release\
    \ and tested\n  against the next one on every change.\n- Models live for the session\
    \ and are not saved in the database file.\n  Retraining is seconds, so `TRAIN`\
    \ in the same job you `PREDICT` in.\n- Predicting a column that already exists\
    \ has no leakage guarantee: every\n  other column on the row is a feature, including\
    \ ones that are consequences\n  of the target. A near-perfect score there usually\
    \ means a tautology.\n  Forecast targets are the path with the structural guarantee.\n\
    - Filters compare a column to a literal (`=`, `<`, `IN`, `IS NULL`, `AND`,\n \
    \ `OR`). Tables are named without a schema. Text targets are refused rather\n\
    \  than trained as multi-class.\n- `SHOW MODELS` is not available on its own (DuckDB\
    \ parses it first); use\n  `pql_models()` or `pql_exec('SHOW MODELS')`.\n- On\
    \ RelBench, the standard benchmark for prediction over relational\n  databases,\
    \ PQL scores in the same class as the published graph neural\n  network and as\
    \ gradient boosting over hand-built features, from a single\n  statement on a\
    \ laptop CPU.\n\n### Learn more\n\n- [Tutorial](https://github.com/Guepard-Corp/duckdb-pql/blob/main/docs/tutorial.md):\n\
    \  a 15-minute walk from first model to backtest, with real output.\n- [Reference](https://github.com/Guepard-Corp/duckdb-pql/blob/main/docs/reference.md):\n\
    \  full syntax, options, result columns, and the current limitations.\n- [How\
    \ it works](https://github.com/Guepard-Corp/duckdb-pql/blob/main/docs/how-it-works.md):\n\
    \  features, leakage, the two model architectures, and the OPTIMIZE solvers.\n\
    - Issues and questions: https://github.com/Guepard-Corp/duckdb-pql/issues\n"
