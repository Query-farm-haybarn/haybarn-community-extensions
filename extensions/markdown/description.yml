extension:
  name: markdown
  description: Read, analyze, and write Markdown files with block-level document representation
    and inline element support
  version: 1.6.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - teaguesterling
  vcpkg_commit: bffcbb75f71553824aa948a7e7b4f798662a6fa7
repo:
  github: teaguesterling/duckdb_markdown
  ref: 3e8e0d59abce16c227f5d52d26fd094c9448917a
docs:
  hello_world: "-- Load the extension\nLOAD markdown;\n\n-- Read Markdown files with\
    \ glob patterns\nSELECT content FROM read_markdown('docs/**/*.md');\n\n-- Parse\
    \ into block-level elements (duck_block shape)\nSELECT element_type, content,\
    \ level\nFROM read_markdown_blocks('README.md')\nORDER BY element_order;\n\n--\
    \ Extract code blocks from Markdown text\nSELECT cb.language, cb.code\nFROM (\n\
    \  SELECT UNNEST(md_extract_code_blocks('```python\\nprint(\"Hello\")\\n```'))\
    \ as cb\n);\n\n-- Build rich text with inline elements\nSELECT duck_blocks_to_md([\n\
    \  {kind: 'inline', element_type: 'text', content: 'Check out ', level: 1, encoding:\
    \ 'text', attributes: MAP{}, element_order: 0},\n  {kind: 'inline', element_type:\
    \ 'link', content: 'our docs', level: 1, encoding: 'text', attributes: MAP{'href':\
    \ 'https://duckdb-markdown.readthedocs.io/'}, element_order: 1}\n]);\n\n-- Export\
    \ query results as Markdown table\nCOPY (SELECT * FROM my_table) TO 'output.md'\
    \ (FORMAT MARKDOWN);\n\n-- Round-trip: read blocks, transform, write back\nCOPY\
    \ (\n  SELECT kind, element_type, content, level, encoding, attributes\n  FROM\
    \ read_markdown_blocks('doc.md')\n) TO 'copy.md' (FORMAT MARKDOWN, markdown_mode\
    \ 'blocks');\n"
  extended_description: 'The Markdown extension adds comprehensive Markdown processing
    capabilities to DuckDB, enabling structured analysis, transformation, and generation
    of Markdown documents.


    **Documentation:** [https://duckdb-markdown.readthedocs.io/](https://duckdb-markdown.readthedocs.io/)


    **Key Features:**


    - **File Reading Functions**: Read Markdown files with `read_markdown()`, `read_markdown_sections()`,
    and `read_markdown_blocks()` supporting glob patterns, metadata extraction, and
    block-level parsing

    - **Block-Level Representation**: Parse documents into duck_block format with
    `kind` (block/inline), `element_type`, `content`, `level`, `encoding`, `attributes`,
    and `element_order` columns

    - **Inline Element Support**: Build rich text content with bold, italic, links,
    code, math, and more using the unified duck_block structure

    - **COPY TO Markdown**: Export query results as Markdown tables, documents, or
    block-level representations with full round-trip support

    - **Content Extraction**: Extract code blocks, links, images, and tables from
    Markdown content using structured LIST<STRUCT> return types

    - **Document Processing**: Convert markdown to HTML/text, validate content, extract
    metadata, and generate document statistics

    - **Replacement Scan Support**: Query Markdown files directly using `FROM ''*.md''`
    syntax with full glob pattern support

    - **Native MARKDOWN Type**: Custom MARKDOWN type with automatic VARCHAR casting
    for seamless integration

    - **Cross-Platform Support**: Works on Linux, macOS, WebAssembly, and Windows

    - **GitHub Flavored Markdown**: Uses cmark-gfm for accurate parsing of modern
    Markdown features

    - **High Performance**: Process thousands of documents efficiently with 4,000+
    sections/second processing rate


    **Core Functions:**


    - `read_markdown()` - Read Markdown files with comprehensive parameter support

    - `read_markdown_sections()` - Parse files into hierarchical sections with filtering
    options

    - `read_markdown_blocks()` - Parse files into block-level elements (duck_block
    shape)

    - `duck_block_to_md()` - Convert single block/inline element to Markdown

    - `duck_blocks_to_md()` - Convert list of elements to Markdown document

    - `duck_blocks_to_sections()` - Convert blocks to hierarchical sections

    - `md_extract_code_blocks()` - Extract code blocks with language and metadata

    - `md_extract_links()` - Extract links with text, URL, and title information

    - `md_extract_images()` - Extract images with alt text and metadata

    - `md_extract_tables_json()` - Extract tables as structured JSON

    - `md_to_html()` - Convert markdown content to HTML

    - `md_to_text()` - Convert markdown to plain text for full-text search

    - `md_stats()` - Get document statistics (word count, reading time, etc.)

    - `md_extract_metadata()` - Extract frontmatter metadata as MAP


    **COPY TO Modes:**


    - `table` (default) - Export any query as a formatted Markdown table

    - `document` - Reconstruct Markdown from sections with headings and content

    - `blocks` / `duck_block` - Round-trip block-level representation with inline
    element support


    **Example Use Cases:**


    - Documentation analysis across entire repositories

    - Content quality assessment and auditing

    - Large-scale documentation search and indexing

    - Code example extraction and analysis

    - Document transformation pipelines

    - Rich text generation with inline formatting

    - Knowledge base processing and content management


    **Performance:**


    Real-world benchmark: Processing 287 Markdown files (2,699 sections, 1,137 code
    blocks, 1,174 links) in 603ms.


    Full test suite with 1190 passing assertions across 24 test files.

    '
