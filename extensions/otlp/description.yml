extension:
  name: otlp
  description: "Query OpenTelemetry traces, logs, and metrics with SQL \u2014 or stream\
    \ live OTLP/HTTP into DuckDB, DuckLake, or Iceberg"
  version: 0.6.1
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: wasm_mvp;wasm_threads;linux_amd64_musl
  requires_toolchains: rust
  maintainers:
  - smithclay
repo:
  github: smithclay/duckdb-otlp
  ref: 8e627d8e45637316f14ad5e62493ad754b8c34a1
docs:
  hello_world: '-- Load the extension

    LOAD otlp;


    -- Traces: find the slow spans

    SELECT trace_id, span_name, service_name, duration

    FROM read_otlp_traces(''traces.jsonl'')

    WHERE duration > 1e9            -- longer than one second

    ORDER BY duration DESC

    LIMIT 10;


    -- Or run a live OTLP/HTTP endpoint and query what arrives

    SELECT listen_url, auth_token FROM otlp_serve(''otlp:localhost:4318'');

    -- POST telemetry to http://localhost:4318/v1/logs.

    -- Rows commit automatically in the background; otlp_stop commits remaining rows.

    SELECT status FROM otlp_stop(''otlp:localhost:4318'');

    SELECT * FROM otlp_logs;


    -- Metrics: latest gauge readings (works native and in the browser)

    SELECT timestamp, service_name, metric_name, value

    FROM read_otlp_metrics_gauge(''metrics.jsonl'')

    ORDER BY timestamp DESC;


    -- Logs: just the errors, read straight from S3

    SELECT timestamp, severity_text, body, service_name

    FROM read_otlp_logs(''s3://bucket/logs-*.jsonl'')

    WHERE severity_text = ''ERROR'';


    -- Protobuf works too, on native builds

    SELECT * FROM read_otlp_traces(''traces.pb'') LIMIT 10;

    '
  extended_description: "# OpenTelemetry, in SQL\n\nPoint this extension at OTLP data\
    \ and query it like any other table. Traces,\nlogs, and metrics arrive as proper\
    \ columns \u2014 `service_name`, `trace_id`,\n`duration`, `value` \u2014 not JSON\
    \ you have to dig through. The schema follows the\nOpenTelemetry ClickHouse exporter,\
    \ so columns are typed, quick to filter, and\nstable.\n\nThere are two ways in.\n\
    \n## Read files\n\nSix table functions read OTLP exports straight from disk or\
    \ object storage:\n\n- `read_otlp_traces()` \u2014 spans, with attributes, events,\
    \ links, and a computed duration\n- `read_otlp_logs()` \u2014 records, with severity,\
    \ body, and trace correlation\n- `read_otlp_metrics_gauge()`, `read_otlp_metrics_sum()`,\
    \ `read_otlp_metrics_histogram()`, `read_otlp_metrics_exp_histogram()`\n\nJSON,\
    \ JSONL, and protobuf are detected automatically. Paths can be local, a\nglob,\
    \ S3, HTTP(S), Azure, or GCS. The browser build (DuckDB-WASM) reads all\nthree\
    \ formats \u2014 try the [interactive demo](https://smithclay.github.io/duckdb-otlp/).\n\
    \n## Serve live ingest (native builds)\n\n`otlp_serve()` starts an OTLP/HTTP endpoint\
    \ inside DuckDB. Point a Collector or\nSDK exporter at `http://localhost:4318`\
    \ and the rows land in tables you can\nquery:\n\n```sql\nSELECT listen_url, auth_token\n\
    FROM otlp_serve('otlp:localhost:4318');\n```\n\nLeave `catalog` empty to land\
    \ rows in the default catalog for quick local work.\nSet it to an attached [DuckLake](https://ducklake.select)\
    \ lakehouse or writable\nIceberg REST catalog for durable lakehouse ingest.\n\n\
    Ingest is buffered and group-committed. A POST returns `202 Accepted` once rows\n\
    are parsed and buffered; they turn durable at the next automatic background commit,\
    \ currently\nwhen the oldest buffered row is about 5 seconds old or admitted request-body\n\
    bytes reach about 64 MiB. `otlp_server_list()` reports the counters, and\n`otlp_stop()`\
    \ commits what is left before it shuts down. `otlp_flush()` is optional:\nuse\
    \ it only when readers need the latest accepted rows durable immediately while\n\
    the server keeps running. Stop before you close the database \u2014 a plain close\
    \ does\nnot commit buffered rows.\n\n## Use it for\n\n- Reading and analyzing\
    \ Collector or SDK exports\n- A small, always-on OTLP sink that writes to DuckDB,\
    \ DuckLake, or Iceberg\n- Converting telemetry to Parquet, CSV, or anything DuckDB\
    \ writes\n- Inspecting traces, logs, and metrics during local development\n\n\
    ## Good to know\n\n- The live server is native-only and HTTP-only \u2014 no WASM,\
    \ no gRPC.\n- File reads are capped at 100 MB each.\n- Summary metrics and the\
    \ unified `read_otlp_metrics()` are not implemented yet.\n\n## References\n\n\
    - [OpenTelemetry Protocol (OTLP)](https://opentelemetry.io/docs/specs/otlp/)\n\
    - [OpenTelemetry ClickHouse Exporter](https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/exporter/clickhouseexporter)\n"
