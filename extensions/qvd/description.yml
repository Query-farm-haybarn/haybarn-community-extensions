extension:
  name: qvd
  description: Read (streaming) and write Qlik QVD files
  version: 1.0.2
  language: Rust
  build: cmake
  license: Apache-2.0
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_amd64_rtools;linux_amd64_musl
  requires_toolchains: rust;python3
  maintainers:
  - snouhaud
repo:
  github: snouhaud/DuckDB-QVD-Extension
  ref: 4f5cc8fd39b9ef336887c72103a451e5468a6af2
docs:
  hello_world: 'INSTALL qvd FROM community;

    LOAD qvd;


    -- Read (streaming, bounded memory)

    SELECT * FROM read_qvd(''sales.qvd'');

    SELECT * FROM read_qvd(''data/*.qvd'');         -- glob


    -- Write

    COPY (SELECT * FROM sales) TO ''output.qvd'' (FORMAT qvd, FIELD_NAMES (a, b));


    -- Import

    COPY sales FROM ''output.qvd'' (FORMAT qvd);

    '
  extended_description: "100% Rust extension to read and write Qlik QVD files.\n\n\
    - **Streaming, projected** read: bounded memory (~30-40x less than a naive\n \
    \ read) and only the projected columns are decoded (16-30x faster on narrow\n\
    \  queries over large files). Native typing `BIGINT`/`DOUBLE`/`VARCHAR`/`DATE`/\n\
    \  `TIMESTAMP`/`TIME`/`INTERVAL`, projection pushdown and multi-file glob.\n-\
    \ `COPY ... TO (FORMAT qvd)` write with `FIELD_NAMES` option, and\n  `COPY tbl\
    \ FROM 'x.qvd' (FORMAT qvd)` import.\n"
