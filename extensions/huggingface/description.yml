extension:
  name: huggingface
  description: Discover, query, profile, and estimate the storage of Hugging Face
    datasets
  version: 0.2.0
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads
  maintainers:
  - dentiny
repo:
  github: dentiny/duckdb-huggingface
  ref: 72d8fec79ea437ee2f3d8d0f119ab4be4ea95464
docs:
  hello_world: "INSTALL huggingface FROM community;\nLOAD huggingface;\n\nFROM hf_files(\n\
    \    'ibm/duorc',\n    config = 'ParaphraseRC',\n    split = 'train'\n);\n"
  extended_description: 'The `huggingface` extension works with Parquet datasets hosted
    on the

    Hugging Face Hub. It can discover Parquet files, scan records with

    projection and filter pushdown, profile Parquet metadata, and estimate

    external-blob storage from a bounded sample.


    The extension uses `cache_httpfs` for cached access to `hf://` paths and

    supports Hugging Face credentials through DuckDB''s secret manager. Lance

    datasets are not currently supported.

    '
