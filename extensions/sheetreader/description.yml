extension:
  name: sheetreader
  description: Fast XLSX file importer
  version: 0.2.0
  language: C++
  build: cmake
  excluded_platforms: windows_amd64_rtools;windows_amd64_mingw
  license: MIT
  maintainers:
  - harrygav
  - freddie-freeloader
repo:
  github: polydbms/sheetreader-duckdb
  ref: e2b9366c4c409f012a6a31191e629c96628e17e6
docs:
  hello_world: "-- Create table from XLSX file & use default values for parameters\n\
    CREATE TABLE data AS FROM sheetreader('data.xlsx');\n\n-- Example usage of available\
    \ named parameters\nCREATE TABLE data2 AS FROM sheetreader(\n    'data2.xlsx',\n\
    \    sheet_index = 1,\n    threads = 16,\n    skip_rows = 0,\n    has_header =\
    \ true,\n    types = [BOOLEAN, VARCHAR],\n    coerce_to_string = true,\n    force_types\
    \ = true\n);\n"
  extended_description: "`sheetreader` is a DuckDB extension that allows reading XLSX\
    \ files into DuckDB tables with SheetReader, our blazingly fast XLSX parser (https://github.com/polydbms/sheetreader-core).\n\
    \n#### Parameters\n\n| Name | Description | Type | Default |\n|:----|:-----------|:----:|:-------|\n\
    | `sheet_index` | Index of the sheet to read. Starts at 1. | `INTEGER` | `1` |\n\
    | `sheet_name` | Name of the sheet to read. <br> Only either `sheet_index` or\
    \ `sheet_name` can be set.  | `VARCHAR` | `\"\"` |\n| `threads` | Number of threads\
    \ to use, while parsing | `INTEGER` | Half of available cores; minimum 1 |\n|\
    \ `skip_rows` | Number of rows to skip | `INTEGER` | `0` |\n| `has_header` | Force\
    \ to treat first row as header row. <br> <ul> <li> If successful, the cell contents\
    \ are used for column names. </li> <li> If set to `false` (which is the default),\
    \ the extension will still try to treat the first row as header row. <br> The\
    \ difference is that it will not fail, if the first row is not usable. </li> </ul>\
    \ | `BOOLEAN` | `false` |\n| `types` | List of types for all columns <ul> <li>\
    \ Types currently available:<br> `VARCHAR`,`BOOLEAN`,`DOUBLE`, `DATE`.</li> <li>\
    \ Useful in combination with `coerce_to_string` and `force_types`. </li> </ul>\
    \ | `LIST(VARCHAR)` | Uses types determined by first & second row (after skipped\
    \ rows) |\n| `coerce_to_string` | Coerce all cells in column of type `VARCHAR`\
    \ to string (i.e. `VARCHAR`). | `BOOLEAN` | `false` |\n| `force_types` | Use `types`\
    \ even if they are not compatible with types determined by first/second row. <br>\
    \ Cells, that are not of the column type, are set to `NULL` or coerced to string,\
    \ if option is set. | `BOOLEAN` | `false` |\n\n#### More Information\nSheetReader\
    \ was introduced in the **PolyDB research project** ([polydbms.org](https://polydbms.org)).\
    \ The initial design and evaluation was published in the [Information Systems\
    \ Journal](https://www.sciencedirect.com/science/article/abs/pii/S0306437923000194).\
    \ If you use this extension in your research, consider citing the following paper:\n\
    \n```bibtex\n@article{DBLP:journals/is/GavriilidisHZM23,\n  author       = {Haralampos\
    \ Gavriilidis and\n                  Felix Henze and\n                  Eleni\
    \ Tzirita Zacharatou and\n                  Volker Markl},\n  title        = {SheetReader:\
    \ Efficient Specialized Spreadsheet Parsing},\n  journal      = {Inf. Syst.},\n\
    \  volume       = {115},\n  pages        = {102183},\n  year         = {2023},\n\
    \  url          = {https://doi.org/10.1016/j.is.2023.102183},\n  doi         \
    \ = {10.1016/J.IS.2023.102183},\n  timestamp    = {Mon, 26 Jun 2023 20:54:32 +0200},\n\
    \  biburl       = {https://dblp.org/rec/journals/is/GavriilidisHZM23.bib},\n \
    \ bibsource    = {dblp computer science bibliography, https://dblp.org}\n}\n```\n"
