extension:
  name: cache_httpfs
  description: Read cached filesystem for httpfs
  version: 0.14.2
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_rtools;windows_amd64;windows_amd64_mingw
  maintainers:
  - dentiny
  - DouEnergy
repo:
  github: dentiny/duck-read-cache-fs
  ref: 933957df0631fc62d62cb851ece11aa26f72f08a
docs:
  hello_world: 'SELECT cache_httpfs_get_ondisk_data_cache_size();

    '
  extended_description: "This extension adds a read cache filesystem to DuckDB, which\
    \ acts as a wrapper of httpfs extention. \nIt supports a few key features:\n-\
    \ Supports both file metadata, glob, file handle and data block cache\n- Supports\
    \ both on-disk cache and in-memory cache for data blocks, with cache mode, block\
    \ size, cache directories tunable\n- Supports disk cache file eviction based on\
    \ access timestamp or LRU, allows tunable disk space reservation\n- Supports parallel\
    \ IO request, with request size and parallelism tunable\n- Supports optional cache\
    \ entries validation, by default off\n- Supports profiling for IO latency and\
    \ cache hit / miss ratio for a few operations (i.e open, read, glob), which provides\
    \ an insight on workload characterization\n- Exposes function to get cache size\
    \ and cleanup cache\n- Provides an option to disable / enable cache, which could\
    \ act as a drop-in replacement for httpfs\n"
