extension:
  # Haybarn: disabled because the extension does not yet build
  # against DuckDB 1.5.2 — upstream community-extensions also has
  # no v1.5.2 binary. Re-enable when upstream lands a v1.5.2-
  # compatible release (sync_from_upstream will pick up the bump).
  # Tracker: https://github.com/saygox/duckdb-httpd-log/issues/12
  excluded_platforms: linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
  name: httpd_log
  description: Reads and parses Apache HTTP server log files
  version: 0.1.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - saygox
repo:
  github: saygox/duckdb-httpd-log
  ref: f5aad68f1050a5290ae5c69166c182e5d9d59a09
docs:
  hello_world: "-- Basic usage (format auto-detected)\nSELECT * FROM read_httpd_log('access.log');\n\
    \n-- Read from S3 (requires httpfs extension)\nLOAD httpfs;\nSELECT * FROM read_httpd_log('s3://bucket/logs/*.log.gz');\n\
    \n-- Auto-select format from httpd.conf\nSELECT * FROM read_httpd_log('access.log',\
    \ conf='/etc/httpd/conf/httpd.conf');\n\n-- Specify format from httpd.conf\nSELECT\
    \ * FROM read_httpd_log('access.log', conf='httpd.conf', format_type='combined')\n\
    \n-- Read with custom format string\nSELECT * FROM read_httpd_log('access.log',\n\
    \    format_str='%h %l %u %t \"%r\" %>s %b %D');\n"
  extended_description: '- Common Log Format and Combined Log Format (auto-detected)

    - Glob patterns, S3, gzip, and other sources via DuckDB''s filesystem layer

    - Automatic format selection from httpd.conf

    - Parsed and normalized data (timestamps converted to UTC, request lines decomposed)

    - Custom formats via Apache LogFormat syntax

    - Dynamic schema generation with automatic column collision resolution

    '
