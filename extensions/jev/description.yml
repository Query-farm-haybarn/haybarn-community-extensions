extension:
  name: jev
  description: "Ask your tables questions in plain language \u2014 filter, rank and\
    \ classify rows with a condition you write as a sentence"
  version: 0.1.0
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads
  maintainers:
  - judoaseeta
repo:
  github: judoaseeta/duckdb-jev
  ref: 58e548463b0bfb25d86bc68b11515a1daaf87ab3
docs:
  hello_world: "-- Judging rows needs a TypeSafe API key (https://console.typesafe.ai)\n\
    SET jev_api_key = '...';\n\nCREATE TABLE tickets AS SELECT * FROM (VALUES\n  ('card\
    \ declined again, I want my money back'),\n  ('how do I export a dashboard to\
    \ PDF?')) t(body);\n\n-- A boolean, so it composes with the rest of SQL\nSELECT\
    \ * FROM tickets WHERE jev(tickets, 'the customer wants a refund');\n\n-- The\
    \ probability behind it, for ranking and for picking a threshold\nSELECT body,\
    \ jev_prob(tickets, 'the customer is angry') AS p\nFROM tickets ORDER BY p DESC;\n\
    \n-- One of n, per row\nSELECT jev_choice(tickets, 'which team should handle this?',\n\
    \                  ['billing', 'technical', 'sales']) AS team, count(*)\nFROM\
    \ tickets GROUP BY 1;\n"
  extended_description: "`jev` lets you filter, rank and classify rows with plain-language\
    \ conditions. Every row is judged by\n[TypeSafe's Jev](https://docs.typesafe.ai),\
    \ a model that returns calibrated probabilities instead of\ngenerated text, so\
    \ there is no index, no embeddings and no vector column.\n\n| Function | Returns\
    \ | Purpose |\n| --- | --- | --- |\n| `jev(row, condition [, threshold])` | `BOOLEAN`\
    \ | `WHERE` predicate. Threshold: argument \u2192 `jev_threshold` \u2192 0.5 |\n\
    | `jev_prob(row, condition)` | `DOUBLE` | Probability 0..1 that the row satisfies\
    \ the condition |\n| `jev_score(row, question, levels)` | `DOUBLE` | Probability-weighted\
    \ position on ordered levels (0 .. n-1) |\n| `jev_score_norm(row, question, levels)`\
    \ | `DOUBLE` | The same, normalised to 0..1 |\n| `jev_choice(row, question, options)`\
    \ | `VARCHAR` | The most likely option, returned verbatim |\n| `jev_confidence(row,\
    \ question, kind, options)` | `DOUBLE` | Confidence of a `score` / `choice` answer\
    \ |\n| `jev_eval(row, question [, kind [, options]])` | `JSON` | The full answer:\
    \ probabilities, legend, confidence |\n| `jev_stats()` | `JSON` | Requests, tokens,\
    \ estimated cost, cache hits |\n| `jev_cache_clear()` | `BOOLEAN` | Forget the\
    \ cached judgments |\n\n`row` is the table itself, an alias, a subquery alias,\
    \ or any single expression: DuckDB hands the\nwhole row over as a struct, and\
    \ the column names are part of what the model reads.\n\n### How it works\n\nDuckDB\
    \ gives a scalar function a vector of up to 2048 rows at a time, so the batch\
    \ is already there.\nRows go out `jev_batch_size` (20) per request \u2014 one\
    \ shared state, one question per row, which\namortises the per-request overhead\
    \ \u2014 over a process-wide pool of `jev_concurrency` (16) kept-alive\nconnections.\
    \ Answers are cached by row content, so re-running a query, changing the threshold\
    \ or\nsorting by probability is free, and rows that a cheaper predicate rejects\
    \ first are never judged.\n\nThis is a port of [pg-jev](https://github.com/realZachi/pg-jev)\
    \ ([pgjev.com](https://pgjev.com)),\nwhich does the same for PostgreSQL, and speaks\
    \ the same API.\n\n### Settings\n\n`jev_api_key` (falls back to the `TYPESAFE_API_KEY`\
    \ environment variable), `jev_api_url`, `jev_model`,\n`jev_threshold`, `jev_batch_size`,\
    \ `jev_concurrency`, `jev_timeout`, `jev_max_retries`,\n`jev_max_rows_per_statement`,\
    \ `jev_max_chars_per_statement`, `jev_cache_max_entries`.\n\nRow contents are\
    \ sent to a third-party API, so do not point it at data you may not share.\n"
