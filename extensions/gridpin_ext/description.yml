extension:
  name: gridpin_ext
  description: "Offline geocoding from a single country file \u2014 forward and reverse,\
    \ no server, no network"
  version: 0.1.0
  language: Rust
  build: cargo
  license: Apache-2.0
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_rtools;linux_amd64_musl
  requires_toolchains: rust;python3
  maintainers:
  - gridpin-reserve
repo:
  github: gridpin/duckdb-gridpin
  ref: cf94e5d3994e48fbf12b67a2b808cdde9bda428d
docs:
  hello_world: "-- Country data files are free downloads: https://gridpin.dev\n--\
    \ (France, Italy, the Netherlands and Serbia today; one file per country.)\nLOAD\
    \ gridpin_ext;\n\n-- Point the extension at a downloaded sheet. One sheet is loaded\
    \ at a time.\nSELECT gridpin_load('./france.bin');\n\n-- Forward geocoding: an\
    \ address string in, a JSON object out.\nSELECT gridpin_geocode('10 rue de rivoli\
    \ paris');\n\n-- Reverse geocoding: coordinates in, the nearest address out.\n\
    SELECT gridpin_reverse(48.8686, 2.3305);\n\n-- It is an ordinary scalar function,\
    \ so a whole table geocodes in one query.\nSELECT id,\n       json_extract(gridpin_geocode(address),\
    \ '$.lat') AS lat,\n       json_extract(gridpin_geocode(address), '$.lon') AS\
    \ lon\nFROM customers;\n"
  extended_description: "GridPin resolves addresses to coordinates and back **entirely\
    \ offline**: one\nmemory-mapped file per country, millisecond lookups on a single\
    \ core, and typo\ntolerance built into the index. There is no server to run, no\
    \ database to import,\nno API key and no per-request fee \u2014 the addresses\
    \ you geocode never leave the machine.\n\n### Functions\n\n| Function | Purpose\
    \ |\n|---|---|\n| `gridpin_load(path)` | memory-map a country sheet; the last\
    \ path wins |\n| `gridpin_geocode(address)` | address string \u2192 JSON object\
    \ with `lat`, `lon`, `street`, `city` |\n| `gridpin_reverse(lat, lon)` | coordinates\
    \ \u2192 JSON object for the nearest address |\n| `gridpin_load_poi(path)` | optional\
    \ points-of-interest layer, consulted after addresses |\n| `gridpin_reset()` |\
    \ drop the loaded sheet so another country can be loaded |\n\nA query issued before\
    \ `gridpin_load` is a clear error rather than a crash, and an\naddress with no\
    \ match returns `{}` \u2014 an empty result is a documented contract, not a\n\
    guess.\n\n### Data files\n\nCountry sheets are published as free downloads at\n\
    [gridpin.dev](https://gridpin.dev) and in the [releases of the main\nrepository](https://github.com/gridpin/gridpin/releases).\
    \ Each sheet carries its own\nsource licence (France comes from the national BAN\
    \ registry under Licence Ouverte;\nItaly, the Netherlands and Serbia are built\
    \ from Overture). The engine itself is\nApache-2.0 and lives at [gridpin/gridpin](https://github.com/gridpin/gridpin);\
    \ this\nrepository holds the extension crate only.\n"
