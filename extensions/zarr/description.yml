extension:
  name: zarr
  description: "Query Zarr array stores (v2 and v3) with SQL \u2014 read xarray-convention\
    \ datasets as tables"
  version: 0.1.3
  language: Rust
  build: cargo
  requires_toolchains: rust;python3
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;linux_amd64_musl
  license: MIT
  maintainers:
  - alxmrs
  - d33bs
repo:
  github: xqlsystems/duckdb-zarr
  ref: v0.1.3
docs:
  hello_world: 'INSTALL zarr FROM community;

    LOAD zarr;


    -- Read a local Zarr store as a table

    SELECT time, lat, lon, temperature

    FROM read_zarr(''path/to/store.zarr'')

    LIMIT 10;


    -- Inspect and query a multiscale OME-Zarr bioimage

    SELECT name, dims, shape

    FROM read_zarr_metadata(''image.ome.zarr'');


    SELECT c, AVG("0") AS mean_intensity

    FROM read_zarr(''image.ome.zarr'', array_path = ''0'')

    GROUP BY c;

    '
  extended_description: "The duckdb-zarr extension exposes [Zarr](https://zarr.dev/)\
    \ array stores as SQL tables,\nfollowing the [xarray](https://xarray.dev/) dimension\
    \ convention used by climate science,\ngeospatial, and bioimaging datasets.\n\n\
    **Functions**\n\n- `read_zarr(path)` \u2014 scan all rows from a single-group\
    \ Zarr store.\n- `read_zarr(path, dims=['time','lat','lon'])` \u2014 select one\
    \ dim group from a multi-group store\n  (`dims` is a list of dimension names).\n\
    - `read_zarr_metadata(path)` \u2014 inspect array names, dtypes, shapes, and roles.\n\
    - `read_zarr_groups(path)` \u2014 enumerate distinct dimension groups in a store.\n\
    \n**Automatic path interception**\n\nAny path ending in `.zarr` is automatically\
    \ routed to `read_zarr`:\n\n```sql\nSELECT * FROM 'era5.zarr' LIMIT 5;\nSELECT\
    \ * FROM 'https://example.org/data.zarr' LIMIT 5;\n```\n\n**Supported formats**\n\
    \n- Zarr v2 and v3\n- Codecs: gzip, zstd, blosc, crc32c, sharding, transpose,\
    \ bytes (big/little endian)\n- CF conventions: `scale_factor`/`add_offset` packed\
    \ integers, `_FillValue`/`missing_value` null masking\n- Local filesystem, HTTP/HTTPS,\
    \ S3, GCS, and Azure Blob Storage. Remote stores must carry\n  consolidated metadata\
    \ \u2014 a Zarr v2 `.zmetadata` object or a Zarr v3 `consolidated_metadata`\n\
    \  block \u2014 because object stores cannot list directories. S3/GCS/Azure credentials\
    \ are read\n  from DuckDB's secrets manager \u2014 `CREATE SECRET ... TYPE S3`\
    \ etc.\n\n**Bioimage and OME-Zarr**\n\nOME-Zarr images commonly contain multiple\
    \ resolution levels and nested label\narrays. Use `read_zarr_metadata` to discover\
    \ store-relative array paths, then\npass `array_path` to select a level or label\
    \ image:\n\n```sql\nSELECT name, dims, shape, dtype\nFROM read_zarr_metadata('image.ome.zarr');\n\
    \nSELECT c, AVG(\"0\") AS mean_intensity\nFROM read_zarr('image.ome.zarr', array_path\
    \ = '0')\nWHERE y BETWEEN 100 AND 199\n  AND x BETWEEN 200 AND 299\nGROUP BY c;\n\
    \nSELECT \"labels/nuclei/0\" AS label, COUNT(*) AS pixels\nFROM read_zarr('image.ome.zarr',\
    \ array_path = 'labels/nuclei/0')\nWHERE \"labels/nuclei/0\" > 0\nGROUP BY label;\n\
    ```\n"
