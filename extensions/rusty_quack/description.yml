extension:
  name: rusty_quack
  description: Provides a hello world example demo from the Rust-based extension template
  version: 0.0.1
  language: Rust
  build: cargo
  license: MIT
  excluded_platforms: linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
  requires_toolchains: rust;python3
  maintainers:
  - samansmink
  - mlafeldt
repo:
  github: duckdb/extension-template-rs
  ref: abb7b2f3f954a47f90fc37a99cda3ce0618e6094
docs:
  hello_world: 'FROM rusty_quack(''world'');

    '
  extended_description: 'The quack extension is based on DuckDB''s [Rust Extension
    Template](https://github.com/duckdb/extension-template-rs/), and it''s a great
    starting point to get started building DuckDB extensions in Rust.

    '
