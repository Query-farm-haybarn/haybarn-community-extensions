extension:
  name: mentat
  description: Datomic-compatible Datalog query engine as a DuckDB extension
  version: 1.18.0
  language: Rust
  build: cargo
  license: Apache-2.0
  maintainers:
  - gburd
  requires_toolchains: rust;python3
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;linux_amd64_musl
repo:
  github: gburd/mentat
  ref: edd11b46c648141ba4e997a0497e434e6a87408c
  variegata: edd11b46c648141ba4e997a0497e434e6a87408c
docs:
  hello_world: "LOAD mentat;\n-- Transact a schema and data into the mentat store\
    \ 'default'. Its datoms are\n-- DuckDB tables (schema `mentat`) in the database\
    \ you have open.\nSELECT edn_t('default',\n  '[{:db/ident :person/name :db/valueType\
    \ :db.type/string :db/cardinality :db.cardinality/one}]');\nSELECT edn_t('default',\
    \ '[{:person/name \"Alice\"} {:person/name \"Bob\"}]');\n-- Datalog: a table function,\
    \ so the rows join against your own tables.\nSELECT * FROM edn_q('default',\n\
    \  '[:find ?e ?name :where [?e :person/name ?name]]', '{}');\nSELECT * FROM edn_q('default',\n\
    \  '[:find ?e . :in ?name :where [?e :person/name ?name]]', '{\"inputs\": [\"\
    Alice\"]}');\n-- The datoms are plain DuckDB rows.\nSELECT count(*) FROM mentat.datoms;\n"
  extended_description: 'mentat is a Datomic-compatible database: an EDN/Datalog front-end
    over an

    entity-attribute-value store with history. This extension stores mentat''s

    datoms in DuckDB: each mentat store is a schema of ordinary tables in the

    database the extension is loaded into, so the data persists with that

    database and plain SQL can read it. It exposes `edn_t` (transact), `edn_q`

    (Datalog query table function, with :in inputs and asOf/since), `edn_pull`

    (pull pattern -> JSON) and `edn_eval` (sandboxed mino script), so Datalog

    query results can be joined against native DuckDB tables. The same engine is also

    available as an embedded Rust library and CLI (on SQLite) and a PostgreSQL

    extension (`pg_mentat`). Source: https://codeberg.org/gregburd/mentat

    '
