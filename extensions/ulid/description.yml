extension:
  # Haybarn: disabled because the extension does not yet build
  # against DuckDB 1.5.2 — upstream community-extensions also has
  # no v1.5.2 binary. Re-enable when upstream lands a v1.5.2-
  # compatible release (sync_from_upstream will pick up the bump).
  # Tracker: https://github.com/Maxxen/duckdb_ulid/issues/2
  excluded_platforms: linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
  name: ulid
  description: ULID data type for DuckDB
  version: 1.0.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - Maxxen
repo:
  github: Maxxen/duckdb_ulid
  ref: b8368f646d57aa1bc73a8fee37621fcb87e4ccd2
docs:
  hello_world: 'SELECT ulid() AS result;

    '
  extended_description: "This extension adds a new `ULID` data type to DuckDB. \n\
    A [ULID](https://github.com/ulid/spec) is similar to a UUID except that it also\
    \ contains a timestamp component, which makes it more suitable for use cases where\
    \ the order of creation is important. \nAdditionally, the string representation\
    \ is lexicographically sortable while preserving the sort order of the timestamps.\n"
