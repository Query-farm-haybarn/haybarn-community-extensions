extension:
  name: oracle
  description: Connect DuckDB directly to Oracle databases for reading and writing
    tables, with catalog integration, pushdown, spatial geometry, and vector support
  version: 0.3.1
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64
  maintainers:
  - cofin
repo:
  github: cofin/duckdb-oracle
  ref: fa61951bdd3edf18bb6bf8e7169255d5ca6de635
docs:
  hello_world: "INSTALL oracle FROM community;\nLOAD oracle;\n\n-- Connect with standard\
    \ credentials\nCREATE SECRET my_oracle (\n    TYPE oracle,\n    HOST 'localhost',\n\
    \    PORT 1521,\n    SERVICE 'FREEPDB1',\n    USER 'scott',\n    PASSWORD 'tiger'\n\
    );\nATTACH '' AS ora (TYPE oracle, SECRET my_oracle);\n\n-- Or connect with an\
    \ Oracle Wallet (Autonomous Database or TLS)\nCREATE SECRET wallet_oracle (\n\
    \    TYPE oracle,\n    SERVICE 'myadb_high',\n    USER 'admin',\n    PASSWORD\
    \ 'secret',\n    WALLET_PATH '/path/to/wallet'\n);\nATTACH '' AS ora_cloud (TYPE\
    \ oracle, SECRET wallet_oracle);\n\n-- Query attached tables with filter and projection\
    \ pushdown\nSELECT empno, ename, sal\nFROM ora.scott.emp\nWHERE deptno = 10;\n\
    \n-- Or run direct Oracle SQL\nSELECT * FROM oracle_query('ora', 'SELECT empno,\
    \ ename FROM scott.emp WHERE sal > 2000');\n"
  extended_description: 'The `oracle` extension connects DuckDB directly to Oracle
    databases for reading and writing tables, views, materialized views, and synonyms.


    Installing and loading the extension requires no Oracle libraries on the host.
    When opening a connection, the extension loads Oracle Instant Client (19c, 21c,
    or 23ai) on demand from `OCI_LIB_DIR`, `ORACLE_HOME`, or the system library path.
    It works with local, on-premises, cloud, and Oracle Autonomous Database instances,
    including connections authenticated with Oracle Wallets.


    Key features:

    - **Catalog attachment & direct SQL**: Attach an Oracle database via `ATTACH ...
    (TYPE oracle)` to query tables directly, or run raw SQL with `oracle_query` and
    `oracle_execute`.

    - **Optimizer pushdown**: Pushes `WHERE` filters, column projections, table row-count
    estimates, and flashback queries (`AS OF SCN` and `AS OF TIMESTAMP`) down to Oracle.

    - **Rich type mapping**: Maps Oracle numeric, temporal, `CLOB`/`BLOB`, `RAW`,
    `JSON`, 23ai `VECTOR` embeddings (`LIST(FLOAT)`), and `SDO_GEOMETRY` spatial geometries
    (`GEOMETRY`).

    - **Batched reads & writes**: Uses array fetching for scans and array binding
    for `INSERT INTO` writes.

    '
