extension:
  name: odata
  description: Expose DuckDB tables and views as an authenticated OData v4 HTTP API
    with query options, generated EDMX metadata, and opt-in writes. Inspired by quack
    and the OData protocol. Support duckdb v1.5 and v2.0.
  version: 0.1.2
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - cn00
repo:
  github: cn00/duckdb-odata
  ref: a364f28886ba4e0a32025363a757ed501bc536f8
docs:
  hello_world: 'INSTALL odata;

    LOAD odata;


    CREATE TABLE customers (id BIGINT, name VARCHAR, active BOOLEAN);

    CALL odata_expose(''customers'');

    CALL odata_entity(''customers'', key := ''id'');

    CALL odata_serve();

    '
  extended_description: "Expose selected DuckDB tables or views as OData v4 entity\
    \ sets. The extension\ngenerates an EDMX `$metadata` document from the DuckDB\
    \ catalog and supports\nquery options such as `$select`, `$filter`, `$orderby`,\
    \ `$top`, `$skip`, and\n`$count`. The server is read-only by default and enables\
    \ bearer-token\nauthentication automatically. Setting `read_only := false` enables\n\
    validated, transactional `POST`, `PATCH`, `PUT`, and `DELETE` operations\nfor\
    \ exposed entities.\n\n### Publish views over local files\n\nUse a dedicated schema\
    \ for views over local CSV and Excel data, then expose\nthe entire schema:\n\n\
    ```sql\nINSTALL excel;\nLOAD excel;\n\nCREATE SCHEMA odata_sources;\nCREATE VIEW\
    \ odata_sources.orders AS\n    SELECT * FROM read_csv_auto('/data/orders.csv');\n\
    CREATE VIEW odata_sources.customers AS\n    SELECT * FROM read_xlsx('/data/customers.xlsx');\n\
    \nCALL odata_expose_schema('odata_sources');\nCALL odata_serve();\n```\n\n###\
    \ Publish attached PostgreSQL or SQL Server schemas\n\nTables and views from other\
    \ DuckDB connectors can be exposed without\ncopying their data. Install and load\
    \ the connector, attach the source, then\nexpose its schema:\n\n```sql\nINSTALL\
    \ postgres;\nLOAD postgres;\nATTACH 'host=db.example.com port=5432 dbname=app\
    \ user=odata_reader password=<password>'\n    AS pg (TYPE postgres, READ_ONLY);\n\
    CALL odata_expose_schema('pg.public');\nCALL odata_serve();\n```\n\n```sql\nINSTALL\
    \ mssql FROM community;\nLOAD mssql;\nATTACH 'Server=db.example.com,1433;Database=app;User\
    \ Id=odata_reader;Password=<password>;TrustServerCertificate=yes'\n    AS mssql_db\
    \ (TYPE mssql);\nCALL odata_expose_schema('mssql_db.dbo');\nCALL odata_serve();\n\
    ```\n\n### Call the OData API with curl\n\n`odata_serve()` returns `listen_url`\
    \ and `auth_token`. Substitute those\nvalues into a second terminal and use the\
    \ token as a bearer credential:\n\n```bash\nexport ODATA_URL='http://localhost:54321'\
    \ # Replace with listen_url.\nexport ODATA_TOKEN='replace-with-auth_token'\n\n\
    curl -H \"Authorization: Bearer $ODATA_TOKEN\" \"$ODATA_URL/odata/\"\ncurl -H\
    \ \"Authorization: Bearer $ODATA_TOKEN\" \"$ODATA_URL/odata/\\$metadata\"\ncurl\
    \ -H \"Authorization: Bearer $ODATA_TOKEN\" \\\n  \"$ODATA_URL/odata/customers?\\\
    $filter=active%20eq%20true&\\$top=10\"\n```\n\nKeep credentials out of SQL files\
    \ and use a database account with only the\nread permissions required by the exposed\
    \ data. Each OData request queries\nthe underlying view or attached table, so\
    \ results remain current.\n\nSee the [project README](https://github.com/cn00/duckdb-odata#readme)\
    \ for\nsetup instructions, examples, and details.\n"
