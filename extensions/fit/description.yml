extension:
  name: fit
  description: Read Garmin .fit files using DuckDB - GPS tracks, heart rate, power
    metrics, and fitness device data
  version: 1.0.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
  - antoriche
repo:
  github: antoriche/duckdb-fit-extension
  ref: 157a5762bba68e84e9affa4af17af45ef15f4be3
docs:
  hello_world: '-- Read GPS records from a FIT file

    SELECT * FROM fit_records(''activity.fit'') LIMIT 5;


    -- Get activity metadata

    SELECT * FROM fit_activities(''activity.fit'');

    '
  extended_description: "This extension allows you to read Garmin .fit files directly\
    \ in DuckDB. \n\n**Available table functions:**\n- `fit_records(filename)` - Main\
    \ records with GPS tracks and sensor data\n- `fit_activities(filename)` - Activity\
    \ metadata and summaries\n- `fit_sessions(filename)` - Training session information\n\
    - `fit_laps(filename)` - Individual lap data and splits\n- `fit_devices(filename)`\
    \ - Device information and sensor details\n- `fit_events(filename)` - Activity\
    \ events and markers\n- `fit_users(filename)` - User profile information\n"
