extension:
  name: sharepoint
  version: 2026.10.18
  description: Query files in SharePoint / OneDrive directly with a sharepoint://
    filesystem
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
  maintainers:
  - jrosskopf
repo:
  github: DataZooDE/duckdb-sharepoint
  ref: 88ce9519e20838b37df80dc1e09d6150cc61fe85
  variegata: 88ce9519e20838b37df80dc1e09d6150cc61fe85
docs:
  hello_world: "-- App-only auth: an Entra ID app registration with the Sites.ReadWrite.All\n\
    -- APPLICATION permission and admin consent. Bind it to a document library\n--\
    \ by DRIVE_ID (a Graph drive id) or SITE_ID.\nCREATE SECRET sp (\n    TYPE sharepoint,\n\
    \    PROVIDER client_credentials,\n    TENANT_ID '00000000-0000-0000-0000-000000000000',\n\
    \    CLIENT_ID '11111111-1111-1111-1111-111111111111',\n    CLIENT_SECRET '...',\n\
    \    DRIVE_ID 'b!AbCdEf...'\n);\n\n-- Read a file by path -- one Graph call, no\
    \ per-segment walk.\nSELECT count(*) FROM 'sharepoint://Finance/2026/actuals.parquet';\n\
    \n-- Address by driveItem id instead -- stable across a rename.\nSELECT * FROM\
    \ read_csv('sharepoint://id:01ABCDEF23456789');\n\n-- Glob a folder.\nSELECT *\
    \ FROM read_parquet('sharepoint://exports/parts/*.parquet');\n\n-- Write a file.\
    \ Sequential only; streamed in bounded memory.\nCOPY (SELECT * FROM t) TO 'sharepoint://reports/out.parquet'\
    \ (FORMAT parquet);\n"
  extended_description: "Registers a `sharepoint://` filesystem backed by Microsoft\
    \ Graph, so any\nDuckDB path expression can address a file in a SharePoint document\
    \ library\nor OneDrive with no download step. Because DuckDB dispatches file access\n\
    through its virtual filesystem, `read_parquet`, `read_csv`, `COPY`, `glob`\nand\
    \ DuckLake all inherit the scheme.\n\nUnlike Google Drive, Graph addresses items\
    \ by path, so there is no\npath-resolution cache and no duplicate-name ambiguity.\
    \ Reads are ranged\nand served from a block cache. Writes stream through a Graph\
    \ upload session\nin bounded memory and the file appears when it is closed (Graph\
    \ cannot\nwrite at a byte offset, so positional writes raise rather than corrupt).\n\
    Besides app-only client credentials, a user can sign in with\n`device_code` or\
    \ `authorization_code`. Also registers the\nscheme-generic `write_blob`, `remove_file`,\
    \ `move_file` and `file_size` SQL\nfunctions, which work for any filesystem DuckDB\
    \ can reach.\n\nThis is **SharePoint / OneDrive via Microsoft Graph**, not Azure\
    \ Blob\nStorage \u2014 a different product with a different API. For `az://`/`abfss://`\n\
    containers use the `azure` extension.\n"
