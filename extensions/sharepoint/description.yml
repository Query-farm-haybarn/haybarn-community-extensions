extension:
  name: sharepoint
  version: 2026.11.13
  description: SharePoint and OneDrive in SQL -- files (sharepoint://), Excel workbooks,
    SharePoint lists, search and change feeds
  language: C++
  build: cmake
  license: MIT
  excluded_platforms: osx_amd64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads
  maintainers:
  - jrosskopf
  - sipemu
repo:
  github: DataZooDE/duckdb-sharepoint
  ref: a4426c0f600408465e2f13b30a1bee72e00d78e0
  variegata: a4426c0f600408465e2f13b30a1bee72e00d78e0
docs:
  hello_world: "-- App-only auth: an Entra ID app registration with the Sites.ReadWrite.All\n\
    -- APPLICATION permission and admin consent. Bind it to a document library\n--\
    \ by DRIVE_ID (a Graph drive id) or SITE_ID.\nCREATE SECRET sp (\n    TYPE sharepoint,\n\
    \    PROVIDER client_credentials,\n    TENANT_ID '00000000-0000-0000-0000-000000000000',\n\
    \    CLIENT_ID '11111111-1111-1111-1111-111111111111',\n    CLIENT_SECRET '...',\n\
    \    DRIVE_ID 'b!AbCdEf...'\n);\n\n-- Read a file by path -- one Graph call, no\
    \ per-segment walk.\nSELECT count(*) FROM 'sharepoint://Finance/2026/actuals.parquet';\n\
    \n-- Address by driveItem id instead -- stable across a rename.\nSELECT * FROM\
    \ read_csv('sharepoint://id:01ABCDEF23456789');\n\n-- Glob a folder.\nSELECT *\
    \ FROM read_parquet('sharepoint://exports/parts/*.parquet');\n\n-- Write a file.\
    \ Sequential only; streamed in bounded memory.\nCOPY (SELECT * FROM t) TO 'sharepoint://reports/out.parquet'\
    \ (FORMAT parquet);\n"
  extended_description: "Registers a `sharepoint://` filesystem backed by Microsoft\
    \ Graph, so any\nDuckDB path expression can address a file in a SharePoint document\
    \ library\nor OneDrive with no download step. Because DuckDB dispatches file access\n\
    through its virtual filesystem, `read_parquet`, `read_csv`, `COPY`, `glob`\nand\
    \ DuckLake all inherit the scheme.\n\nUnlike Google Drive, Graph addresses items\
    \ by path, so there is no\npath-resolution cache and no duplicate-name ambiguity.\
    \ Reads are ranged\nand served from a block cache. Writes stream through a Graph\
    \ upload session\nin bounded memory and the file appears when it is closed (Graph\
    \ cannot\nwrite at a byte offset, so positional writes raise rather than corrupt).\n\
    Beyond files: `read_excel_table` / `read_excel_range` read live Excel\nworkbooks\
    \ and `COPY ... (FORMAT excel_table | excel_range)` writes them\nback; `read_sharepoint_list`\
    \ reads SharePoint lists as typed tables (WHERE\npushed down to Graph on indexed\
    \ columns) and `COPY ... (FORMAT\nsharepoint_list)` creates or updates items;\
    \ `read_sharepoint_files` lists a\nlibrary with its metadata; `search_sharepoint`\
    \ runs Microsoft Search;\n`sharepoint_changes` / `sharepoint_list_changes` return\
    \ what changed\nsince a token; `?version=` reads an earlier version of a file.\n\
    `ATTACH` a site to see its lists (and, with `WORKBOOKS`, Excel tables) in\nthe\
    \ catalog; the `excel` extension's `read_xlsx` / `FORMAT xlsx` work on\n`sharepoint://`\
    \ paths;\n`read_docx` reads Word documents and `COPY ... (FORMAT docx, TEMPLATE\
    \ ...)`\nfills templates; `read_onenote_pages`, `read_outlook_messages`,\n`read_planner_tasks`\
    \ / `read_todo_tasks` and `sharepoint_permissions`\nreach OneNote, Outlook mail,\
    \ tasks and sharing.\nBesides app-only client credentials or a certificate, a\
    \ user can sign in\nwith `device_code` or `authorization_code`. Also registers\
    \ the\nscheme-generic `write_blob`, `remove_file`, `move_file` and `file_size`\
    \ SQL\nfunctions, which work for any filesystem DuckDB can reach.\n\nThis is **SharePoint\
    \ / OneDrive via Microsoft Graph**, not Azure Blob\nStorage \u2014 a different\
    \ product with a different API. For `az://`/`abfss://`\ncontainers use the `azure`\
    \ extension.\n"
