extension:
  name: grainlift
  description: Query any database exposed by a Grainlift gateway from Haybarn DuckDB-WASM, over HTTP(S) or Iroh, through a statically linked ADBC driver.
  version: 0.4.0
  language: C++
  build: cmake
  license: MIT
  maintainers:
    - rustyconover
  # WASM only: on Linux, macOS and Windows use adbc_scanner with the
  # adbc-driver-grainlift driver instead. iroh:// needs wasm_threads (COI).
  excluded_platforms: linux_amd64;linux_amd64_musl;linux_arm64;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_amd64_mingw;windows_arm64;wasm_mvp
  # The statically linked Rust driver needs the pinned nightly + rust-src
  # (-Z build-std) for wasm_threads.
  requires_toolchains: rust_nightly

repo:
  github: query-farm/duckdb-grainlift
  ref: 8b76faee8a8b9e2d911bcd16da1db8e3345f0f74

docs:
  hello_world: |
    INSTALL grainlift FROM community;
    LOAD grainlift;
    -- Attach a database behind a Grainlift gateway (or grainlift+iroh://<endpoint-id>)
    ATTACH 'grainlift+https://gateway.example.com' AS remote
        (TYPE grainlift, target 'postgres', bearer_token 'your-token');
    SHOW ALL TABLES;
    -- Run SQL in the remote database's own dialect
    SELECT * FROM grainlift_scan('remote', 'SELECT 42 AS answer');
  extended_description: |
    `grainlift` lets DuckDB-WASM in the browser query databases served by a
    [Grainlift](https://github.com/Query-farm/grainlift) gateway
    (`pip install grainlift-adbc-gateway`): SQLite, PostgreSQL, DuckDB and any
    other ADBC driver the gateway hosts. The Grainlift ADBC driver is linked
    statically and its HTTP traffic goes through DuckDB's HTTP stack, so it
    works where native ADBC drivers cannot be loaded.

    - `ATTACH ... (TYPE grainlift)` with filter pushdown, plus
      `grainlift_scan`, `grainlift_execute` and metadata functions that name
      the attached database,
      `INSERT`/`CREATE TABLE AS` (bulk ingestion) and `CREATE`/`DROP TABLE`.
    - `grainlift+http(s)://` works on `wasm_eh` and `wasm_threads`;
      `grainlift+iroh://` (reach gateways behind NAT, no open ports) needs the
      cross-origin-isolated `wasm_threads` build and the page's Iroh adapter.

    This extension is built for Haybarn WASM only. On Linux, macOS and Windows,
    use [`adbc_scanner`](https://duckdb.org/community_extensions/extensions/adbc_scanner)
    with the `adbc-driver-grainlift` driver.
