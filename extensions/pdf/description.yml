extension:
  name: pdf
  description: Read, OCR, inspect, transform, and write PDFs in SQL
  version: 0.8.0
  language: C++
  build: cmake
  license: GPL-2.0-or-later
  maintainers:
  - asubbarao
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_amd64_rtools;windows_arm64
  requires_toolchains: vcpkg
  vcpkg_url: https://github.com/microsoft/vcpkg.git
  vcpkg_commit: 84bab45d415d22042bd0b9081aea57f362da3f35
repo:
  github: asubbarao/duckdb-pdf
  ref: 6535c8107e4106058df6f2a111407c1b823fb858
docs:
  hello_world: 'LOAD pdf;


    -- One row per page (file, list, or glob; parallel across pages/files)

    SELECT filename, page, text

    FROM read_pdf(''reports/*.pdf'')

    WHERE contains(lower(text), ''revenue'');


    -- Metadata census

    SELECT file, title, author, page_count FROM pdf_info(''reports/*.pdf'');


    -- RAG chunks in one statement

    CREATE TABLE chunks AS FROM pdf_chunks(''reports/*.pdf'');


    -- Page raster + native write

    SELECT pdf_to_png(''report.pdf'', 1, 150) AS page_image;

    COPY (SELECT * FROM findings)

    TO ''findings.pdf'' (FORMAT pdf, TITLE ''Findings'', FOOTER ''page {page}'');

    '
  extended_description: "**Everything PDF, in SQL** \u2014 Poppler, Tesseract (OCR),\
    \ qpdf, and libharu,\nstatically linked. Paths or globs; no external tools at\
    \ runtime for core\nops. Full docs and recipes:\n[github.com/asubbarao/duckdb-pdf](https://github.com/asubbarao/duckdb-pdf).\n\
    \n**Read** \u2014 `read_pdf`, `read_pdf_lines`, `read_pdf_words` /\n`read_pdf_layout`\
    \ (word boxes), `read_pdf_elements`, `read_pdf_tables`,\n`pdf_chunks`. Auto-OCR\
    \ on image-only pages; English model bundled.\n\n**Inspect** \u2014 `pdf_info`,\
    \ outline, attachments, form fields, annotations,\nrevisions, signatures, embedded\
    \ images.\n\n**Convert / render** \u2014 text, markdown, HTML, XML, SVG, PNG;\
    \ low-level\n`poppler_render_page` + `tesseract_ocr` for blob pipelines.\n\n**Transform\
    \ & write** \u2014 merge, split, rotate, compress, encrypt/decrypt,\nwatermark,\
    \ Bates, sign, redact; `write_pdf` / `COPY \u2026 (FORMAT pdf)`;\n`to_pdf` for\
    \ office docs (LibreOffice at runtime).\n\n**Scope** \u2014 deterministic extraction,\
    \ not ML document AI. **License** \u2014\nGPL-2.0-or-later (Poppler).\n"
