extension:
  name: pdf
  description: Read text, metadata, words, lines, and tables from PDF files, with
    optional Tesseract OCR for scanned pages.
  version: 0.1.0
  language: C++
  build: cmake
  license: GPL-2.0-or-later
  maintainers:
  - asubbarao
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_amd64_rtools;windows_arm64
  requires_toolchains: vcpkg
  vcpkg_url: https://github.com/microsoft/vcpkg.git
  vcpkg_commit: 84bab45d415d22042bd0b9081aea57f362da3f35
repo:
  github: asubbarao/duckdb-pdf
  ref: 03380d1f5ece904b96fc0963d08cd7331ebe0c3f
docs:
  hello_world: '-- Load the extension

    LOAD pdf;


    -- One row per page (filename, page, page_count, text, width, height).

    -- Accepts a single file, a list, or a glob.

    SELECT page, text

    FROM read_pdf(''report.pdf'');


    -- Search across many PDFs at once

    SELECT filename, page

    FROM read_pdf(''reports/*.pdf'')

    WHERE text ILIKE ''%revenue%'';


    -- Document metadata, one row per file

    SELECT title, author, pages FROM read_pdf_meta(''report.pdf'');


    -- Extract tabular regions from digital PDFs

    SELECT * FROM read_pdf_tables(''financial_report.pdf'');


    -- Whole document as plain text (scalar)

    SELECT pdf_to_text(''report.pdf'') AS full_text;

    '
  extended_description: "The `pdf` extension brings native PDF reading to DuckDB using\
    \ the Poppler\nlibrary for rendering and Tesseract for OCR of scanned pages.\n\
    \nAll table functions accept a single path, a list of paths, or a glob\n(`'docs/*.pdf'`).\
    \ Shared named parameters: `first_page`, `last_page`,\n`password`, `layout` ('reading'\
    \ | 'physical' | 'raw'), and the OCR knobs\n`ocr`, `auto_ocr`, `ocr_language`,\
    \ `ocr_dpi`, `ocr_psm`, `ocr_oem`,\n`tessdata_dir`.\n\n**Table functions**\n\n\
    - `read_pdf(path, ...)` \u2014 one row per page; columns: filename, page,\n  page_count,\
    \ text, width, height (page size in PDF points).\n- `read_pdf_lines(path, ...)`\
    \ \u2014 one row per layout-preserving line of text;\n  columns: filename, page,\
    \ line, text. A PDF-aware analog to `read_lines`.\n- `read_pdf_meta(path)` \u2014\
    \ one row per file; columns: filename, title, author,\n  subject, keywords, creator,\
    \ producer, pages, pdf_version, encrypted.\n- `read_pdf_words(path, ...)` \u2014\
    \ one row per word; columns: filename, page,\n  word, x0, y0, x1, y1 (bounding\
    \ box in PDF user-space points, origin\n  bottom-left), font_name, font_size.\n\
    - `read_pdf_tables(path, ...)` \u2014 extracts tabular regions from digital PDFs;\n\
    \  columns: filename, page, table_index, row_index, cells (VARCHAR[]).\n\n**Scalar\
    \ functions**\n\n- `pdf_to_text(path[, layout])` \u2014 entire document as a plain-text\
    \ VARCHAR.\n- `pdf_to_html(path)` \u2014 document rendered to HTML.\n- `pdf_to_xml(path)`\
    \ \u2014 document rendered to XML (Poppler pdftoxml format).\n- `pdf_to_svg(path,\
    \ page)` \u2014 a single page rendered to SVG.\n\n**OCR (scanned / image-only\
    \ PDFs)**\n\nPages with no extractable text layer are OCR'd automatically (`auto_ocr`,\n\
    on by default); pass `ocr := true` to force OCR on every page. OCR requires a\n\
    Tesseract language model at runtime \u2014 package managers do not ship one \u2014\
    \ but\nonce you install one the usual way it works with **no configuration**:\
    \ the\nextension auto-detects the standard model directories used by Homebrew\n\
    (`brew install tesseract tesseract-lang`), apt\n(`apt-get install tesseract-ocr\
    \ tesseract-ocr-eng`), and the Windows\ninstaller. To use a non-standard location,\
    \ pass\n`tessdata_dir := '/path/to/tessdata'` per query, or set the `TESSDATA_PREFIX`\n\
    environment variable (resolution order: `tessdata_dir` \u2192 `TESSDATA_PREFIX`\
    \ \u2192\nauto-detected paths). Select the language with `ocr_language`\n(e.g.\
    \ `ocr_language := 'deu'`). If no model is found anywhere, OCR raises a\nclear,\
    \ actionable error rather than returning empty text.\n\n**Table extraction: scope**\n\
    \n`read_pdf_tables` uses a precision-first geometric heuristic (word\nbounding-box\
    \ column clustering with a regularity gate) on digital PDFs. It\nreliably handles\
    \ clean, aligned tables and avoids emitting spurious tables\nfrom prose, but it\
    \ does not do ML-based table-structure recognition \u2014 merged\ncells, borderless/sparse\
    \ tables, and scanned tables are out of scope. For\nstate-of-the-art document\
    \ understanding, reach for tools like docling,\nmarker, or a cloud Document AI\
    \ service; this extension targets the ~80% of\neveryday text/word/line/metadata/simple-table\
    \ extraction directly in SQL.\n\n**Platform support**\n\nLinux (x86_64, arm64),\
    \ macOS (x86_64, arm64), and Windows (x64, MSVC) are\nsupported \u2014 all dependencies\
    \ are resolved through vcpkg and statically linked.\nThe mingw/rtools Windows\
    \ variants and windows_arm64 are excluded (different\ntoolchain / untested), and\
    \ WebAssembly is excluded because Poppler and\nTesseract cannot be linked into\
    \ the wasm target.\n\n**License**\n\nGPL-2.0-or-later. Poppler is GPL-2.0; statically\
    \ linking it requires the\ncombined work to be distributed under the GPL.\n"
