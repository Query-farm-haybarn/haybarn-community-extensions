extension:
  name: pdf
  description: "Read, inspect, transform, and write PDFs in SQL \u2014 text at every\
    \ grain (page/line/word/element/chunk), OCR for scanned files, metadata, tables,\
    \ images, and document surgery (merge/split/sign/redact/watermark/encrypt/...)."
  version: 0.8.0
  language: C++
  build: cmake
  license: GPL-2.0-or-later
  maintainers:
  - asubbarao
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_amd64_rtools;windows_arm64
  requires_toolchains: vcpkg
  vcpkg_url: https://github.com/microsoft/vcpkg.git
  vcpkg_commit: 84bab45d415d22042bd0b9081aea57f362da3f35
repo:
  github: asubbarao/duckdb-pdf
  ref: 1bacb91927adbdd43046b3234bbd5f9e5afb3059
docs:
  hello_world: "LOAD pdf;\n\n-- One row per page; takes a file, a list, or a glob\
    \ (parallel across files)\nSELECT filename, page, text\nFROM read_pdf('reports/*.pdf')\n\
    WHERE contains(lower(text), 'revenue');\n\n-- One row per file: metadata, page\
    \ count, size, encryption\nSELECT file, title, author, page_count FROM pdf_info('reports/*.pdf');\n\
    \n-- Structured table extraction (digital and scanned PDFs)\nSELECT * FROM read_pdf_tables('financial_report.pdf');\n\
    \n-- Retrieval-ready, section-aware chunks for RAG \u2014 one statement\nCREATE\
    \ TABLE chunks AS FROM pdf_chunks('reports/*.pdf');\n\n-- Render a page to PNG\
    \ bytes (vision-model input, thumbnails)\nSELECT pdf_to_png('report.pdf', 1, 150)\
    \ AS page_image;\n\n-- Write page preview PNGs to disk (no pdftoppm): pages/<stem>/p1.png,\
    \ \u2026\nSELECT * FROM pdf_write_page_images('reports/*.pdf', 'pages', dpi :=\
    \ 100);\n\n-- Query result to a typeset PDF, no external tools\nCOPY (SELECT *\
    \ FROM findings)\nTO 'findings.pdf' (FORMAT pdf, TITLE 'Findings', FOOTER 'page\
    \ {page}');\n"
  extended_description: "**Everything PDF, in SQL** \u2014 built on Poppler (parsing/rendering),\n\
    Tesseract (OCR), qpdf (document surgery), and libharu (native writing),\nall statically\
    \ linked into the DuckDB process. Every function accepts a\nsingle path or a glob,\
    \ so the natural unit of work is a folder of PDFs.\n\n**Read** \u2014 `read_pdf`\
    \ (pages), `read_pdf_lines`, `read_pdf_words`\n(bounding boxes + OCR confidence),\
    \ `read_pdf_elements` (layout elements in\nreading order), `read_pdf_tables` (ruled\
    \ *and* unruled tables, digital or\nscanned), `pdf_chunks` (retrieval-ready chunks\
    \ with section headings).\nShared named parameters cover `password`, page ranges,\
    \ text layout, and\nOCR knobs; `ignore_errors := true` skips unopenable files\
    \ in a folder scan.\n\n**Inspect** \u2014 `pdf_info` (full per-file census), `pdf_outline`\n\
    (bookmarks), `pdf_attachments` (embedded files as BLOBs),\n`pdf_form_fields`,\
    \ `pdf_annotations` (incl. hyperlink extraction),\n`pdf_revisions` (incremental-update\
    \ forensics: what changed after the\ndocument was first written), `pdf_signatures`\
    \ (digital signatures,\ncryptographically verified with OpenSSL CMS over the signed\
    \ byte ranges),\n`pdf_images` (the stored raster XObjects \u2014 the JPEG a scanner\
    \ wrote \u2014 as\nBLOBs), and PDF/A identification columns on `pdf_info`.\n\n\
    **Convert** \u2014 `pdf_to_text` / `pdf_to_markdown` (layout-aware GitHub\nmarkdown)\
    \ / `pdf_to_html` / `pdf_to_xml` / `pdf_to_svg` / `pdf_to_png` /\n`pdf_write_page_images`\
    \ (write page preview PNGs to `out_dir/<stem>/p{N}.png`\nwithout pdftoppm).\n\
    The render scalars also accept PDF bytes as a BLOB, so they compose with\n`read_blob`\
    \ and httpfs.\n\n**Transform & write** \u2014 `pdf_merge`, `pdf_split`, `pdf_split_blank`\n\
    (split scanned batches at blank separator pages), `pdf_rotate`,\n`pdf_pages`,\
    \ `pdf_compress`, `pdf_encrypt` / `pdf_decrypt`;\n`pdf_watermark` / `pdf_bates`\
    \ (searchable text stamps), `pdf_sign`\n(CMS digital signatures \u2014 verifies\
    \ back through `pdf_signatures`),\n`pdf_redact` (true raster redaction: boxed\
    \ text destroyed, not covered);\n`write_pdf` and `COPY ... TO 'out.pdf' (FORMAT\
    \ pdf)` typeset text or query\nresults natively (libharu \u2014 no external tools);\
    \ `to_pdf` converts office\ndocuments (docx, odt, pptx, ...) via a LibreOffice\
    \ runtime shell-out.\n\n**OCR** \u2014 pages with no text layer are OCR'd automatically.\
    \ **English\n(eng) is bundled** (tessdata_fast, extracted on first use) so scanned\
    \ PDFs\nwork with zero host tessdata install. Other languages: install models\
    \ the\nnormal way (`brew install tesseract-lang`, `apt-get install tesseract-ocr-deu`,\n\
    \u2026) or pass `tessdata_dir` / `TESSDATA_PREFIX`. Pick languages with\n`ocr_language\
    \ := 'deu'`. Leptonica preprocess + confidence DPI retry by\ndefault. Page text\
    \ from `read_pdf` / `pdf_to_text` is **trimmed once** at\nemit (no trailing form-feeds).\n\
    \n**Scope** \u2014 deterministic extraction, not ML document understanding:\n\
    merged cells and borderless/sparse tables are out of scope (use docling /\nmarker\
    \ / a Document AI service for those). Full per-function docs,\ncolumn lists, and\
    \ recipes: https://github.com/asubbarao/duckdb-pdf\n\n**License** \u2014 GPL-2.0-or-later\
    \ (Poppler is GPL-2.0 and statically linked).\n"
