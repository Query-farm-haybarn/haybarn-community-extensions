extension:
  name: panduck
  description: Read documents natively into the duck_block vocabulary -- DOCX, ODT,
    EPUB, RTF, LaTeX, Org, RST, ipynb, MediaWiki and Textile -- and write them back
    as Pandoc JSON, without linking Pandoc
  version: 0.5.3
  language: C++
  build: cmake
  license: MIT
  requires_toolchains: vcpkg
  maintainers:
  - teaguesterling
  vcpkg_commit: 84bab45d415d22042bd0b9081aea57f362da3f35
repo:
  github: teaguesterling/duckdb_panduck
  ref: 4dc698503e5b56a4c17999eca1c5dc72a177add7
  ref_next: 4dc698503e5b56a4c17999eca1c5dc72a177add7
docs:
  hello_world: "LOAD panduck;\n\n-- Read a document straight into flattened duck_block\
    \ rows\nSELECT * FROM read_docx_blocks('report.docx');\nSELECT * FROM read_epub_blocks('book.epub');\n\
    SELECT * FROM read_latex_blocks('paper.tex');\n\n-- Or let the path pick the reader\n\
    SELECT * FROM panduck_read_blocks('notes.org');\nSELECT panduck_format_for('paper.tex');\
    \       -- 'latex'\nSELECT panduck_can_read('archive.docx');      -- true\n\n\
    -- Formats with no file: parse a string directly\nSELECT * FROM read_mediawiki_blocks_string('==\
    \ Heading ==');\n\n-- Outline any supported document\nSELECT * FROM doc_toc('report.docx');\n\
    \n-- Pull one section out, by heading or by a fragment of one\nSELECT * FROM doc_section('report.docx',\
    \ 'Methods');\nSELECT * FROM doc_section('report.docx', 'Meth', match := 'contains');\n\
    \n-- ...or find the section by what it SAYS rather than what it is called\nSELECT\
    \ * FROM doc_search_sections('report.docx', 'p < 0.05');\n\n-- Render one back\
    \ out (md, html or text)\nSELECT doc_render('report.docx', 'md');\n\n-- Write\
    \ back out as Pandoc JSON that a real pandoc accepts\nSELECT panduck_write_pandoc_ast('doc.json',\n\
    \    (SELECT list(b) FROM read_odt_blocks('doc.odt') b)\n);\n\n-- Or get the AST\
    \ as a struct without touching the filesystem\nSELECT panduck_blocks_to_pandoc_ast(\n\
    \    (SELECT list(b) FROM read_rtf_blocks('memo.rtf') b)\n);\n"
  extended_description: 'Panduck reads document formats natively into the `duck_block`
    vocabulary shared

    with `duck_block_utils`, `markdown` and `webbed` -- so a DOCX, an EPUB and a

    LaTeX paper all land in the same seven-column shape and can be queried together.


    **It does not link Pandoc.** Pandoc is a Haskell program; the only C bindings

    that ever existed went unmaintained in 2017, and a Cabal foreign-library request

    has been open upstream since 2020. Linking the GHC runtime into a dlopen''d DuckDB

    extension would be a bad neighbour even if it existed. Panduck is instead

    compatible with Pandoc''s **data model**: every reader is hand-written, and a

    checked mapping table pins the correspondence to Pandoc''s AST constructors.


    ## Readers


    | Function | Format |

    |----------|--------|

    | `read_docx_blocks(path)` | Word OOXML |

    | `read_odt_blocks(path)` | OpenDocument Text |

    | `read_epub_blocks(path)` | EPUB 2/3 |

    | `read_rtf_blocks(path)` | Rich Text Format |

    | `read_latex_blocks(path)` | LaTeX |

    | `read_org_blocks(path)` | Org mode |

    | `read_rst_blocks(path)` | reStructuredText |

    | `read_ipynb_blocks(path)` | Jupyter notebooks |

    | `read_mediawiki_blocks(path)` | MediaWiki wikitext |

    | `read_textile_blocks(path)` | Textile |

    | `read_pandoc_blocks(path)` | Pandoc JSON AST (reaches all 43 formats pandoc
    reads) |


    Every text format also has a `_string` variant that parses content directly.

    DOCX, ODT, EPUB and RTF read lists, blockquotes, tables, images and footnotes;

    document metadata is extracted for every format that has any.


    ## Dispatch


    | Function | Description |

    |----------|-------------|

    | `panduck_read_blocks(path)` | Read any supported path, reader chosen by extension
    |

    | `panduck_format_for(path)` | Which format a path resolves to |

    | `panduck_can_read(path)` | Whether a path is supported |

    | `panduck_supported_extensions()` | The registry, as a table |

    | `panduck_register_doc_reader(...)` | Register a reader at runtime |


    ## Document helpers


    | Function | Description |

    |----------|-------------|

    | `doc_toc(path)` | Table of contents for any supported document |

    | `doc_section(path, heading)` | The blocks under one heading (`match := ''contains''`
    for a fragment) |

    | `doc_search_sections(path, pattern)` | The section whose CONTENT matches, not
    its heading |

    | `doc_container(path, id)` | The blocks inside one container |

    | `doc_render(path, fmt)` | Render a document to `md`, `html` or text |


    Each of these accepts `expand_embedded := true`, which parses a format embedded
    in a

    document -- a markdown cell inside a `.ipynb` -- so a notebook is navigable rather

    than a wall of `raw` blocks. Opt-in: it needs the `markdown` extension, and an

    unchanged call reads identically without it.


    ## Writing Pandoc JSON


    | Function | Description |

    |----------|-------------|

    | `panduck_blocks_to_pandoc_ast(blocks)` | duck_block list to a Pandoc AST document
    |

    | `panduck_blocks_to_pandoc_blocks(blocks)` | duck_block list to a Pandoc block
    array |

    | `panduck_blocks_to_pandoc_json(blocks)` | duck_block list to Pandoc JSON text
    |

    | `panduck_write_pandoc_ast(path, blocks)` | Write Pandoc JSON to a file |

    | `panduck_pandoc_ast_map()` | The constructor mapping, as a queryable table |


    The governing rule is that panduck may be **more** faithful than pandoc -- richer

    attributes, better block types, metadata pandoc does not extract -- so long as
    the

    mapping back to valid Pandoc JSON stays total. Every fixture and a set of

    hand-built constructs are round-tripped through a real pandoc in CI to hold that.


    ## Scope


    This is an early release. Ten native readers are implemented and tested against

    reference implementations -- RTF, DOCX, ODT, EPUB, LaTeX, Org, RST, ipynb, MediaWiki,

    Textile -- plus a Pandoc AST reader, with 2931 test assertions, differential validation

    against a real pandoc on every fixture, and eleven jobs in CI. PDF, Markdown and
    HTML

    are read by delegating to the pdf, markdown and webbed extensions rather than
    by a

    reader here.


    The readers were audited over five rounds before this release, each round asking
    a

    question the previous one could not answer -- does a construct come back at all,
    do

    any words go missing, do all ten readers agree on one logical document. That found

    18 defects, including silent text loss in DOCX where a hyperlink''s anchor text
    was

    dropped outright. All are fixed and pinned by tests. Three findings remain open
    and

    are recorded in the documentation rather than omitted.


    Known divergences from pandoc are declared and reasoned in the repository''s

    roundtrip ledger rather than hidden -- including several where pandoc is the one

    losing information.

    '
