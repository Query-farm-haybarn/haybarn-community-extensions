extension:
  # Haybarn: skip the per-extension test suite. The build itself
  # succeeds — the test step fails on Haybarn (test/sql/integration.test:57 — extension test data)
  # while building cleanly. The .duckdb_extension binary is signed
  # and shipped to R2 + npm + PyPI as normal.
  haybarn_skip_tests: true
  name: duck_tails
  description: Smart Development Intelligence for DuckDB - Git-aware data analysis
    capabilities that allow querying git history, accessing files at any revision,
    and performing version-aware data analysis with SQL.
  version: 1.4.1
  language: C++
  build: cmake
  license: MIT
  requires_toolchains: vcpkg
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads
  maintainers:
  - teaguesterling
repo:
  github: teaguesterling/duck_tails
  ref: dca8ff3b3f5d423beb474c11349b547c88e99e70
docs:
  hello_world: "-- Load the extension\nLOAD 'duck_tails';\n\n-- Query git history\
    \ (defaults to current directory)\nSELECT commit_hash, author_name, message, author_date\n\
    FROM git_log() LIMIT 5;\n\n-- Access files from git repository at specific revisions\n\
    SELECT * FROM read_csv('git://data/sales.csv@HEAD');\n\n-- Compare data between\
    \ commits\nSELECT COUNT(*) FROM read_csv('git://data/sales.csv@HEAD') AS current_count,\n\
    \       COUNT(*) FROM read_csv('git://data/sales.csv@HEAD~1') AS previous_count;\n\
    \n-- Analyze text differences\nSELECT * FROM read_git_diff('git://README.md@HEAD',\
    \ 'git://README.md@HEAD~1');\n"
  extended_description: 'Duck Tails brings git-aware data analysis capabilities to
    DuckDB, enabling sophisticated version-controlled data workflows. The extension
    provides three core capabilities:


    **Git Filesystem Access**: Use the `git://` protocol to access any file in your
    git repository at any commit, branch, or tag. This allows you to query historical
    data states, compare versions, and perform temporal analysis directly in SQL.


    **Repository Metadata Queries**: Query git repository information directly with
    table functions like `git_log()`, `git_branches()`, and `git_tags()`. Analyze
    commit histories, track development patterns, and integrate repository metadata
    into your analytical workflows.


    **Text Diff Analysis**: Comprehensive text diffing capabilities with functions
    like `diff_text()`, `read_git_diff()`, and `text_diff_stats()`. Analyze changes
    between file versions, track configuration drift, and perform code change analysis.


    Key functions include:

    - `git_log([path])` - Query commit history

    - `git_branches([path])` - List repository branches

    - `git_tags([path])` - List repository tags

    - `diff_text(old, new)` - Compute text differences

    - `read_git_diff(file1, [file2])` - Structured diff analysis

    - `text_diff_lines(diff)` - Parse diff into line-by-line changes

    - `text_diff_stats(old, new)` - Diff statistics and metrics


    The extension supports mixed file systems, allowing you to combine git://, local
    files, S3, and other DuckDB-supported protocols in a single query. Built with
    libgit2 for robust git operations and comprehensive error handling.

    '
