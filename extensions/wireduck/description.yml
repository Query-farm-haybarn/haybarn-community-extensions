  extended_description: "### pcap dissector extention\nWireduck runs tshark behind\
    \ the scenes utilizing wireshark's glossary to be able to parse any packet from\
    \ any supported protocol to its fields. \nenabeling network data analysis and\
    \ analytics.\n\n### Features\n- read_pcap table function.\n- support any protocol\
    \ supported by wireshark.\n- allow push down filters to wireshark using cfilter\
    \ climit  parameters\n\n### Prerequities\ntshark (installed as part of wireshark)\
    \ should be installed.\nvalidate its exists via\n```\ntshark --version\n```\n\
    > For examples and instructions check out [Readme](https://github.com/hyehudai/wireduck)\n\
    \n    \n> Note: Wireduck is still experimental.\n"
