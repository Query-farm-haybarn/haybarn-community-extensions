    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2524\n\u2502          429 \u2502\
    \         259678 \u2502       11001 \u2502       53867 \u2502\n\u2502        \
    \   56 \u2502          19702 \u2502       53867 \u2502       11001 \u2502\n\u2514\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
