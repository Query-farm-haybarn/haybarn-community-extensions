  hello_world: "-- Basic PCAP reader for local files.\nD select count(*) , sum (\"\
    tcp.len\") , \"tcp.srcport\" ,\"tcp.dstport\"   from read_pcap('~/wireduck/fix.pcap',\
    \ protocols:=['ip','tcp'],climit:=100)  group by  \"tcp.srcport\" ,\"tcp.dstport\"\
    \ ;;\n\u250C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u252C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252C\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502 count_star()\
    \ \u2502 sum(\"tcp.len\") \u2502 tcp.srcport \u2502 tcp.dstport \u2502\n\u2502\
    \    int64     \u2502     int128     \u2502    int64    \u2502    int64    \u2502\
    \n\u251C\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
