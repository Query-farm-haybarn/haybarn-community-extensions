  extended_description: "A DuckDB extension for speech-to-text transcription using\
    \ [whisper.cpp](https://github.com/ggml-org/whisper.cpp), the C/C++ port of OpenAI's\
    \ Whisper model.\n\nTranscribe audio files directly from SQL queries in DuckDB,\
    \ making it easy to process and analyze audio data alongside your other data.\n\
    \n## Features\n\n- Transcribe audio files (WAV, MP3, FLAC, OGG, and more)\n- Live\
    \ recording and transcription from microphone\n- Voice-to-SQL: speak natural language\
    \ questions, get query results\n- Support for all Whisper models (tiny, base,\
    \ small, medium, large)\n- Detailed transcription segments with timestamps and\
    \ confidence scores\n- Automatic language detection or specify target language\n\
    - Works with file paths, BLOB data, or remote URLs\n\n## Quick Start\n\n### Download\
    \ a Model\n\nModels must be downloaded before use. They are stored in `~/.duckdb/whisper/models/`.\n\
    \n```bash\nmkdir -p ~/.duckdb/whisper/models\ncurl -L -o ~/.duckdb/whisper/models/ggml-tiny.en.bin\
    \ \\\n  https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin\n\
    ```\n\nCheck available models and download status:\n\n```sql\nSELECT * FROM whisper_list_models();\n\
    ```\n\n### Transcribe an Audio File\n\n```sql\n-- Simple transcription\nSELECT\
    \ whisper_transcribe('audio.wav', 'tiny.en');\n\n-- Get detailed segments with\
    \ timestamps\nSELECT * FROM whisper_transcribe_segments('audio.wav', 'tiny.en');\n\
    \n-- Translate foreign audio to English\nSELECT whisper_translate('german_speech.mp3',\
    \ 'small');\n```\n\n## Example Use Cases\n\n### Transcribe Remote Audio\n\n```sql\n\
    INSTALL httpfs;\nLOAD httpfs;\n\nSELECT whisper_transcribe(content, 'tiny.en')\n\
    FROM read_blob('https://example.com/audio.mp3');\n```\n\n### Batch Transcribe\
    \ Multiple Files\n\n```sql\nSELECT file, whisper_transcribe(file, 'tiny.en') as\
    \ transcript\nFROM glob('audio/*.wav');\n```\n\n### Search Within Transcriptions\n\
    \n```sql\nSELECT * FROM whisper_transcribe_segments('meeting.wav', 'base.en')\n\
    WHERE text ILIKE '%action item%';\n```\n\n### Generate Subtitles (SRT Format)\n\
    \n```sql\nSELECT\n    segment_id + 1 as id,\n    printf('%02d:%02d:%02d,%03d',\n\
    \        (start_time/3600)::int, ((start_time%3600)/60)::int,\n        (start_time%60)::int,\
    \ ((start_time - start_time::int) * 1000)::int\n    ) || ' --> ' ||\n    printf('%02d:%02d:%02d,%03d',\n\
    \        (end_time/3600)::int, ((end_time%3600)/60)::int,\n        (end_time%60)::int,\
    \ ((end_time - end_time::int) * 1000)::int\n    ) as timestamp,\n    trim(text)\
    \ as text\nFROM whisper_transcribe_segments('video.mp4', 'small.en');\n```\n\n\
    ## Recording (requires microphone)\n\n### Setup Audio Device\n\nBefore using microphone\
    \ recording or voice query features:\n\n```sql\n-- List all available audio input\
    \ devices\nSELECT * FROM whisper_list_devices();\n\n-- Set the device ID (use\
    \ a device_id from the list above)\nSET whisper_device_id = 0;\n\n-- Verify your\
    \ microphone is working\nSELECT whisper_mic_level(3);\n```\n\n### Record and Transcribe\n\
    \n```sql\n-- Record for 5 seconds\nSELECT whisper_record(5, 'tiny.en');\n\n--\
    \ Record until silence (max 30 seconds)\nSELECT whisper_record_auto(30);\n\n--\
    \ Record and translate to English\nSELECT whisper_record_translate(5, 'small');\n\
    ```\n\n## Voice-to-SQL (Experimental)\n\nSpeak natural language questions about\
    \ your data and receive SQL query results.\n\nRequires [text-to-sql-proxy](https://github.com/tobilg/text-to-sql-proxy)\
    \ running locally.\n\n```sql\n-- Create test data\nCREATE TABLE customers (id\
    \ INT, name VARCHAR, revenue DECIMAL);\nINSERT INTO customers VALUES (1, 'Acme',\
    \ 100000), (2, 'Beta', 50000);\n\n-- Get SQL from voice (doesn't execute)\nSELECT\
    \ whisper_voice_to_sql();\n\n-- Execute voice query directly\nFROM whisper_voice_query();\n\
    \n-- Include generated SQL in results\nFROM whisper_voice_query_with_sql();\n\
    ```\n\n## Available Models\n\n| Model | Size | Description |\n|-------|------|-------------|\n\
    | tiny/tiny.en | ~75MB | Fastest |\n| base/base.en | ~142MB | Fast |\n| small/small.en\
    \ | ~466MB | Good balance |\n| medium/medium.en | ~1.5GB | High quality |\n| large-v1/v2/v3\
    \ | ~2.9GB | Best quality |\n| large-v3-turbo | ~1.6GB | Fast + accurate |\n\n\
    Models with `.en` suffix are optimized for English.\n\n## Supported Audio Formats\n\
    \nThe extension uses FFmpeg for audio decoding: WAV, MP3, FLAC, OGG/Vorbis, AAC/M4A,\
    \ and many more. Audio is automatically converted to 16kHz mono as required by\
    \ Whisper.\n\n## Function Reference\n\n### Transcription Functions\n\n- `whisper_transcribe(audio,\
    \ [model])` - Transcribes audio and returns the full text\n- `whisper_translate(audio,\
    \ [model])` - Translates audio from any language to English\n- `whisper_transcribe_segments(audio,\
    \ [model], [language], [translate])` - Returns table of segments with timestamps\n\
    \n### Recording Functions\n\n- `whisper_list_devices()` - Lists available audio\
    \ input devices\n- `whisper_record(duration_seconds, [model], [device_id])` -\
    \ Records and transcribes\n- `whisper_record_auto(max_seconds, [silence_seconds],\
    \ [model], [threshold], [device_id])` - Records until silence\n- `whisper_record_translate(duration_seconds,\
    \ [model], [device_id])` - Records and translates to English\n- `whisper_mic_level(duration_seconds,\
    \ [device_id])` - Check microphone amplitude levels\n\n### Voice-to-SQL Functions\n\
    \n- `whisper_voice_to_sql([model], [device_id])` - Records voice and returns generated\
    \ SQL\n- `whisper_voice_query([model], [device_id])` - Records voice, generates\
    \ SQL, executes it\n- `whisper_voice_query_with_sql([model], [device_id])` - Same\
    \ as above with SQL columns\n\n### Model Management Functions\n\n- `whisper_list_models()`\
    \ - Lists all available models and download status\n- `whisper_download_model(model_name)`\
    \ - Returns download instructions\n\n### Utility Functions\n\n- `whisper_version()`\
    \ - Returns extension and whisper.cpp version info\n- `whisper_check_audio(file_path)`\
    \ - Validates that an audio file can be read\n- `whisper_audio_info(file_path)`\
    \ - Returns audio file metadata\n- `whisper_get_config()` - Returns current whisper\
    \ configuration settings\n\n## Configuration\n\nConfigure settings using standard\
    \ `SET` statements:\n\n```sql\n-- Model settings\nSET whisper_model = 'small.en';\n\
    SET whisper_model_path = '/custom/path/models';\nSET whisper_language = 'en';\n\
    SET whisper_threads = 4;\n\n-- Recording settings\nSET whisper_device_id = 0;\n\
    SET whisper_max_duration = 30;\nSET whisper_silence_duration = 2;\nSET whisper_silence_threshold\
    \ = 0.005;\n\n-- Voice query settings\nSET whisper_text_to_sql_url = 'http://localhost:8080/generate-sql';\n\
    SET whisper_text_to_sql_timeout = 60;\nSET whisper_voice_query_show_sql = true;\n\
    \n-- View all whisper settings\nSELECT * FROM duckdb_settings() WHERE name LIKE\
    \ 'whisper_%';\n```\n\nSee the [GitHub repository](https://github.com/tobilg/duckdb-whisper)\
    \ for full documentation.\n"
