# Manual fan-out: rebuild every extension in extensions/ against the current
# Haybarn engine. Used:
#   - after a `sync_from_upstream` PR merges (imports many descriptors at once)
#   - after a Haybarn engine release (force-refresh the catalog)
#   - to bulk-deploy after a vcpkg pin bump
#
# WARNING: with ~150 extensions and a 12-platform matrix, this can fan out
# to 1800 concurrent jobs and saturate the org's GitHub Actions concurrency.
# Use scripts/create_build_all_invocation.py to chunk the input list when
# the catalog grows past ~25 extensions.

name: Build all extensions

# Pull a hint of which extensions a given batch covers into the Actions UI
# title. Otherwise every batch shows up as the same default name and you
# have to click in to see scope. With a JSON-list input we just slice the
# first few entries.
#
# The engine version tag (duckdb_version) is embedded in the run-name so
# downstream consumers can tell which Haybarn engine this sweep built
# against — it's a run-level dispatch input, not a per-job matrix dimension,
# so the run title is the only place it surfaces. The haybarn-status page
# parses `haybarn-v<X.Y.Z>` out of this title to scope the community build
# matrix per engine version (a 1.5.3 rc page must not show a 1.5.2 sweep).
# The `|| 'haybarn-v1.5.5-rc1'` default MUST stay in lockstep with build.yml's
# `inputs.duckdb_version || 'haybarn-v1.5.5-rc1'` fallback (the version this
# sweep actually builds against when dispatched with no duckdb_version).
run-name: >-
  ${{ inputs.build_extensions
      && format('🐝 sweep {0} batch ({1})', inputs.duckdb_version || 'haybarn-v1.5.5-rc1', inputs.build_extensions)
      || format('🐝 sweep {0} (all extensions)', inputs.duckdb_version || 'haybarn-v1.5.5-rc1') }}

on:
  workflow_dispatch:
    inputs:
      duckdb_version:
        type: string
      duckdb_tag:
        type: string
      deploy:
        type: string
      build_extensions:
        description: "List of extensions to build, formatted as: `['ext1', 'ext2']`"
        type: string
        required: false
        default: ''
      # R2 is the source of truth for a bulk rebuild; npm/PyPI publish is a
      # decoupled second step. Default false so a sweep is R2-only.
      publish_registries:
        description: "Also publish npm/PyPI leaf packages (R2 is published regardless)."
        type: boolean
        required: false
        default: false

# A called reusable workflow's jobs are capped by the *caller's* granted
# token permissions. build.yml's `deploy` job requests
# `contents/actions: read` + `id-token: write`; without granting them here
# the org-default restrictive token (`actions: none, id-token: none`) caps
# the nested call and the run fails validation with a startup_failure.
permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  collect_extensions:
    outputs:
      COMMUNITY_EXTENSION_LIST: ${{ steps.generate_list.outputs.EXTENSION_LIST }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate extension list
        id: generate_list
        run: |
          if [[ "${{ inputs.build_extensions }}" == "" ]]; then
            ./scripts/get_extension_list.sh
            cat extension_list
            cat extension_list >> $GITHUB_OUTPUT
          else
            echo "EXTENSION_LIST=${{ inputs.build_extensions }}" >> $GITHUB_OUTPUT
          fi

  build_all:
    needs: collect_extensions
    strategy:
      fail-fast: false
      matrix:
        extension_name: ${{ fromJson(needs.collect_extensions.outputs.COMMUNITY_EXTENSION_LIST) }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      extension_name: ${{ matrix.extension_name }}
      duckdb_version: ${{ inputs.duckdb_version }}
      duckdb_tag: ${{ inputs.duckdb_tag }}
      deploy: ${{ inputs.deploy }}
      publish_registries: ${{ inputs.publish_registries }}
