# Haybarn Community Extension build pipeline — 2.0 line (branch haybarn-2.0).
#
# Builds one community extension against the Haybarn 2.0 engine with the
# Haybarn fork of extension-ci-tools, and (only when explicitly asked) signs
# and deploys it to R2 + npm.
#
# Differences from duckdb/community-extensions' build.yml:
#   1. The reusable distribution workflow is the Haybarn fork
#      (`Query-farm-haybarn/haybarn-extension-ci-tools`) at its `haybarn-2.0`
#      branch tip, pointed at the Haybarn engine via
#      `override_duckdb_repository`. The Linux build images (haybarn-ci) and
#      the wasm build image (haybarn-wasm-{base,rust}) are pinned by that
#      ci-tools branch; nothing here selects them.
#   2. `duckdb_version` carries the Haybarn engine *git tag*
#      (`haybarn-v2.0.0-rc6` = Query-farm-haybarn/haybarn 5ab8a76db1). ci-tools
#      checks that tag out, links the staged Haybarn static libs for it, and
#      stamps the extension with the plain `v2.0.0` (ci_phase sets
#      DUCKDB_VERSION). The deploy normalizes the tag to `v2.0.0` for the R2
#      path (`community/v2.0.0/<arch>/…`) and to `h2-0-0` for npm names.
#   3. scripts/build.py picks the descriptor ref the way upstream does
#      (`ref` for 2.0, `variegata` for 1.5.6), after normalizing the tag.
#   4. 2.0 platform drops: wasm_mvp, osx_amd64 and windows_arm64 are never
#      built; they are prepended to every exclude_archs.
#   5. No push / pull_request triggers, and the deploy needs an explicit
#      `deploy: 'true'` on this branch. See "Triggers" below.
name: Community Extension Build

# The run title carries the extension name and engine tag, e.g.
# "🐤 h3 (haybarn-v2.0.0-rc6)". The haybarn-status page and the Makefile parse
# `🐤 <name>` and `haybarn-v<X.Y.Z>` out of it, so 1.5 (main) and 2.0
# (haybarn-2.0) runs of the same extension stay apart. Keep the
# `|| 'haybarn-v2.0.0-rc6'` default in lockstep with HAYBARN_ENGINE_TAG below.
run-name: >-
  ${{ inputs.extension_name && format('🐤 {0} ({1})', inputs.extension_name, inputs.duckdb_version || 'haybarn-v2.0.0-rc6') ||
      format('push: {0}', github.event.head_commit.message || github.ref_name) }}

# Triggers: workflow_dispatch (make dispatch, the sync bot) and workflow_call
# (build_all.yml, republish) only. Upstream also builds on push / pull_request
# for changed descriptors; those stay off on haybarn-2.0 until the owner turns
# them on. To restore them as build-only, add upstream's `pull_request:` and
# `push:` blocks (paths-ignore '**' except scripts/build.py, this file and
# extensions/*/description.yml): the deploy job below still needs
# `inputs.deploy == 'true'`, which a push or PR event never sets.
on:
  workflow_dispatch:
    inputs:
      extension_name:
        type: string
      duckdb_version:
        description: "Haybarn engine tag (default haybarn-v2.0.0-rc6)"
        type: string
      ci_tools_version:
        type: string
      reduced_ci_mode:
        type: string
      duckdb_tag:
        type: string
      duckdb_commit:
        type: string
      deploy:
        description: "'true' signs + deploys to R2 (community/v2.0.0). Anything else is a dry build."
        type: string
        default: 'false'
      more_excluded:
        type: string
      more_opt_in:
        type: string
      skip_tests:
        required: false
        type: boolean
        default: false
      # npm leaf packages alongside the R2 deploy. Only used when deploy is
      # 'true'. R2 is the source of truth; registry publish is a decoupled step.
      publish_registries:
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      extension_name:
        type: string
      duckdb_version:
        type: string
      ci_tools_version:
        type: string
      reduced_ci_mode:
        type: string
      duckdb_tag:
        type: string
      duckdb_commit:
        type: string
      deploy:
        type: string
        default: 'false'
      more_excluded:
        type: string
      more_opt_in:
        type: string
      skip_tests:
        required: false
        type: boolean
        default: false
      require_ref_next:
        required: false
        type: boolean
        default: false
      publish_registries:
        required: false
        type: boolean
        default: false

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ inputs.extension_name || '' }}-${{ inputs.duckdb_version || '' }}
  cancel-in-progress: true

# Default Haybarn pins for this branch. GitHub doesn't allow ${{ }} in `uses:`,
# so the ci-tools branch is repeated in the two `uses:` lines (build job here,
# registry publish in _extension_deploy.yml) and in _extension_deploy.yml's
# ci-tools checkout. Keep all of them in lockstep.
env:
  HAYBARN_ENGINE_REPO: 'Query-farm-haybarn/haybarn'
  HAYBARN_ENGINE_TAG: 'haybarn-v2.0.0-rc6'   # 5ab8a76db12
  HAYBARN_CI_TOOLS_REF: 'haybarn-2.0'

jobs:
  prepare:
    outputs:
      COMMUNITY_EXTENSION_NAME: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_NAME }}
      COMMUNITY_EXTENSION_GITHUB: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_GITHUB }}
      COMMUNITY_EXTENSION_CANONICAL_NAME: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_CANONICAL_NAME }}
      COMMUNITY_EXTENSION_REF: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_REF }}
      COMMUNITY_EXTENSION_DEPLOY: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_DEPLOY }}
      COMMUNITY_EXTENSION_EXCLUDE_PLATFORMS: ${{ inputs.more_excluded }}${{ steps.parse.outputs.COMMUNITY_EXTENSION_EXCLUDE_PLATFORMS }}
      COMMUNITY_EXTENSION_OPT_IN_PLATFORMS: ${{ inputs.more_opt_in }}${{ steps.parse.outputs.COMMUNITY_EXTENSION_OPT_IN_PLATFORMS }}
      COMMUNITY_EXTENSION_REQUIRES_TOOLCHAINS: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_REQUIRES_TOOLCHAINS }}
      COMMUNITY_EXTENSION_TEST_CONFIG: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_TEST_CONFIG }}
      # SPDX license, description and source repo from the descriptor, for the
      # npm package.json / README the deploy generates.
      COMMUNITY_EXTENSION_LICENSE: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_LICENSE }}
      COMMUNITY_EXTENSION_DESCRIPTION: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_DESCRIPTION }}
      COMMUNITY_EXTENSION_SOURCE_REPO: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_SOURCE_REPO }}
      # `haybarn_skip_tests: true` in the descriptor (environment-sensitive tests).
      COMMUNITY_EXTENSION_SKIP_TESTS: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_SKIP_TESTS }}
      # `haybarn_job_timeout_minutes: <n>` in the descriptor (long cold builds).
      COMMUNITY_EXTENSION_JOB_TIMEOUT_MINUTES: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_JOB_TIMEOUT_MINUTES }}
      # `haybarn_wasm_cmake_flags` in the descriptor (extra CMake flags, wasm legs only).
      COMMUNITY_EXTENSION_WASM_CMAKE_FLAGS: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_WASM_CMAKE_FLAGS }}
      # `haybarn_test_timeout_minutes` in the descriptor (long test suites).
      COMMUNITY_EXTENSION_TEST_TIMEOUT_MINUTES: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_TEST_TIMEOUT_MINUTES }}
      COMMUNITY_EXTENSION_VCPKG_URL: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_VCPKG_URL == '' && 'https://github.com/microsoft/vcpkg.git' || steps.parse.outputs.COMMUNITY_EXTENSION_VCPKG_URL }}
      # Upstream: release 2025.12.12 (84bab45d) for v1.5.6, else 2026.06.24
      # (cd61e1e2). This branch only builds 2.0 (the ci-tools `uses:` is the
      # 2.0 line), so the 1.5.6 arm is kept only to match upstream.
      COMMUNITY_EXTENSION_VCPKG_COMMIT: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_VCPKG_COMMIT != '' && steps.parse.outputs.COMMUNITY_EXTENSION_VCPKG_COMMIT || ((inputs.duckdb_version == 'v1.5.6' || startsWith(inputs.duckdb_version, 'haybarn-v1.5.6')) && '84bab45d415d22042bd0b9081aea57f362da3f35' || 'cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3') }}
    env:
      # scripts/build.py normalizes a Haybarn tag to its semver before
      # comparing, so `ref` is used for haybarn-v2.0.0-rcN and `variegata`
      # for haybarn-v1.5.6*.
      DUCKDB_LATEST_STABLE: 'v2.0.0'
      DUCKDB_VERSION: ${{ inputs.duckdb_version || 'haybarn-v2.0.0-rc6' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get all changed description files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            extensions/*/description.yml

      - name: Parse description files
        id: parse
        env:
          ALL_CHANGED_FILES: ${{ github.event_name == 'workflow_dispatch' && format('extensions/{0}/description.yml', inputs.extension_name) || inputs.extension_name != '' && format('extensions/{0}/description.yml', inputs.extension_name) || steps.changed-files.outputs.all_changed_files }}
          PIP_BREAK_SYSTEM_PACKAGES: 1
          COMMUNITY_EXTENSION_REQUIRE_REF_NEXT: ${{ inputs.require_ref_next }}
        run: |
          pip install pyyaml
          python scripts/build.py
          cat env.sh >> $GITHUB_OUTPUT
          echo `cat $GITHUB_OUTPUT`

  build:
    needs: prepare
    # Must match HAYBARN_CI_TOOLS_REF (no ${{ }} allowed in `uses:`).
    uses: Query-farm-haybarn/haybarn-extension-ci-tools/.github/workflows/_extension_distribution.yml@haybarn-2.0
    # Not `secrets: inherit`: the callee expects `vcpkg_token` (lowercase) and
    # the org secret is HAYBARN_VCPKG_TOKEN; inherit forwards by name only.
    secrets:
      vcpkg_token: ${{ secrets.HAYBARN_VCPKG_TOKEN }}
      # Direct vcpkg cache writes to R2 (macOS/Windows; ci-tools skips them when these are empty).
      # A token scoped to the haybarn-build-cache bucket only, never the R2_* publishing keys:
      # these jobs run the extensions' own build code.
      VCPKG_CACHING_AWS_ACCESS_KEY_ID: ${{ secrets.HAYBARN_BUILD_CACHE_R2_ACCESS_KEY_ID }}
      VCPKG_CACHING_AWS_SECRET_ACCESS_KEY: ${{ secrets.HAYBARN_BUILD_CACHE_R2_SECRET_ACCESS_KEY }}
      VCPKG_CACHING_AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
    # Upstream also skips when build.py wrote no ref (require_ref_next without
    # a ref_next).
    if: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_NAME != '' && needs.prepare.outputs.COMMUNITY_EXTENSION_REF != '' }}
    with:
      duckdb_version: ${{ inputs.duckdb_version || 'haybarn-v2.0.0-rc6' }}
      duckdb_tag: ${{ inputs.duckdb_tag || '' }}
      duckdb_commit: ${{ inputs.duckdb_commit || '' }}
      ci_tools_version: ${{ inputs.ci_tools_version || 'haybarn-2.0' }}
      reduced_ci_mode: ${{ inputs.reduced_ci_mode || 'auto' }}
      # Build against the Haybarn engine, not duckdb/duckdb. The engine URL is
      # passed to `git clone`, so it is a full URL; the ci-tools repository is
      # an owner/repo slug for actions/checkout.
      override_duckdb_repository: 'https://github.com/Query-farm-haybarn/haybarn'
      override_ci_tools_repository: 'Query-farm-haybarn/haybarn-extension-ci-tools'
      # 2.0 drops: no wasm_mvp, osx_amd64 or windows_arm64 (Haybarn 2.0 ships
      # none of them). Prepended to the descriptor's own exclusions.
      exclude_archs: wasm_mvp;osx_amd64;windows_arm64;${{ needs.prepare.outputs.COMMUNITY_EXTENSION_EXCLUDE_PLATFORMS }}
      opt_in_archs: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_OPT_IN_PLATFORMS }}
      test_config: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_TEST_CONFIG }}
      extension_canonical: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_CANONICAL_NAME }}
      extra_toolchains: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_REQUIRES_TOOLCHAINS }}
      extension_name: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_NAME }}
      override_repository: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_GITHUB }}
      override_ref: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_REF }}
      vcpkg_url: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_VCPKG_URL }}
      vcpkg_commit: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_VCPKG_COMMIT }}
      # vcpkg_binary_sources is not set: the ci-tools default is the Haybarn
      # readwrite HTTP cache with the bearer token from vcpkg_token.
      skip_tests: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_SKIP_TESTS == 'true' || inputs.skip_tests || false }}
      job_timeout_minutes: ${{ fromJSON(needs.prepare.outputs.COMMUNITY_EXTENSION_JOB_TIMEOUT_MINUTES || '45') }}
      wasm_extra_cmake_flags: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_WASM_CMAKE_FLAGS }}
      test_timeout_minutes: ${{ fromJSON(needs.prepare.outputs.COMMUNITY_EXTENSION_TEST_TIMEOUT_MINUTES || '30') }}
      save_cache: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_NAME == 'quack' && github.event_name != 'pull_request' }}

  # Upstream's doc_test job (generate_docs.yml) is not carried: the docs
  # pipeline is DuckDB's site, and generate_docs.yml is removed on this branch.

  # Source archiving to R2 (archived_sources/<name>/…) is disabled, as on main.
  # To re-enable, gate it like the deploy job below.
  archive:
    needs:
      - prepare
      - build
    uses: ./.github/workflows/_extension_archive.yml
    if: ${{ false }}
    secrets: inherit
    with:
      extension_name: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_NAME }}
      repository: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_GITHUB }}
      ref: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_REF }}

  deploy:
    needs:
      - prepare
      - build
    uses: ./.github/workflows/_extension_deploy.yml
    # Deploys ONLY when all of these hold:
    #   - the caller passed deploy: 'true' explicitly (the input defaults to
    #     'false'; push/PR events carry no inputs, so they can never deploy)
    #   - the run is on haybarn-2.0 itself (scratch branches never deploy;
    #     upstream's equivalent is `github.ref_name == 'main'`)
    #   - build.py marked the descriptor deployable (not the waddle fallback)
    if: ${{ inputs.deploy == 'true' && github.ref == 'refs/heads/haybarn-2.0' && needs.prepare.outputs.COMMUNITY_EXTENSION_DEPLOY != '' }}
    # Reusable-workflow permissions are granted by the caller, and a nested
    # reusable workflow may only request a subset:
    #   contents: read   → checkout the extension source repo
    #   actions: read    → cross-run artifact download in _extension_registry_publish.yml
    #   id-token: write  → npm --provenance (only with publish_registries)
    permissions:
      contents: read
      actions: read
      id-token: write
    secrets: inherit
    with:
      deploy_latest: true
      duckdb_version: ${{ inputs.duckdb_version || 'haybarn-v2.0.0-rc6' }}
      duckdb_tag: ${{ inputs.duckdb_tag || '' }}
      ci_tools_version: ${{ inputs.ci_tools_version || 'haybarn-2.0' }}
      exclude_archs: wasm_mvp;osx_amd64;windows_arm64;${{ needs.prepare.outputs.COMMUNITY_EXTENSION_EXCLUDE_PLATFORMS }}
      opt_in_archs: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_OPT_IN_PLATFORMS }}
      extension_name: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_NAME }}
      extension_license: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_LICENSE }}
      extension_description: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_DESCRIPTION }}
      extension_source_repo: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_SOURCE_REPO }}
      publish_registries: ${{ inputs.publish_registries == true }}
      repository: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_GITHUB }}
      ref: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_REF }}
