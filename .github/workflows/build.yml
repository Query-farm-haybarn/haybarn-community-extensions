# Haybarn Community Extension build pipeline.
#
# Path-filtered to fire only when an extension descriptor (or this workflow,
# or the descriptor parser) actually changes. The default branch is `main`,
# so a push there after PR merge is what kicks off a deploy.
#
# Two upstream-shaped differences from duckdb/community-extensions:
#   1. The reusable distribution workflow is the haybarn fork
#      (`Query-farm-haybarn/haybarn-extension-ci-tools`) pinned by SHA, and
#      it's pointed at the Haybarn engine via `override_duckdb_repository`.
#      That's how the extension gets built against Haybarn (with the Haybarn
#      curated patch stack) rather than upstream DuckDB.
#   2. `duckdb_version` stays `v1.5.2` because the Haybarn engine reports
#      `DUCKDB_VERSION=v1.5.2` for storage-format / extension-loading
#      compatibility — and that's the version segment the engine uses when
#      constructing the URL it fetches an extension from. We deploy under
#      `/v1.5.2/<arch>/<name>.duckdb_extension.gz`; the engine looks there.
name: Community Extension Build

on:
  pull_request:
    paths-ignore:
      - '**'
      - '!scripts/build.py'
      - '!.github/workflows/build.yml'
      - '!extensions/*/description.yml'
  push:
    paths-ignore:
      - '**'
      - '!scripts/build.py'
      - '!.github/workflows/build.yml'
      - '!extensions/*/description.yml'
  workflow_dispatch:
    inputs:
      extension_name:
        type: string
      duckdb_version:
        type: string
      ci_tools_version:
        type: string
      duckdb_tag:
        type: string
      deploy:
        type: string
      more_excluded:
        type: string
      more_opt_in:
        type: string
      skip_tests:
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      extension_name:
        type: string
      duckdb_version:
        type: string
      ci_tools_version:
        type: string
      duckdb_tag:
        type: string
      deploy:
        type: string
      more_excluded:
        type: string
      more_opt_in:
        type: string
      skip_tests:
        required: false
        type: boolean
        default: false

# Default Haybarn pins. These are the single source of truth — every other
# workflow in this repo reads its defaults from here.
env:
  # Engine version the extension targets (== DUCKDB_VERSION reported by the
  # Haybarn binary). Drives the URL segment under which we deploy.
  HAYBARN_DUCKDB_VERSION_DEFAULT: 'v1.5.2'
  # Branch/SHA of Query-farm-haybarn/haybarn-extension-ci-tools to use.
  # Bump this and the `uses:`/`ci_tools_version:` literals below in lockstep
  # whenever rolling forward. (GHA doesn't allow ${{ }} inside `uses:`.)
  HAYBARN_CI_TOOLS_REF_DEFAULT: 'e5ff1a1b5ad5d24bd833c810befc1fcb58f429d7'
  # Branch/SHA of Query-farm-haybarn/haybarn (the engine) to build against.
  HAYBARN_ENGINE_REPO: 'Query-farm-haybarn/haybarn'
  HAYBARN_ENGINE_REF_DEFAULT: 'haybarn'

jobs:
  prepare:
    outputs:
      COMMUNITY_EXTENSION_NAME: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_NAME }}
      COMMUNITY_EXTENSION_GITHUB: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_GITHUB }}
      COMMUNITY_EXTENSION_CANONICAL_NAME: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_CANONICAL_NAME }}
      COMMUNITY_EXTENSION_REF: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_REF }}
      COMMUNITY_EXTENSION_DEPLOY: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_DEPLOY }}
      COMMUNITY_EXTENSION_EXCLUDE_PLATFORMS: ${{ inputs.more_excluded }}${{ steps.parse.outputs.COMMUNITY_EXTENSION_EXCLUDE_PLATFORMS }}
      COMMUNITY_EXTENSION_OPT_IN_PLATFORMS: ${{ inputs.more_opt_in }}${{ steps.parse.outputs.COMMUNITY_EXTENSION_OPT_IN_PLATFORMS }}
      COMMUNITY_EXTENSION_REQUIRES_TOOLCHAINS: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_REQUIRES_TOOLCHAINS }}
      COMMUNITY_EXTENSION_TEST_CONFIG: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_TEST_CONFIG }}
      # Mapped from `requires_toolchains` by scripts/build.py — one of
      # base / rust / full, selecting which pre-built GHCR image to pull.
      COMMUNITY_EXTENSION_IMAGE_VARIANT: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_IMAGE_VARIANT }}
      COMMUNITY_EXTENSION_VCPKG_URL: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_VCPKG_URL == '' && 'https://github.com/microsoft/vcpkg.git' || steps.parse.outputs.COMMUNITY_EXTENSION_VCPKG_URL }}
      # Haybarn: the upstream-versioned `case()` selecting different vcpkg pins
      # per DuckDB version is collapsed: we only target v1.5.2 today. When/if
      # we move to a later DuckDB base, revisit this.
      COMMUNITY_EXTENSION_VCPKG_COMMIT: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_VCPKG_COMMIT == '' && '84bab45d415d22042bd0b9081aea57f362da3f35' || steps.parse.outputs.COMMUNITY_EXTENSION_VCPKG_COMMIT }}
    env:
      # The script honours both these env vars: DUCKDB_VERSION drives the
      # `ref_next` / `andium` selection, DUCKDB_LATEST_STABLE is the comparison
      # baseline. For Haybarn we keep both pinned at v1.5.2 — the sync bot
      # strips `andium` (DuckDB v1.4) and `ref_next` (pre-release upstream) from
      # imported descriptors, but if a human ever wires them back in, this is
      # the gate they're compared against.
      DUCKDB_LATEST_STABLE: 'v1.5.2'
      DUCKDB_VERSION: ${{ inputs.duckdb_version || 'v1.5.2' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get all changed description files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            extensions/*/description.yml

      - name: Parse description files
        id: parse
        env:
          ALL_CHANGED_FILES: ${{ github.event_name == 'workflow_dispatch' && format('extensions/{0}/description.yml', inputs.extension_name) || steps.changed-files.outputs.all_changed_files }}
          PIP_BREAK_SYSTEM_PACKAGES: 1
        run: |
          pip install pyyaml
          python scripts/build.py
          cat env.sh >> $GITHUB_OUTPUT
          echo `cat $GITHUB_OUTPUT`

  build:
    needs: prepare
    # Pinned by SHA; bumped deliberately alongside engine-release rolls.
    # See HAYBARN_CI_TOOLS_REF_DEFAULT above for the canonical value (this
    # `uses:` line MUST stay in lockstep with that env var by convention —
    # `uses` doesn't accept ${{ }} interpolation so we duplicate it).
    #
    # 7e4a36f includes:
    #   - Phase A: GHCR image publish workflow (haybarn-<arch>-<variant>:v1.5.2)
    #   - Phase B: use_prebuilt_images / image_variant inputs
    #   - vcpkg cache default switched to the readwrite haybarn cache
    #   - retry on transient GHCR "unknown blob" during image push
    uses: Query-farm-haybarn/haybarn-extension-ci-tools/.github/workflows/_extension_distribution.yml@e5ff1a1b5ad5d24bd833c810befc1fcb58f429d7
    # Cannot use `secrets: inherit` here: the callee expects a secret named
    # `vcpkg_token` (lowercase), but our org-level secret is HAYBARN_VCPKG_TOKEN.
    # `inherit` forwards by name only — no renaming — so the callee would see
    # secrets.vcpkg_token as empty and the {0} placeholder in the vcpkg URL
    # would substitute to the empty string. Result: 401 on writes to the
    # readwrite Haybarn vcpkg cache (the exact failure mode observed in macOS
    # leg 76290732603 of run 25951627266: "curl failed to put file ... http code 401").
    secrets:
      vcpkg_token: ${{ secrets.HAYBARN_VCPKG_TOKEN }}
    if: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_NAME != '' }}
    with:
      duckdb_version: ${{ inputs.duckdb_version || 'v1.5.2' }}
      duckdb_tag: ${{ inputs.duckdb_tag || '' }}
      ci_tools_version: ${{ inputs.ci_tools_version || 'e5ff1a1b5ad5d24bd833c810befc1fcb58f429d7' }}
      # Phase C: pull the pre-built Linux build image from GHCR instead of
      # running `docker build` inline on every extension. The variant
      # (base/rust/full) is chosen by scripts/build.py from the descriptor's
      # `requires_toolchains` field — most extensions hit `base` and pull
      # ~30s instead of building manylinux from scratch (~7 min).
      # macOS / Windows / wasm jobs are unaffected; they don't use Docker.
      use_prebuilt_images: true
      image_variant: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_IMAGE_VARIANT }}
      prebuilt_image_tag: 'v1.5.2'
      # Build against Haybarn engine (NOT upstream duckdb/duckdb).
      # override_duckdb_repository is fed to `git clone` directly inside
      # haybarn-extension-ci-tools' Makefile (set_duckdb_repository target),
      # so it must be a full URL. override_repository (extension source) is
      # fed to actions/checkout, which takes a bare owner/repo slug — the
      # asymmetry is unfortunate but baked into the existing workflow.
      override_duckdb_repository: 'https://github.com/Query-farm-haybarn/haybarn'
      override_ci_tools_repository: 'Query-farm-haybarn/haybarn-extension-ci-tools'
      exclude_archs: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_EXCLUDE_PLATFORMS }}
      opt_in_archs: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_OPT_IN_PLATFORMS }}
      test_config: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_TEST_CONFIG }}
      extension_canonical: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_CANONICAL_NAME }}
      extra_toolchains: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_REQUIRES_TOOLCHAINS }}
      extension_name: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_NAME }}
      override_repository: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_GITHUB }}
      override_ref: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_REF }}
      vcpkg_url: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_VCPKG_URL }}
      vcpkg_commit: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_VCPKG_COMMIT }}
      # vcpkg_binary_sources intentionally NOT set here: as of the pinned
      # extension-ci-tools SHA, the default already points at the Haybarn
      # readwrite cache at haybarn-vcpkg-cache.rusty-bb6.workers.dev with the
      # bearer token substituted from HAYBARN_VCPKG_TOKEN. Same Worker fronts
      # vcpkg and ccache; secrets: inherit above pipes the token through.
      skip_tests: ${{ inputs.skip_tests || false }}
      # Only the quack template's cache is persisted (upstream convention) —
      # it's the canonical "warm me up" extension for vcpkg dependency cache.
      save_cache: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_NAME == 'quack' && github.event_name != 'pull_request' }}

  # NOTE: upstream has a `doc_test` job here that calls generate_docs.yml.
  # We've deferred the docs pipeline until the build pipeline is proven —
  # the workflow file would fail registration with `uses:` pointing at a
  # non-existent generate_docs.yml even when gated by `if: false`. Wire it
  # back in once we add generate_docs.yml.

  archive:
    needs:
      - prepare
      - build
    uses: ./.github/workflows/_extension_archive.yml
    if: ${{ (github.head_ref || github.ref_name) == 'main' }}
    secrets: inherit
    with:
      extension_name: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_NAME }}
      repository: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_GITHUB }}
      ref: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_REF }}

  deploy:
    needs:
      - prepare
      - build
    uses: ./.github/workflows/_extension_deploy.yml
    if: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_DEPLOY != '' && inputs.deploy != 'false' }}
    secrets: inherit
    with:
      deploy_latest: true
      duckdb_version: ${{ inputs.duckdb_version || 'v1.5.2' }}
      duckdb_tag: ${{ inputs.duckdb_tag || '' }}
      ci_tools_version: ${{ inputs.ci_tools_version || 'e5ff1a1b5ad5d24bd833c810befc1fcb58f429d7' }}
      exclude_archs: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_EXCLUDE_PLATFORMS }}
      opt_in_archs: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_OPT_IN_PLATFORMS }}
      extension_name: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_NAME }}
      repository: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_GITHUB }}
      ref: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_REF }}
