# Reusable workflow that archives an extension's source at the descriptor's
# pinned ref into the Haybarn community-extensions R2 bucket. Useful for
# reproducibility if an upstream extension's repo ever vanishes — we keep
# a zipped snapshot of the exact commit we built from.
#
# Bucket layout: s3://haybarn-community-extensions/archived_sources/<name>/repo_sources_<sha>.zip

name: Extension Archive Sources
on:
  workflow_call:
    inputs:
      extension_name:
        required: true
        type: string
      repository:
        required: false
        type: string
        default: ""
      ref:
        required: false
        type: string
        default: ""
jobs:
  fetch_repo:
    name: Fetch repo and save
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          # Don't recurse submodules — the archive is meant to be the source
          # snapshot of the extension itself, NOT its build dependencies.
          # We used to `rm -rf repo/duckdb` after a recursive clone but git's
          # tmp_pack files were racing with the zip, causing "file size changed
          # while zipping" + exit 18 (run 25964378414).
          submodules: false
          path: ./repo

      - name: Compress the repository sources
        run: |
          # Defensively remove any nested duckdb/ in case the extension's
          # repo ships it pre-populated (rare, but happens). With
          # submodules:false above, there's usually nothing to remove here.
          rm -rf repo/duckdb
          zip -9 -r compressed.zip repo

      - name: Upload to Haybarn community R2 bucket
        shell: bash
        # Reuse the same R2_* org-secret credentials used by haybarn-extensions.yml.
        # Same token, two buckets per the user's R2 grants.
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          # See _extension_deploy.yml for why this is R2_SECRET_KEY_ID
          # (not R2_SECRET_ACCESS_KEY).
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY_ID }}
          AWS_ENDPOINT_URL:      ${{ secrets.R2_ENDPOINT }}
          BUCKET_NAME:           haybarn-community-extensions
          PIP_BREAK_SYSTEM_PACKAGES: 1
        run: |
          python3 -m pip install awscli
          if [ -n "${AWS_SECRET_ACCESS_KEY}" ]; then
            aws s3 cp compressed.zip "s3://${BUCKET_NAME}/archived_sources/${{ inputs.extension_name }}/repo_sources_${{ inputs.ref }}.zip"
          else
            echo "No HAYBARN_COMMUNITY_S3_* secrets configured — skipping archive upload."
          fi
