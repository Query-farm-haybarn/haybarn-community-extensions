# Reusable + dispatchable workflow that publishes pre-built pip wheels +
# npm packages to PyPI / npm.
#
# Two usage modes:
#
#   1. workflow_call from _extension_deploy.yml after the deploy matrix
#      finishes — same run, artifacts are local. source_run_id defaults
#      to github.run_id so download-artifact reads from the same run.
#
#   2. workflow_dispatch for manual retry — e.g. when PyPI's "too many
#      new projects" rate limit (which is sticky for hours) bounced an
#      earlier publish. The dispatcher passes source_run_id pointing at
#      the build run whose artifacts to re-publish, and we download from
#      that run via actions/download-artifact's run-id input.
#
# Trigger via:
#   gh workflow run "_extension_registry_publish.yml" --ref main \
#     -f extension_name=arrow -f source_run_id=26001361449
#
# Splitting publish out from deploy lets us re-publish without paying
# for another build, which matters when PyPI's project-creation rate
# limit (~5 new projects per several hours per account) intermittently
# rejects publishes during a wide rollout.

name: Extension Registry Publish
on:
  workflow_call:
    inputs:
      extension_name:
        required: true
        type: string
      duckdb_version:
        required: false
        type: string
        default: 'v1.5.2'
      # The version string and ext_commit the publish-meta-package step
      # needs. Passed from the calling _extension_deploy.yml's `deploy`
      # job outputs. Optional so the workflow_dispatch path can omit
      # them (the artifacts already contain the right version baked
      # into each leaf's package.json; only the meta-package needs them
      # explicitly).
      version:
        required: false
        type: string
        default: ''
      ext_commit:
        required: false
        type: string
        default: ''
      extension_version_label:
        required: false
        type: string
        default: ''
      source_run_id:
        required: false
        type: string
        default: ''     # empty → same run (workflow_call); set → cross-run download
  workflow_dispatch:
    inputs:
      extension_name:
        required: true
        type: string
      source_run_id:
        description: 'GitHub Actions run ID whose pypi-wheel-* / npm-leaf-* artifacts to publish'
        required: true
        type: string
      duckdb_version:
        required: false
        type: string
        default: 'v1.5.2'
      version:
        description: 'pip/npm version field (e.g. 202605.17.122351). Required for npm meta-package construction; pypi already has it baked into wheels.'
        required: false
        type: string
      ext_commit:
        description: 'extension source commit (for npm meta metadata blob)'
        required: false
        type: string
      extension_version_label:
        required: false
        type: string

jobs:
  # ------------------------------------------------------------------
  # Aggregate PyPI publish — same logic as the previous in-line job in
  # _extension_deploy.yml. Token-based auth (account-scoped) because
  # Trusted Publishers require per-project pre-registration which
  # doesn't scale to ~250 extension package names. Attestations still
  # use OIDC (id-token: write).
  # ------------------------------------------------------------------
  publish_pypi:
    name: Publish PyPI
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions:  read      # cross-run actions/download-artifact needs this
      id-token: write     # PEP 740 attestations
    concurrency:
      # Serialize PyPI publishes across the whole org-bucket so we don't
      # burst-create projects and hit PyPI's anti-spam rate limit
      # ("429 Too many new projects created"). One publish at a time
      # across all extensions; cancel-in-progress=false so a queued
      # retry doesn't kill an in-flight publish.
      group: registry-publish-pypi
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pypi-wheel-${{ inputs.extension_name }}-*
          path: dist/
          merge-multiple: true
          # When source_run_id is empty, falls back to current run.
          # When set, downloads from that run (requires github-token).
          run-id: ${{ inputs.source_run_id != '' && inputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: List collected wheels
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.HAYBARN_PYPI_TOKEN }}
          attestations: true
          skip-existing: true
          verbose: true

  # ------------------------------------------------------------------
  # Aggregate npm publish — collect per-platform leaves, publish each,
  # then build + publish the meta-package. Same EEXIST-tolerant logic
  # as the previous in-line job.
  # ------------------------------------------------------------------
  publish_npm:
    name: Publish npm
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions:  read      # cross-run download-artifact
      id-token: write     # --provenance attestations
    concurrency:
      group: registry-publish-npm
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          path: ce

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Sanity-check npm version
        run: npm --version

      - uses: actions/download-artifact@v4
        with:
          pattern: npm-leaf-${{ inputs.extension_name }}-${{ inputs.duckdb_version }}-*
          path: leaves/
          run-id: ${{ inputs.source_run_id != '' && inputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Resolve version + ext_commit
        id: meta
        shell: bash
        env:
          IN_VERSION:    ${{ inputs.version }}
          IN_EXT_COMMIT: ${{ inputs.ext_commit }}
        run: |
          set -euo pipefail
          # Inputs override; otherwise pull from any leaf's package.json
          # (all leaves of an extension share the same version + commit).
          if [[ -n "${IN_VERSION:-}" ]]; then
            VERSION="$IN_VERSION"
          else
            VERSION=$(python3 -c "
          import glob, json
          ps = glob.glob('leaves/*/package.json')
          if not ps:
              raise SystemExit('no leaf package.json found')
          print(json.load(open(ps[0]))['version'])
          ")
          fi
          if [[ -n "${IN_EXT_COMMIT:-}" ]]; then
            EXT_COMMIT="$IN_EXT_COMMIT"
          else
            EXT_COMMIT=$(python3 -c "
          import glob, json, tarfile, io
          ps = glob.glob('leaves/*/npm-leaf.tar.gz')
          if not ps:
              raise SystemExit('no npm-leaf.tar.gz found')
          with tarfile.open(ps[0]) as t:
              for m in t:
                  if m.name.endswith('package.json'):
                      data = json.load(t.extractfile(m))
                      print(data.get('haybarn', {}).get('ext_commit', ''))
                      break
              else:
                  raise SystemExit('package.json not found in tar')
          ")
          fi
          {
            echo "version=$VERSION"
            echo "ext_commit=$EXT_COMMIT"
          } >> "$GITHUB_OUTPUT"

      - name: Publish each leaf
        id: leaves
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.HAYBARN_NPM_TOKEN }}
          VERSION:   ${{ steps.meta.outputs.version }}
          EXTENSION: ${{ inputs.extension_name }}
          DV:        ${{ inputs.duckdb_version }}
        shell: bash
        run: |
          set -euo pipefail
          HV="${DV#v}"
          HSUFFIX="h${HV//./-}"
          META_PKG="@haybarn/ext-${EXTENSION}-${HSUFFIX}"

          PRESENT_LEAVES=""
          ART_PREFIX="leaves/npm-leaf-${EXTENSION}-${DV}-"
          META_PREFIX="${META_PKG}-"
          for art in "${ART_PREFIX}"*; do
            [[ -d "$art" ]] || continue
            ARCH="${art#"$ART_PREFIX"}"
            echo "::group::leaf for $ARCH"
            STAGE=$(mktemp -d)
            tar -xzf "$art/npm-leaf.tar.gz" -C "$STAGE"
            LEAF_NAME=$(python3 -c "import json; print(json.load(open('$STAGE/package.json'))['name'])")
            echo "publishing $LEAF_NAME @ $VERSION"
            if ! (cd "$STAGE" && npm publish --provenance --access public --tag latest 2>/tmp/npm.err); then
              if grep -qiE 'previously published|EPUBLISHCONFLICT|cannot publish over' /tmp/npm.err; then
                echo "::notice::$LEAF_NAME@$VERSION already published — skipping"
              else
                cat /tmp/npm.err
                echo "::error::npm publish failed for $LEAF_NAME@$VERSION"
                exit 1
              fi
            fi
            SLUG="${LEAF_NAME#"$META_PREFIX"}"
            if [[ -n "$PRESENT_LEAVES" ]]; then
              PRESENT_LEAVES="${PRESENT_LEAVES},${SLUG}"
            else
              PRESENT_LEAVES="$SLUG"
            fi
            echo "::endgroup::"
          done

          if [[ -z "$PRESENT_LEAVES" ]]; then
            echo "::error::no npm leaves found — nothing to publish"
            exit 1
          fi
          {
            echo "present_leaves=$PRESENT_LEAVES"
            echo "meta_pkg=$META_PKG"
          } >> "$GITHUB_OUTPUT"

      - name: Build + publish meta package
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.HAYBARN_NPM_TOKEN }}
          VERSION:           ${{ steps.meta.outputs.version }}
          EXTENSION:         ${{ inputs.extension_name }}
          DV:                ${{ inputs.duckdb_version }}
          EXT_COMMIT:        ${{ steps.meta.outputs.ext_commit }}
          EXT_VERSION_LABEL: ${{ inputs.extension_version_label }}
          PRESENT_LEAVES:    ${{ steps.leaves.outputs.present_leaves }}
          META_PKG:          ${{ steps.leaves.outputs.meta_pkg }}
        shell: bash
        run: |
          set -euo pipefail
          HV="${DV#v}"
          export STAGE="stage/npm-meta"
          export PKG="$META_PKG"
          export HAYBARN_VERSION="$HV"
          export HAYBARN_METADATA="$STAGE/haybarn-metadata.json"
          export VERSION EXTENSION PRESENT_LEAVES

          mkdir -p "$STAGE"
          python3 ce/scripts/generate_haybarn_metadata.py \
            --extension "$EXTENSION" \
            --ext-commit "$EXT_COMMIT" \
            --haybarn-version "$HV" \
            --ext-version-label "$EXT_VERSION_LABEL" \
            --sha256 "see-leaf-packages-for-per-platform-sha256" \
            --built-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --out "$HAYBARN_METADATA"

          python3 ce/scripts/npm_build_meta.py

          cat "$STAGE/package.json"

          echo "::notice::publishing $META_PKG @ $VERSION"
          if ! (cd "$STAGE" && npm publish --provenance --access public --tag latest 2>/tmp/npm-meta.err); then
            if grep -qiE 'previously published|EPUBLISHCONFLICT|cannot publish over' /tmp/npm-meta.err; then
              echo "::notice::$META_PKG@$VERSION already published — skipping"
            else
              cat /tmp/npm-meta.err
              echo "::error::npm publish failed for $META_PKG@$VERSION"
              exit 1
            fi
          fi

      - name: Verify
        env:
          VERSION:  ${{ steps.meta.outputs.version }}
          META_PKG: ${{ steps.leaves.outputs.meta_pkg }}
        run: |
          echo "Published $META_PKG @ $VERSION + all per-platform leaves."
          echo "Users can run:"
          echo "  npm install $META_PKG"
