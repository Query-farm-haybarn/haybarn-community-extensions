# Reusable workflow that deploys a built extension to the Haybarn
# community R2 bucket (legacy single-slot path + per-commit immutable
# path with signed manifest), and optionally publishes a pip wheel +
# npm leaves/meta to PyPI and npm when the extension's descriptor opts
# in via `publish_registries: true`.
#
# Differences from upstream's duckdb/community-extensions/_extension_deploy.yml:
#   - Bucket target:        haybarn-community-extensions (was duckdb-community-extensions)
#   - Signing key secret:   HAYBARN_EXTENSION_SIGNING_PK (was S3_DUCKDB_ORG_COMMUNITY_SIGNING_PK)
#   - S3 creds:             HAYBARN_COMMUNITY_S3_* (was DUCKDB_COMMUNITY_EXTENSION_S3_*)
#   - DuckDB checkout:      Query-farm-haybarn/haybarn (was duckdb/duckdb)
#   - extension-ci-tools:   Query-farm-haybarn/haybarn-extension-ci-tools (was duckdb/extension-ci-tools)
#
# The deploy_script path is `./duckdb/scripts/extension-upload-single.sh`
# which Haybarn carries unchanged — the script reads bucket name + signing
# key from env, so we don't need to modify it.
#
# Per-commit immutable R2 layout (in addition to legacy single-slot):
#
#   s3://<bucket>/community/<duckdb_version>/<arch>/<name>/<ext_commit_short>/
#       <name>.duckdb_extension.gz       ← binary
#       manifest.json                    ← signed per-build metadata
#       manifest.json.asc
#
#   s3://<bucket>/community/<duckdb_version>/<arch>/<name>/
#       current.json                     ← signed pointer to latest commit
#       current.json.asc
#
# See ideas/extension-version-pinning.md for the full design.

name: Extension Deployment
on:
  workflow_call:
    inputs:
      extension_name:
        required: true
        type: string
      duckdb_version:
        required: true
        type: string
      duckdb_tag:
        required: false
        type: string
        default: ""
      ci_tools_version:
        required: true
        type: string
      exclude_archs:
        required: false
        type: string
        default: ""
      opt_in_archs:
        required: false
        type: string
        default: ""
      deploy_latest:
        required: false
        type: boolean
        default: false
      deploy_versioned:
        required: false
        type: boolean
        default: false
      artifact_postfix:
        required: false
        type: string
        default: ""
      deploy_script:
        required: false
        type: string
        default: "./duckdb/scripts/extension-upload-single.sh"
      repository:
        required: false
        type: string
        default: ""
      ref:
        required: false
        type: string
        default: ""
      reduced_ci_mode:
        required: false
        type: string
        default: 'auto'
      # Per-extension opt-in to PyPI + npm publishing. Gated this way so
      # we can prove the round-trip with waddle before flipping it for
      # the rest of the community catalog.
      publish_registries:
        required: false
        type: boolean
        default: false
      # Extension's own semver from the descriptor (extension.version).
      # Used as the pip/npm version field when non-empty; otherwise the
      # deploy job falls back to CalVer derived from the commit timestamp.
      extension_version_label:
        required: false
        type: string
        default: ""
      # SPDX license string from the descriptor's `extension.license`.
      # Passed to npm_build_leaf.py / npm_build_meta.py via the LICENSE
      # env var so the published package.json carries the upstream
      # extension's actual license rather than the engine's default MIT.
      # Empty string keeps the default MIT (matches engine + core
      # extensions, which is what was hardcoded before).
      extension_license:
        required: false
        type: string
        default: ""
      # One-line description from descriptor's `extension.description`
      # — used by npm_build_meta.py / npm_build_leaf.py to render the
      # generated README.md and package.json `description` field.
      extension_description:
        required: false
        type: string
        default: ""
      # Upstream extension source repo URL (https://github.com/<o>/<r>),
      # derived from descriptor's `repo.github`. Shown as a link in the
      # generated README.md.
      extension_source_repo:
        required: false
        type: string
        default: ""

jobs:
  generate_matrix:
    name: Generate matrix
    runs-on: ubuntu-latest
    outputs:
      deploy_matrix: ${{ steps.parse-matrices.outputs.deploy_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 'Query-farm-haybarn/haybarn-extension-ci-tools'
          ref: ${{ inputs.ci_tools_version }}
          path: extension-ci-tools

      - id: parse-matrices
        run: |
          python3 ./extension-ci-tools/scripts/modify_distribution_matrix.py \
            --input ./extension-ci-tools/config/distribution_matrix.json \
            --deploy_matrix --output deploy_matrix.json \
            --exclude "${{ inputs.exclude_archs }}" \
            --opt_in "${{ inputs.opt_in_archs }}" \
            --pretty --reduced_ci_mode ${{ inputs.reduced_ci_mode }}
          # --pretty produces multi-line JSON; GITHUB_OUTPUT can't take a
          # single `name=value` line for that. Heredoc form is required for
          # any multi-line value. (Run 25963459910 failed with "Invalid
          # format '  \"include\": [' "; run 25964378414 then failed with
          # "Matching delimiter not found 'HAYBARN_OUTPUT_EOF'" — that one
          # is because the JSON file lacks a trailing newline, so the
          # closing delim ends up on the same line as the last `}` and
          # GH's heredoc parser doesn't see a standalone delimiter line.
          # `printf '\n'` before the closing delimiter forces the newline.)
          {
            printf 'deploy_matrix<<HAYBARN_OUTPUT_EOF\n'
            cat deploy_matrix.json
            printf '\nHAYBARN_OUTPUT_EOF\n'
          } >> "$GITHUB_OUTPUT"
          echo "--- deploy_matrix.json ---"
          cat deploy_matrix.json
          echo "--- end deploy_matrix.json ---"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: generate_matrix
    if: ${{ needs.generate_matrix.outputs.deploy_matrix != '{}' && needs.generate_matrix.outputs.deploy_matrix != '' }}
    strategy:
      matrix: ${{ fromJson(needs.generate_matrix.outputs.deploy_matrix) }}
      # Don't cascade-cancel other legs when one fails — for waddle we
      # want every successful platform's wheel/leaf to still publish.
      fail-fast: false
    # NOTE: a job-level `concurrency:` group referencing ${{ matrix.X }} is
    # not currently supported by GitHub Actions (causes startup_failure on
    # workflow validation). The per-(ext, version, arch) current.json
    # writes don't race within a single run anyway — each matrix leg
    # targets a different per-arch path. Cross-run races (two pushes for
    # the same extension landing simultaneously) remain possible but
    # uncommon for our smoke-test workflow; can be addressed later with
    # If-Match retry or a non-matrix follow-up job if needed.
    outputs:
      version: ${{ steps.calver.outputs.version }}
      ext_commit: ${{ steps.extsrc.outputs.ext_commit }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          submodules: 'false'

      # Haybarn engine checkout — supplies the extension-upload-single.sh
      # script and the version-tag-derivation logic the deploy step uses below.
      - uses: actions/checkout@v4
        with:
          repository: 'Query-farm-haybarn/haybarn'
          ref: ${{ inputs.duckdb_version }}
          path: duckdb
          fetch-depth: 0

      # ci-tools checkout (under ci-tools/) supplies the shared publish
      # helpers (compute_calver, generate_haybarn_metadata, r2_build_manifest,
      # pypi_build_wheel, npm_build_leaf) from scripts/publish/. Tracks the
      # `haybarn` branch tip — single source of truth shared with the engine
      # repo's haybarn-extensions.yml.
      - uses: actions/checkout@v4
        with:
          repository: 'Query-farm-haybarn/haybarn-extension-ci-tools'
          ref: haybarn
          path: ci-tools

      - name: Capture extension source commit + timestamp
        id: extsrc
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          EXT_COMMIT=$(git log -1 --format=%H)
          EXT_COMMIT_TS=$(git log -1 --format=%ct)
          EXT_COMMIT_SHORT=$(git log -1 --format=%h)
          BUILT_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          {
            echo "ext_commit=$EXT_COMMIT"
            echo "ext_commit_ts=$EXT_COMMIT_TS"
            echo "ext_commit_short=$EXT_COMMIT_SHORT"
            echo "built_at=$BUILT_AT"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::extension source commit ${EXT_COMMIT_SHORT} (ts=${EXT_COMMIT_TS}, built_at=${BUILT_AT})"

      - name: Capture haybarn engine commit
        id: engine
        shell: bash
        run: |
          ENGINE_COMMIT=$(git -C duckdb log -1 --format=%H)
          echo "engine_commit=$ENGINE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "::notice::haybarn engine commit ${ENGINE_COMMIT}"

      - name: Compute pip/npm version (semver if descriptor has one, else CalVer)
        id: calver
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.extension_version_label }}" ]]; then
            VERSION=$(python3 ci-tools/scripts/publish/compute_calver.py --semver "${{ inputs.extension_version_label }}")
          else
            VERSION=$(python3 ci-tools/scripts/publish/compute_calver.py --commit-ts "${{ steps.extsrc.outputs.ext_commit_ts }}")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::pip/npm version: $VERSION"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.extension_name }}-${{ inputs.duckdb_version }}-extension-${{ matrix.duckdb_arch }}${{ inputs.artifact_postfix }}${{ startsWith(matrix.duckdb, 'wasm') && '.wasm' || '' }}
          path: /tmp/extension

      - name: Deploy
        shell: bash
        # Reuse the same R2_* org-secret credentials used by haybarn-extensions.yml
        # Community extensions now share the core bucket
        # (haybarn-extensions.query.farm), distinguished by a top-level
        # `community/` key prefix instead of a separate bucket+subdomain.
        # The upload script's $5 (bucket name) accepts "<bucket>/<prefix>"
        # — aws s3 cp treats anything after the bucket as the object key,
        # so `s3://<core>/community/<name>/<extver>/<duckdbver>/<arch>/...`
        # works without script changes. URL the engine fetches becomes
        # `https://haybarn-extensions.query.farm/community/<duckdbver>/<arch>/<name>.duckdb_extension.gz`.
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          # The org secret is named R2_SECRET_KEY_ID (not the more
          # conventional R2_SECRET_ACCESS_KEY). See companion fix in
          # haybarn/.github/workflows/haybarn-extensions.yml.
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY_ID }}
          AWS_ENDPOINT_URL:      ${{ secrets.R2_ENDPOINT }}
          AWS_DEFAULT_REGION:    auto
          # Cloudflare R2 rejects new sigv4 checksum headers added
          # in awscli ≥ 1.36 / v2 ≥ 2.23 (surfaces as AccessDenied on
          # PutObject). Pin to pre-2024 checksum behavior.
          AWS_REQUEST_CHECKSUM_CALCULATION:  when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION:  when_required
          BUCKET_NAME:           ${{ secrets.R2_BUCKET }}/community
          # SAME private key Haybarn uses to sign core extensions. The
          # engine's `community_public_keys[]` and `public_keys[]` both
          # reference the matching HAYBARN_TRUST_ROOT constant.
          DUCKDB_EXTENSION_SIGNING_PK: ${{ secrets.HAYBARN_EXTENSION_SIGNING_PK }}
          DUCKDB_DEPLOY_SCRIPT_MODE: for_real
          PIP_BREAK_SYSTEM_PACKAGES: 1
        run: |
          python3 -m pip install awscli
          if [ -n "${{ inputs.duckdb_tag }}" ]; then
            export DUCKDB_VERSION="${{ inputs.duckdb_tag }}"
          else
            git config --global --add safe.directory '*'
            cd duckdb
            git fetch --tags
            DUCKDB_VERSION=$(git tag --points-at HEAD)
            DUCKDB_VERSION=${DUCKDB_VERSION:=$(git log -1 --format=%h)}
            export DUCKDB_VERSION
            cd ..
          fi
          git fetch --tags --no-recurse-submodules
          EXT_VERSION=$(git tag --points-at HEAD)
          EXT_VERSION=${EXT_VERSION:=$(git log -1 --format=%h)}
          export EXT_VERSION
          ${{ inputs.deploy_script }} \
            ${{ inputs.extension_name }} \
            "$EXT_VERSION" "$DUCKDB_VERSION" \
            ${{ matrix.duckdb_arch }} \
            "$BUCKET_NAME" \
            ${{ inputs.deploy_latest || 'true' && 'false' }} \
            ${{ inputs.deploy_versioned || 'true' && 'false' }}

      # ------------------------------------------------------------------
      # New per-commit immutable R2 layout (Phase 1 of extension-version-pinning).
      # Runs alongside the legacy upload above. Produces its own signed +
      # compressed binary (the legacy script deletes its copy on exit, so
      # we re-do the dance to have something to upload to the new path and
      # to hand off to the pip/npm publish steps if registries are opted-in).
      # Signing is deterministic (RSA-PKCS1-v1_5 over a fixed input), so
      # the bytes produced here are byte-identical to what the legacy step
      # uploaded.
      # ------------------------------------------------------------------

      - name: Re-sign and compress for new layout
        id: signpack
        shell: bash
        env:
          DUCKDB_EXTENSION_SIGNING_PK: ${{ secrets.HAYBARN_EXTENSION_SIGNING_PK }}
        run: |
          set -euo pipefail
          EXT='${{ inputs.extension_name }}'
          ARCH='${{ matrix.duckdb_arch }}'
          mkdir -p stage

          if [[ "$ARCH" == wasm* ]]; then
            SRC="/tmp/extension/${EXT}.duckdb_extension.wasm"
            DEST="stage/${EXT}.duckdb_extension.wasm"
            COMPRESSED_SUFFIX="wasm"
          else
            SRC="/tmp/extension/${EXT}.duckdb_extension"
            DEST="stage/${EXT}.duckdb_extension.gz"
            COMPRESSED_SUFFIX="gz"
          fi

          # Same dance extension-upload-single.sh runs: copy → truncate
          # last 256 bytes (placeholder signature) → hash → sign → append
          # signature → compress.
          cp "$SRC" stage/work.append
          ( command -v truncate && truncate -s -256 stage/work.append ) \
            || ( command -v gtruncate && gtruncate -s -256 stage/work.append ) \
            || { echo "::error::no truncate/gtruncate available"; exit 1; }

          if [[ -n "${DUCKDB_EXTENSION_SIGNING_PK:-}" ]]; then
            echo "$DUCKDB_EXTENSION_SIGNING_PK" > stage/private.pem
            duckdb/scripts/compute-extension-hash.sh stage/work.append > stage/work.hash
            openssl pkeyutl -sign -in stage/work.hash -inkey stage/private.pem \
              -pkeyopt digest:sha256 -out stage/work.sign
            rm -f stage/private.pem
          else
            # Should never hit this in CI — the key is set in repo secrets —
            # but mirror the script's fallback for parity.
            dd if=/dev/zero of=stage/work.sign bs=256 count=1
          fi

          cat stage/work.sign >> stage/work.append
          rm stage/work.sign

          if [[ "$COMPRESSED_SUFFIX" == "wasm" ]]; then
            brotli < stage/work.append > "$DEST"
          else
            gzip < stage/work.append > "$DEST"
          fi
          rm stage/work.append stage/work.hash

          # Hash the COMPRESSED SIGNED binary — that's what consumers
          # download and what the lockfile verifies against.
          SHA=$(openssl dgst -sha256 -binary "$DEST" | xxd -p -c 64)
          SIZE=$(stat -c %s "$DEST" 2>/dev/null || stat -f %z "$DEST")
          {
            echo "binary_path=$DEST"
            echo "binary_basename=$(basename "$DEST")"
            echo "sha256=$SHA"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::signed+compressed binary $DEST (sha256=$SHA, size=$SIZE)"

      - name: Generate haybarn-metadata.json
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          # Strip the leading 'v' from the engine version for the metadata
          # blob ("1.5.2", not "v1.5.2") — matches the package-name suffix
          # convention from extension-version-pinning.md.
          HAYBARN_VERSION="${DV#v}"
          python3 ci-tools/scripts/publish/generate_haybarn_metadata.py \
            --extension '${{ inputs.extension_name }}' \
            --ext-commit '${{ steps.extsrc.outputs.ext_commit }}' \
            --haybarn-version "$HAYBARN_VERSION" \
            --ext-version-label '${{ inputs.extension_version_label }}' \
            --sha256 '${{ steps.signpack.outputs.sha256 }}' \
            --built-at '${{ steps.extsrc.outputs.built_at }}' \
            --out stage/haybarn-metadata.json
          cat stage/haybarn-metadata.json
        env:
          DV: ${{ inputs.duckdb_version }}

      - name: Look up previous_commit from existing current.json
        id: prev
        shell: bash
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY_ID }}
          AWS_ENDPOINT_URL:      ${{ secrets.R2_ENDPOINT }}
          AWS_DEFAULT_REGION:    auto
          # Cloudflare R2 rejects new sigv4 checksum headers added
          # in awscli ≥ 1.36 / v2 ≥ 2.23 (surfaces as AccessDenied on
          # PutObject). Pin to pre-2024 checksum behavior.
          AWS_REQUEST_CHECKSUM_CALCULATION:  when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION:  when_required
        run: |
          set -euo pipefail
          PTR="s3://${{ secrets.R2_BUCKET }}/community/${{ inputs.duckdb_version }}/${{ matrix.duckdb_arch }}/${{ inputs.extension_name }}/current.json"
          # Fetching may legitimately fail on the first build of this
          # (extension, version, arch) tuple — that's fine, previous_commit
          # stays empty.
          if aws s3 cp "$PTR" stage/prev-current.json 2>/dev/null; then
            PREV=$(python3 -c "import json; print(json.load(open('stage/prev-current.json')).get('latest',''))")
            echo "::notice::previous_commit=$PREV"
          else
            PREV=""
            echo "::notice::no existing current.json — first build of this tuple"
          fi
          echo "previous_commit=$PREV" >> "$GITHUB_OUTPUT"

      - name: Build R2 manifest.json
        shell: bash
        run: |
          set -euo pipefail
          # Channels list reflects what this build will actually be published to.
          if [[ '${{ inputs.publish_registries }}' == 'true' ]]; then
            CHANNELS='r2-community,pypi,npm'
          else
            CHANNELS='r2-community'
          fi
          python3 ci-tools/scripts/publish/r2_build_manifest.py \
            --extension '${{ inputs.extension_name }}' \
            --duckdb-version '${{ inputs.duckdb_version }}' \
            --platform '${{ matrix.duckdb_arch }}' \
            --ext-commit '${{ steps.extsrc.outputs.ext_commit }}' \
            --ext-version-label '${{ inputs.extension_version_label }}' \
            --sha256 '${{ steps.signpack.outputs.sha256 }}' \
            --object '${{ steps.signpack.outputs.binary_basename }}' \
            --built-at '${{ steps.extsrc.outputs.built_at }}' \
            --haybarn-engine-commit '${{ steps.engine.outputs.engine_commit }}' \
            --signed-by 'haybarn-extension-signing-2026' \
            --channels "$CHANNELS" \
            --previous-commit '${{ steps.prev.outputs.previous_commit }}' \
            --out stage/manifest.json
          cat stage/manifest.json

      - name: GPG-sign manifest.json and current.json
        shell: bash
        env:
          HAYBARN_GPG_PRIVATE_KEY: ${{ secrets.HAYBARN_GPG_PRIVATE_KEY }}
          HAYBARN_GPG_PASSPHRASE:  ${{ secrets.HAYBARN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          # The HAYBARN_GPG_PRIVATE_KEY org secret is hex-encoded (per the
          # gotcha documented in haybarn/CLAUDE.md). Decode and import.
          # Probe a couple of shapes for resilience to future re-stores.
          import_ok=0
          for decoder in "xxd -r -p" "base64 -d" "cat"; do
            if echo "$HAYBARN_GPG_PRIVATE_KEY" | eval "$decoder" 2>/dev/null \
                | gpg --batch --pinentry-mode loopback \
                      --passphrase "$HAYBARN_GPG_PASSPHRASE" \
                      --import 2>/dev/null; then
              echo "::notice::GPG key imported via: $decoder"
              import_ok=1
              break
            fi
          done
          if [[ "$import_ok" != "1" ]]; then
            echo "::error::could not import HAYBARN_GPG_PRIVATE_KEY in any known shape"
            exit 1
          fi

          # Build current.json pointing at this commit (will be uploaded
          # after we've finished signing both files).
          python3 -c "
          import json, datetime
          print(json.dumps({
              'latest': '${{ steps.extsrc.outputs.ext_commit }}',
              'updated_at': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
          }, indent=2, sort_keys=True) + '\n')
          " > stage/current.json

          # Find the key fingerprint we just imported (filter for our uid)
          KEY_ID=$(gpg --list-secret-keys --keyid-format LONG \
                     | awk '/sec/{gsub(/.*\//,"",$2); print $2; exit}')
          echo "::notice::signing with GPG key $KEY_ID"

          for f in stage/manifest.json stage/current.json; do
            gpg --batch --yes --pinentry-mode loopback \
                --passphrase "$HAYBARN_GPG_PASSPHRASE" \
                --local-user "$KEY_ID" \
                --detach-sign --armor \
                --output "${f}.asc" "$f"
          done

          ls -la stage/

      - name: Upload binary + manifest to per-commit immutable R2 path
        shell: bash
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY_ID }}
          AWS_ENDPOINT_URL:      ${{ secrets.R2_ENDPOINT }}
          AWS_DEFAULT_REGION:    auto
          # Cloudflare R2 rejects new sigv4 checksum headers added
          # in awscli ≥ 1.36 / v2 ≥ 2.23 (surfaces as AccessDenied on
          # PutObject). Pin to pre-2024 checksum behavior.
          AWS_REQUEST_CHECKSUM_CALCULATION:  when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION:  when_required
        run: |
          set -euo pipefail
          # Per-commit immutable path: same content for the life of the URL,
          # so cache forever. Without explicit Cache-Control, R2 stores
          # objects with no metadata and Cloudflare's zone default (~4h)
          # applies — fine for staleness here but wastes cache space for
          # immutable assets that could be held indefinitely.
          IMMUTABLE_CC="public, max-age=31536000, immutable"
          PREFIX="s3://${{ secrets.R2_BUCKET }}/community/${{ inputs.duckdb_version }}/${{ matrix.duckdb_arch }}/${{ inputs.extension_name }}/${{ steps.extsrc.outputs.ext_commit_short }}"
          aws s3 cp '${{ steps.signpack.outputs.binary_path }}' "${PREFIX}/${{ steps.signpack.outputs.binary_basename }}" --cache-control "$IMMUTABLE_CC"
          aws s3 cp stage/manifest.json     "${PREFIX}/manifest.json"     --cache-control "$IMMUTABLE_CC" --content-type application/json
          aws s3 cp stage/manifest.json.asc "${PREFIX}/manifest.json.asc" --cache-control "$IMMUTABLE_CC" --content-type application/pgp-signature

      - name: Update current.json pointer
        shell: bash
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY_ID }}
          AWS_ENDPOINT_URL:      ${{ secrets.R2_ENDPOINT }}
          AWS_DEFAULT_REGION:    auto
          # Cloudflare R2 rejects new sigv4 checksum headers added
          # in awscli ≥ 1.36 / v2 ≥ 2.23 (surfaces as AccessDenied on
          # PutObject). Pin to pre-2024 checksum behavior.
          AWS_REQUEST_CHECKSUM_CALCULATION:  when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION:  when_required
        run: |
          set -euo pipefail
          # Concurrency group above serializes runs for the same
          # (extension, version, arch). The pointer is the only mutable
          # surface; per-build binary + manifest live at immutable paths.
          # Short Cache-Control so the Cloudflare edge serves the just-
          # updated pointer within seconds — without it the zone default
          # (~4h) holds the prior pointer and `INSTALL <ext>` keeps
          # resolving the previous commit.
          MUTABLE_CC="public, max-age=10, must-revalidate"
          PTR="s3://${{ secrets.R2_BUCKET }}/community/${{ inputs.duckdb_version }}/${{ matrix.duckdb_arch }}/${{ inputs.extension_name }}/current.json"
          aws s3 cp stage/current.json     "$PTR"        --cache-control "$MUTABLE_CC" --content-type application/json
          aws s3 cp stage/current.json.asc "${PTR}.asc"  --cache-control "$MUTABLE_CC" --content-type application/pgp-signature

      # ------------------------------------------------------------------
      # PyPI + npm registry publishing (opt-in via descriptor).
      # ------------------------------------------------------------------

      - name: Map duckdb_arch → PyPI platform tag + npm os/cpu/libc
        # Was previously gated by a hardcoded allowlist of 11 names. Now
        # driven by the caller's `publish_registries` input — community
        # build.yml defaults that to true so every merged descriptor
        # auto-publishes; other callers (engine, build-forks) keep the
        # input default of false and stay R2-only unless they opt in.
        if: ${{ inputs.publish_registries }}
        id: platmap
        shell: bash
        run: |
          set -euo pipefail
          # PyPI tags follow PEP 600 / 656. npm uses (os, cpu, libc).
          # The "-" libc value means "omit the libc field" (per
          # npm_build_leaf.py's contract).
          case '${{ matrix.duckdb_arch }}' in
            linux_amd64)       PY=manylinux_2_28_x86_64;  NOS=linux;  NCPU=x64;   NLIBC=glibc ;;
            linux_arm64)       PY=manylinux_2_28_aarch64; NOS=linux;  NCPU=arm64; NLIBC=glibc ;;
            linux_amd64_musl)  PY=musllinux_1_2_x86_64;   NOS=linux;  NCPU=x64;   NLIBC=musl  ;;
            linux_arm64_musl)  PY=musllinux_1_2_aarch64;  NOS=linux;  NCPU=arm64; NLIBC=musl  ;;
            osx_amd64)         PY=macosx_11_0_x86_64;     NOS=darwin; NCPU=x64;   NLIBC=-     ;;
            osx_arm64)         PY=macosx_11_0_arm64;      NOS=darwin; NCPU=arm64; NLIBC=-     ;;
            windows_amd64)     PY=win_amd64;              NOS=win32;  NCPU=x64;   NLIBC=-     ;;
            windows_arm64)     PY=win_arm64;              NOS=win32;  NCPU=arm64; NLIBC=-     ;;
            wasm_*|windows_amd64_mingw)
              # No PyPI / npm publish for wasm or the MinGW Windows variant
              # (npm os/cpu can't distinguish MinGW from MSVC; we'd be
              # publishing a duplicate-platform leaf). Skip silently.
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "::error::no PyPI/npm platform mapping for ${{ matrix.duckdb_arch }}"
              exit 1
              ;;
          esac
          # Build the leaf slug — '-' libc gets no suffix; explicit libc
          # gets appended as -musl etc. (glibc is the default → no suffix).
          case "$NLIBC" in
            musl) LEAF_SUFFIX="$NOS-$NCPU-musl" ;;
            *)    LEAF_SUFFIX="$NOS-$NCPU"     ;;
          esac
          {
            echo "skip=false"
            echo "pypi_platform_tag=$PY"
            echo "npm_os=$NOS"
            echo "npm_cpu=$NCPU"
            echo "npm_libc=$NLIBC"
            echo "npm_leaf_suffix=$LEAF_SUFFIX"
          } >> "$GITHUB_OUTPUT"

      - name: Build pip wheel
        if: ${{ inputs.publish_registries && steps.platmap.outputs.skip == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/pypi
          python3 ci-tools/scripts/publish/pypi_build_wheel.py \
            --extension '${{ inputs.extension_name }}' \
            --haybarn-version "${DV#v}" \
            --version '${{ steps.calver.outputs.version }}' \
            --platform-tag '${{ steps.platmap.outputs.pypi_platform_tag }}' \
            --binary '${{ steps.signpack.outputs.binary_path }}' \
            --haybarn-metadata stage/haybarn-metadata.json \
            --license ce/LICENSE \
            --source-repo '${{ inputs.extension_source_repo }}' \
            --out-dir dist/pypi/
        env:
          DV: ${{ inputs.duckdb_version }}

      - name: Upload pip wheel artifact (for publish_pypi job)
        if: ${{ inputs.publish_registries && steps.platmap.outputs.skip == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: pypi-wheel-${{ inputs.extension_name }}-${{ matrix.duckdb_arch }}
          path: dist/pypi/
          if-no-files-found: error

      - name: Build npm leaf package
        if: ${{ inputs.publish_registries && steps.platmap.outputs.skip == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          EXT='${{ inputs.extension_name }}'
          HV="${DV#v}"
          # Same suffix derivation as the pip wheel — needed for the
          # leaf package name.
          HSUFFIX="h${HV//./-}"
          META_PKG="@haybarn/ext-${EXT}-${HSUFFIX}"
          LEAF_PKG="${META_PKG}-${{ steps.platmap.outputs.npm_leaf_suffix }}"

          STAGE_DIR="dist/npm-leaf"
          mkdir -p "$STAGE_DIR/bin"
          cp '${{ steps.signpack.outputs.binary_path }}' \
             "$STAGE_DIR/bin/${{ steps.signpack.outputs.binary_basename }}"
          cp stage/haybarn-metadata.json "$STAGE_DIR/haybarn-metadata.json"

          STAGE="$STAGE_DIR" \
          PKG="$LEAF_PKG" \
          VERSION='${{ steps.calver.outputs.version }}' \
          EXTENSION="$EXT" \
          HAYBARN_VERSION="$HV" \
          OS='${{ steps.platmap.outputs.npm_os }}' \
          CPU='${{ steps.platmap.outputs.npm_cpu }}' \
          LIBC='${{ steps.platmap.outputs.npm_libc }}' \
          LICENSE='${{ inputs.extension_license }}' \
          EXTENSION_DESCRIPTION='${{ inputs.extension_description }}' \
          EXTENSION_SOURCE_REPO='${{ inputs.extension_source_repo }}' \
          HAYBARN_METADATA="$STAGE_DIR/haybarn-metadata.json" \
            python3 ci-tools/scripts/publish/npm_build_leaf.py

          # Tar the staged dir for the publish_npm job
          (cd "$STAGE_DIR" && tar -czf "$GITHUB_WORKSPACE/dist/npm-leaf.tar.gz" .)
          ls -la dist/
        env:
          DV: ${{ inputs.duckdb_version }}

      - name: Upload npm leaf artifact (for publish_npm job)
        if: ${{ inputs.publish_registries && steps.platmap.outputs.skip == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-leaf-${{ inputs.extension_name }}-${{ inputs.duckdb_version }}-${{ matrix.duckdb_arch }}
          path: dist/npm-leaf.tar.gz
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Registry publish (PyPI + npm) is the consolidated reusable workflow
  # in ci-tools — same workflow the engine repo's haybarn-extensions.yml
  # calls for core extensions. We pass artifact_shape=per-extension so
  # it downloads pypi-wheel-<ext>-* / npm-leaf-<ext>-<dv>-* (matrix
  # artifacts), as opposed to the bundled core-{pypi,npm}-* shape.
  #
  # Independent dispatch (e.g. for retry after a PyPI "429 Too many new
  # projects" rate-limit bounce) is supported by calling the upstream
  # workflow directly:
  #   gh workflow run "_extension_registry_publish.yml" \
  #     -R Query-farm-haybarn/haybarn-extension-ci-tools --ref haybarn \
  #     -f artifact_shape=per-extension -f extension_name=<name> \
  #     -f source_run_id=<this-run-id> -f duckdb_version=v1.5.2 \
  #     -f version=<calver> -f ext_commit=<sha> -f extension_version_label=
  # ------------------------------------------------------------------
  call_publish_registries:
    name: Publish PyPI + npm
    needs:
      - generate_matrix
      - deploy
    if: ${{ always() && needs.deploy.result != 'cancelled' && inputs.publish_registries && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') }}
    uses: Query-farm-haybarn/haybarn-extension-ci-tools/.github/workflows/_extension_registry_publish.yml@haybarn
    permissions:
      contents: read
      actions:  read
      id-token: write
    secrets: inherit
    with:
      artifact_shape:          per-extension
      # MUST match the ref in the `uses:` line above — the called workflow
      # uses this to checkout its own scripts/publish/.
      ci_tools_ref:            haybarn
      extension_name:          ${{ inputs.extension_name }}
      duckdb_version:          ${{ inputs.duckdb_version }}
      version:                 ${{ needs.deploy.outputs.version }}
      ext_commit:              ${{ needs.deploy.outputs.ext_commit }}
      extension_version_label: ${{ inputs.extension_version_label }}
      extension_license:       ${{ inputs.extension_license }}
      extension_description:   ${{ inputs.extension_description }}
      extension_source_repo:   ${{ inputs.extension_source_repo }}
      # Empty source_run_id → publish from the current run's artifacts.
      source_run_id: ''

# NOTE: upstream has a `clean_cache` job here that purges the Cloudflare CDN
# for the just-replaced extension's path. We don't need it: every deployed
# artifact lives at a unique URL (version segment + git-sha segment), so
# old paths are never re-served — Cloudflare's edge happily holds onto the
# old binary forever and nothing requests it again. New deploys land at
# new URLs, no purge required.
