# Weekly (and on-demand) sync of upstream duckdb/community-extensions
# descriptors into this repo. Opens a PR rather than push-to-main so a
# human eyeballs the diff before the descriptor changes trigger the per-
# extension build matrix at PR-merge time.
#
# The script handles all the "mirror" semantics — see scripts/sync_from_upstream.py.

name: Sync descriptors from upstream
on:
  schedule:
    - cron: '0 6 * * 1'    # weekly Monday 06:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    # PR creation needs `contents: write` (for the branch push) and
    # `pull-requests: write` (for opening the PR).
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          # Need full history so the PR branch picks up correctly off main.
          fetch-depth: 0

      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: duckdb/community-extensions
          ref: main
          path: upstream
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --upgrade pyyaml

      - name: Run sync
        id: sync
        run: |
          set -euo pipefail
          python3 scripts/sync_from_upstream.py --upstream upstream > sync_summary.json
          echo "summary<<EOF" >> "$GITHUB_OUTPUT"
          cat sync_summary.json >> "$GITHUB_OUTPUT"
          echo "EOF"          >> "$GITHUB_OUTPUT"

      - name: Detect changes
        id: diff
        run: |
          if [ -z "$(git status --porcelain extensions/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: |
            sync: pull upstream community-extensions descriptors

            Auto-generated by sync_from_upstream.yml.
            See scripts/sync_from_upstream.py for the mirror semantics
            (andium stripped, haybarn_fork/haybarn_ref preserved).
          title: "sync: upstream community-extensions"
          body: |
            Automated descriptor sync from `duckdb/community-extensions@main`.

            ### Summary
            ```json
            ${{ steps.sync.outputs.summary }}
            ```

            ### Review checklist
            - [ ] `additions` look reasonable (new extensions to start building)
            - [ ] `updates` upstream ref bumps look reasonable
            - [ ] `haybarn_only` list still intentional (any Haybarn-specific descriptors we maintain)
            - [ ] No descriptor with `repo.haybarn_fork` had its fork field stomped

            On merge, `build.yml` will fire per changed descriptor and deploy
            to `haybarn-extensions.query.farm/community`.
          branch: sync/upstream
          delete-branch: true
          labels: |
            sync
            community-extensions

      - name: No changes
        if: steps.diff.outputs.changed == 'false'
        run: echo "No descriptor changes detected — upstream already matches."
